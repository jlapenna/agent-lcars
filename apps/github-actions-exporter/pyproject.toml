[project]
name = "agent-lcars-github-actions-exporter"
version = "0.1.0"
description = "Durable, low-cardinality GitHub Actions metrics for Prometheus"
requires-python = ">=3.14"
dependencies = [
  "prometheus-client==0.26.0",
  "requests==2.34.2",
]

[dependency-groups]
dev = ["ruff==0.16.1"]

[tool.ruff]
target-version = "py314"
