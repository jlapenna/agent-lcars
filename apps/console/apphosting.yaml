# Settings for Agent LCARS Frontend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
scripts:
  buildCommand: . tools/cloud-build-prebuild.sh && ./tools/nx bundle @agent-lcars/console --verbose
  runCommand: node dist/apps/console/.next/standalone/apps/console/server.js
outputFiles:
  serverApp:
    include:
      - dist/apps/console/.next/standalone
      - dist/apps/console/.next/static
runConfig:
  minInstances: 0
  cpu: 1
  memoryMiB: 1024
env:
  # Defined Values
  - variable: CI
    value: 'true'
    availability:
      - BUILD
  - variable: CLOUD_BUILD
    value: 'true'
    availability:
      - BUILD
  - variable: FORCE_COLOR
    value: '0'
    availability:
      - BUILD
      - RUNTIME
  - variable: NODE_OPTIONS
    value: '--max-old-space-size=3072'
    availability:
      - BUILD
  - variable: NX_DAEMON
    value: 'false'
    availability:
      - BUILD
  - variable: NO_COLOR
    value: '1'
    availability:
      - BUILD
  - variable: PATH
    value: /workspace/node_modules/.go/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    availability:
      - BUILD

  # Project Identification (Plain config values)
  - variable: PROJECT_ID
    value: 'agent-lcars'
    availability:
      - RUNTIME
  - variable: QUICK_TASK_EVIDENCE_BUCKET
    value: 'agent-lcars-quick-task-evidence'
    availability:
      - RUNTIME
      - BUILD

  # NextAuth URL
  - variable: AUTH_URL
    value: 'https://lcars.jlapenna.net'
    availability:
      - RUNTIME

  # Not sensitive - just the allowlisted GitHub login. Doubles as the
  # maintainer identity the queue is curated for (see lib/deployment.ts):
  # single-admin console, so they are the same person by construction.
  - variable: AGENT_LCARS_ADMIN_GITHUB_LOGIN
    value: 'jlapenna'
    availability:
      - RUNTIME

  # The rest of this deployment's identity, mirroring lib/deployment.ts's
  # fallbacks explicitly rather than relying on them - so what this instance
  # is configured with is visible here, not only in app source.
  - variable: AGENT_LCARS_FLEET_GITHUB_LOGIN
    value: 'jclaw-bot'
    availability:
      - RUNTIME

  # The repository allowed to invoke the hosted control-plane endpoints via
  # GitHub Actions OIDC, and the repository the reconciler scans.
  - variable: AGENT_LCARS_CONTROL_PLANE_REPOSITORY
    value: 'jlapenna/agent-lcars'
    availability:
      - RUNTIME

  # GitHub App webhook delivery is the production event authority; hosted
  # reconciliation handles manual recovery as well.
  - variable: AGENT_LCARS_HOSTED_ADMISSION_MODE
    value: 'authority'
    availability:
      - RUNTIME

  - variable: AGENT_LCARS_WEBHOOK_QUEUE
    value: 'dispatch-webhooks'
    availability:
      - RUNTIME

  - variable: AGENT_LCARS_WEBHOOK_QUEUE_LOCATION
    value: 'us-central1'
    availability:
      - RUNTIME

  - variable: DISPATCH_FIRESTORE_DATABASE_ID
    value: 'dispatch-controller'
    availability:
      - RUNTIME

  - variable: AGENT_LCARS_ARTIFACT_SHARE_BASE_URL
    value: 'https://share.lan.jlapenna.net'
    availability:
      - RUNTIME

  # The curated repo list this console watches - see getWatchedRepos() in
  # apps/console/src/lib/github-client.ts. Not sensitive, just config; the
  # console falls back to supersprinklesracing/sprinkles alone when unset, so
  # this is the only place that needs editing to add/remove a watched repo.
  # Agent capabilities are explicit. Omitting `agents` opts a repository into
  # the standard Claude, Codex, and OpenCode integrations.
  - variable: AGENT_LCARS_WATCHED_REPOS
    value: '[{"owner":"supersprinklesracing","name":"sprinkles","alias":"sprinkles"},{"owner":"jlapenna","name":"agent-lcars","alias":"agent-lcars"},{"owner":"jlapenna","name":"homelab","alias":"homelab"}]'
    availability:
      - RUNTIME

  # Actual Secrets from GCP Secret Manager
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability:
      - RUNTIME
  - variable: AUTH_GITHUB_ID
    secret: AUTH_GITHUB_ID
    availability:
      - RUNTIME
  - variable: AUTH_GITHUB_SECRET
    secret: AUTH_GITHUB_SECRET
    availability:
      - RUNTIME
  # Calls the GitHub API directly from server actions - there's no separate
  # backend service (single consumer, no shared/Firestore state, so the
  # split wasn't earning its keep).
  - variable: AGENT_LCARS_GITHUB_TOKEN
    secret: AGENT_LCARS_GITHUB_TOKEN
    availability:
      - RUNTIME
  - variable: AGENT_LCARS_WEBHOOK_SECRET
    secret: AGENT_LCARS_WEBHOOK_SECRET
    availability:
      - RUNTIME
