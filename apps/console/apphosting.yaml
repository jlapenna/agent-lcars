# Settings for Agent LCARS Frontend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
scripts:
  buildCommand: . tools/cloud-build-prebuild.sh && ./tools/nx bundle @agent-lcars/console --verbose
  runCommand: node dist/apps/console/.next/standalone/apps/console/server.js
outputFiles:
  serverApp:
    include:
      - dist/apps/console/.next/standalone
      - dist/apps/console/.next/static
runConfig:
  minInstances: 0
  cpu: 1
  memoryMiB: 1024
env:
  # Defined Values
  - variable: CI
    value: 'true'
    availability:
      - BUILD
  - variable: CLOUD_BUILD
    value: 'true'
    availability:
      - BUILD
  - variable: FORCE_COLOR
    value: '0'
    availability:
      - BUILD
      - RUNTIME
  - variable: NODE_OPTIONS
    value: '--max-old-space-size=3072'
    availability:
      - BUILD
  - variable: NX_DAEMON
    value: 'false'
    availability:
      - BUILD
  - variable: NO_COLOR
    value: '1'
    availability:
      - BUILD
  # Project Identification (Plain config values)
  - variable: PROJECT_ID
    value: 'agent-lcars'
    availability:
      - RUNTIME
      - BUILD
  - variable: QUICK_TASK_EVIDENCE_BUCKET
    value: 'agent-lcars-quick-task-evidence'
    availability:
      - RUNTIME

  # NextAuth URL
  - variable: AUTH_URL
    value: 'https://lcars.jlapenna.net'
    availability:
      - RUNTIME

  # This console deployment's own public base URL (see lib/deployment.ts's
  # consoleUrl). Required, no fallback (#1731) -- also the default --origin
  # the saved-session CLI tools point at.
  - variable: AGENT_LCARS_CONSOLE_URL
    value: 'https://lcars.jlapenna.net'
    availability:
      - RUNTIME

  # GCS object path for the one centrally-owned Codex subscription
  # credential (see lib/deployment.ts's codexCentralAuthObject and
  # lib/codex-auth-store.ts). Required, no fallback (#1731, #1751).
  - variable: AGENT_LCARS_CODEX_CENTRAL_AUTH_OBJECT
    value: 'jlapenna/agent-lcars/auth.json'
    availability:
      - RUNTIME

  # Optional -- see lib/deployment.ts's consoleDescription. Set explicitly
  # so this deployment's own page metadata stays what it has always been,
  # even though an unset value now falls back to a generic description
  # rather than this string.
  - variable: AGENT_LCARS_CONSOLE_DESCRIPTION
    value: 'jlapenna/agent-lcars — multi-agent issue activity'
    availability:
      - RUNTIME

  # Not sensitive - the allowlisted GitHub logins that may operate the
  # console. Authorization is deliberately separate from queue ownership.
  - variable: AGENT_LCARS_ADMIN_GITHUB_LOGINS
    value: 'jlapenna,lizsprinkles'
    availability:
      - RUNTIME

  # The maintainer identity whose queue the console curates (see
  # lib/deployment.ts). Adding another console operator must not change it.
  - variable: AGENT_LCARS_ADMIN_GITHUB_LOGIN
    value: 'jlapenna'
    availability:
      - RUNTIME

  # Not sensitive - grants for the Work API (see
  # apps/console/src/lib/work-grants.ts). Maps a Google service-account
  # email, `github:<login>` session subject, or signed
  # `github-actions:<owner/repo>` subject to a principal and the pipelines it
  # may operate. The current operator grants each list every supported
  # pipeline. That admission grant does not select an executor; the one
  # global cutover below does. svc:telemetry-writer
  # is the runner-autoscaler's queue executor claim identity
  # (native-work-items sub-project 4,
  # #1502): scoped to work.executor and work.cron, never work.operator --
  # see docs/deployment-boundary.md's work-grants table. Those separate
  # grants make it the sole server-side claim capability source for every
  # direct runner and the server-owned schedule ticker identity.
  #
  # The Firebase App Hosting default compute service account is Sprinkles'
  # current ambient backend identity. Its ID token's raw `email` is the
  # grant subject (work-auth verifies that value); the service-prefixed
  # principal is the stable audit identity. It replaces the restricted
  # `/lcars` Slack command's direct GitHub issue filing with a native item.
  # Its current grant lists every supported pipeline.
  - variable: AGENT_LCARS_WORK_GRANTS
    value: '[{"principal":"user:jlapenna","subjects":["github:jlapenna"],"pipelines":["claude","codex","opencode"],"scopes":["work.operator"]},{"principal":"workflow:work-create","subjects":["codex-agent@agent-lcars.iam.gserviceaccount.com"],"pipelines":["claude","codex","opencode"],"scopes":["work.operator"]},{"principal":"workflow:member-automation","subjects":["github-actions:jlapenna/agent-lcars","github-actions:supersprinklesracing/sprinkles","github-actions:jlapenna/homelab","github-actions:supersprinklesracing/www","github-actions:supersprinklesracing/girosf","github-actions:jlapenna/nx-cache-server","github-actions:jlapenna/sync-padd"],"pipelines":["claude","codex","opencode"],"scopes":["work.operator"]},{"principal":"svc:telemetry-writer","subjects":["telemetry-writer@agent-lcars.iam.gserviceaccount.com"],"pipelines":["claude","codex","opencode"],"scopes":["work.executor","work.cron"]},{"principal":"svc:firebase-app-hosting-compute@supersprinklesracing.iam.gserviceaccount.com","subjects":["firebase-app-hosting-compute@supersprinklesracing.iam.gserviceaccount.com"],"pipelines":["claude","codex","opencode"],"scopes":["work.operator"]},{"principal":"svc:push-watch","subjects":["push-watch"],"pipelines":["claude"],"scopes":["work.operator"]}]'
    availability:
      - RUNTIME

  # Not sensitive - the global cap on simultaneously live work runs.
  - variable: AGENT_LCARS_WORK_MAX_LIVE_RUNS
    value: '2'
    availability:
      - RUNTIME

  # Not sensitive - the audience the work API requires on Google ID tokens.
  - variable: AGENT_LCARS_WORK_AUDIENCE
    value: 'agent-lcars-work'
    availability:
      - RUNTIME

  # Explicit deployment identity. Repository configuration has no source
  # fallback, so these values remain visible and mutually validated here.
  - variable: AGENT_LCARS_FLEET_GITHUB_LOGIN
    value: 'agent-lcars-bot'
    availability:
      - RUNTIME

  # The repository allowed to invoke the hosted control-plane endpoints via
  # GitHub Actions OIDC, and the repository the reconciler scans.
  - variable: AGENT_LCARS_CONTROL_PLANE_REPOSITORY
    value: 'jlapenna/agent-lcars'
    availability:
      - RUNTIME
  # Repositories the orchestrator admits (webhook, ingest,
  # task-state). The home repo stays the reconcile caller. Dispatch tokens
  # are minted per repository from the fleet App (#1197/#1287); the ambient
  # PAT this flip was originally probe-verified against (#1190) has been
  # retired.
  - variable: AGENT_LCARS_CONTROL_PLANE_REPOSITORIES
    value: 'jlapenna/agent-lcars,supersprinklesracing/sprinkles,jlapenna/homelab,supersprinklesracing/www,supersprinklesracing/girosf,jlapenna/nx-cache-server,jlapenna/sync-padd'
    availability:
      - RUNTIME

  # Resumable-conversations plan 2 (docs/superpowers/plans/2026-09-04-
  # resumable-conversations-2-github-replies.md): a comma-separated
  # owner/repo list whose issue/PR threads accept an ordinary OWNER/MEMBER
  # comment on a PARKED anchor as a reply that resumes the agent's session,
  # no trigger word needed. Empty here on purpose -- merging the feature
  # must change no behavior until a maintainer deliberately enables it for
  # a repository (plan task 4 step 2, maintainer-gated).
  - variable: AGENT_LCARS_IMPLICIT_REPLY_REPOS
    value: ''
    availability:
      - RUNTIME

  # Separate, narrower repo list: only `push` webhook events mint a native
  # work item for these (`push-watch.ts`) — unlike
  # AGENT_LCARS_CONTROL_PLANE_REPOSITORIES above, membership here does not
  # make a repository eligible for issue/PR dispatch. jlapenna/repo-tools is
  # not itself a control-plane repository; only its `main` branch moving is
  # observed, and the resulting work item always targets whatever
  # AGENT_LCARS_PUSH_WATCH_TARGET_REPO names below (already admitted above).
  - variable: AGENT_LCARS_PUSH_WATCHED_REPOS
    value: 'jlapenna/repo-tools'
    availability:
      - RUNTIME

  # Repository the resulting work item always targets, regardless of which
  # AGENT_LCARS_PUSH_WATCHED_REPOS entry triggered it. Required, no fallback
  # (#1731) -- see lib/deployment.ts's pushWatchTargetRepo.
  - variable: AGENT_LCARS_PUSH_WATCH_TARGET_REPO
    value: 'jlapenna/homelab'
    availability:
      - RUNTIME

  - variable: AGENT_LCARS_WEBHOOK_QUEUE
    value: 'dispatch-webhooks'
    availability:
      - RUNTIME

  - variable: AGENT_LCARS_WEBHOOK_QUEUE_LOCATION
    value: 'us-central1'
    availability:
      - RUNTIME

  - variable: DISPATCH_FIRESTORE_DATABASE_ID
    value: 'dispatch-controller'
    availability:
      - RUNTIME

  - variable: AGENT_LCARS_ARTIFACT_SHARE_BASE_URL
    value: 'https://share.lan.jlapenna.net'
    availability:
      - RUNTIME

  # The curated repo list this console watches. It must exactly match
  # AGENT_LCARS_CONTROL_PLANE_REPOSITORIES; either mismatch fails closed.
  # Every watched repository uses the canonical Claude, Codex, and OpenCode
  # integrations. Only `agents: false` opts a repository out entirely.
  - variable: AGENT_LCARS_WATCHED_REPOS
    value: '[{"owner":"supersprinklesracing","name":"sprinkles","alias":"sprinkles"},{"owner":"jlapenna","name":"agent-lcars","alias":"agent-lcars"},{"owner":"jlapenna","name":"homelab","alias":"homelab"},{"owner":"supersprinklesracing","name":"www","alias":"www"},{"owner":"supersprinklesracing","name":"girosf","alias":"girosf"},{"owner":"jlapenna","name":"nx-cache-server","alias":"nx-cache-server"},{"owner":"jlapenna","name":"sync-padd","alias":"sync-padd"}]'
    availability:
      - RUNTIME

  # Actual Secrets from GCP Secret Manager
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability:
      - RUNTIME
  - variable: AUTH_GITHUB_ID
    secret: AUTH_GITHUB_ID
    availability:
      - RUNTIME
  - variable: AUTH_GITHUB_SECRET
    secret: AUTH_GITHUB_SECRET
    availability:
      - RUNTIME
  - variable: AGENT_LCARS_WEBHOOK_SECRET
    secret: AGENT_LCARS_WEBHOOK_SECRET
    availability:
      - RUNTIME
  # #1284: both of these are now required, everywhere the console calls
  # GitHub - the singleton Octokit client (getGithubClient() in
  # github-client.ts) and the outbox drain's dispatch provider
  # (createDispatchTokenProvider in github-app-tokens.ts). Every request,
  # home repo included, mints a short-lived per-repo GitHub App installation
  # token; there is no more ambient long-lived PAT fallback
  # (AGENT_LCARS_GITHUB_TOKEN, formerly wired here, is retired - the
  # Terraform secret container and its Secret Manager value are the
  # maintainer's own post-merge cleanup, see infra/terraform/main.tf).
  - variable: AGENT_LCARS_APP_CLIENT_ID
    value: 'Iv23liO6X8pLJLcTFzyv'
    availability:
      - RUNTIME
  - variable: AGENT_LCARS_APP_PRIVATE_KEY
    secret: AGENT_LCARS_APP_PRIVATE_KEY
    availability:
      - RUNTIME
