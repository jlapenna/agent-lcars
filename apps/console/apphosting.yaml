# Settings for Agent LCARS Frontend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
scripts:
  buildCommand: . tools/cloud-build-prebuild.sh && ./tools/nx bundle @agent-lcars/console --verbose
  runCommand: node dist/apps/console/.next/standalone/apps/console/server.js
outputFiles:
  serverApp:
    include:
      - dist/apps/console/.next/standalone
      - dist/apps/console/.next/static
runConfig:
  minInstances: 0
  cpu: 1
  # Bridge requests exceeded 1 GiB in production (#2617). Keep the same CPU
  # and scaling/concurrency policy while providing supported runtime headroom.
  memoryMiB: 2048
env:
  # Defined Values
  - variable: CI
    value: 'true'
    availability:
      - BUILD
  - variable: CLOUD_BUILD
    value: 'true'
    availability:
      - BUILD
  - variable: FORCE_COLOR
    value: '0'
    availability:
      - BUILD
      - RUNTIME
  - variable: NODE_OPTIONS
    value: '--max-old-space-size=3072'
    availability:
      - BUILD
  - variable: NX_DAEMON
    value: 'false'
    availability:
      - BUILD
  - variable: NO_COLOR
    value: '1'
    availability:
      - BUILD
  # Project Identification (Plain config values)
  - variable: PROJECT_ID
    value: 'agent-lcars'
    availability:
      - RUNTIME
      - BUILD
  - variable: QUICK_TASK_EVIDENCE_BUCKET
    value: 'agent-lcars-quick-task-evidence'
    availability:
      - RUNTIME

  # NextAuth URL
  - variable: AUTH_URL
    value: 'https://lcars.jlapenna.net'
    availability:
      - RUNTIME

  # This console deployment's own public base URL (see lib/deployment.ts's
  # consoleUrl). Required, no fallback (#1731) -- also the default --origin
  # the saved-session CLI tools point at.
  - variable: AGENT_LCARS_CONSOLE_URL
    value: 'https://lcars.jlapenna.net'
    availability:
      - RUNTIME

  # GCS object path for the one centrally-owned Codex subscription
  # credential (see lib/deployment.ts's codexCentralAuthObject and
  # lib/codex-auth-store.ts). Required, no fallback (#1731, #1751).
  - variable: AGENT_LCARS_CODEX_CENTRAL_AUTH_OBJECT
    value: 'jlapenna/agent-lcars/auth.json'
    availability:
      - RUNTIME

  # Optional -- see lib/deployment.ts's consoleDescription. Set explicitly
  # so this deployment's own page metadata stays what it has always been,
  # even though an unset value now falls back to a generic description
  # rather than this string.
  - variable: AGENT_LCARS_CONSOLE_DESCRIPTION
    value: 'jlapenna/agent-lcars — multi-agent issue activity'
    availability:
      - RUNTIME

  # Not sensitive - the allowlisted GitHub logins that may operate the
  # console. Authorization is deliberately separate from queue ownership.
  - variable: AGENT_LCARS_ADMIN_GITHUB_LOGINS
    value: 'jlapenna,lizsprinkles'
    availability:
      - RUNTIME

  # The maintainer identity whose queue the console curates (see
  # lib/deployment.ts). Adding another console operator must not change it.
  - variable: AGENT_LCARS_ADMIN_GITHUB_LOGIN
    value: 'jlapenna'
    availability:
      - RUNTIME

  # Not sensitive - grants for the Work API (see
  # apps/console/src/lib/work-grants.ts). Maps a Google service-account
  # email, `github:<login>` session subject, or signed
  # `github-actions:<owner/repo>` subject to a principal and the pipelines it
  # may operate. The current operator grants each list every supported
  # pipeline. That admission grant does not select an executor; the one
  # global cutover below does. svc:telemetry-writer
  # is the runner-autoscaler's queue executor claim identity
  # (native-work-items sub-project 4,
  # #1502): scoped to work.executor only, never work.operator -- see
  # docs/deployment-boundary.md's work-grants table. That grant makes it the
  # sole server-side claim capability source for every direct runner.
  #
  # svc:job-scheduler (#3217) is the server-owned schedule and maintenance
  # ticker identity: the runner-autoscaler ticker authenticates with its key
  # (LCARS_SCHEDULER_CREDENTIALS), which runner pods never mount. As the one
  # grant holding work.cron for goose it is also the repository-job
  # automation principal (jobAutomationPrincipal), so only it, not the
  # runner-mounted executor key, can admit jobs under a profile that lists it.
  #
  # The Firebase App Hosting default compute service account is Sprinkles'
  # current ambient backend identity. Its ID token's raw `email` is the
  # grant subject (work-auth verifies that value); the service-prefixed
  # principal is the stable audit identity. It replaces the restricted
  # `/lcars` Slack command's direct GitHub issue filing with a native item.
  # Its current grant lists every supported pipeline.
  #
  # svc:work-reader (#2502) is the interactive-session identity for the
  # read-only issue-owner and Costs budget queries. It carries work.reader and
  # costs.reader, never
  # work.operator; only the maintainer's Google account may impersonate it
  # (infra/terraform/main.tf, work_reader_token_creator).
  - variable: AGENT_LCARS_WORK_GRANTS
    value: '[{"principal":"user:jlapenna","subjects":["github:jlapenna"],"pipelines":["claude","codex","opencode","agy","goose"],"scopes":["work.operator","secrets.admin"]},{"principal":"workflow:work-create","subjects":["codex-agent@agent-lcars.iam.gserviceaccount.com"],"pipelines":["claude","codex","opencode","agy"],"scopes":["work.operator"]},{"principal":"workflow:member-automation","subjects":["github-actions:jlapenna/agent-lcars","github-actions:supersprinklesracing/sprinkles","github-actions:jlapenna/homelab","github-actions:supersprinklesracing/www","github-actions:supersprinklesracing/girosf","github-actions:jlapenna/nx-cache-server","github-actions:jlapenna/sync-padd"],"pipelines":["claude","codex","opencode","agy"],"scopes":["work.operator"]},{"principal":"svc:telemetry-writer","subjects":["telemetry-writer@agent-lcars.iam.gserviceaccount.com"],"pipelines":["claude","codex","opencode","agy","goose"],"scopes":["work.executor"]},{"principal":"svc:job-scheduler","subjects":["job-scheduler@agent-lcars.iam.gserviceaccount.com"],"pipelines":["goose"],"scopes":["work.cron"]},{"principal":"svc:firebase-app-hosting-compute@supersprinklesracing.iam.gserviceaccount.com","subjects":["firebase-app-hosting-compute@supersprinklesracing.iam.gserviceaccount.com"],"pipelines":["claude","codex","opencode","agy"],"scopes":["work.operator"],"channel":"slack"},{"principal":"svc:production-verifier","subjects":["github:agent-lcars-production-verifier"],"pipelines":["claude","codex","opencode","agy","goose"],"scopes":["work.operator"]},{"principal":"svc:job-secret-operator","subjects":["job-secret-operator@agent-lcars.iam.gserviceaccount.com"],"pipelines":["goose"],"scopes":["secrets.admin"]},{"principal":"svc:work-reader","subjects":["work-reader@agent-lcars.iam.gserviceaccount.com"],"pipelines":["claude","codex","opencode","agy"],"scopes":["work.reader","costs.reader"]},{"principal":"svc:linear","subjects":["linear-webhook-adapter"],"pipelines":["claude","codex","opencode","agy"],"scopes":["work.operator"],"channel":"linear"}]'
    availability:
      - RUNTIME

  # Tech issues carrying the dedicated LCARS label enter native Work for this repo.
  # docs/linear.md owns setup and secret ownership. Values remain in Secret Manager.
  - variable: AGENT_LCARS_LINEAR
    value: '{"organizationId":"8baeaebb-62f3-4c4b-a463-f9b4733173d6","operatorIds":["83b707e1-a261-4dad-af05-338629454e49"],"teams":[{"teamId":"6e8229a7-645e-44fa-8aad-415a4e08baa8","name":"Tech","repositories":[{"repo":"jlapenna/agent-lcars","labelId":"1bd8382c-0fe9-45ad-ba92-b19dade6ddd7"}],"states":{"started":"1fb0308f-e13b-4ccb-bf11-c6ccb47742ea","parked":"553770ec-906a-4a3a-910e-805cf90b426c","failed":"553770ec-906a-4a3a-910e-805cf90b426c","canceled":"c4550227-9f5a-43c1-83d1-c4d712b8705b","completed":"0ab16df0-99e7-4660-8494-12ca1aa865c9"},"triage":{"bugLabelIds":["6b441899-8a55-4070-a361-05229ce78dc2"],"readyLabelId":"ac4452a1-87ce-436f-8538-adfa134a718c","pipeline":"opencode","principal":"svc:linear"}}],"routes":[{"teamId":"6e8229a7-645e-44fa-8aad-415a4e08baa8","labelId":"ac4452a1-87ce-436f-8538-adfa134a718c","repo":"jlapenna/agent-lcars","pipeline":"codex","principal":"svc:linear"},{"teamId":"6e8229a7-645e-44fa-8aad-415a4e08baa8","labelId":"41932d60-9367-464b-b448-a5499ccdda08","repo":"jlapenna/agent-lcars","pipeline":"claude","principal":"svc:linear"},{"teamId":"6e8229a7-645e-44fa-8aad-415a4e08baa8","labelId":"86f9728e-d12d-47de-8080-6980921d5cb3","repo":"jlapenna/agent-lcars","pipeline":"opencode","principal":"svc:linear"}]}'
    availability:
      - RUNTIME
  - variable: AGENT_LCARS_LINEAR_API_KEY
    secret: AGENT_LCARS_LINEAR_API_KEY
    availability:
      - RUNTIME
  - variable: AGENT_LCARS_LINEAR_WEBHOOK_SECRET
    secret: AGENT_LCARS_LINEAR_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # Operator-owned repository job profiles (docs/repository-jobs.md). Each
  # profile names the repositories and principals that may admit a Goose
  # recipe, its exact whole-job allocation, and the approved input sets.
  # homelab-security-audit admits jclaw's manual-only weekly-security-audit
  # recipe for the maintainer and for the dedicated production-verification
  # identity (its saved console session performs live runtime qualification,
  # see .agents/skills/verifying-console-session). Its allocation equals the lcars-work executor
  # pool (jlapenna/homelab github-runner-autoscaler/orchestrator.yml). crossRepo
  # reuses the renewable cross-repository checkout credential so the recipe's
  # read-only `gh issue list` on the findings repository works; a recipe input
  # cannot select it.
  - variable: AGENT_LCARS_JOB_PROFILES
    value: '[{"name":"homelab-security-audit","repositories":["jlapenna/jclaw"],"principals":["user:jlapenna","svc:production-verifier"],"crossRepo":true,"allocation":{"cpu":2,"memory":"6Gi","storage":"24Gi"},"inputSets":[{"subnet":"192.168.68.0/24","findingsRepository":"jlapenna/homelab","mode":"report"}]},{"name":"skill-evals","repositories":["jlapenna/agent-lcars","jlapenna/homelab","supersprinklesracing/sprinkles","supersprinklesracing/www","jlapenna/labels","jlapenna/jclaw","jlapenna/homegit","jlapenna/home-assistant-config","jlapenna/sparkstack-registry"],"principals":["user:jlapenna","svc:production-verifier","svc:job-scheduler"],"allocation":{"cpu":2,"memory":"6Gi","storage":"24Gi"},"inputSets":[{"mode":"report"}],"providerAuth":"codex","credentialSet":{"name":"skill-evals","revision":2},"resultFile":"/tmp/skill-evals/report/result.json","fallbackProfile":"skill-evals-claude"},{"name":"skill-evals-claude","repositories":["jlapenna/agent-lcars","jlapenna/homelab","supersprinklesracing/sprinkles","supersprinklesracing/www","jlapenna/labels","jlapenna/jclaw","jlapenna/homegit","jlapenna/home-assistant-config","jlapenna/sparkstack-registry"],"principals":["user:jlapenna","svc:production-verifier","svc:job-scheduler"],"allocation":{"cpu":2,"memory":"6Gi","storage":"24Gi"},"inputSets":[{"mode":"report"}],"providerAuth":"claude","credentialSet":{"name":"skill-evals","revision":2},"resultFile":"/tmp/skill-evals/report/result.json","fallbackProfile":"skill-evals-agy"},{"name":"skill-evals-agy","repositories":["jlapenna/agent-lcars","jlapenna/homelab","supersprinklesracing/sprinkles","supersprinklesracing/www","jlapenna/labels","jlapenna/jclaw","jlapenna/homegit","jlapenna/home-assistant-config","jlapenna/sparkstack-registry"],"principals":["user:jlapenna","svc:production-verifier","svc:job-scheduler"],"allocation":{"cpu":2,"memory":"6Gi","storage":"24Gi"},"inputSets":[{"mode":"report"}],"providerAuth":"agy","credentialSet":{"name":"skill-evals","revision":2},"resultFile":"/tmp/skill-evals/report/result.json","providerModel":"gemini-4-argon-medium"},{"name":"dev-personal-github","repositories":["jlapenna/dev"],"principals":["user:jlapenna"],"credentialSet":{"name":"dev-personal-github","revision":1},"gitIdentity":{"name":"Joe LaPenna","email":"45910+jlapenna@users.noreply.github.com"},"allocation":{"cpu":2,"memory":"6Gi","storage":"24Gi"},"inputSets":[{"mode":"report"}]}]'
    availability:
      - RUNTIME

  # Not sensitive - the audience the work API requires on Google ID tokens.
  - variable: AGENT_LCARS_WORK_AUDIENCE
    value: 'agent-lcars-work'
    availability:
      - RUNTIME

  # Resumable-conversations plan 5: a JSON map from a native item's
  # `origin.channel` to its outbound delivery target, read by
  # lib/outcome-webhook.ts's outcomeWebhookFor. A settled native item whose
  # origin names a thread has its outcome delivered there through the outbox
  # drain -- the same lease/retry/backoff path the GitHub outcome comment
  # already uses.
  #
  # The `slack` target is the sprinkles bot's verified receiver
  # (supersprinklesracing/sprinkles#5097): `registerOutcomeRoute` mounts
  # POST /lcars/outcome on the bot's own Express surface, and it verifies a
  # Google ID token for this exact audience issued by this console's runtime
  # identity, rejecting anything else 401 without posting.
  #
  # Only the sprinkles bot's grant declares `channel: "slack"` (#1806), and
  # the channel is grant-declared rather than caller-supplied (#1804), so no
  # other caller can route its outcomes here.
  - variable: AGENT_LCARS_OUTCOME_WEBHOOKS
    value: '{"slack":{"url":"https://bot.supersprinkles.racing/lcars/outcome","audience":"agent-lcars-outcome"}}'
    availability:
      - RUNTIME

  # Explicit deployment identity. Repository configuration has no source
  # fallback, so these values remain visible and mutually validated here.
  - variable: AGENT_LCARS_FLEET_GITHUB_LOGIN
    value: 'agent-lcars-bot'
    availability:
      - RUNTIME

  # The repository allowed to invoke the hosted control-plane endpoints via
  # GitHub Actions OIDC, and the repository the reconciler scans.
  - variable: AGENT_LCARS_CONTROL_PLANE_REPOSITORY
    value: 'jlapenna/agent-lcars'
    availability:
      - RUNTIME
  # Repositories the orchestrator admits (webhook, ingest,
  # task-state). The home repo stays the reconcile caller. Dispatch tokens
  # are minted per repository from the fleet App (#1197/#1287); the ambient
  # PAT this flip was originally probe-verified against (#1190) has been
  # retired.
  - variable: AGENT_LCARS_CONTROL_PLANE_REPOSITORIES
    value: 'jlapenna/agent-lcars,supersprinklesracing/sprinkles,jlapenna/homelab,supersprinklesracing/www,supersprinklesracing/girosf,jlapenna/nx-cache-server,jlapenna/sync-padd,jlapenna/messages-control,jlapenna/labels,jlapenna/jclaw,jlapenna/home-assistant-config,jlapenna/sparkstack-registry,jlapenna/homegit,jlapenna/dev'
    availability:
      - RUNTIME

  - variable: AGENT_LCARS_WEBHOOK_QUEUE
    value: 'dispatch-webhooks'
    availability:
      - RUNTIME

  - variable: AGENT_LCARS_WEBHOOK_TASK_SERVICE_ACCOUNT
    value: 'firebase-app-hosting-compute@agent-lcars.iam.gserviceaccount.com'
    availability:
      - RUNTIME

  - variable: AGENT_LCARS_WEBHOOK_QUEUE_LOCATION
    value: 'us-central1'
    availability:
      - RUNTIME

  - variable: DISPATCH_FIRESTORE_DATABASE_ID
    value: 'dispatch-controller'
    availability:
      - RUNTIME

  - variable: AGENT_LCARS_ARTIFACT_SHARE_BASE_URL
    value: 'https://share.lan.jlapenna.net'
    availability:
      - RUNTIME

  # The curated repo list this console watches. It must exactly match
  # AGENT_LCARS_CONTROL_PLANE_REPOSITORIES; either mismatch fails closed.
  # Every watched repository uses the canonical Claude, Codex, and OpenCode
  # integrations. Only `agents: false` opts a repository out entirely.
  # jlapenna/jclaw and jlapenna/dev are watched for repository-owned Goose
  # jobs (AGENT_LCARS_JOB_PROFILES above), without coding-agent dispatch.
  - variable: AGENT_LCARS_WATCHED_REPOS
    value: '[{"owner":"supersprinklesracing","name":"sprinkles","alias":"sprinkles"},{"owner":"jlapenna","name":"agent-lcars","alias":"agent-lcars"},{"owner":"jlapenna","name":"homelab","alias":"homelab"},{"owner":"supersprinklesracing","name":"www","alias":"www"},{"owner":"supersprinklesracing","name":"girosf","alias":"girosf"},{"owner":"jlapenna","name":"nx-cache-server","alias":"nx-cache-server"},{"owner":"jlapenna","name":"sync-padd","alias":"sync-padd"},{"owner":"jlapenna","name":"messages-control","alias":"messages-control"},{"owner":"jlapenna","name":"labels","alias":"labels"},{"owner":"jlapenna","name":"jclaw","alias":"jclaw","agents":false},{"owner":"jlapenna","name":"home-assistant-config","alias":"home-assistant-config"},{"owner":"jlapenna","name":"sparkstack-registry","alias":"sparkstack-registry"},{"owner":"jlapenna","name":"homegit","alias":"homegit"},{"owner":"jlapenna","name":"dev","alias":"dev","agents":false}]'
    availability:
      - RUNTIME

  # Decision Inbox descriptions and completion handoff actions share this
  # bounded server-only provider. The dedicated virtual key permits only this model.
  - variable: AGENT_LCARS_HANDOFF_SUMMARY_URL
    value: 'https://llm.jlapenna.net/chat/completions'
    availability:
      - RUNTIME
  - variable: AGENT_LCARS_HANDOFF_SUMMARY_MODEL
    value: 'default'
    availability:
      - RUNTIME
  - variable: AGENT_LCARS_HANDOFF_SUMMARY_API_KEY
    secret: AGENT_LCARS_HANDOFF_SUMMARY_API_KEY
    availability:
      - RUNTIME

  # Explicit opt-in Web Push. JSON contains publicKey, privateKey and subject;
  # only publicKey is returned to an authenticated browser.
  - variable: AGENT_LCARS_PUSH_VAPID
    secret: AGENT_LCARS_PUSH_VAPID
    availability:
      - RUNTIME

  # Actual Secrets from GCP Secret Manager
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability:
      - RUNTIME
  - variable: AUTH_GITHUB_ID
    secret: AUTH_GITHUB_ID
    availability:
      - RUNTIME
  - variable: AUTH_GITHUB_SECRET
    secret: AUTH_GITHUB_SECRET
    availability:
      - RUNTIME
  - variable: AGENT_LCARS_WEBHOOK_SECRET
    secret: AGENT_LCARS_WEBHOOK_SECRET
    availability:
      - RUNTIME
  # #1284: both of these are now required, everywhere the console calls
  # GitHub - the singleton Octokit client (getGithubClient() in
  # github-client.ts) and the outbox drain's dispatch provider
  # (createDispatchTokenProvider in github-app-tokens.ts). Every request,
  # home repo included, mints a short-lived per-repo GitHub App installation
  # token; there is no more ambient long-lived PAT fallback
  # (AGENT_LCARS_GITHUB_TOKEN, formerly wired here, is retired - the
  # Terraform secret container and its Secret Manager value are the
  # maintainer's own post-merge cleanup, see infra/terraform/main.tf).
  - variable: AGENT_LCARS_APP_CLIENT_ID
    value: 'Iv23liO6X8pLJLcTFzyv'
    availability:
      - RUNTIME
  - variable: AGENT_LCARS_APP_PRIVATE_KEY
    secret: AGENT_LCARS_APP_PRIVATE_KEY
    availability:
      - RUNTIME

  # Application-owned job credentials; values are resolved at runtime, never during build.
  - variable: AGENT_LCARS_JOB_SECRETS_PROJECT
    value: agent-lcars-job-secrets
    availability: [RUNTIME]
  - variable: AGENT_LCARS_JOB_SECRETS_WRITER
    value: job-secret-writer@agent-lcars-job-secrets.iam.gserviceaccount.com
    availability: [RUNTIME]
