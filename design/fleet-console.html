<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent LCARS — Jobs</title>
<meta name="description" content="Agent LCARS console design prototype. Browse registered jobs, review repository definitions and simulate manual Work admission.">
<style>
@font-face { font-family: "Antonio"; src: url(assets/fonts/Antonio-500-700.woff2) format("woff2"); font-weight: 500 700; font-display: swap; }
@font-face { font-family: "IBM Plex Sans"; src: url(assets/fonts/IBMPlexSans-400-600.woff2) format("woff2"); font-weight: 400 600; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(assets/fonts/IBMPlexMono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(assets/fonts/IBMPlexMono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }

/* ---- Tokens: values are theme.ts palette anchors + dark ramp ---- */
:root {
  --surface: #060709;          /* the one ground (dark-9) */
  --surface-raised: #0f121a;   /* menus, row hover only */
  --hairline: #212736;         /* dark-6 */
  --ink: #eeeff2;              /* gray-0 */
  --ink-dim: #a5adc0;          /* dark-2 */
  --ink-on-accent: #06070a;
  --ink-on-muted: #f4f4f6;
  --spark: #505c7c;            /* dark-4: quiet data encoding */
  --track: #212736;

  --amber: #ff9f45; --blue: #6c8fe0; --periwinkle: #8c8fde;
  --violet: #b15fc7; --teal: #4fb8c4; --gold: #e0b84b;

  /* status: never a route accent */
  --ok: #4fae8c; --warn: #b98e19; --warn-ink: #e0b84b; --fail: #d9694f; --fail-ink: #df9786;

  --signal-stops: var(--blue) 0 56%, var(--violet) 56% 76%, var(--gold) 76% 100%;
  --spine: 6px;

  --rail-w: 152px; --arm-h: 24px; --knee-r: 32px; --outer-r: 72px; --gap: 32px;

  --f-display: "Antonio", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
[data-accent="amber"] { --accent: var(--amber); }
[data-accent="blue"] { --accent: var(--blue); }
[data-accent="periwinkle"] { --accent: var(--periwinkle); }
[data-accent="violet"] { --accent: var(--violet); }
[data-accent="teal"] { --accent: var(--teal); }
[data-accent="gold"] { --accent: var(--gold); }
[data-accent] {
  --accent-ink: color-mix(in srgb, var(--accent) 80%, white);
  --accent-muted: color-mix(in srgb, var(--accent) 52%, var(--surface));
  --accent-muted-hover: color-mix(in srgb, var(--accent) 40%, var(--surface));
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--surface); color: var(--ink); }
body { font: 400 14px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
.mono { font-family: var(--f-mono); }
.dim { color: var(--ink-dim); }
.eyebrow { font: 600 12px/1 var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-dim); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Page grid: elbow rail | header + body ---- */
.page { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: auto 1fr; column-gap: var(--gap); min-height: 100vh; padding-right: 28px; }

/* ---- The one elbow: rail turns through the knee into the arm ---- */
.rail-head { position: relative; grid-row: 1; background: var(--accent); border-top-left-radius: var(--outer-r); display: flex; flex-direction: column; justify-content: flex-end; padding: 0 12px 12px; color: var(--ink-on-accent); text-align: right; }
.rail-head::after { content: ""; position: absolute; left: 100%; top: 0; width: var(--knee-r); height: calc(var(--arm-h) + var(--knee-r)); background: var(--accent);
  -webkit-mask: radial-gradient(circle at 100% 100%, transparent calc(var(--knee-r) - .5px), #000 var(--knee-r)) 0 var(--arm-h) / var(--knee-r) var(--knee-r) no-repeat, linear-gradient(#000, #000) 0 0 / 100% var(--arm-h) no-repeat;
          mask: radial-gradient(circle at 100% 100%, transparent calc(var(--knee-r) - .5px), #000 var(--knee-r)) 0 var(--arm-h) / var(--knee-r) var(--knee-r) no-repeat, linear-gradient(#000, #000) 0 0 / 100% var(--arm-h) no-repeat; }
.rail-brand { font: 700 22px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
/* the environment line: the host this console serves */
.rail-code { font: 500 11px/1.4 var(--f-mono); margin-top: 6px; text-transform: uppercase; }
.rail-body { grid-row: 2; display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.rail-block { background: var(--accent-muted); color: var(--ink-on-muted); padding: 8px 12px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; text-align: right; }
.rail-block b { font: 500 18px/1.1 var(--f-mono); }
.rail-block span { font: 600 11px/1.2 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.rail-block.fill { flex: 1; min-height: 40px; }
.rail-block.end { background: var(--accent); color: var(--ink-on-accent); height: 44px; }

/* ---- Header ---- */
.header { grid-row: 1; grid-column: 2; padding-bottom: 18px; min-width: 0; }
.arm { display: flex; gap: 6px; height: var(--arm-h); }
.arm i { background: var(--accent); display: block; }
.arm i:first-child { flex: 1; }
.title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 18px 0 0; }
.title-block { min-width: 0; }
h1 { margin: 0; font: 700 46px/.95 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.subtitle { margin-top: 6px; color: var(--ink-dim); font-size: 13px; }
.subtitle a { color: inherit; text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 3px; }
.utilities { display: flex; align-items: center; gap: 12px; justify-content: flex-end; position: relative; }
/* live routes stream; the others say when the page was loaded */
.sync { font: 400 12px/1.3 var(--f-mono); color: var(--ink-dim); text-align: right; white-space: nowrap; }
.sync b { color: var(--ok); font-weight: 500; }
.sync b.snap { color: var(--ink-dim); }
.sync-compact { display: none; font: 400 11px/1.3 var(--f-mono); color: var(--ink-dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync-compact b { color: var(--ok); font-weight: 500; }
.sync-compact b.snap { color: var(--ink-dim); }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.who .av { width: 32px; height: 32px; background: var(--hairline); display: grid; place-items: center; font: 600 13px var(--f-display); letter-spacing: .05em; }
.icon { width: 16px; height: 16px; flex: none; }

.signal { display: flex; gap: 4px; height: 6px; margin: 16px 0 12px; }
.signal i { display: block; background: linear-gradient(to right, var(--signal-stops)); }
.signal i:nth-child(1) { flex: 0 0 34%; background: var(--blue); }
.signal i:nth-child(2) { flex: 0 0 12%; background: var(--violet); }
.signal i:nth-child(3) { flex: 0 0 7%; background: var(--gold); }
.signal i:nth-child(4) { flex: 0 0 3%; background: var(--amber); }
.signal i:nth-child(5) { flex: 1; background: var(--teal); max-width: 14%; }

/* destination rail: square modules sized by their labels (6.5rem floor),
   label docked to the trailing edge, one row at laptop widths */
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; height: 44px; padding: 0 12px 7px; min-width: 6.5rem;
  background: var(--accent-muted); color: var(--ink-on-muted); text-decoration: none; font: 600 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; transition: background-color .14s; }
.nav a small { font: 500 11px/1 var(--f-mono); letter-spacing: 0; opacity: .9; align-self: flex-start; padding-top: 7px; }
.nav a:hover { background: var(--accent-muted-hover); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--ink-on-accent); }
.nav a:active { transform: translateY(1px); }

/* readout strip: the rail's figures on one line where the rail is hidden */
.strip { display: none; font: 400 11px/1.4 var(--f-mono); color: var(--ink-dim); }
.strip b { color: var(--ink); font-weight: 500; }
.strip > span { white-space: nowrap; margin-right: 12px; }

/* ---- Buttons: flat blocks ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border: 0; border-radius: 0; cursor: pointer; text-decoration: none;
  font: 600 14px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; transition: background-color .14s; white-space: nowrap; }
.btn:hover { text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--ink-on-accent); height: 40px; padding: 0 20px; }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 86%, white); }
.btn-secondary { background: var(--accent-muted); color: var(--ink-on-muted); }
.btn-secondary:hover { background: var(--accent-muted-hover); }
/* the header's create command keeps the console's amber on every route */
.btn-create { background: var(--amber); color: var(--ink-on-accent); height: 36px; padding: 0 10px; font-size: 13px; }
.btn-icon { width: 44px; height: 44px; padding: 0; }
.btn-sm { height: 30px; padding: 0 12px; font-size: 13px; }
.btn:active { transform: translateY(1px); }
.kebab { width: 28px; height: 28px; display: inline-grid; place-items: center; background: transparent; border: 0; color: var(--ink-dim); cursor: pointer; font: 600 18px/1 var(--f-body); }
.kebab:hover { color: var(--ink); background: var(--surface-raised); }

/* ---- Console menu (the ⋯ utility): destinations, preferences, identity ---- */
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; width: 248px; max-width: calc(100vw - 16px); background: var(--surface-raised); border: 1px solid var(--hairline); padding: 6px 0; display: none; }
.menu[data-open] { display: block; }
.menu .eyebrow { display: block; padding: 8px 12px 6px; font-size: 11px; }
.menu a, .menu button.item { display: flex; align-items: center; min-height: 40px; padding: 0 12px; width: 100%; color: var(--ink); background: none; border: 0; font: 400 14px var(--f-body); text-align: left; cursor: pointer; }
.menu a:hover, .menu button.item:hover { background: var(--hairline); text-decoration: none; }
.menu a[aria-current="page"] { color: var(--accent-ink); }
.menu hr { border: 0; border-top: 1px solid var(--hairline); margin: 6px 0; }
.menu .ident { display: flex; align-items: center; gap: 8px; padding: 4px 12px 8px; font-size: 13px; }
.menu .ident > span:last-child { min-width: 0; overflow-wrap: anywhere; }
/* Destinations join the menu only below 64em, where the pills are folded. */
@media (min-width: 64em) { .menu .nav-group { display: none; } }

/* ---- Workspace frame ---- */
.body { grid-row: 2; grid-column: 2; padding: 16px 0 28px; min-width: 0; }
.frame { border: 1px solid var(--hairline); }
.warnband { display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-left: 4px solid var(--warn); border-bottom: 1px solid var(--hairline); color: var(--warn-ink); font-size: 13px; }
.warnband .eyebrow { color: var(--warn-ink); }
.warnband .sep { color: var(--hairline); }
.warnband a { color: var(--warn-ink); text-decoration: underline; text-underline-offset: 3px; margin-left: auto; white-space: nowrap; }
.warnband.none { border-left-color: var(--hairline); color: var(--ink-dim); }
.warnband.none .eyebrow { color: var(--ink-dim); }
/* Every control applies on change; there is no Apply step. */
.toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
.field { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--hairline); background: var(--surface); color: var(--ink); font: 400 13px var(--f-body); }
.field .eyebrow { font-size: 11px; }
select.field { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(-45deg, transparent 50%, var(--ink-dim) 50%); background-size: 5px 5px; background-position: right 14px center, right 9px center; background-repeat: no-repeat; cursor: pointer; max-width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--hairline); }
.seg button { height: 34px; padding: 0 14px; border: 0; background: transparent; color: var(--ink-dim); font: 500 12px var(--f-mono); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--hairline); }
.seg button:hover:not(:disabled) { color: var(--ink); background: var(--surface-raised); }
.seg button[aria-pressed="true"] { background: var(--accent-muted); color: var(--ink-on-muted); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.tb-note { font-size: 12px; color: var(--ink-dim); }
.search { width: 220px; }
.search input { border: 0; background: transparent; color: var(--ink); font: inherit; width: 100%; outline: none; min-width: 0; }
.search input::placeholder { color: var(--ink-dim); }
.search:focus-within { outline: 2px solid var(--amber); outline-offset: 2px; }
.search .opts { border: 0; background: none; color: var(--ink-dim); cursor: pointer; padding: 0; display: grid; place-items: center; }
details.more { position: relative; }
details.more > summary { list-style: none; cursor: pointer; }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] .more-panel { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; display: grid; gap: 8px; padding: 10px; background: var(--surface-raised); border: 1px solid var(--hairline); width: 240px; }
.asof { font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
.phone-only { display: none; }
/* Keyboard hints only where a hover-capable pointer is present. */
@media not ((hover: hover) and (pointer: fine)) { .kbd-hint { display: none; } }
.compact-link { display: none; font-size: 14px; white-space: nowrap; }
/* The Inbox's phone meta line sits on the list it describes, sharing its edge. */
.list-meta { justify-content: space-between; align-items: baseline; padding: 0 12px 8px; border-bottom: 1px solid var(--hairline); margin-bottom: 12px; font-size: 12px; color: var(--ink-dim); }
.toolbar .push { margin-left: auto; }
.fold-toggle { display: none; }
.fold-group { display: contents; }
.content { padding: 20px; display: grid; gap: 28px; }

/* ---- Readouts ---- */
.readouts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); row-gap: 16px; }
.readout { padding: 2px 20px; border-left: 1px solid var(--hairline); min-width: 0; }
.readout:first-child { border-left: 0; padding-left: 4px; }
.readout .val { font: 500 30px/1.1 var(--f-mono); margin: 10px 0 2px; letter-spacing: -.01em; }
.readout .val small { font-size: 15px; color: var(--ink-dim); }
.readout .sub { font-size: 12px; color: var(--ink-dim); min-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.readouts.wrap .sub { white-space: normal; }
.spark { display: block; width: 100%; height: 28px; margin-top: 10px; }
.spark rect { fill: var(--spark); }
.spark rect.now { fill: var(--accent); }
.spark rect.warn { fill: var(--warn); }
.alert { padding: 12px 16px; background: color-mix(in srgb, var(--fail) 18%, var(--surface)); color: var(--ink); font-size: 14px; }

/* ---- Panels: square spine down the leading edge ---- */
.cols { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.stack { display: grid; gap: 28px; min-width: 0; }
.panel { display: grid; grid-template-columns: var(--spine) minmax(0, 1fr); column-gap: 16px; min-width: 0; }
.panel::before { content: ""; background: var(--accent); }
.panel.signalled { grid-template-columns: var(--spine) minmax(0, 1fr) var(--spine); }
.panel.signalled::after { content: ""; background: linear-gradient(to bottom, var(--signal-stops)); }
.panel-head { display: flex; align-items: baseline; gap: 10px; padding: 2px 0 12px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
.panel-head h2 { margin: 0; font: 600 19px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.panel-head .count { font: 500 14px var(--f-mono); color: var(--accent-ink); }
.panel-head .meta { margin-left: auto; font: 400 12px var(--f-mono); color: var(--ink-dim); }
.panel-head .seg { align-self: center; }
.panel-head .seg button { height: 26px; padding: 0 10px; font: 600 12px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 10px 8px 0; font: 600 11px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); border-bottom: 1px solid var(--hairline); white-space: nowrap; }
td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
tbody tr:hover td { background: var(--surface-raised); }
td.num, th.num { text-align: right; white-space: nowrap; }
td.num { font-family: var(--f-mono); font-size: 13px; }
.ref { font: 500 12px var(--f-mono); color: var(--accent-ink); white-space: nowrap; }
.item-title { display: block; color: var(--ink); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.cell-clip { max-width: 0; width: 40%; }
.links { display: block; margin-top: 4px; font-size: 12px; color: var(--ink-dim); }
.tag { display: inline-block; padding: 3px 6px 2px; border: 1px solid var(--hairline); font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-dim); }
.tag.live { background: color-mix(in srgb, var(--ok) 55%, var(--surface)); border-color: transparent; color: var(--ink); }
.tag.idle { background: color-mix(in srgb, var(--warn) 60%, var(--surface)); border-color: transparent; color: var(--ink); }
.tag.badge { border-color: var(--ink-dim); color: var(--ink); }
table.sess { table-layout: fixed; }
table.sess .cell-clip { max-width: none; width: auto; overflow: hidden; }
.group-head { display: flex; align-items: baseline; gap: 10px; padding: 16px 0 6px; flex-wrap: wrap; }
.group-head h3 { margin: 0; font: 600 16px/1 var(--f-display); letter-spacing: .04em; }
.group-head .dim { font-size: 12px; }

/* phase readout: five flat blocks */
.phase { display: flex; gap: 2px; }
.phase i { display: block; width: 18px; height: 8px; background: var(--track); }
.phase i.done { background: var(--accent); }
.phase i.cur { background: linear-gradient(to right, var(--accent) var(--p), var(--accent-muted) var(--p)); }
.phase-label { font: 500 11px/1 var(--f-mono); color: var(--ink-dim); margin-top: 6px; text-transform: uppercase; white-space: nowrap; }

.meter { height: 6px; background: var(--track); min-width: 80px; }
.meter i { display: block; height: 100%; background: var(--spark); width: var(--v); }
.meter.warn i { background: var(--warn); }
.meter.fail i { background: var(--fail); }
.budget { font: 400 12px var(--f-mono); color: var(--ink-dim); margin-top: 6px; white-space: nowrap; }
.budget b { color: var(--ink); font-weight: 500; }
.budget.warn b { color: var(--warn-ink); }

.state { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 13px; }
.state::before { content: ""; width: 8px; height: 8px; background: currentColor; }
.state.ok { color: var(--ok); } .state.fail { color: var(--fail-ink); } .state.warn { color: var(--warn-ink); }
.state.busy { color: var(--ink); } .state.idle { color: var(--ink-dim); } .state.neutral { color: var(--ink-dim); }

/* decision inbox */
.inbox { list-style: none; margin: 0; padding: 0; }
.inbox li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 12px 0; border-bottom: 1px solid var(--hairline); align-items: center; }
.inbox li.sel { box-shadow: inset 4px 0 0 var(--accent); padding-left: 12px; }
.inbox .kind { font: 600 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
.inbox .t { color: var(--ink); margin: 5px 0 4px; }
.inbox .m { font: 400 12px var(--f-mono); color: var(--ink-dim); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.inbox .m > span { white-space: nowrap; }
.inbox .m .late { color: var(--warn-ink); }
.inbox .acts { display: flex; align-items: center; gap: 4px; }

/* operations rows: content left, the action on a stable right edge */
.ops-rows { display: grid; }
.op-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
.op-row:last-child { border-bottom: 0; }
.op-row .t { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op-row .line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--ink-dim); }
.op-row .acts { display: flex; align-items: center; gap: 4px; }

/* hosts */
.host-spec { font: 400 11px/1.4 var(--f-mono); color: var(--ink-dim); display: block; margin-top: 2px; white-space: nowrap; }
.slots { display: flex; gap: 2px; }
.slots i { width: 12px; height: 12px; background: var(--track); display: block; }
.slots i.busy { background: var(--ink-dim); }
.slots i.drain { background: var(--warn); }
.slots i.off { background: transparent; border: 1px solid var(--fail); }
.slots i.open { background: transparent; border: 1px solid var(--hairline); }
.bars { display: grid; gap: 5px; min-width: 110px; }
.bars div { display: grid; grid-template-columns: 30px 1fr 30px; gap: 6px; align-items: center; font: 400 11px var(--f-mono); color: var(--ink-dim); }
.bars span:last-child { text-align: right; }

const $ = (s) => document.querySelector(s);
const money = (n) => '$' + n.toFixed(2);
function spark(vals, { warnAbove = Infinity, label = '' } = {}) {
  const max = Math.max(...vals), n = vals.length, w = 4;
  const bars = vals.map((v, i) => {
    const h = Math.max(1.5, (v / max) * 28);
    const cls = i === n - 1 ? 'now' : v > warnAbove ? 'warn' : '';
    return `<rect class="${cls}" x="${i * w}" y="${28 - h}" width="${w - 1}" height="${h}"/>`;
  }).join('');
  return `<svg class="spark" viewBox="0 0 ${n * w - 1} 28" preserveAspectRatio="none" role="img" aria-label="${label}">${bars}</svg>`;
}
const series = (base, amp, n, seed) => Array.from({ length: n }, (_, i) => Math.round(base + amp * Math.sin(i * 0.55 + seed) + amp * 0.6 * Math.sin(i * 1.7 + seed * 2)));
const meterCls = (pct) => pct >= 100 ? 'fail' : pct >= 80 ? 'warn' : '';
const kebab = (label) => `<button class="kebab" type="button" aria-label="${label}">⋮</button>`;

function phaseCell(r) {
  const blocks = PHASES.map((_, i) => i < r.phase ? '<i class="done"></i>' : i === r.phase ? `<i class="cur" style="--p:${r.p}%"></i>` : '<i></i>').join('');
  return `<div class="phase" aria-label="Phase ${r.phase + 1} of 5: ${PHASES[r.phase]}">${blocks}</div><div class="phase-label">${r.note}</div>`;
}
function budgetCell(r) {
  const pct = Math.round((r.used / r.cap) * 100), c = meterCls(pct);
  return `<div class="meter ${c}"><i style="--v:${Math.min(pct, 100)}%"></i></div><div class="budget ${c}"><b>${money(r.used)}</b> / ${money(r.cap)} · ${r.tok} tok</div>`;
}

function jobDefinition(j) { return `<div class="job-section" data-od-id="jobs-definition"><h3>Installed definition</h3><p class="job-caption">Illustrative content for this prototype. Repository file, revision and digest were not supplied.</p><dl class="job-facts"><div><dt>Job key</dt><dd class="mono">${j.name}</dd></div><div><dt>Repository</dt><dd>${esc(jobRepo(j))}</dd></div><div><dt>Triggers</dt><dd>${j.schedule}${j.cron ? ' · manual run available' : ''}</dd></div>${j.cron ? `<div><dt>Schedule expression</dt><dd><code>${j.cron}</code><br>Timezone: UTC</dd></div>` : ''}</dl><h3>Recipe review</h3><p>${j.recipe}</p><details data-od-id="jobs-recipe-excerpt"><summary>Illustrative recipe excerpt</summary><pre># Example only — not repository source\n${esc(j.recipe)}</pre></details><p class="job-caption">The implemented console must show the complete installed recipe and bind review to its revision and digest.</p><label class="job-review"><input type="checkbox" id="job-reviewed" data-od-id="jobs-reviewed" ${jobUI.reviewed[j.id] ? 'checked' : ''}><span>I reviewed this example definition and recipe.</span></label>${!j.enabled ? jobButton('toggle', 'Enable reviewed job', true, !jobUI.reviewed[j.id]) : '<p class="job-caption">This example is already enabled. Review does not change its state.</p>'}</div>`; }
function jobLatest(j) { const run = jobUI.runs[j.id]; return `<div class="job-section" data-od-id="jobs-latest"><h3>${jobUI.work ? 'Work detail · simulated' : 'Latest run'}</h3>${run ? `<div class="job-notice"><strong>Queued · simulated</strong><p>This interaction created a local example only. No Work was admitted and no execution has started.</p></div><dl class="job-facts"><div><dt>Trigger</dt><dd>Manual · this prototype session</dd></div><div><dt>Parameters</dt><dd>${Object.entries(run).map(([k,v]) => `${esc(k)}: ${esc(v || 'Not set')}`).join('<br>')}</dd></div><div><dt>Result</dt><dd>Not available</dd></div></dl>${jobUI.work ? jobButton('latest', 'Back to latest run') : jobButton('work', 'Open simulated Work')}<h3>Artifacts</h3><p class="job-caption">No validated artifacts yet. When returned, artifact names and links belong here, tied to this occurrence.</p>` : `<p>No run history supplied.</p><p class="job-caption">Latest status, Work and artifacts appear together when an occurrence is available. No completed audits or results are implied.</p><dl class="job-facts"><div><dt>Work</dt><dd>Not supplied</dd></div><div><dt>Artifacts</dt><dd>Not supplied</dd></div></dl>`}</div>`; }
function jobParameters(j) { if (j.id === 'sprinkles-heal') return [{ key:'pull_request', label:'Pull request number', hint:'Required · positive whole number', required:true, pattern:'[1-9][0-9]*', value:'' }]; if (j.id === 'sprinkles-verify') return [{ key:'deployment_url', label:'Deployment URL', hint:'Required · HTTPS address', required:true, pattern:'https://.+', value:'' },{ key:'expected_revision', label:'Expected revision', hint:'Required · commit or release reference', required:true, value:'' }]; return [{ key:'target_ref', label:'Target revision', hint:'Required · branch, tag or commit', required:true, value:'main' }]; }
function jobRunForm(j) { const draft = jobUI.drafts[j.id] || {}; return `<form class="job-form" id="job-run-form" novalidate data-od-id="jobs-run-form"><h3>Run once</h3><p class="job-caption">Example parameters for interaction review; the real form must come from the installed recipe schema. Scheduled runs stay unchanged.</p>${jobParameters(j).map(p => `<label for="job-param-${p.key}">${p.label}<input class="field" id="job-param-${p.key}" name="${p.key}" data-job-param="${p.key}" data-od-id="jobs-param-${p.key}" value="${esc(draft[p.key] ?? p.value)}" maxlength="2048" ${p.required ? 'required' : ''} ${p.pattern ? `pattern="${p.pattern}"` : ''} aria-describedby="job-hint-${p.key} job-error-${p.key}"><span class="job-caption" id="job-hint-${p.key}">${p.hint}</span><span class="job-issue" id="job-error-${p.key}" role="alert"></span></label>`).join('')}<label for="job-note">Run note <span class="job-caption">Optional · local context for this example</span><textarea class="field" id="job-note" name="note" data-job-param="note" maxlength="2048" data-od-id="jobs-run-note">${esc(draft.note || '')}</textarea></label><p class="job-caption">Repository: ${esc(j.repo)}<br>Execution: one manual occurrence · simulated</p><div id="job-form-error" role="alert"></div><div class="job-actions"><button class="btn btn-primary" type="submit" data-od-id="jobs-queue-run">Queue simulated run</button>${jobButton('cancel-run','Cancel')}</div></form>`; }
function jobDetail() { const j = job(); if (!j) return ''; return `<aside class="job-detail" id="job-detail" data-od-id="jobs-selected-detail" aria-labelledby="job-detail-title">${jobButton('back','← All jobs')}<div class="job-detail-head"><span class="job-repo">${esc(jobRepo(j))}</span><h2 id="job-detail-title" tabindex="-1" data-od-id="jobs-detail-title">${j.title}</h2><div class="job-actions"><span class="job-state ${j.enabled ? 'enabled' : ''}">${j.enabled ? 'Enabled' : 'Disabled'}</span><span class="job-caption">${j.invalid ? 'Needs attention' : 'Repository-owned job'}</span>${j.enabled && !jobUI.confirm && !jobUI.runForm ? jobButton('toggle','Disable') : ''}${!jobUI.runForm && !jobUI.confirm && jobUI.tab !== 'definition' ? jobButton('run','Run now',true,!j.enabled || j.invalid) : ''}</div>${!j.enabled ? `<p class="job-caption">${j.invalid ? 'Refresh and review the source before enabling or running.' : 'Run now is unavailable until you review and enable this job.'}</p>` : ''}</div>${j.invalid ? `<div class="job-section"><div class="job-notice error" role="alert" data-od-id="jobs-source-error"><h3>Source refresh failed</h3><p>The registered entry is retained. Its current definition, recipe and schedule are unavailable; the underlying error was not supplied.</p>${jobButton('repair','Review repository source')}</div>${jobLatest(j)}</div>` : jobUI.confirm ? `<div class="job-section"><div class="job-notice" data-od-id="jobs-state-confirm"><h3>${j.enabled ? 'Disable this job?' : 'Enable reviewed definition?'}</h3><p>${j.enabled ? 'Future scheduled and manual admissions will be blocked. Existing Work is not canceled.' : `${j.cron ? `Scheduled execution becomes eligible ${j.schedule.toLowerCase()}.` : 'This job stays manual only.'} Manual runs become available. Enabling does not start a run now.`}</p><p class="job-caption">${esc(j.repo)} / ${j.name}<br>Prototype only · no live state will change.</p><div class="job-actions">${jobButton('confirm-state',j.enabled ? 'Confirm disable' : 'Confirm enable',true)}${jobButton('cancel-state','Keep current state')}</div></div></div>` : `<nav class="job-tabs" aria-label="Selected job sections">${[['overview','Overview'],['definition','Definition & recipe'],['latest','Latest run']].map(([key,label]) => `<button type="button" data-job-tab="${key}" data-od-id="jobs-tab-${key}" aria-pressed="${jobUI.tab === key}" aria-controls="job-tab-content">${label}</button>`).join('')}</nav><section id="job-tab-content" aria-label="${jobUI.tab === 'definition' ? 'Definition and recipe' : jobUI.tab === 'latest' ? 'Latest run' : 'Overview'}">${jobUI.runForm ? jobRunForm(j) : jobUI.tab === 'definition' ? jobDefinition(j) : jobUI.tab === 'latest' ? jobLatest(j) : jobOverview(j)}</section>`}</aside>`; }
function jobSources() { const repos = [...new Set(JOBS.map(j => j.repo))]; const matching = JOBS.filter(j => j.repo === jobUI.sourceRepo); return `<section class="job-source" data-od-id="jobs-repository-sources"><div class="job-source-top"><div><h2 tabindex="-1" id="job-source-title">Repository sources</h2><p class="job-caption">Install definitions here. Browse registered jobs in the registry.</p></div>${jobButton('close-sources','← Job registry')}</div><div class="job-source-list">${repos.map(repo => `<article class="job-source-row" data-od-id="source-${repo.split('/')[1]}"><div><span class="job-repo">${repo}</span><span class="job-caption">${JOBS.filter(j => j.repo === repo).length} registered · ${repo === 'jlapenna/jclaw' ? '<span class="job-issue">Source refresh failed</span>' : 'Example definitions available'}</span></div><button type="button" class="btn btn-secondary" data-job-source="${repo}" aria-label="Review source refresh for ${repo}" data-od-id="refresh-${repo.split('/')[1]}">Review refresh</button></article>`).join('')}</div><form class="job-form" id="job-source-form" novalidate><label for="job-source-repo">Repository<input class="field" id="job-source-repo" value="${esc(jobUI.sourceRepo)}" maxlength="240" placeholder="owner/repository" data-od-id="jobs-source-repository" aria-describedby="job-source-hint job-source-validation"><span class="job-caption" id="job-source-hint">Use owner/repository. Preview changes before installing; refreshing does not enable jobs.</span><span id="job-source-validation" class="job-issue" role="alert"></span></label><div class="job-actions"><button type="submit" class="btn ${jobUI.sourcePreview ? 'btn-secondary' : 'btn-primary'}" data-od-id="jobs-preview-source">Preview definitions</button></div></form>${jobUI.sourcePreview ? `<section class="job-section" data-od-id="jobs-source-preview"><h3>Source preview · simulated</h3>${!matching.length ? '<p>No prototype definitions for this repository. The five supplied examples are the complete fixture set.</p>' : matching.some(j => j.invalid) ? `<div class="job-notice error" role="alert"><h3>Source refresh failed</h3><p>The example cannot provide a valid definition. Keep the registered job visible and disabled.</p><p class="job-caption">${jobUI.retryAt ? `Last attempted: ${Math.floor((Date.now()-jobUI.retryAt)/1000)}s ago · ` : ''}Example error ID: DEMO-SOURCE</p>${jobUI.sourceRetries < 3 ? jobButton('retry-source','Retry source preview') : '<p>Ask the repository owner to check the source. Error ID: <code>DEMO-SOURCE</code></p>'}</div>` : `<p>${matching.length} existing ${matching.length === 1 ? 'definition' : 'definitions'} · no new entries in this fixture.</p><ul>${matching.map(j => `<li>${j.name} · ${j.enabled ? 'enabled' : 'disabled'}</li>`).join('')}</ul><p class="job-caption">Source and recipe text are examples; no revision comparison is available. Enabled states remain unchanged.</p>${jobButton('apply-source','Install / refresh definitions',true)}`}</section>` : ''}</section>`; }
function jobsPanel() { let body; const matches = jobMatches(); if (jobUI.sources) body = jobSources(); else if (['loading','error','offline','empty'].includes(jobUI.demo)) { const mode=jobUI.demo; body=`<section class="job-detail job-empty" data-od-id="jobs-state-${mode}" aria-busy="${mode === 'loading'}"><h2 tabindex="-1" id="jobs-state-title">${{loading:'Loading registered jobs',error:'Registry could not be loaded',offline:'You’re offline',empty:'No jobs registered'}[mode]}</h2><p>${{loading:'Reading the registry, including disabled and invalid entries.',error:'The registry request failed. No entries have been removed; search and parameters are preserved.',offline:'The registry is unavailable. Reconnect before changing state or starting Work.',empty:'Install repository definitions to make them visible here. Review each job before enabling it.'}[mode]}</p>${mode === 'loading' ? '<div class="job-skeleton" aria-hidden="true"><i></i><i></i></div><div class="job-skeleton" aria-hidden="true"><i></i><i></i></div><p id="job-loading-delay" class="job-caption" role="status"></p>' : ''}${jobButton(mode === 'empty' ? 'sources' : mode === 'loading' ? 'cancel-load' : 'reload',mode === 'empty' ? 'Install repository jobs' : mode === 'loading' ? 'Cancel' : 'Retry registry',mode !== 'loading')}</section>`; } else body=`<div class="job-summary" data-od-id="jobs-registry-summary"><strong>${JOBS.length} registered</strong><span>${JOBS.filter(j=>j.enabled).length} enabled · ${JOBS.filter(j=>!j.enabled).length} disabled</span><span class="job-issue">1 source issue</span><span class="job-caption">Prototype examples · no live data</span></div><div class="job-grid ${jobUI.detail ? 'show-detail' : ''}"><section class="job-registry" aria-labelledby="job-list-title" data-od-id="jobs-registry"><div class="job-list-head"><h2 id="job-list-title">Registered jobs</h2><span class="job-caption">${matches.length} of ${JOBS.length}</span></div>${matches.length ? `<ul class="job-list">${jobRows()}</ul>` : `<div class="job-empty"><h3>No matching jobs</h3><p>${jobUI.query ? `No job matches “${esc(jobUI.query)}” with this filter.` : 'No jobs match this state filter.'}</p>${jobButton('clear-filters','Clear search & filters')}</div>`}</section>${matches.length ? jobDetail() : ''}</div>`; return `<div class="jobs" data-od-id="jobs-workspace">${jobUI.actionError ? `<div class="job-notice error" role="alert"><h3>Change not saved · simulated</h3><p>${esc(jobUI.actionError)}</p><p class="job-caption">Choose Populated in Prototype state to retry successfully.</p></div>` : ''}${body}<footer class="job-demo" data-od-id="jobs-demo-controls"><label for="job-demo-state">Prototype state</label><select class="field" id="job-demo-state" data-od-id="jobs-demo-state">${[['populated','Populated'],['loading','Loading'],['empty','Empty registry'],['error','Registry error'],['offline','Offline'],['edge','Long repository name'],['action-error','Action failure']].map(([v,l]) => `<option value="${v}" ${jobUI.demo === v ? 'selected' : ''}>${l}</option>`).join('')}</select><span class="job-caption">All actions simulated · resets on reload</span></footer></div>`; }
VIEWS.jobs = { create:false, folded:[], tools:[`<label class="field search"><span class="sr-only">Search registered jobs</span><input id="job-search" type="search" placeholder="Find a job or repository" aria-label="Search registered jobs" data-od-id="jobs-search"></label>`,`<select class="field" id="job-filter" aria-label="Job state" data-od-id="jobs-filter"><option value="all">All jobs</option><option value="enabled">Enabled</option><option value="disabled">Disabled</option><option value="issues">Source issues</option></select>`], primary:jobButton('sources','Repository sources'), body:jobsPanel };
function drawJobs(focus) {
  if(document.body.dataset.destination !== 'jobs') return;
  $('#content').innerHTML=jobsPanel(); $('.jobs').setAttribute('aria-busy',String(jobUI.pending));
  if($('#job-search')) { $('#job-search').value=jobUI.query; $('#job-filter').value=jobUI.filter; $('#toolbar').hidden=jobUI.sources; }
  document.querySelectorAll('#toolbar :is(button,input,select), #refresh').forEach(el=>el.disabled=jobUI.pending);
  const back=$('[data-job-action="back"]'); if(back) back.classList.add('job-back');
  if(jobUI.pending) document.querySelectorAll('.jobs :is(button,input,select,textarea)').forEach(el=>el.disabled=true);
  const counts=[JOBS.length,JOBS.filter(j=>j.enabled).length,JOBS.filter(j=>!j.enabled).length];
  document.querySelectorAll('.rail-body .rail-block b').forEach((el,i)=>{if(i<3) el.textContent=counts[i];});
  if(focus) $(focus)?.focus({preventScroll:true});
}
function jobBusy(done, message, delay=550) { if(jobUI.pending) return; jobUI.pending=true; jobUI.actionError=''; drawJobs(); jobMessage(message); clearTimeout(jobTimer); jobTimer=setTimeout(()=>{ jobUI.pending=false; done(); },delay); }
function jobValidate(field) { const error=$(`#job-error-${field.name}`); const valid=field.checkValidity() && !!field.value.trim(); field.setAttribute('aria-invalid',String(!valid)); if(error) error.textContent=valid ? '' : field.name === 'pull_request' ? 'Enter a positive pull request number.' : field.name === 'deployment_url' ? 'Enter an HTTPS deployment URL.' : 'Enter a revision to continue.'; return valid; }
function jobStartLoading() { clearTimeout(jobLongTimer); clearTimeout(jobTimeout); jobUI.demo='loading'; jobUI.sources=false; jobUI.detail=false; drawJobs(); jobMessage('Loading registry'); jobLongTimer=setTimeout(()=>{ const el=$('#job-loading-delay'); if(el) el.textContent='Taking longer than expected. You can cancel and return to the example registry.'; },15000); jobTimeout=setTimeout(()=>{ if(jobUI.demo==='loading') { jobUI.demo='error'; drawJobs('#jobs-state-title'); jobMessage('Registry request timed out. Retry is available'); } },30000); }
document.addEventListener('input',e=>{ if(e.target.id==='job-search') { jobUI.query=e.target.value; jobUI.detail=false; const matches=jobMatches(); if(matches.length&&!matches.some(j=>j.id===jobUI.selected)) { jobUI.selected=matches[0].id; jobUI.runForm=false; jobUI.confirm=false; } drawJobs(); } if(e.target.id==='job-source-repo') { jobUI.sourceRepo=e.target.value; e.target.removeAttribute('aria-invalid'); $('#job-source-validation').textContent=''; if(jobUI.sourcePreview) { jobUI.sourcePreview=false; drawJobs('#job-source-repo'); } } if(e.target.dataset.jobParam) { (jobUI.drafts[job().id] ||= {})[e.target.dataset.jobParam]=e.target.value; if(e.target.getAttribute('aria-invalid')==='true') jobValidate(e.target); } });
document.addEventListener('focusout',e=>{ if(e.target.matches('[data-job-param][required]')) jobValidate(e.target); });
document.addEventListener('change',e=>{ if(e.target.id==='job-filter') { jobUI.filter=e.target.value; jobUI.detail=false; const m=jobMatches(); if(m.length&&!m.some(j=>j.id===jobUI.selected)) { jobUI.selected=m[0].id; jobUI.runForm=false; jobUI.confirm=false; } drawJobs(); } if(e.target.id==='job-reviewed') { jobUI.reviewed[job().id]=e.target.checked; drawJobs('#job-reviewed'); jobMessage(e.target.checked ? 'Example review recorded' : 'Example review cleared'); } if(e.target.id==='job-demo-state') { clearTimeout(jobLongTimer); clearTimeout(jobTimeout); jobUI.demo=e.target.value; jobUI.actionError=''; if(['empty','error','offline','edge'].includes(jobUI.demo)) { jobUI.sources=false; jobUI.detail=false; } if(jobUI.demo==='loading') jobStartLoading(); else { drawJobs('#job-demo-state'); jobMessage('Prototype state changed'); } } });
document.addEventListener('submit',e=>{ if(jobUI.pending && e.target.matches('#job-source-form,#job-run-form')) { e.preventDefault(); return; } if(e.target.id==='job-source-form') { e.preventDefault(); const field=$('#job-source-repo'); if(!/^[\w.-]+\/[\w.-]+$/.test(field.value.trim())) { field.setAttribute('aria-invalid','true'); $('#job-source-validation').textContent='Enter a repository as owner/repository.'; field.focus(); return; } jobUI.sourceRepo=field.value.trim(); jobBusy(()=>{ jobUI.sourcePreview=true; drawJobs('#job-source-title'); jobMessage('Source preview ready'); },'Reading repository definitions'); } if(e.target.id==='job-run-form') { e.preventDefault(); const fields=[...e.target.querySelectorAll('[required]')]; const valid=fields.map(jobValidate); if(valid.includes(false)) { fields[valid.indexOf(false)].focus(); return; } const j=job(), values=Object.fromEntries(new FormData(e.target)); jobUI.drafts[j.id]=values; jobBusy(()=>{ if(jobUI.demo==='action-error') { drawJobs('#job-run-form input'); const formError=$('#job-form-error'); if(formError) formError.innerHTML='<p class="job-issue">Admission failed in this example. Your parameters are preserved; choose Populated below to retry.</p>'; jobMessage('Run was not admitted'); } else { jobUI.runs[j.id]=values; jobUI.runForm=false; jobUI.tab='latest'; jobUI.work=false; drawJobs('#job-detail-title'); jobMessage('Manual run queued locally. No backend request was sent'); } },'Submitting manual run'); } });
document.addEventListener('click',e=>{ const selection=e.target.closest('[data-job-select]'), tab=e.target.closest('[data-job-tab]'), source=e.target.closest('[data-job-source]'), action=e.target.closest('[data-job-action]'); if(selection) { jobUI.listScroll=window.scrollY; jobUI.actionError=''; jobUI.selected=selection.dataset.jobSelect; jobUI.detail=true; jobUI.confirm=false; jobUI.runForm=false; jobUI.work=false; jobUI.tab='overview'; drawJobs('#job-detail-title'); if(window.innerWidth<768) window.scrollTo(0,$('#content').getBoundingClientRect().top+window.scrollY); return; } if(tab) { jobUI.tab=tab.dataset.jobTab; jobUI.runForm=false; jobUI.work=false; drawJobs(`[data-job-tab="${jobUI.tab}"]`); return; } if(source) { jobUI.sourceRepo=source.dataset.jobSource; jobUI.sourcePreview=true; jobUI.sourceRetries=0; drawJobs('#job-source-repo'); jobMessage('Repository source selected'); return; } if(!action || action.disabled) return; const a=action.dataset.jobAction, j=job(); if(a==='sources'||a==='repair') { clearTimeout(jobLongTimer); clearTimeout(jobTimeout); jobUI.actionError=''; if(jobUI.demo==='loading') jobUI.demo='populated'; jobUI.sources=true; jobUI.sourcePreview=a==='repair'; if(a==='repair') jobUI.sourceRepo=j.repo; drawJobs('#job-source-title'); } else if(a==='close-sources') { jobUI.sources=false; if(['empty','error','offline','loading'].includes(jobUI.demo)) jobUI.demo='populated'; drawJobs('[data-job-action="sources"]'); } else if(a==='back') { jobUI.detail=false; jobUI.runForm=false; jobUI.confirm=false; drawJobs(`[data-job-select="${j.id}"]`); if(window.innerWidth<768) window.scrollTo(0,jobUI.listScroll || 0); } else if(a==='definition') { jobUI.tab='definition'; drawJobs('[data-job-tab="definition"]'); } else if(a==='toggle') { if(j.invalid) return; if(!j.enabled&&!jobUI.reviewed[j.id]) { jobUI.tab='definition'; drawJobs('[data-job-tab="definition"]'); jobMessage('Review the definition and recipe before enabling'); } else { jobUI.confirm=true; jobUI.runForm=false; drawJobs('[data-job-action="confirm-state"]'); } } else if(a==='cancel-state') { jobUI.confirm=false; drawJobs('#job-detail-title'); } else if(a==='confirm-state') { jobBusy(()=>{ if(jobUI.demo==='action-error') { jobUI.actionError='The state-change request failed. The job remains unchanged.'; drawJobs('[data-job-action="confirm-state"]'); jobMessage('State change failed. Job state is unchanged; choose Populated to retry'); return; } j.enabled=!j.enabled; jobUI.confirm=false; jobUI.tab='overview'; drawJobs('#job-detail-title'); jobMessage(`${j.name} ${j.enabled ? 'enabled' : 'disabled'}`); },'Saving enabled state'); } else if(a==='run') { if(!j.enabled||j.invalid) return; jobUI.runForm=true; drawJobs('#job-run-form input'); } else if(a==='cancel-run') { jobUI.runForm=false; drawJobs('[data-job-action="run"]'); } else if(a==='work'||a==='latest') { jobUI.work=a==='work'; jobUI.tab='latest'; drawJobs('#job-detail-title'); jobMessage(a==='work' ? 'Opened local Work example' : 'Returned to latest run'); } else if(a==='clear-filters') { jobUI.query=''; jobUI.filter='all'; drawJobs('#job-search'); jobMessage('Search and filters cleared'); } else if(a==='cancel-load') { clearTimeout(jobLongTimer); clearTimeout(jobTimeout); jobUI.demo='populated'; drawJobs('#job-search'); jobMessage('Loading canceled'); } else if(a==='reload') { jobStartLoading(); jobBusy(()=>{ clearTimeout(jobLongTimer); clearTimeout(jobTimeout); jobUI.demo='populated'; drawJobs('#job-search'); jobMessage('Example registry restored'); },'Retrying registry'); } else if(a==='retry-source') { jobUI.sourceRetries++; jobUI.retryAt=Date.now(); jobBusy(()=>{ drawJobs('#job-source-title'); jobMessage('Source refresh failed; registered job retained'); },'Retrying source preview',jobUI.sourceRetries===1?550:jobUI.sourceRetries===2?2000:4000); } else if(a==='apply-source') { jobBusy(()=>{ if(jobUI.demo==='action-error') { jobUI.actionError='Source refresh failed. Installed definitions and enabled states are unchanged.'; drawJobs('#job-source-title'); jobMessage('Source refresh failed. Definitions and enabled states are unchanged'); return; } jobUI.sources=false; jobUI.sourcePreview=false; jobUI.demo='populated'; drawJobs('#job-search'); jobMessage('Example definitions refreshed; enabled states unchanged'); },'Refreshing repository definitions'); } });

function renderMenu(d) {
  $('#menu').innerHTML = `<div class="nav-group"><span class="eyebrow">Navigate</span>${DEST.map((x) => `<a role="menuitem" href="#${x.key}" data-key="${x.key}" ${x.key === d.key ? 'aria-current="page"' : ''}>${x.label}</a>`).join('')}<hr></div>
    <span class="eyebrow">Preferences</span><button class="item" role="menuitem" type="button" id="scheme-toggle" data-od-id="scheme-toggle">Switch to ${document.documentElement.dataset.mantineColorScheme === 'light' ? 'dark' : 'light'} mode</button><button class="item" role="menuitem" type="button">Enable decision notifications</button>
    <hr><span class="eyebrow">Console</span><div class="ident"><span class="av" style="width:28px;height:28px;background:var(--hairline);display:grid;place-items:center;font:600 12px var(--f-display)">JL</span><span>jlapenna <span class="dim">admin · work.operator</span></span></div>`;
}

const originalRail = $('.rail-body').innerHTML, originalStrip = $('.strip').innerHTML;
function render(key) {
  const d = DEST.find((x) => x.key === key) || DEST[0], v = VIEWS[d.key];
  document.body.dataset.destination = d.key;
  $('#refresh').disabled = false;
  $('#toolbar').hidden = false;
  $('#job-feedback').textContent = '';
  $('.rail-body').innerHTML = originalRail;
  $('.strip').innerHTML = originalStrip;
  document.body.dataset.accent = d.accent;
  document.title = `Agent LCARS — ${d.title}`;
  $('#page-title').textContent = d.title;
  $('#page-sub').innerHTML = d.sub;
  const status = d.live ? ['<b>■ LIVE</b> · synced 14:32:08', 'auto-refresh 5 s'] : ['<b class="snap">■ Snapshot</b> · loaded 14:32:08', 'refresh to update'];
  $('#sync').innerHTML = `${status[0]}<br>${status[1]}`;
  $('#sync-compact').innerHTML = status[0];
  $('#create').hidden = v.create === false;
  $('#nav').innerHTML = DEST.map((x, i) => `<a href="#${x.key}" data-accent="${x.accent}" data-key="${x.key}" ${x.key === d.key ? 'aria-current="page"' : ''} data-od-id="nav-${x.key}"><small>0${i + 1}${x.count ? ' · ' + x.count : ''}</small>${x.label}</a>`).join('');
  renderMenu(d);
  const band = $('#warnband');
  band.classList.toggle('none', !v.warn);
  band.innerHTML = v.warn
    ? `<span class="eyebrow">2 data warnings</span><span>GitHubActionsMainWorkflowFailing ×2 on jlapenna/messages-control (#2469)</span><span class="sep">|</span><span>worf NotReady for 12 min · its slot is excluded from admission</span><a href="#">Details</a>`
    : `<span class="eyebrow">No data warnings</span><span>All sources reporting</span>`;
  $('#toolbar').innerHTML = `
    <label class="field fold-toggle"><input type="checkbox" aria-label="Show filters"><span class="eyebrow">Filters</span></label>
    <span class="fold-group">${v.folded.join('')}</span>
    ${v.tools.join('')}
    ${v.after ? `<span class="fold-group">${v.after.join('')}</span>` : ''}
    ${v.primary || ''}`;
  $('#content').innerHTML = v.body();
  if(d.key === 'jobs') {
    $('#sync').textContent = 'Design prototype · sample data';
    $('#sync-compact').textContent = 'Prototype · sample data';
    $('.strip').textContent = 'Repository jobs · all actions simulated';
    $('.rail-body').innerHTML = `<div class="rail-block"><b>${JOBS.length}</b><span>Registered</span></div><div class="rail-block"><b>${JOBS.filter(j=>j.enabled).length}</b><span>Enabled</span></div><div class="rail-block"><b>${JOBS.filter(j=>!j.enabled).length}</b><span>Disabled</span></div><div class="rail-block fill"><b>01</b><span>Source issue</span></div><div class="rail-block end"><span>Prototype</span></div>`;
    drawJobs();
  }
  try { localStorage.setItem('lcars.dest', d.key); } catch (e) {}
}

function closeMenu() { $('#menu').removeAttribute('data-open'); $('#menu-btn').setAttribute('aria-expanded', 'false'); }

document.addEventListener('click', (e) => {
  if(e.target.closest('.skip-jobs')) { e.preventDefault(); $('#main-content').focus(); return; }
  if(e.target.closest('#scheme-toggle')) { const light = document.documentElement.dataset.mantineColorScheme !== 'light'; document.documentElement.dataset.mantineColorScheme = light ? 'light' : 'dark'; try { localStorage.setItem('lcars.scheme', light ? 'light' : 'dark'); } catch {} renderMenu(DEST.find(d=>d.key===document.body.dataset.destination)); $('#scheme-toggle').focus(); return; }
  if(e.target.closest('#refresh') && document.body.dataset.destination === 'jobs') { jobStartLoading(); jobBusy(()=>{ clearTimeout(jobLongTimer); clearTimeout(jobTimeout); jobUI.demo='populated'; drawJobs('#job-search'); jobMessage('Example registry refreshed; repository definitions unchanged'); },'Refreshing registry'); return; }
  if (e.target.closest('#menu-btn')) {
    const open = !$('#menu').hasAttribute('data-open');
    $('#menu').toggleAttribute('data-open', open); $('#menu-btn').setAttribute('aria-expanded', String(open)); return;
  }
  // Sample links lead nowhere; they must not reset the route.
  if (e.target.closest('a[href="#"]')) { e.preventDefault(); return; }
  const nav = e.target.closest('.nav a, .menu a[data-key]');
  if (nav) { e.preventDefault(); closeMenu(); location.hash = nav.dataset.key; return; }
  if (!e.target.closest('#menu')) closeMenu();
  const seg = e.target.closest('.seg button');
  if (seg && !seg.disabled) seg.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === seg)));
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
window.addEventListener('hashchange', () => { render(location.hash.slice(1)); window.scrollTo(0, 0); });

let start = 'jobs';
try { document.documentElement.dataset.mantineColorScheme = localStorage.getItem('lcars.scheme') || 'dark'; } catch (e) {}
render(location.hash.slice(1) || start);
</script>
</body>
</html>
