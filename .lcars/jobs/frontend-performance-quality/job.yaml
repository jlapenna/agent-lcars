version: 1
description: Fortnightly frontend performance and quality analysis, root cause investigation, and verified fixes.
triggers:
  manual: true
  schedule:
    intervalDays: 14
    startsAt: '2026-11-03T14:00:00Z'
execution:
  recipe: ./recipe.yaml
  profile: lcars-frontend-quality
  timeout: 45m
  maxAttempts: 1
  resources:
    requests:
      cpu: 2
      memory: 6Gi
      storage: 24Gi
    limits:
      cpu: 2
      memory: 6Gi
      storage: 24Gi
inputs:
  scope: console
  mode: analyze-and-fix
concurrency:
  maxRuns: 1
  overlap: skip
state:
  previousSuccessfulResult: true
result:
  contract: json-v1
  requiredArtifacts:
    - report.md
    - result.json
