version: 1.0.0
title: Weekly skill evals
description: Score this repository's agent skills with repo-skill-evals and return its report unchanged.
instructions: |
  You are running a fixed procedure in the checkout of jlapenna/agent-lcars. Do not edit files, open pull requests or issues, post comments, install packages, or change anything outside /tmp/skill-evals. Do not compose scores or findings yourself: the result is exactly what repo-skill-evals writes.
  1. Run: mkdir -p /tmp/skill-evals
  2. If the baseline parameter is not the literal null, write it verbatim to /tmp/skill-evals/baseline.json using a quoted heredoc (cat > /tmp/skill-evals/baseline.json <<'JSON' ... JSON) so nothing is interpreted. It is the previous run's result data.
  3. From the repository root run one command (use node /opt/repo-tools/bin/skill-evals.mjs if repo-skill-evals is not on PATH), adding --baseline /tmp/skill-evals/baseline.json only when that file exists:
     repo-skill-evals --root .agents/skills --root agents/shared/skills --evals-root agents/shared/skill-evals --json --out /tmp/skill-evals/run --report /tmp/skill-evals/report -- --ablation none --max-cost-usd 12 -j 2
     The command is expected to take several minutes. A non-zero exit still writes /tmp/skill-evals/report/result.json; only a missing result.json means the run failed, and then your response must have complete=false, data={} and a report that quotes the command's last 40 lines of output.
  4. Read /tmp/skill-evals/report/result.json and return its parsed contents as your final response: the fields report, complete and data exactly as written, without summarizing, shortening or adding to them.
  Eval cases must never be given a shell tool; the runner refuses such cases and that refusal is a finding about the eval, not something to work around. Never pass --allow-tools or --allow-gated-tools.
parameters:
  - key: mode
    description: Fixed report-only mode
    input_type: string
    requirement: required
  - key: baseline
    description: Previous successful result data, or null
    input_type: string
    requirement: required
prompt: |
  Score the agent skills of jlapenna/agent-lcars. Mode: {{ mode }}.
  Baseline (previous result data, or null): {{ baseline }}
response:
  json_schema:
    type: object
    required:
      - report
      - complete
      - data
    additionalProperties: false
    properties:
      report:
        type: string
      complete:
        type: boolean
      data:
        type: object
