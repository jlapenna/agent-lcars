packages:
  - 'apps/*'
  - 'libs/*'
  - 'packages/*'

allowBuilds:
  '@firebase/util': true
  '@google/genai': true
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  less: true
  nx: true
  protobufjs: true
  re2: true
  sharp: true
  tree-sitter-go: false
  unrs-resolver: true

# pnpm 11 revalidates the existing frozen lockfile against its new default
# 24-hour release-age policy. First-party publisher scopes are exempt; retain
# the default policy for third-party dependencies except the exact versions
# accepted below by #964 and #1345.
minimumReleaseAgeExclude:
  - '@jlapenna/*'
  - '@supersprinklesracing/*'
  - '@eslint-react/ast@5.18.4'
  - '@eslint-react/core@5.18.4'
  - '@eslint-react/eslint-plugin@5.18.4'
  - '@eslint-react/eslint@5.18.4'
  - '@eslint-react/jsx@5.18.4'
  - '@eslint-react/shared@5.18.4'
  - '@eslint-react/var@5.18.4'
  - '@google-cloud/firestore@9.0.0'
  - 'electron-to-chromium@1.5.405'
  - 'eslint-plugin-react-dom@5.18.4'
  - 'eslint-plugin-react-jsx@5.18.4'
  - 'eslint-plugin-react-naming-convention@5.18.4'
  - 'eslint-plugin-react-rsc@5.18.4'
  - 'eslint-plugin-react-web-api@5.18.4'
  - 'eslint-plugin-react-x@5.18.4'
  - 'proto3-json-serializer@4.0.1'
  - 'retry-request@9.0.1'
  - 'teeny-request@11.0.1'
  # #1345's vitest 4.1.10 -> 4.1.11 bump, accepted the same way as #964.
  - 'vitest@4.1.11'
  - '@vitest/coverage-v8@4.1.11'
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'

# Transitive Dependabot remediations (#3058): each parent pins a range that
# excludes the first patched release, so floor the vulnerable range only.
overrides:
  'piscina@<4.9.4': 4.9.4
  'proxy-addr@<2.0.8': 2.0.8
  'brace-expansion@>=2 <2.1.6': 5.0.12
  'fast-uri@<3.1.7': 3.1.9
  'immutable@<5.1.8': 5.1.9
  'source-map-js@<1.2.2': 1.2.2
  'svgo@<4.1.0': 4.1.0
  'undici@>=7 <7.30.1': 7.30.1
  'postcss-selector-parser@<7.1.6': 7.1.7
  'qs@<6.16.1': 6.17.0
  'uuid@<11.1.1': 11.1.1
  'katex@<0.18.2': 0.19.1
