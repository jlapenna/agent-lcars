# Files this repo owns that consumers keep byte-identical copies of.
#
# Format: <canonical-path-in-this-repo> <repo>:<path> [<repo>:<path> ...]
#
# These are duplicated deliberately: AGENTS.md forbids cross-repository source
# imports, so consumers cannot depend on this repo's source tree. That leaves
# copies -- and copies drift silently. This manifest is what makes the drift
# loud instead. See #1307 and #1311.
#
# Only list pairs that are supposed to be byte-identical. A file that is
# legitimately repo-specific does not belong here.

