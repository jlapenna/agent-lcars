name: Assert repo variables
description: >-
  Fail fast - naming every missing variable in one ::error:: line - when
  required repo variables are unset, instead of the job failing later,
  deeper, on the first use of an empty value. A composite action cannot
  read `vars.*` itself, so the caller passes NAME=VALUE lines with the
  values already interpolated.

inputs:
  profile:
    description: >-
      Optional profile in config/github-variables.json. When supplied, the
      action also requires every profile variable marked required. Leave it
      empty for generic published-action callers that have no fleet profile.
    required: false
    default: ''
  vars:
    description: >-
      Newline-separated NAME=VALUE lines - each VALUE the caller-side
      interpolation of the matching repo variable (vars.NAME). Fails,
      listing every NAME whose VALUE is empty, if any are missing. Lines
      that are blank or carry no `=` are ignored (a multi-line value's
      continuation lines). NOTE: this description must never contain a
      literal dollar-brace expression - GitHub evaluates action.yml
      metadata as a template at load time, where the `vars` context does
      not exist, and the whole job dies in "Set up job" (took down the
      router on 2026-08-05).
    required: true

runs:
  using: composite
  steps:
    - name: Assert required repo variables are set
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        VARS: ${{ inputs.vars }}
      run: bash "$GITHUB_ACTION_PATH/assert.sh"
