name: Validate worker workflows
description: >-
  Validate the shared issue-or-native-work anchor contract in every present
  Claude, Codex, and OpenCode worker workflow while leaving provider-specific
  lane configuration unconstrained.

runs:
  using: composite
  steps:
    - name: Validate worker workflow anchor contracts
      shell: bash
      run: node "$GITHUB_ACTION_PATH/dist/validate.cjs" "$GITHUB_WORKSPACE"
