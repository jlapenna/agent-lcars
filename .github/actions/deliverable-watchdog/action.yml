name: Surface abandoned agent deliverables
description: >-
  Find agent-authored pull requests whose head and required check have not
  moved within a bounded window, then surface one durable, non-spamming
  needs-human marker on each real task anchor. This action never rebases,
  merges, or closes a pull request.

inputs:
  agent-bot-logins:
    description: JSON array of canonical REST-shaped agent bot logins.
    required: true
  maintainer:
    description: Maintainer assigned when a deliverable needs attention.
    required: true
  required-check:
    description: Required check name used as the deliverable activity signal.
    required: false
    default: Verify
  stale-hours:
    description: Hours without a head commit or required-check event before surfacing.
    required: false
    default: '6'

outputs:
  scanned:
    description: Number of open pull requests examined.
    value: ${{ steps.watch.outputs.scanned }}
  needs-attention:
    description: Number of agent-authored pull requests beyond the activity window.
    value: ${{ steps.watch.outputs.needs-attention }}
  recovered:
    description: Number of prior watchdog markers transitioned to activity-resumed.
    value: ${{ steps.watch.outputs.recovered }}

runs:
  using: composite
  steps:
    - name: Scan agent deliverables
      id: watch
      shell: bash
      env:
        AGENT_BOT_LOGINS: ${{ inputs.agent-bot-logins }}
        MAINTAINER_LOGIN: ${{ inputs.maintainer }}
        REQUIRED_CHECK: ${{ inputs.required-check }}
        STALE_HOURS: ${{ inputs.stale-hours }}
      run: node "$GITHUB_ACTION_PATH/dist/main.mjs"
