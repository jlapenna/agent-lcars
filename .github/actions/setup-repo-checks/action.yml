name: Set up repository checks
description: Install native, versioned secret and workflow scanners without Docker.
inputs:
  tool:
    description: Scanner to install (gitleaks or actionlint).
    required: true
  tool-source:
    description: Use baked exact-version tools or install verified releases (baked never falls back).
    required: false
    default: 'install'
  actionlint-version:
    description: Exact actionlint release version (without v). Empty selects the fleet pin (the runner image's in baked mode).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOOL_SOURCE: ${{ inputs.tool-source }}
        CHECK_TOOL: ${{ inputs.tool }}
        ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        SETUP_ACTION_PATH: ${{ github.action_path }}
      run: bash "$SETUP_ACTION_PATH/install.sh"
