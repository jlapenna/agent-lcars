name: Alert on workflow failure / resolve on recovery
description: >-
  Track one workflow's health as one durable, workflow-specific issue instead
  of noise: on failure, open (or comment on) its tracked alert issue with the
  failing run URL, UTC timestamp, and a consecutive-failure count derived live
  from that workflow's own run history; on success, close it with a recovery
  comment if one is open. See canary-alert.sh for the lookup/count logic.

inputs:
  token:
    description: Token used for the gh/API calls. Pass github.token - no new secret.
    required: true
  workflow-status:
    description: >-
      The watched job's own conclusion - success, failure, cancelled, or skipped
      (GitHub reports a job-level timeout-minutes kill as cancelled, not
      failure). Pass job.status when this step runs inside the watched job
      itself, or needs.<job>.result when it runs from a separate dependent
      job (the required shape here: a job-level timeout terminates the
      watched job outright, so an in-job trailing step - even one marked
      if: always() - never starts). Branches the whole script.
    required: true
  workflow-file:
    description: >-
      Filename of the watched workflow under .github/workflows/, used to
      query /actions/workflows/<file>/runs for the consecutive-failure count.
    required: true
  workflow-event:
    description: >-
      Optional GitHub Actions event filter for run-history counting (for
      example, schedule). Use when the watched workflow also has unrelated
      trigger lanes whose successful runs must not reset this alert's streak.
    required: false
    default: ''
  failure-detail:
    description: >-
      Optional sanitized diagnostic emitted by the watched job. Included only
      on the failure path so the tracked issue distinguishes failure classes
      without requiring an operator to open logs first.
    required: false
    default: ''
  maintainer:
    description: Login assigned on a newly created alert issue.
    required: true

runs:
  using: composite
  steps:
    # This alert must stay outside the watched job's failure domain, which
    # can go dark with nobody noticing - so the caller's job MUST be
    # `if: always()` (evaluate after both a passing and a failing watched
    # run) and this inner step MUST be `continue-on-error: true`: a broken
    # alert path (a transient API hiccup) logs loudly (see canary-alert.sh's
    # ::error:: annotations) but can never turn a healthy canary run red.
    # It also can never turn a failing run green - the canary's own earlier
    # step already fixed the job's real conclusion before this one runs;
    # continue-on-error only stops THIS step's own outcome from being able
    # to override that.
    - name: Alert on workflow failure / resolve on recovery
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
        CANARY_STATUS: ${{ inputs.workflow-status }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        WORKFLOW_EVENT: ${{ inputs.workflow-event }}
        FAILURE_DETAIL: ${{ inputs.failure-detail }}
        WORKFLOW_NAME: ${{ github.workflow }}
        MAINTAINER: ${{ inputs.maintainer }}
      run: bash "$GITHUB_ACTION_PATH/canary-alert.sh"
