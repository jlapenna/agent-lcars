name: Agent setup
description: >-
  Configure the agent git identity, record the run start, and point Nx at
  the shared host cache when the runner mounts one.
inputs:
  agent-login:
    description: Git identity used for agent commits.
    required: true
outputs:
  started-at:
    description: UTC timestamp used by the deliverable gate.
    value: ${{ steps.start.outputs.started_at }}
runs:
  using: composite
  steps:
    - name: Configure git identity
      if: inputs.agent-login != ''
      shell: bash
      env:
        AGENT_LOGIN: ${{ inputs.agent-login }}
      run: |
        git config user.name "$AGENT_LOGIN"
        git config user.email "$AGENT_LOGIN@users.noreply.github.com"

    - name: Record run start time
      id: start
      shell: bash
      run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    # Same-host cache sharing with the CI runner: presence-gated so the job
    # still works on a runner container without the mount.
    - name: Point Nx at the shared host cache when present
      shell: bash
      run: |
        if [ -d /shared-cache ]; then
          mkdir -p /shared-cache/nx
          echo "NX_CACHE_DIRECTORY=/shared-cache/nx" >> "$GITHUB_ENV"
        fi
