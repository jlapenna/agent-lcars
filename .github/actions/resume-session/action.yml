name: Resume prior session
description: >-
  Downloads a prior session's archived transcript into Claude Code's local
  session store when the dispatched work carries a resume request (native
  work items sub-project 6), so a later `--resume <sessionId>` finds it.

inputs:
  work-json:
    description: The raw `work` workflow_dispatch input (JSON), read for `.resume`.
    required: true
  credentials-file-path:
    description: telemetry-writer credentials file path (telemetry-start's output).
    required: true

outputs:
  session-id:
    description: The resumed session id, or empty when no resume happened.
    value: ${{ steps.resume.outputs.session-id }}

runs:
  using: composite
  steps:
    - name: Download prior session transcript
      id: resume
      shell: bash
      env:
        # Passed via env:, never interpolated into the run: script text --
        # see resume.sh's own header for why (work-json carries untrusted
        # work-item content).
        WORK_JSON: ${{ inputs.work-json }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ inputs.credentials-file-path }}
      run: |
        set -euo pipefail
        out="$(bash "$GITHUB_ACTION_PATH/resume.sh")"
        echo "$out" >> "$GITHUB_OUTPUT"
