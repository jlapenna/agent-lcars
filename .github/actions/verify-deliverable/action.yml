name: Verify deliverable
description: >-
  Verify a durable deliverable. Broker-bound runs require an exact attempt
  marker; standalone consumers without attempt identity use guarded legacy
  inference (see verify-deliverable.sh).

inputs:
  token:
    description: Token used for the gh/API lookups.
    required: true
  agent:
    description: Agent name used in messages (e.g. Claude, Codex, OpenCode).
    required: true
  issue:
    description: Issue or pull request number that anchors the work.
    required: true
  mode:
    description: >-
      Dispatch mode. Only 'review' additionally checks pull request reviews
      for the exact marker - the reviews endpoint 404s when `issue` is not
      itself a pull request, and review mode is the one case this action
      already knows it is.
    required: true
  started-at:
    description: UTC start timestamp required only when attempt-id is empty.
    required: false
    default: ''
  runbook:
    description: Optional runbook name; enables comment evidence in legacy mode.
    required: false
    default: ''
  expected-comment-login:
    description: Bot login trusted by legacy time-window inference.
    required: false
    default: ''
  exclude-pr-author:
    description: Comma-separated sibling-pipeline PR authors ignored by legacy inference.
    required: false
    default: ''
  exclude-comment-id:
    description: Scripted pickup-comment ID ignored by legacy inference.
    required: false
    default: ''
  attempt-id:
    description: >-
      This run's stable attempt identity (g<generation>:<intentId>, see
      libs/dispatch-contracts/src/marker.ts's formatAttemptId). The exact
      string a deliverable must carry inside
      `<!-- attempt-claim:<attempt-id> -->` for this run to pass.
      Optional for standalone consumers. When set, inference is disabled and
      the exact marker is mandatory.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # This composite is only safe to invoke via `uses:` BEFORE the agent
    # step runs. Called after it, use the pre-agent snapshot of
    # verify-deliverable.sh instead (see claude.yml/codex.yml/opencode.yml's
    # "Snapshot post-agent enforcement scripts" step) - a local composite
    # resolves from the current working tree, which the agent has
    # unrestricted Bash access to modify.
    - name: Verify a deliverable exists
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        AGENT: ${{ inputs.agent }}
        REPO: ${{ github.repository }}
        NUM: ${{ inputs.issue }}
        MODE: ${{ inputs.mode }}
        STARTED_AT: ${{ inputs.started-at }}
        RUNBOOK: ${{ inputs.runbook }}
        EXPECTED_COMMENT_LOGIN: ${{ inputs.expected-comment-login }}
        EXCLUDE_PR_AUTHOR: ${{ inputs.exclude-pr-author }}
        EXCLUDE_COMMENT_ID: ${{ inputs.exclude-comment-id }}
        ATTEMPT_ID: ${{ inputs.attempt-id }}
      run: bash "$GITHUB_ACTION_PATH/verify-deliverable.sh"
