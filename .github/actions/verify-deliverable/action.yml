name: Verify deliverable
description: >-
  Verify a durable deliverable via this run's exact attempt-claim marker.
  Exact-marker only: the legacy time-window/login inference mode was
  deleted once every fleet consumer passed attempt-id (see
  verify-deliverable.sh).

inputs:
  token:
    description: Token used for the gh/API lookups.
    required: true
  agent:
    description: Agent name used in messages (e.g. Claude, Codex, OpenCode).
    required: true
  issue:
    description: >-
      Issue or pull request number that anchors the work. Empty for a
      native work-item run (no issue anchor); the gate then checks only
      the PR-marker lookup.
    required: false
    default: ''
  mode:
    description: >-
      Dispatch mode. Only 'review' additionally checks pull request reviews
      for the exact marker - the reviews endpoint 404s when `issue` is not
      itself a pull request, and review mode is the one case this action
      already knows it is.
    required: true
  attempt-id:
    description: >-
      This run's stable attempt identity (g<generation>:<intentId>, see
      libs/dispatch-contracts/src/marker.ts's formatAttemptId). The exact
      string a deliverable must carry inside
      `<!-- attempt-claim:<attempt-id> -->` for this run to pass.
    required: true

runs:
  using: composite
  steps:
    # This composite is only safe to invoke via `uses:` BEFORE the agent
    # step runs. Called after it, use the pre-agent snapshot of
    # verify-deliverable.sh instead (see the "Snapshot post-agent
    # enforcement scripts" step in agent-lane-*.yml and
    # dispatch-bootstrap/action.yml) - a local composite resolves from the
    # current working tree, which the agent has unrestricted Bash access
    # to modify.
    - name: Verify a deliverable exists
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        AGENT: ${{ inputs.agent }}
        REPO: ${{ github.repository }}
        NUM: ${{ inputs.issue }}
        MODE: ${{ inputs.mode }}
        ATTEMPT_ID: ${{ inputs.attempt-id }}
      run: bash "$GITHUB_ACTION_PATH/verify-deliverable.sh"
