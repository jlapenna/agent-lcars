name: Start telemetry sidecar
description: >-
  Authenticate the write-only telemetry WIF identity and start the
  best-effort mid-run telemetry sidecar, when the runner image provides it.

inputs:
  workload-identity-provider:
    description: Terraform-managed WIF provider selected by the shared lane.
    required: true
  service-account:
    description: Telemetry-writer service account selected by the shared lane.
    required: true
  issue:
    description: Issue or pull request number this run is working, forwarded to the sidecar.
    required: true
  intent-id:
    description: >-
      Orchestrator run ID (broker_intent_id) -- the join key a work item
      needs to find its sessions. Forwarded to the sidecar as INTENT_ID.
      Optional; label-driven runs have one too (<repo>#<issue>/r<n>).
    required: false
    default: ''

outputs:
  credentials-file-path:
    description: Path to the telemetry-writer credentials file, for the matching telemetry-finalize call.
    value: ${{ steps.telemetry-auth.outputs.credentials_file_path }}

runs:
  using: composite
  steps:
    # Authenticates via the terraform-managed WIF pool this repo IS the
    # source of (infra/terraform/main.tf's
    # google_iam_workload_identity_pool.github), impersonating the
    # write-only telemetry-writer SA so the sidecar can report this run's
    # live turns/tokens to this repo's own agent-lcars console. if: always()
    # so this still runs after an earlier step failure; continue-on-error:
    # true so a broken/rotated WIF config here can never turn a healthy
    # agent run red.
    - name: Authenticate telemetry writer
      id: telemetry-auth
      if: always()
      continue-on-error: true
      # SHA-pinned per homelab's supply-chain hardening; this is the
      # canonical copy of what was homelab's only fork delta on this repo
      # (their fork is being deleted in a parallel PR).
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
        token_format: access_token
        # By default this action also exports GOOGLE_APPLICATION_CREDENTIALS
        # (and friends) into GITHUB_ENV, making them ambient to every later
        # step in this job -- including the agent's own run, where a
        # prompt-injected agent's Bash tool could read/misuse the
        # storage.objectAdmin-scoped telemetry-writer credential. Unneeded:
        # the one consumer that actually needs this (the sidecar start
        # below, and telemetry-finalize later) already receives it
        # explicitly via this step's own credentials_file_path output, not
        # the ambient env var.
        export_environment_variables: false

    # Best-effort mid-run telemetry: backgrounds the sidecar tool for the
    # duration of the agent step via the baked-in wrapper script
    # (apps/telemetry-watcher/bin/sidecar-lifecycle.sh) rather than
    # duplicating its process-management logic inline here -- see that
    # script's own header for the full rationale. No --repo flag needed:
    # GITHUB_REPOSITORY is already set for every job/step by GitHub Actions,
    # and the sidecar CLI falls back to it when --repo is absent (see
    # apps/telemetry-watcher/src/lib/runner-config.ts).
    - name: Start telemetry sidecar
      shell: bash
      continue-on-error: true
      env:
        WRITER_CREDENTIALS_FILE: ${{ steps.telemetry-auth.outputs.credentials_file_path }}
        RUN_ID: ${{ github.run_id }}
        NUM: ${{ inputs.issue }}
        INTENT_ID: ${{ inputs.intent-id }}
      run: |
        SCRIPT=/usr/local/lib/agent-lcars/sidecar-lifecycle.sh
        if [ -x "$SCRIPT" ]; then
          "$SCRIPT" start
        else
          echo "Sidecar tooling not found at $SCRIPT (runner image predates this bake-in, or this isn't the claude-agent-lcars fleet); skipping telemetry sidecar."
        fi
