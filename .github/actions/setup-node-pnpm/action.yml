name: Setup Node and pnpm
description: >-
  This repo's standard toolchain block - pnpm (version resolved from
  packageManager), Node, and a frozen-lockfile
  install. Internal dedup for this repo's own workflows; consumer repos
  have their own setup conventions and should not adopt this one.

inputs:
  node-version:
    description: Node version to install.
    required: false
    default: '24'
  install:
    description: Whether to run `pnpm install --frozen-lockfile`.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Detect matching baked Node and pnpm
      id: baked
      shell: bash
      env:
        REQUESTED_NODE_VERSION: ${{ inputs.node-version }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: bash "${{ github.action_path }}/detect-baked.sh"

    - uses: pnpm/action-setup@v6
      if: steps.baked.outputs.ready != 'true'

    - uses: actions/setup-node@v7
      if: steps.baked.outputs.ready != 'true'
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
