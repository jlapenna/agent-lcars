name: Agent LCARS CredentialGrant
description: >-
  Exchange the current GitHub Actions job's exact-run OIDC identity for one
  server-authorized, short-lived credential. This action is inactive until a
  separately reviewed control-plane route and lane activation exist.

inputs:
  attempt-id:
    description: Server-minted global Agent LCARS AttemptId.
    required: true
  request-id:
    description: Caller-generated idempotency identity for this one grant request.
    required: true

outputs:
  kind:
    description: Closed result kind (issued, denied, or terminal).
    value: ${{ steps.grant.outputs.kind }}
  token:
    description: Ephemeral issued token; empty for denied or terminal results.
    value: ${{ steps.grant.outputs.token }}
  grant-id:
    description: Server-owned grant identity when issued.
    value: ${{ steps.grant.outputs.grant-id }}
  credential-profile-id:
    description: Server-selected credential profile identity when issued.
    value: ${{ steps.grant.outputs.credential-profile-id }}
  issued-at:
    description: Trusted issuance timestamp when issued.
    value: ${{ steps.grant.outputs.issued-at }}
  token-expires-at:
    description: Issued token expiry when issued.
    value: ${{ steps.grant.outputs.token-expires-at }}
  renewal-deadline:
    description: Server policy deadline for later bounded renewal.
    value: ${{ steps.grant.outputs.renewal-deadline }}
  max-residual-token-expiry:
    description: Maximum residual token exposure recorded by the server.
    value: ${{ steps.grant.outputs.max-residual-token-expiry }}
  denial-code:
    description: Closed server denial code for denied results.
    value: ${{ steps.grant.outputs.denial-code }}
  retry-after:
    description: Optional server-owned retry time for a denied result.
    value: ${{ steps.grant.outputs.retry-after }}
  terminal-state:
    description: Immutable Attempt terminal state for terminal results.
    value: ${{ steps.grant.outputs.terminal-state }}

runs:
  using: composite
  steps:
    - name: Request one exact-run CredentialGrant
      id: grant
      shell: bash
      env:
        INPUT_ATTEMPT_ID: ${{ inputs.attempt-id }}
        INPUT_REQUEST_ID: ${{ inputs.request-id }}
      run: node "$GITHUB_ACTION_PATH/credential-grant.mjs"
