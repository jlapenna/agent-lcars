name: Mint agent token
description: >-
  Mint a short-lived Agent LCARS GitHub App installation token, used for the
  agent fleet's claim/comment/label gh operations and, where a workflow
  passes it to checkout, its push credential. The verification probe below
  checks the token's repository scope in addition to its permissions.

inputs:
  client-id:
    description: GitHub App client ID (repo variable AGENT_LCARS_CLIENT_ID).
    required: true
  private-key:
    description: GitHub App private key (repo secret AGENT_LCARS_PRIVATE_KEY).
    required: true
  # The scoping passthroughs below mirror actions/create-github-app-token's
  # own inputs, for which an empty string means "unset" - so blank defaults
  # leave the minted token at its default scope (the workflow repo, all
  # installation permissions). Always pass the narrowest scope the caller
  # actually needs.
  owner:
    description: Org/user to scope the installation token to (defaults to the workflow repo's owner).
    required: false
    default: ''
  repositories:
    description: Comma- or newline-separated repositories to scope the token to.
    required: false
    default: ''
  permission-issues:
    description: Issues permission level to request (e.g. read, write).
    required: false
    default: ''
  permission-contents:
    description: Contents permission level to request.
    required: false
    default: ''
  permission-pull-requests:
    description: Pull-requests permission level to request.
    required: false
    default: ''
  permission-actions:
    description: Actions permission level to request.
    required: false
    default: ''
  permission-metadata:
    description: Metadata permission level to request.
    required: false
    default: ''
  permission-workflows:
    description: >-
      Workflows permission level to request (only 'write' is meaningful -
      lets the token create or update .github/workflows/** files). Opt-in
      and unset by default: every existing caller that does not set this
      keeps its current scope unchanged, even after an installation
      approves the App's own workflows permission grant (jlapenna/
      agent-lcars#868). When set, this action verifies the installation
      actually granted it (see verify-workflows-grant.sh) and fails before
      returning a token, rather than silently handing back a token that
      will only fail much later at push time.
    required: false
    default: ''

outputs:
  token:
    description: Minted installation token.
    value: ${{ steps.mint.outputs.token }}
  app-slug:
    description: App slug the token was minted for.
    value: ${{ steps.mint.outputs.app-slug }}
  installation-id:
    description: Installation ID the token was minted for.
    value: ${{ steps.mint.outputs.installation-id }}

runs:
  using: composite
  steps:
    - name: Mint Agent LCARS installation token
      id: mint
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-metadata: ${{ inputs.permission-metadata }}
        permission-workflows: ${{ inputs.permission-workflows }}

    # The early trusted capability check (#868): runs BEFORE this action
    # returns (composite steps run in order and stop on the first failure by
    # default - no `if:` needed to skip this after a failed mint), so every
    # caller - including every lane workflow's own "Mint agent token" step,
    # which always runs before claim/checkout/the model-invocation step -
    # fails here rather than deep into an agent's turn at push time.
    #
    # Unconditional, not gated on inputs.permission-workflows: a published
    # action (docs/published-actions.md) is referenced cross-repo at `@main`
    # with whatever permission-* inputs that caller chooses, including none
    # at all - and this composite's own long-documented "leave everything
    # blank to get every installation permission" behavior would otherwise
    # let `workflows` leak into such a caller's token silently, with no
    # opt-in, the moment an installation approves it (Codex review on #903).
    # verify-workflows-grant.sh mints its own probe token with this same
    # call's exact permission-* inputs and inspects THAT token's actual
    # grant - not GET /app/installations/{id}, which reports the
    # installation's overall ceiling rather than what a specifically-scoped
    # token receives, and produced a false failure here for exactly the
    # narrowed-allowlist case this step exists to protect (see the script's
    # own header for the full story). Blank permission-workflows means
    # "expect workflows to be absent from a token minted this way", not
    # "skip the check".
    #
    # Gated strictly on what a REVIEWED WORKFLOW-YAML CHANGE sets via
    # inputs.permission-*: nothing an issue comment, PR body, or agent tool
    # call can influence at runtime. The check only ever reads what its own
    # probe token actually receives; it never widens what the real token
    # above was minted with.
    #
    # Also verifies repository scope (jlapenna/homelab#622): OWNER/
    # REPOSITORIES are forwarded so the probe mints against the same
    # owner/repositories selection the real mint step above just requested
    # - see verify-workflows-grant.sh for why an unscoped probe cannot
    # catch a token that ends up broader than the caller asked for.
    - name: Verify workflows permission was actually granted
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.client-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
        INSTALLATION_ID: ${{ steps.mint.outputs.installation-id }}
        OWNER: ${{ inputs.owner }}
        REPOSITORIES: ${{ inputs.repositories }}
        PERMISSION_ISSUES: ${{ inputs.permission-issues }}
        PERMISSION_CONTENTS: ${{ inputs.permission-contents }}
        PERMISSION_PULL_REQUESTS: ${{ inputs.permission-pull-requests }}
        PERMISSION_ACTIONS: ${{ inputs.permission-actions }}
        PERMISSION_METADATA: ${{ inputs.permission-metadata }}
        REQUESTED_LEVEL: ${{ inputs.permission-workflows }}
      run: bash "$GITHUB_ACTION_PATH/verify-workflows-grant.sh"
