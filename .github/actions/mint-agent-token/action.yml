name: Mint agent token
description: >-
  Mint a short-lived Agent LCARS GitHub App installation token, used for the
  agent fleet's claim/comment/label gh operations and, where a workflow
  passes it to checkout, its push credential. Callers must explicitly name
  at least one permission; the pinned native action enforces the requested scope.

inputs:
  client-id:
    description: GitHub App client ID (repo variable AGENT_LCARS_CLIENT_ID).
    required: true
  private-key:
    description: GitHub App private key (repo secret AGENT_LCARS_PRIVATE_KEY).
    required: true
  # The scoping passthroughs below mirror actions/create-github-app-token's
  # own inputs, for which an empty string means "unset" - so blank defaults
  # use the workflow repository when both target inputs are blank. At least
  # one permission input must be explicit so no token inherits the entire
  # installation permission set.
  owner:
    description: Org/user to scope the installation token to (defaults to the workflow repo's owner).
    required: false
    default: ''
  repositories:
    description: Comma- or newline-separated repositories to scope the token to.
    required: false
    default: ''
  permission-issues:
    description: Issues permission level to request (e.g. read, write).
    required: false
    default: ''
  permission-contents:
    description: Contents permission level to request.
    required: false
    default: ''
  permission-pull-requests:
    description: Pull-requests permission level to request.
    required: false
    default: ''
  permission-actions:
    description: Actions permission level to request.
    required: false
    default: ''
  permission-metadata:
    description: Metadata permission level to request.
    required: false
    default: ''
  permission-workflows:
    description: >-
      Workflows permission level to request (only 'write' is meaningful -
      lets the token create or update .github/workflows/** files). Opt-in
      and unset by default. Explicit permissions are passed to the pinned
      GitHub-owned mint action, which rejects unapproved grants before returning
      a token. Omit this input when workflow-file writes are unnecessary.
    required: false
    default: ''

outputs:
  token:
    description: Minted installation token.
    value: ${{ steps.mint.outputs.token }}
  app-slug:
    description: App slug the token was minted for.
    value: ${{ steps.mint.outputs.app-slug }}
  installation-id:
    description: Installation ID the token was minted for.
    value: ${{ steps.mint.outputs.installation-id }}

runs:
  using: composite
  steps:
    - name: Require explicit token permissions
      shell: bash
      env:
        PERMISSION_ISSUES: ${{ inputs.permission-issues }}
        PERMISSION_CONTENTS: ${{ inputs.permission-contents }}
        PERMISSION_PULL_REQUESTS: ${{ inputs.permission-pull-requests }}
        PERMISSION_ACTIONS: ${{ inputs.permission-actions }}
        PERMISSION_METADATA: ${{ inputs.permission-metadata }}
        PERMISSION_WORKFLOWS: ${{ inputs.permission-workflows }}
      run: bash "$GITHUB_ACTION_PATH/require-explicit-permissions.sh"

    - name: Mint Agent LCARS installation token
      id: mint
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-metadata: ${{ inputs.permission-metadata }}
        permission-workflows: ${{ inputs.permission-workflows }}
