name: Prepare agent dispatch
description: Write routed issue context as data for a headless coding agent.

inputs:
  token:
    description: Optional GitHub token used only to read the current anchor context; defaults to github.token.
    required: false
    default: ''
  agent:
    description: Name of the agent receiving the dispatch.
    required: true
  issue:
    description: >-
      Issue or pull request number that anchors the work. Empty for a
      native work-item dispatch (see `work`), which has no issue.
    required: false
    default: ''
  work:
    description: >-
      JSON dispatch payload: `{"spec":{"title","description","pipeline","target":{"repo"}}}`
      for a GitHub-anchored task that carries one (sub-project 5), or
      `{"id","spec":{...}}` for a native work item with no issue anchor. When
      `issue` is also set, the brief's `anchor.title`/`anchor.body` come from
      this input's `spec`, merged over the issue's own number/labels/
      assignees/state/pull_request for linking and type inference. When
      `issue` is empty, the brief's `anchor` is `type: "work"` built from
      this input alone, with no GitHub read. Empty for a legacy issue-anchored
      dispatch with no work payload yet.
    required: false
    default: ''
  mode:
    description: Dispatch mode selected by the router.
    required: true
  reply:
    description: Original maintainer reply, if this is a continuation.
    required: false
    default: ''
  runbook:
    description: Optional repository skill selected for a runbook dispatch.
    required: false
    default: ''
  context:
    description: Optional router or deployment context for the dispatch.
    required: false
    default: ''
  console-url:
    description: >-
      Base URL of the Agent LCARS console, used to build a native work
      item's `anchor.html_url` (`<console-url>/work/<id>`).
    required: false
    default: 'https://lcars.jlapenna.net'
  prior-terminal-state:
    description: JSON summary emitted by broker preflight for the prior attempt.
    required: false
    default: 'null'
  budget-minutes:
    description: Actual timeout of the upcoming agent step.
    required: false
    default: '60'
  artifact-checkpoint-minutes:
    description: Minutes after start by which a durable artifact is required.
    required: false
    default: '25'
  finalize-checkpoint-minutes:
    description: Minutes after start by which scope expansion must stop.
    required: false
    default: '45'

outputs:
  path:
    description: Path to the JSON dispatch brief.
    value: ${{ steps.prepare.outputs.path }}
  protocol-path:
    description: Path to the shared agent protocol document bundled with this action revision.
    value: ${{ steps.prepare.outputs['protocol-path'] }}
  skills-path:
    description: Directory the layer-1 agent skill surface was installed into for this run.
    value: ${{ steps.prepare.outputs['skills-path'] }}
  skills-digest:
    description: sha256 of the installed skill tree, recording exactly which guidance this run's agent received.
    value: ${{ steps.prepare.outputs['skills-digest'] }}

runs:
  using: composite
  steps:
    - name: Write dispatch brief
      id: prepare
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        AGENT: ${{ inputs.agent }}
        ISSUE: ${{ inputs.issue }}
        WORK: ${{ inputs.work }}
        MODE: ${{ inputs.mode }}
        REPLY: ${{ inputs.reply }}
        RUNBOOK: ${{ inputs.runbook }}
        CONTEXT: ${{ inputs.context }}
        CONSOLE_URL: ${{ inputs.console-url }}
        PRIOR_TERMINAL_STATE: ${{ inputs.prior-terminal-state }}
        BUDGET_MINUTES: ${{ inputs.budget-minutes }}
        ARTIFACT_CHECKPOINT_MINUTES: ${{ inputs.artifact-checkpoint-minutes }}
        FINALIZE_CHECKPOINT_MINUTES: ${{ inputs.finalize-checkpoint-minutes }}
      run: bash "$GITHUB_ACTION_PATH/prepare.sh"
