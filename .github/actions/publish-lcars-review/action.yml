name: Publish LCARS review
description: Reconcile LCARS reviews on open default-branch PR merge candidates.
inputs:
  client-id:
    description: Agent LCARS App client ID
    required: true
  private-key:
    description: Agent LCARS App private key
    required: true
runs:
  using: composite
  steps:
    - name: Mint a repository-scoped check writer
      id: publisher
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-checks: write
    - name: Publish merge-candidate checks
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
        REPO: ${{ github.repository }}
        BASE: ${{ github.event.repository.default_branch }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/publish.sh"
