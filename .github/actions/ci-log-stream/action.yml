name: Stream live CI logs
description: >-
  Internal fail-soft lifecycle for shipping this runner's GitHub Actions page
  logs to Loki while a long job is still running.

inputs:
  mode:
    description: Start or stop the in-job shipper.
    required: true
  loki-url:
    description: >-
      Loki push API endpoint reachable from trusted fleet runners. No
      default: an unset or empty value is this action's normal
      disabled-shipper state (lifecycle.sh no-ops when
      AGENT_LCARS_CI_LOG_LOKI_URL is empty), matching every other fail-soft
      branch in this action rather than shipping a fleet-specific default
      into forks or other consumers.
    required: false

runs:
  using: composite
  steps:
    - name: ${{ inputs.mode }} live CI log stream
      shell: bash
      env:
        AGENT_LCARS_CI_LOG_LOKI_URL: ${{ inputs.loki-url }}
      run: bash "$GITHUB_ACTION_PATH/lifecycle.sh" "${{ inputs.mode }}"
