name: Dispatch bootstrap
description: >-
  Shared trusted worker lifecycle scaffolding common to claude.yml,
  codex.yml, and opencode.yml (agent-lcars#823): freeze the post-agent
  enforcement scripts, assert required repo variables are set, publish this
  attempt's stable identity, mint the Agent LCARS App token, and claim the
  anchor issue/PR for the agent fleet - in that exact order, byte-identical
  across all three lanes before this extraction. One implementation now owns
  this sequence instead of three hand-copied ones, so a change to the
  claim/attempt-identity contract can never drift between lanes.

  Thin executor (agent-lcars#1015): this action does NOT re-verify
  admission or bind state against any ledger. `workflow_dispatch` on this
  repo can only be invoked by credentialed callers, and the hosted
  orchestrator (libs/orchestrator + apps/console) already authenticated the
  triggering event and confirmed the dispatch server-side before this
  workflow ever ran - the `broker-generation`/`broker-intent-id` inputs
  below are trustworthy by construction, not something this action needs to
  re-prove against Firestore. This action used to wrap
  `./.github/actions/dispatch-broker`'s `preflight` operation (a legacy
  Firestore broker-binding read/write via WIF) to do exactly that; #1015
  retired the wrapped call along with the WIF auth step it needed, and
  retired the `dispatch-broker` action and the independent Claude-lane-
  readiness probe in agent-fallback-finalize.yml it backed in the same
  cutover. `apps/dispatch-broker` itself (the action's implementation) was
  later deleted outright in #1199 once nothing else depended on it either.

  Requires the caller to have already checked out the repository: every
  wrapped step below resolves a local composite action
  (`uses: ./.github/actions/...`), which GitHub Actions can only do once
  the repo containing it is on disk - a platform constraint, not a
  preference (see snapshot-enforcement-scripts/action.yml for the
  rationale). This action does not perform that checkout itself: claude.yml
  checks out once with fetch-depth 0 before calling this action (the
  claude-code-action manages its own push credential internally), while
  codex.yml/opencode.yml check out a minimal copy before calling this
  action and a second full copy with this action's minted token afterward
  (their agent steps push with plain `git`/`gh`, so they need the
  credential persisted to disk) - that divergence is a genuine per-lane
  difference, not scaffolding, and stays in each lane's own workflow file.

inputs:
  issue:
    description: Issue number to run against (the worker workflow's own `inputs.issue`).
    required: true
  broker-generation:
    description: Monotonic broker generation (the worker workflow's own `inputs.broker_generation`).
    required: true
  broker-intent-id:
    description: >-
      Immutable broker intent ID (the worker workflow's own
      `inputs.broker_intent_id`). Combined with `broker-generation` to
      derive this attempt's stable identity - see "Publish attempt
      identity" below.
    required: true
  agent-fleet-login:
    description: >-
      Fleet-claim login (repo variable AGENT_FLEET_LOGIN) - used both for
      the required-repo-vars assertion and as the issue claim's
      claim-login.
    required: true
  maintainer-login:
    description: Maintainer login (repo variable MAINTAINER_LOGIN), asserted present before dispatch proceeds.
    required: true
  agent-lcars-client-id:
    description: Agent LCARS GitHub App client ID (repo variable AGENT_LCARS_CLIENT_ID).
    required: true
  agent-lcars-private-key:
    description: Agent LCARS GitHub App private key (repo secret AGENT_LCARS_PRIVATE_KEY).
    required: true
  permission-workflows:
    description: >-
      Passthrough to mint-agent-token's own permission-workflows input
      (agent-lcars#868/#903). Unset by default, matching every caller of
      this action today - the only permission-* knob exposed here, because
      it is the one PR #868 documented as a deliberate future per-lane
      opt-in (docs/agent-workflow-write-permission.md), unlike the fixed
      actions/contents/issues/metadata/pull-requests set below, which has
      never varied across callers and stays hardcoded so it cannot drift.
    required: false
    default: ''

outputs:
  token:
    description: Minted Agent LCARS App installation token.
    value: ${{ steps.agent-lcars-token.outputs.token }}
  app-slug:
    description: App slug the token was minted for.
    value: ${{ steps.agent-lcars-token.outputs.app-slug }}

runs:
  using: composite
  steps:
    # The agent step later in the caller's job has unrestricted Bash on the
    # same checkout, so the post-agent gates (verify-deliverable,
    # report-failure, telemetry-finalize, and the post-agent-gates
    # orchestrator that drives all three) must run from a copy frozen now,
    # while the tree is still exactly what the trusted dispatched ref
    # checked out - and via `run:` from $RUNNER_TEMP, never `uses:`, at
    # gate time. The full rationale lives in
    # snapshot-enforcement-scripts/action.yml. Runs first so failure
    # reporting stays trusted even if a later step (the token mint below,
    # or the agent step itself) fails.
    - name: Snapshot post-agent enforcement scripts
      uses: ./.github/actions/snapshot-enforcement-scripts

    # vars.AGENT_RUNNER_LABEL (consumed by the caller's own `runs-on`)
    # cannot be asserted here - job placement onto a runner happens before
    # any step runs, so an empty/unset value already fails the job loudly
    # on its own before this step could ever fire.
    - name: Assert required repo variables are set
      uses: ./.github/actions/assert-repo-vars
      with:
        vars: |
          AGENT_FLEET_LOGIN=${{ inputs.agent-fleet-login }}
          MAINTAINER_LOGIN=${{ inputs.maintainer-login }}

    # Thin executor (agent-lcars#1015): the dispatch inputs are already
    # trustworthy (see this action's own top-level description), so this
    # attempt's stable identity is derived directly from them rather than
    # re-verified against a ledger. `g<generation>:<intentId>` matches
    # formatAttemptId in libs/dispatch-contracts/src/marker.ts byte for
    # byte - the same format the hosted orchestrator, verify-deliverable.sh
    # (via the exact `<!-- attempt-claim:<ATTEMPT_ID> -->` marker), and
    # agent-fallback-finalize.yml's own independent
    # `attempt_id="g${GENERATION}:${INTENT_ID}"` re-derivation all agree
    # on. Written to $GITHUB_ENV, not a step output: every later step in
    # the caller's own job (including "Run post-agent gates", far after the
    # agent step) reads it as `${{ env.ATTEMPT_ID }}`, exactly like the
    # legacy broker-preflight call used to publish it (a composite action
    # step can write $GITHUB_ENV exactly like a plain `run:` step can - see
    # prepare-agent-dispatch/prepare.sh for another composite doing this).
    - name: Publish attempt identity
      id: attempt-identity
      shell: bash
      env:
        ATTEMPT_ID: g${{ inputs.broker-generation }}:${{ inputs.broker-intent-id }}
      run: echo "ATTEMPT_ID=$ATTEMPT_ID" >> "$GITHUB_ENV"

    # Explicit permission-* allowlist (#868), not the blank/"all
    # installation permissions" default this step used before: the Agent
    # LCARS App now also declares `workflows` (approved on the
    # supersprinklesracing org installation; see #868), and
    # actions/create-github-app-token grants a token EVERY permission the
    # installation has approved whenever no permission-* input narrows it.
    # Left blank, this step's token would silently start carrying
    # workflows:write the moment this repo's own installation approves it
    # too - with no opt-in, no preflight, and no dispatch ever having asked
    # for it. Enumerating exactly today's actually-used set (not a smaller
    # guess) keeps this step's behavior unchanged while making `workflows`
    # opt-in only, via this action's own permission-workflows passthrough
    # input (empty here by default, matching every caller today). The
    # other five permission-* values are fixed, not passed through: they
    # have never varied across the three lane callers, and hardcoding them
    # here means the lanes can never drift apart on them by accident - a
    # lane that needs a different grant among those five extends this
    # action's inputs deliberately, in review, rather than silently
    # diverging. `permission-workflows` alone is exposed because #868
    # documented it as a deliberate future per-lane opt-in (see
    # docs/agent-workflow-write-permission.md).
    - name: Mint agent token
      id: agent-lcars-token
      uses: ./.github/actions/mint-agent-token
      with:
        client-id: ${{ inputs.agent-lcars-client-id }}
        private-key: ${{ inputs.agent-lcars-private-key }}
        permission-actions: write
        permission-contents: write
        permission-issues: write
        permission-metadata: read
        permission-pull-requests: write
        permission-workflows: ${{ inputs.permission-workflows }}

    # Only a broker-authorized run may mutate the anchor or start the paid
    # agent. The fleet login is assignable; the provider App identities are
    # not (see agent-protocol.md §10). Claim the anchor issue/PR for the
    # agent fleet the moment the run starts, so ownership is visible at a
    # glance (and filterable via `gh issue list --assignee <fleet-login>`).
    # Additive and idempotent: this never removes a human assignee.
    - name: Claim the issue as the agent fleet
      id: claim
      uses: ./.github/actions/claim-issue
      with:
        token: ${{ steps.agent-lcars-token.outputs.token }}
        issue: ${{ inputs.issue }}
        claim-login: ${{ inputs.agent-fleet-login }}
