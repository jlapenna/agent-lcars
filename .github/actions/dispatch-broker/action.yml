name: Serialized dispatch broker
description: Normalize, serialize, bind, and verify durable agent dispatch intents.
# main.mjs imports the shared libs/dispatch-contracts package via a
# repo-relative path above this action directory
# (../../../libs/dispatch-contracts/src/index.js), so a cross-repo `uses:`
# of this action requires the whole-repo checkout the caller downloads by
# default -- see docs/published-actions.md's "whole-repo-download caveat".

inputs:
  operation:
    description: normalize, broker, preflight, completion-callback, or reconcile
    required: true
  payload:
    description: Base64url normalized intent emitted by the normalize operation
    required: false
    default: ''
  group:
    description: Canonical concurrency group emitted by normalization
    required: false
    default: ''
  issue:
    description: Canonical issue number for worker preflight
    required: false
    default: ''
  generation:
    description: Broker generation for worker preflight
    required: false
    default: ''
  intent-id:
    description: Broker intent ID for worker preflight
    required: false
    default: ''
  dispatch-token:
    description: Immutable broker dispatch token for worker preflight
    required: false
    default: ''
  worker-workflow:
    description: Worker workflow file sending the completion callback
    required: false
    default: ''
  outcome-kind:
    description: Durable worker lifecycle outcome sent with completion
    required: false
    default: ''
  outcome-reference:
    description: Exact pull request number backing a pull-request outcome
    required: false
    default: ''
  readiness-failure:
    description: Shared lane prerequisite that failed (credential, provider, or bootstrap)
    required: false
    default: ''

outputs:
  eligible:
    description: Whether normalization produced a broker event
    value: ${{ steps.run.outputs.eligible }}
  issue:
    description: Canonical issue number
    value: ${{ steps.run.outputs.issue }}
  repository-id:
    description: Immutable numeric GitHub repository ID
    value: ${{ steps.run.outputs.repository-id }}
  is-pr:
    description: Whether the canonical anchor is a pull request
    value: ${{ steps.run.outputs.is-pr }}
  group:
    description: Repository-wide collision-safe broker concurrency group
    value: ${{ steps.run.outputs.group }}
  payload:
    description: Base64url normalized broker event
    value: ${{ steps.run.outputs.payload }}
  reason:
    description: Reason an event was ignored
    value: ${{ steps.run.outputs.reason }}
  authorized:
    description: Whether worker preflight found an exact binding
    value: ${{ steps.run.outputs.authorized }}
  attempt-id:
    # Derived from the `generation`/`intent-id` inputs preflight already
    # required and verified -- NOT sourced from a new workflow_dispatch
    # input. `broker_generation`/`broker_intent_id` are already required
    # worker-workflow inputs, so the attempt ID is exactly recoverable from
    # them (see formatAttemptId in libs/dispatch-contracts/src/marker.js); a
    # new required input would just be a second, redundant way to say the
    # same thing. It would also break consuming repos whose copy of the
    # worker workflow lags this one -- apps/console/src/lib/backend-actions.ts's
    # `withoutUnexpectedInputs` shim exists precisely because
    # workflow_dispatch inputs drift like that across repos.
    description: The verified attempt's stable identity, g<generation>:<intentId>
    value: ${{ steps.run.outputs.attempt-id }}
  prior-terminal-state:
    description: Compact JSON summary of the latest earlier terminal generation
    value: ${{ steps.run.outputs.prior-terminal-state }}
  candidates:
    description: Number of open agent-labeled issues/PRs the reconcile scan discovered
    value: ${{ steps.run.outputs.candidates }}
  dispatched:
    description: Number of candidates the reconcile scan successfully dispatched
    value: ${{ steps.run.outputs.dispatched }}

runs:
  using: composite
  steps:
    - name: Run dispatch broker operation
      id: run
      shell: bash
      env:
        BROKER_PAYLOAD: ${{ inputs.payload }}
        BROKER_GROUP: ${{ inputs.group }}
        BROKER_ISSUE: ${{ inputs.issue }}
        BROKER_GENERATION: ${{ inputs.generation }}
        BROKER_INTENT_ID: ${{ inputs.intent-id }}
        BROKER_DISPATCH_TOKEN: ${{ inputs.dispatch-token }}
        BROKER_WORKER_WORKFLOW: ${{ inputs.worker-workflow }}
        BROKER_OUTCOME_KIND: ${{ inputs.outcome-kind }}
        BROKER_OUTCOME_REFERENCE: ${{ inputs.outcome-reference }}
        BROKER_READINESS_FAILURE: ${{ inputs.readiness-failure }}
      run: node "$GITHUB_ACTION_PATH/dist/main.mjs" "${{ inputs.operation }}"

    # Publish the verified attempt ID to every later step in the caller's
    # own job as $ATTEMPT_ID (#645 Phase 3/4: a step that stamps an
    # artifact with it is stamping a verified identity, not an unvalidated
    # echo of its own inputs). Folded in here instead of a fifth
    # hand-copied `run: echo ATTEMPT_ID=...` step in every worker
    # workflow: this composite already produces `attempt-id` from the same
    # preflight call, and a composite action step can write $GITHUB_ENV
    # exactly like a plain `run:` step can (see
    # prepare-agent-dispatch/prepare.sh for another composite doing this).
    # Gated to `operation == 'preflight'` so a later completion-callback
    # call in the same job never blanks out the value this step already
    # published.
    - name: Publish attempt identity
      if: inputs.operation == 'preflight'
      shell: bash
      env:
        ATTEMPT_ID: ${{ steps.run.outputs.attempt-id }}
      run: echo "ATTEMPT_ID=$ATTEMPT_ID" >> "$GITHUB_ENV"
