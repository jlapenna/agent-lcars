name: Scan published image
description: >-
  Scan a just-pushed registry reference for vulnerabilities with Trivy and
  surface the result as a real CI check: upload SARIF to the repo's code
  scanning UI, then fail the job on fixable CRITICAL CVEs (agent-lcars#224).

inputs:
  image-ref:
    description: >-
      Registry reference to scan, e.g.
      docker-registry.lan.jlapenna.net/agent-lcars/runner-autoscaler:abc123.
      Must be the just-pushed reference, not a local tag or image ID --
      publish-images.yml's runner holds no Docker socket (agent-lcars#101),
      so there is no local image for Trivy to inspect. Trivy pulls the
      manifest over the registry API instead, reusing the `docker login`
      credential the earlier push step already established for this job
      (Trivy reads the same `~/.docker/config.json` credential store Docker
      does -- no separate TRIVY_USERNAME/TRIVY_PASSWORD is needed here).
    required: true
  platform:
    description: >-
      Set this (e.g. "linux/amd64") when image-ref is a multi-platform
      manifest list. Trivy has no notion of "scan every platform" for a
      single image-ref -- given a manifest list it resolves and scans
      exactly one arbitrary manifest from it, so a multi-arch image
      scanned without this would silently never have its other
      architectures scanned at all. When set, this action first resolves
      that platform's own manifest digest out of image-ref via `docker
      buildx imagetools inspect --raw` (its `manifests[].platform.os` /
      `.architecture` fields -- BuildKit attestation-manifest entries are
      always "unknown/unknown" so they can never be mismatched for a real
      platform here, see moby/buildkit's attestation-storage docs) and
      scans that digest directly -- an unambiguous single-platform
      reference needs no further disambiguation. Leave unset only when
      image-ref is already single-platform (nothing to disambiguate; e.g.
      the telemetry-watcher image, which only ever publishes linux/amd64).
    required: false
    default: ''
  category:
    description: >-
      Unique slug for this image+platform (e.g.
      "runner-autoscaler-linux-amd64"). Distinguishes this scan's SARIF
      results from every other image/platform this workflow scans in the
      same run -- without a unique category, each upload would overwrite
      the previous one's results for the same commit in the code-scanning
      UI.
    required: true

runs:
  using: composite
  steps:
    # Only needed for a multi-platform image-ref -- see the `platform`
    # input's own comment for why scanning it directly would silently
    # cover only one of its architectures.
    - name: 'Resolve ${{ inputs.platform }} digest: ${{ inputs.category }}'
      if: inputs.platform != ''
      id: digest
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        os="${PLATFORM%%/*}"
        arch="${PLATFORM#*/}"
        digest="$(docker buildx imagetools inspect "$IMAGE_REF" --raw \
          | jq -r --arg os "$os" --arg arch "$arch" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest')"
        if [ -z "$digest" ]; then
          echo "::error::no $PLATFORM manifest found in $IMAGE_REF -- was it actually built for that platform?"
          exit 1
        fi
        repo="${IMAGE_REF%:*}"
        echo "ref=${repo}@${digest}" >> "$GITHUB_OUTPUT"

    # SARIF first, unconditionally: this is what shows up in the repo's
    # Security tab (and as PR annotations on any future PR touching this
    # SHA), independent of whether the fail-fast step below trips. Scoped
    # to CRITICAL + ignore-unfixed to match the gate step exactly -- see
    # that step's comment for why this threshold was chosen.
    - name: 'Trivy scan (SARIF): ${{ inputs.category }}'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.platform != '' && steps.digest.outputs.ref || inputs.image-ref }}
        format: sarif
        output: trivy-results-${{ inputs.category }}.sarif
        severity: CRITICAL
        ignore-unfixed: true

    - name: 'Upload scan results to code scanning: ${{ inputs.category }}'
      if: always()
      uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
      with:
        sarif_file: trivy-results-${{ inputs.category }}.sarif
        category: ${{ inputs.category }}

    # The actual gate. CRITICAL + ignore-unfixed: true (fail only on
    # vulnerabilities a rebuild could actually resolve) is a defensible
    # default chosen in the absence of a reachable definition of the
    # homelab `ImageVulnerabilities` alert's own threshold -- that alert
    # (bin/scan-vulns.sh) lives in the separate jlapenna/homelab repo and
    # was not reachable from here. See agent-lcars#224.
    #
    # `skip-setup-trivy: true` re-uses the Trivy binary and vuln DB the
    # SARIF step above already fetched, rather than reinstalling -- see
    # aquasecurity/trivy-action's README ("Skipping Setup when Calling
    # Trivy Action multiple times").
    #
    # publish-images.yml calls this action against a STAGING tag, before
    # the fleet-consumed mutable tag is moved to point at it (see that
    # workflow's own comments) -- so exiting 1 here still actually blocks
    # a vulnerable image from ever becoming the one the fleet pulls,
    # rather than just turning the run red after the damage is done.
    #
    # trivyignores points at the repo-root .trivyignore: a small, scoped,
    # expiring (exp: dated) list of CVE IDs baked into RUNNER_BASE itself
    # rather than anything this monorepo depends on, with no newer upstream
    # release to bump to yet -- see that file's own comment and
    # agent-lcars#414 for the full writeup. Deliberately only on this gate
    # step, not the SARIF step above: both findings stay visible in the
    # Security tab for tracking even while suppressed here.
    - name: 'Fail on fixable CRITICAL CVEs: ${{ inputs.category }}'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.platform != '' && steps.digest.outputs.ref || inputs.image-ref }}
        format: table
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: '1'
        skip-setup-trivy: true
        trivyignores: ${{ github.workspace }}/.trivyignore
