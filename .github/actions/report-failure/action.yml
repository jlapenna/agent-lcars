name: Report failure on the issue
description: >-
  Log this run's failure. Standalone consumers may also supply token, issue,
  and maintainer to post the visible failure and park the anchor; LCARS's
  hosted-finalizer path leaves them unset and remains projector-only (#813).

inputs:
  token:
    description: Optional token for standalone-consumer comment/label/assignee writes.
    required: false
    default: ''
  agent:
    description: Agent name used in the log message (e.g. Claude, Codex, OpenCode).
    required: true
  message-prefix:
    description: Optional literal prefix for the log message (e.g. an emoji).
    required: false
    default: ''
  reason:
    description: Optional extra explanation appended after the run link (already newline-prefixed by the caller).
    required: false
    default: ''
  job-status:
    description: The job's status context value (job.status), used to distinguish a timeout cancellation from an ordinary failure.
    required: true
  issue:
    description: Optional issue or pull request number for standalone-consumer reporting.
    required: false
    default: ''
  maintainer:
    description: Optional maintainer login; provide it with token and issue for standalone-consumer parking.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # #813: LCARS's own workers leave maintainer unset, so this only logs and
    # the hosted finalizer/projector remains their one writer. Standalone
    # consumers without that coupled finalizer may deliberately provide all
    # three compatibility inputs and retain the protocol's visible parking
    # path (#4388).
    #
    # This composite is only safe to invoke via `uses:` BEFORE the agent
    # step runs. Called after it, use the pre-agent snapshot of
    # report-failure.sh instead (see the "Snapshot post-agent enforcement
    # scripts" step in agent-lane-*.yml and dispatch-bootstrap/action.yml) -
    # a local composite resolves from the current working tree, which the
    # agent has unrestricted Bash access to modify.
    - name: Report failure on the issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        AGENT: ${{ inputs.agent }}
        MESSAGE_PREFIX: ${{ inputs.message-prefix }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
        ISSUE_NUM: ${{ inputs.issue }}
        REASON: ${{ inputs.reason }}
        JOB_STATUS: ${{ inputs.job-status }}
        MAINTAINER: ${{ inputs.maintainer }}
      run: bash "$GITHUB_ACTION_PATH/report-failure.sh"
