name: Report failure on the issue
description: >-
  Log this run's own failure. Does NOT write the anchor issue/PR directly
  (#813) -- the hosted finalizer's completion callback reports the comment,
  status:needs-human, and maintainer assignment through the projector's one
  idempotent writer instead. Each workflow computes its own `reason` text
  inline before calling this.

inputs:
  agent:
    description: Agent name used in the log message (e.g. Claude, Codex, OpenCode).
    required: true
  message-prefix:
    description: Optional literal prefix for the log message (e.g. an emoji).
    required: false
    default: ''
  reason:
    description: Optional extra explanation appended after the run link (already newline-prefixed by the caller).
    required: false
    default: ''
  job-status:
    description: The job's status context value (job.status), used to distinguish a timeout cancellation from an ordinary failure.
    required: true

runs:
  using: composite
  steps:
    # #813: this composite used to post the visible failure comment and
    # apply status:needs-human/the maintainer assignee directly, using this
    # job's own token. It now only logs -- see report-failure.sh's own
    # header for why that write moved to the hosted finalizer's completion
    # callback and the projector's one idempotent writer.
    #
    # This composite is only safe to invoke via `uses:` BEFORE the agent
    # step runs. Called after it, use the pre-agent snapshot of
    # report-failure.sh instead (see claude.yml/codex.yml/opencode.yml's
    # "Snapshot post-agent enforcement scripts" step) - a local composite
    # resolves from the current working tree, which the agent has
    # unrestricted Bash access to modify.
    - name: Report failure on the issue
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        MESSAGE_PREFIX: ${{ inputs.message-prefix }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
        REASON: ${{ inputs.reason }}
        JOB_STATUS: ${{ inputs.job-status }}
      run: bash "$GITHUB_ACTION_PATH/report-failure.sh"
