name: Check canonical sync
description: >-
  Fails when this repo's copy of a file agent-lcars owns has drifted from the
  canonical version. Runs in a consumer repo and needs no credentials -
  agent-lcars is public. See jlapenna/agent-lcars#1307.

inputs:
  manifest:
    description: >-
      Path to the consumer's manifest, one "<local-path> <agent-lcars-path>"
      pair per line.
    required: false
    default: .github/canonical-sync.conf
  ref:
    description: agent-lcars ref to compare against.
    required: false
    default: main
  forbid-strays:
    description: >-
      Also fail when a copy of any canonicalized script's basename exists at
      a path the manifest does not declare ("local copy quietly grows back",
      agent-lcars#1307).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Compare against agent-lcars
      shell: bash
      run: >-
        "${{ github.action_path }}/check.sh"
        --manifest "${{ inputs.manifest }}"
        --ref "${{ inputs.ref }}"
        ${{ inputs.forbid-strays == 'true' && '--forbid-strays' || '' }}
