name: Run GitHub App webhook ingress canary
description: >-
  Toggle the dedicated non-dispatch sentinel, identify its exact GitHub App
  delivery, and require exact hosted-controller authority evidence. Uses only
  a GitHub-hosted runner and never allocates a worker or invokes a model.

inputs:
  app-client-id:
    description: GitHub App client ID used to read App delivery history.
    required: true
  app-private-key:
    description: GitHub App private key used only to mint a short-lived App JWT.
    required: true

outputs:
  issue:
    description: Dedicated sentinel issue number.
    value: ${{ steps.probe.outputs.issue }}
  failure-category:
    description: Stable failure category emitted before a failed probe exits.
    value: ${{ steps.probe.outputs.failure-category }}
  failure-detail:
    description: Sanitized failure detail for the independent alert issue.
    value: ${{ steps.probe.outputs.failure-detail }}

runs:
  using: composite
  steps:
    - name: Exercise real GitHub App ingress
      id: probe
      shell: bash
      env:
        APP_CLIENT_ID: ${{ inputs.app-client-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
      run: |
        if [ ! -f "$GITHUB_ACTION_PATH/dist/run.mjs" ]; then
          echo "failure-category=probe_bundle_missing" >> "$GITHUB_OUTPUT"
          echo "failure-detail=Committed webhook ingress probe bundle is missing" >> "$GITHUB_OUTPUT"
          echo "::error::Committed webhook ingress probe bundle is missing"
          exit 1
        fi
        node "$GITHUB_ACTION_PATH/dist/run.mjs"
