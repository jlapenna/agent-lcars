name: Archive OpenCode trajectory
description: Export sanitized OpenCode sessions from this run for durable trajectory diagnosis.

inputs:
  started-at:
    description: ISO timestamp captured before the worker setup began.
    required: true

outputs:
  path:
    description: Directory containing the sanitized exports and manifest.
    value: ${{ steps.archive.outputs.path }}
  has-sessions:
    description: Whether at least one session from this run was exported.
    value: ${{ steps.archive.outputs.has-sessions }}

runs:
  using: composite
  steps:
    - name: Export sanitized sessions
      id: archive
      shell: bash
      env:
        STARTED_AT: ${{ inputs.started-at }}
      run: bash "$GITHUB_ACTION_PATH/archive.sh"
