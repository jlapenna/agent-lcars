name: Stamp attempt marker on agent artifacts
description: >-
  Install a `gh` wrapper that stamps this attempt's
  `<!-- attempt-claim:<id> -->` marker onto the pull request or comment a
  dispatched agent creates, so verify-deliverable's exact-marker clause stops
  depending on the model transcribing a literal out of its prompt
  (agent-lcars#1213).

  The wrapper is installed on PATH job-wide but is INERT unless a step opts
  in with `AGENT_MARKER_STAMPING: '1'` in its own `env:`. That opt-in is the
  whole safety story: only the untrusted model-invocation step sets it, and
  the post-agent gates deliberately do not - they post their failure reports
  with this same `gh`, and stamping those would let the deliverable gate
  satisfy itself with its own output. A job-wide PATH entry that does nothing
  without the per-step flag is simpler and harder to get wrong than trying to
  scope PATH to a single step, which Actions has no clean mechanism for.

  Internal dedup only (no stability promise; see docs/published-actions.md's
  "Internal" tier).

runs:
  using: composite
  steps:
    - name: Install the marker-stamping gh wrapper
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install.sh"
