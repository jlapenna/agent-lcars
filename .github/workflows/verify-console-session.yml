name: Verify Production Console Session

on:
  schedule:
    # Weekly verification leaves several attempts inside the seven-day
    # rotation window before the dedicated 30-day session expires.
    - cron: '23 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Authenticated production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm

      # This is the same identity available inside codex.yml. Its access is
      # read-only and scoped to the dedicated browser-state secret, so this
      # scheduled run proves the real issue-agent access path without gaining
      # the Auth.js signing key needed to mint or rotate sessions.
      - name: Authenticate as codex-agent
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CODEX_AGENT_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify saved admin session and Agents page
        run: >-
          ./tools/nx run @agent-lcars/console:verify-session --
          --role admin
          --storage secret
          --path /agents
          --wait-for .agents-workspace
          --assert-text "Agent Status"
          --minimum-valid-days 7
