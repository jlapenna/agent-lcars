name: Bootstrap Canary

# Fifth canary in the dispatch-broker family (#645 Phase 3), alongside
# dispatch-canary.yml/agent-dispatch-canary.yml. Those two prove the
# BROKER's own claim/dispatch/completion-callback path end to end on
# ubuntu-latest -- deliberately incapable of touching self-hosted infra or a
# paid model (workflow-contract.spec.ts's "the canary worker... is
# structurally incapable..." pins that down; apps/dispatch-broker/src/
# workflow-contract.spec.ts's "canary orchestrators... never reference a
# self-hosted runner or a secret" pins the two orchestrators too). This
# workflow proves the opposite half: that the self-hosted worker BOOTSTRAP
# sequence -- runner allocation, App token mint, enforcement-script
# snapshot, and the telemetry sidecar's WIF auth + process lifecycle --
# actually works on the real fleet, without ever invoking a paid model.
# claude.yml/codex.yml/opencode.yml all share this exact bootstrap sequence
# ahead of their own agent step; this workflow runs it in isolation and
# stops.
#
# Deliberately NOT dispatched through agent-router.yml/dispatch-broker:
# there is no issue to claim, no ledger generation, nothing for the broker
# to arbitrate here -- this is a standalone infra probe, not a worker
# dispatch. It mirrors label-contract-audit.yml / rerun-infra-killed-runs.yml
# / dispatch-reconcile.yml's own convention for a scheduled infra check with
# no natural issue/PR anchor: let a genuine failure fail the job loudly
# (::error:: annotations, a non-zero exit, a red run in the Actions tab)
# rather than parking status:needs-human on a fabricated issue -- see
# report-failure/action.yml's own header for why that heavier mechanism
# exists specifically for anchored issue/PR work, which this is not.
#
# Two of the four bootstrap pieces (telemetry-start/telemetry-finalize) are
# themselves DESIGNED to never fail the job that calls them -- every
# meaningful step inside those composite actions runs under
# continue-on-error: true, because a real agent dispatch must never be
# blocked by a broken telemetry sidecar (see telemetry-start/action.yml's
# own header, and apps/telemetry-watcher/bin/sidecar-lifecycle.sh's own "Every
# failure path logs and exits 0" contract). Calling either composite via
# `uses:` alone would therefore always report green here regardless of
# whether the underlying WIF auth or sidecar process actually works -- the
# exact "canary that proves nothing" failure mode #645 exists to close. This
# workflow instead adds its own explicit verification steps after each
# composite call, reading the SAME signals telemetry-watcher already
# produces for exactly this purpose (agent-lcars#352's ::warning:: escalation
# on a silently-rejected WIF grant) and turning them into a hard failure.
#
# What it deliberately never does, mirroring agent-dispatch-canary.yml's own
# "structurally incapable" contract: no agent adapter step (nothing with
# `id: agent`), no model credential, no published third-party agent action.
# workflow-contract.spec.ts's own assertions for this file pin both halves
# down.

on:
  schedule:
    # Hourly, offset clear of every other scheduled cadence already
    # documented in this repo: dispatch-canary.yml ('13 * * * *'),
    # dispatch-reconcile.yml ('7,37 * * * *'), rerun-infra-killed-runs.yml
    # ('22,52 * * * *'), label-contract-audit.yml ('17 13 * * *' daily).
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # google-github-actions/auth@v3 (inside telemetry-start) needs this on the
  # job to mint a WIF token. Nothing else here needs a broader grant --
  # deliberately no issues/pull-requests/actions permission: this workflow
  # never touches an issue, a PR, or another workflow run.
  id-token: write

jobs:
  bootstrap:
    # claude-agent-lcars is registered in jlapenna/homelab's
    # github-runner-autoscaler/orchestrator.yml as
    # homelab-autoscale-claude-agent-lcars (homelab#97) -- the same pool
    # claude.yml/codex.yml/opencode.yml run on. Using it here, rather than
    # a dedicated label, is the point: this canary must allocate a runner
    # from the exact pool a real dispatch would.
    runs-on: ['${{ vars.AGENT_RUNNER_LABEL }}']
    timeout-minutes: 10
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@v7

      # The agent step's "unrestricted Bash on the working tree" rationale
      # for snapshotting before use doesn't apply here -- this workflow
      # never runs an agent step, so nothing untrusted ever touches this
      # checkout. Snapshotting anyway, and verifying the result below,
      # directly exercises the mechanism itself: proving the composite
      # action's own cp/mkdir sequence still works on the real fleet, the
      # same way claude.yml/codex.yml/opencode.yml depend on it working
      # before their own post-agent gates can run.
      - name: Snapshot post-agent enforcement scripts
        id: snapshot
        uses: ./.github/actions/snapshot-enforcement-scripts

      - name: Verify the enforcement-script snapshot actually landed
        env:
          SNAPSHOT_PATH: ${{ steps.snapshot.outputs.path }}
        run: |
          if [ -z "$SNAPSHOT_PATH" ]; then
            echo "::error::snapshot-enforcement-scripts did not report an output path."
            exit 1
          fi
          for name in verify-deliverable report-failure telemetry-finalize post-agent-gates; do
            script="$SNAPSHOT_PATH/$name/$name.sh"
            if [ ! -s "$script" ]; then
              echo "::error::Expected snapshotted script missing or empty: $script"
              exit 1
            fi
          done

      # vars.AGENT_RUNNER_LABEL (consumed by runs-on above) cannot be
      # asserted here -- job placement onto a runner happens before any step
      # runs, so an empty/unset value already fails the job loudly on its
      # own before this step could ever fire.
      - name: Assert required repo variables are set
        uses: ./.github/actions/assert-repo-vars
        with:
          vars: |
            AGENT_LCARS_CLIENT_ID=${{ vars.AGENT_LCARS_CLIENT_ID }}
            GCP_WIF_PROVIDER=${{ vars.GCP_WIF_PROVIDER }}
            GCP_TELEMETRY_WRITER_SA=${{ vars.GCP_TELEMETRY_WRITER_SA }}

      # Same mint every real worker uses, with the same default (unscoped)
      # permission set claude.yml/codex.yml/opencode.yml request -- no
      # permission-* override here, deliberately: narrowing the scope would
      # test a different mint shape than the one production actually
      # depends on.
      - name: Mint agent token
        id: agent-lcars-token
        uses: ./.github/actions/mint-agent-token
        with:
          client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}

      # Reuses the same identity-verification composite every real worker
      # calls (claude.yml/codex.yml/opencode.yml) -- a real `gh api` call
      # against the minted token, not just "the mint call returned a
      # string". This is what actually proves the token is live and
      # resolves to the expected bot identity, not merely present.
      - name: Verify agent identity
        uses: ./.github/actions/verify-agent-identity
        with:
          token: ${{ steps.agent-lcars-token.outputs.token }}
          agent: Bootstrap Canary
          app-slug: ${{ steps.agent-lcars-token.outputs.app-slug }}

      # if: always() so an earlier step's failure doesn't skip telemetry
      # entirely, matching every real worker's own placement of this step --
      # but see the header comment above: this composite's own inner steps
      # are continue-on-error: true, so it always reports green regardless
      # of whether WIF auth actually succeeded. The verification step right
      # after this one is what actually tests it.
      - name: Start telemetry sidecar
        id: telemetry-start
        if: always()
        uses: ./.github/actions/telemetry-start
        with:
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_TELEMETRY_WRITER_SA }}
          # Not a real issue/PR number -- this run has neither. Left as a
          # recognizable literal (never a real GitHub issue number) rather
          # than blank, so any telemetry doc this run does produce is
          # obviously attributable to this canary rather than misread as
          # untagged production traffic. runner-config.ts's own
          # `--issue-number` parsing already fails soft on a non-numeric
          # value (see its own "consistent with this file's fail-soft
          # parsing" comment), so this is a supported, not a hacked-in,
          # input shape.
          issue: bootstrap-canary

      # credentials-file-path is the one reliable signal telemetry-start
      # exposes to its caller: it's only populated if "Authenticate
      # telemetry writer" (google-github-actions/auth@v3, inside the
      # composite) actually succeeded before its own continue-on-error:
      # true swallowed any failure. An empty value here means the real WIF
      # exchange failed -- exactly the failure mode agent-lcars#352
      # describes ("a WIF grant silently rejected every ... telemetry write
      # for months because the failure never showed up anywhere but plain
      # step output"). The PID/liveness check below additionally proves the
      # sidecar binary is present on this runner image and that starting it
      # doesn't crash immediately.
      - name: Verify telemetry sidecar actually started
        env:
          CREDENTIALS_FILE_PATH: ${{ steps.telemetry-start.outputs['credentials-file-path'] }}
        run: |
          if [ -z "$CREDENTIALS_FILE_PATH" ]; then
            echo "::error::Telemetry WIF auth did not produce a credentials file -- google-github-actions/auth failed inside the telemetry-start composite. That step's own continue-on-error: true never fails this job by design (telemetry must not block a real agent dispatch), which is exactly why this canary has to check its output explicitly instead of trusting the step's own green checkmark."
            exit 1
          fi
          PID_FILE=/tmp/runner-telemetry/sidecar.pid
          if [ ! -f "$PID_FILE" ]; then
            echo "::error::Telemetry sidecar never wrote $PID_FILE -- either this runner image is missing /usr/local/lib/agent-lcars/sidecar-lifecycle.sh (a stale bake-in on this fleet), or the sidecar failed before it could background itself. See sidecar-lifecycle.sh's own 'start' branch."
            exit 1
          fi
          SIDECAR_PID="$(cat "$PID_FILE")"
          # Give a broken sidecar (e.g. a Node startup crash) a moment to
          # die before checking liveness -- sidecar-lifecycle.sh backgrounds
          # it with `nohup ... &` and returns immediately, so an instant
          # crash would otherwise race this check.
          sleep 3
          if ! kill -0 "$SIDECAR_PID" 2>/dev/null; then
            echo "::error::Telemetry sidecar (pid $SIDECAR_PID) exited immediately after starting. Sidecar log:"
            cat /tmp/runner-telemetry/sidecar.log 2>/dev/null || echo "(no sidecar.log found)"
            exit 1
          fi

      # Deliberately NOT `uses: ./.github/actions/telemetry-finalize` --
      # that composite's own single step is also continue-on-error: true,
      # and sidecar-lifecycle.sh's underlying `finalize` mode has no `set
      # -e` and always ends on an explicit `exit 0` (see its own header:
      # "Every failure path logs and exits 0 -- telemetry must never fail
      # the job it instruments"), so its real exit code carries no signal
      # under either invocation shape. Running the SAME snapshotted script
      # post-agent-gates.sh itself calls (see its "Finalize telemetry
      # sidecar" section) directly via `run:`, and capturing its output
      # ourselves, is the only way to see the actual text signal finalize.ts
      # produces on failure (below) -- this is safe here specifically
      # because, unlike the real workers, no untrusted agent step has run
      # between checkout and this step, so the working tree/snapshot is
      # still exactly what was checked out.
      - name: Finalize telemetry sidecar
        env:
          WRITER_CREDENTIALS_FILE: ${{ steps.telemetry-start.outputs['credentials-file-path'] }}
          RUN_ID: ${{ github.run_id }}
          NUM: bootstrap-canary
        run: |
          bash "$RUNNER_TEMP/trusted-actions/telemetry-finalize/telemetry-finalize.sh" \
            2>&1 | tee "$RUNNER_TEMP/telemetry-finalize.log"

      # finalize.ts's own annotateWarning() (agent-lcars#352) is the
      # existing, deliberate signal for a real telemetry-finalize failure:
      # it never throws (finalizeSidecar's own doc comment: "this function
      # itself never throws" -- telemetry must not fail a real agent run),
      # so the absence of a non-zero exit code proves nothing. This canary's
      # whole purpose is escalating that already-designed soft signal into a
      # hard one instead of inventing a new detection mechanism.
      # "finalize discovered zero sessions" is the expected, benign outcome
      # here specifically -- this canary never runs an agent step, so there
      # is genuinely no Claude/Codex transcript for finalize to find and
      # ship. Every OTHER agent-lcars-telemetry-watcher warning (a failed
      # transcript read/upload, a failed Firestore upsert) is fatal.
      #
      # Filter the permitted warning OUT and fail on whatever remains --
      # never "pass if the benign line appeared". finalizeSidecar emits the
      # zero-sessions warning whenever shippedCount is 0, and shippedCount
      # is 0 exactly when every discovered transcript failed to read or
      # reduce. So the benign line is present *precisely in the case that
      # must fail*, and treating it as an all-clear would mask the failures
      # this step exists to catch.
      #
      # The ADC line is the second permitted one, and it is routine rather
      # than an exception: create-store.ts logs it at info level on every
      # runner-mode start, because runner mode resolves the WIF-minted
      # short-lived credentials file through Application Default Credentials
      # by design (apps/telemetry-watcher/README.md documents it as the
      # sanctioned third credential path). It is not a fallback away from a
      # healthier path. Omitting it is why this canary failed every run from
      # the moment it was added.
      #
      # Keeping this an allowlist -- rather than flagging only ::warning::
      # and ::error:: lines -- is deliberate. The watcher reports its most
      # serious failures with NO annotation at all ("runner finalize failed
      # (ignored...)", "uncaught exception in runner finalize (ignored)"),
      # precisely because telemetry must never fail a real agent run. A
      # severity-based filter would therefore miss exactly the failures this
      # step exists to catch. The cost is that a genuinely new benign line
      # turns this red until it is allowlisted, which is the correct
      # direction to be wrong in for a component engineered to fail quietly.
      - name: Verify telemetry finalize completed without a reported failure
        run: |
          LOG="$RUNNER_TEMP/telemetry-finalize.log"
          unexpected="$(grep 'agent-lcars-telemetry-watcher:' "$LOG" \
            | grep -v 'finalize discovered zero sessions' \
            | grep -v 'using ambient Application Default Credentials' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Telemetry finalize reported a failure:"
            printf '%s\n' "$unexpected"
            echo "--- full captured output ---"
            cat "$LOG"
            exit 1
          fi

          PID_FILE=/tmp/runner-telemetry/sidecar.pid
          if [ -f "$PID_FILE" ] && kill -0 "$(cat "$PID_FILE")" 2>/dev/null; then
            echo "::error::Telemetry sidecar is still running after finalize; finalize's own stop sequence (sidecar-lifecycle.sh's SIGTERM-then-wait loop) should have terminated it."
            exit 1
          fi
