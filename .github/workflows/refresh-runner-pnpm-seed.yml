name: Refresh runner pnpm seed

# Keeps the runner image's pnpm store seed matched to what the fleet actually
# installs (agent-lcars#2076). The seed is the union of every fleet JavaScript
# repository's lockfile; tools/sync-runner-pnpm-seed.py copies those lockfiles
# (plus each repository's packageManager and supportedArchitectures) into
# apps/runner-autoscaler/runner-image/pnpm-seed/fleet/ as data. A change opens
# or updates one agent-lcars[bot] PR, which agent-automerge.yml lands once the
# repository's normal required CI passes; merging republishes the runner image
# through homelab's canonical publisher.
#
# Weekly, because consumer lockfiles move daily (Renovate) and every package a
# job's install does not find in the seed is downloaded and written per job.

on:
  schedule:
    # Monday, offset off the hour like this repository's other cron schedules.
    - cron: '47 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Sync fleet lockfiles into the runner pnpm seed
    runs-on: ['lcars-default']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The push below authenticates as agent-lcars[bot] through the
          # remote URL; checkout's persisted GITHUB_TOKEN header would
          # override that and push as github-actions[bot], which has no
          # write access here.
          persist-credentials: false

      # Read-only, and only the lockfile-bearing repositories: the sync reads
      # pnpm-lock.yaml, package.json and pnpm-workspace.yaml.
      - name: Mint Super Sprinkles read token
        id: read-token
        uses: ./.github/actions/mint-agent-token
        with:
          client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          owner: supersprinklesracing
          repositories: sprinkles,www,girosf
          permission-contents: read

      # agent-lcars[bot] is in AGENT_BOT_LOGINS, so agent-automerge.yml picks
      # up this PR, and an App token's push triggers the normal pull_request
      # CI (a GITHUB_TOKEN push would not). issues:write is for the label.
      - name: Mint Agent LCARS identity token
        id: mint
        uses: ./.github/actions/mint-agent-token
        with:
          client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Reset deps/runner-pnpm-seed from main
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          git config user.name 'agent-lcars[bot]'
          git config user.email 'agent-lcars[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main
          git checkout -B deps/runner-pnpm-seed origin/main

      - name: Sync fleet lockfiles
        id: sync
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          GH_TOKEN_SUPERSPRINKLESRACING: ${{ steps.read-token.outputs.token }}
        run: |
          python3 tools/sync-runner-pnpm-seed.py | tee "$RUNNER_TEMP/sources"
          git add -A apps/runner-autoscaler/runner-image/pnpm-seed/fleet
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push, and open or update the PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          sources="$(while read -r repository commit; do printf -- '- %s at %s\n' "$repository" "$commit"; done < "$RUNNER_TEMP/sources")"
          changed="$(git diff --cached --stat -- apps/runner-autoscaler/runner-image/pnpm-seed/fleet | tail -n 1)"
          git commit -m "chore(runner-image): refresh the fleet pnpm seed" -m "Synced by .github/workflows/refresh-runner-pnpm-seed.yml. Refs #2076."
          git push --force origin deps/runner-pnpm-seed

          body="$(cat <<EOF
          Weekly refresh of the runner image's pnpm store seed from the fleet's
          lockfiles (#2076). Merging republishes the runner image, whose seed
          is then the union of these lockfiles:

          ${sources}

          ${changed}

          Only lockfiles (without their patch maps), each repository's
          \`packageManager\`, and its \`supportedArchitectures\` are copied,
          as data. The sync refuses an empty, non-pnpm-11, or still-patched
          lockfile; the required \`Runner image pnpm-store seed\` check
          fetches this seed through the image's own stage before merge; and
          the canonical publisher's seed budget check gates promotion.

          🤖 Generated by [.github/workflows/refresh-runner-pnpm-seed.yml](https://github.com/${{ github.repository }}/blob/main/.github/workflows/refresh-runner-pnpm-seed.yml)
          EOF
          )"

          existing_pr="$(gh pr list --head deps/runner-pnpm-seed --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --body "$body"
            echo "Updated PR #$existing_pr"
          else
            gh pr create \
              --head deps/runner-pnpm-seed \
              --base main \
              --title "chore(runner-image): refresh the fleet pnpm seed" \
              --body "$body" \
              --label type:dependency-update
          fi
