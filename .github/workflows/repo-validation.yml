name: Repo Validation

# Fleet-published reusable workflow (docs/published-actions.md, #1340
# A-R5): the minimal repository-validation surface the fleet's small repos
# (www, girosf, sync-padd, nx-cache-server, sprinkles' actionlint adoption)
# used to carry as byte-identical local validate.yml bodies. One job lints
# every workflow file with actionlint; a fix or version bump lands once,
# here, instead of N times.
#
# The caller owns what `workflow_call` cannot carry: triggers,
# workflow-level permissions, and concurrency. Check-run naming: a
# reusable workflow's job reports as "<caller job> / <this job's name>",
# so a caller whose job key is `validate` produces the check
# "validate / repository validation" — that composed string is what
# rulesets and agent-automerge `required-checks` must name.
#
# actionlint's repo config (.github/actionlint.yaml, e.g. self-hosted
# runner labels) is read from the caller's own checkout, so per-repo label
# vocabularies keep working unchanged.
#
# The same declaration drives the runner-label check: every label a fleet
# repo declares under self-hosted-runner.labels is an ARC scale set, which
# matches a job only by its own name. actionlint accepts `self-hosted`
# beside any label, so `[self-hosted, <scale-set>]` passes lint and then
# queues forever (homelab, 2026-10-04). A repo that declares no labels makes
# the check a no-op; a repo whose classic runners really carry both labels
# sets check-runner-labels: false.

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: >-
          Exact native actionlint release version to run. The default tracks the
          version baked into the fleet runner image
          (apps/runner-autoscaler/runner-image/actionlint-version).
        required: false
        type: string
        default: '1.7.7'
      runs-on:
        description: >-
          Runner labels as a JSON array string, passed straight to
          fromJSON(). Defaults to GitHub-hosted ubuntu-latest on purpose:
          validation must stay green-capable before a repo's self-hosted
          fleet capacity deploys. Linux x64/arm64 runners need curl, tar, xz,
          Python 3 and pip. Missing xz is installed with sudo apt-get; no
          Docker daemon is required.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      check-runner-labels:
        description: >-
          Reject any job whose runs-on pairs `self-hosted` with a label
          declared in the caller's .github/actionlint.yaml. Disable only for a
          repository whose declared labels are classic runners that carry
          `self-hosted` too.
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  # Independent of inputs.runs-on and with no `needs`: when the caller routes
  # repository validation itself onto `[self-hosted, <scale-set>]`, that job
  # never starts, and this one still reports why. repo-tools' dependency-free
  # checker (repo-check-runner-labels) is pinned to an exact commit so a
  # repo-tools push cannot change what runs here.
  runner-labels:
    name: runner label combinations
    if: inputs.check-runner-labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Reject self-hosted paired with a declared runner label
        env:
          REPO_TOOLS_SHA: 45b4201b28e40abe97a9acebff9aaa41ae860ee2
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/check-runner-labels.mjs" \
            "https://raw.githubusercontent.com/jlapenna/repo-tools/$REPO_TOOLS_SHA/bin/check-runner-labels.mjs"
          node "$RUNNER_TEMP/check-runner-labels.mjs"

  validate:
    name: repository validation
    # The required check every caller's ruleset names. It gates on the label
    # job's real result: `always()` keeps a failed or cancelled label check
    # from turning this job into a skipped (and therefore passing) check.
    needs: runner-labels
    if: always()
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require valid runner label combinations
        env:
          CHECK_ENABLED: ${{ inputs.check-runner-labels }}
          RUNNER_LABELS_RESULT: ${{ needs.runner-labels.result }}
        run: |
          if [ "$CHECK_ENABLED" = true ] && [ "$RUNNER_LABELS_RESULT" != success ]; then
            echo "::error::Runner label combinations concluded '$RUNNER_LABELS_RESULT'."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Install xz when missing
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends xz-utils
          fi

      - uses: jlapenna/agent-lcars/.github/actions/setup-repo-checks@main
        with:
          tool: actionlint
          actionlint-version: ${{ inputs.actionlint-version }}

      - name: actionlint
        run: actionlint -color
