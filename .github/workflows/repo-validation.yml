name: Repo Validation

# Fleet-published reusable workflow (docs/published-actions.md, #1340
# A-R5): the minimal repository-validation surface the fleet's small repos
# (www, girosf, sync-padd, nx-cache-server, sprinkles' actionlint adoption)
# used to carry as byte-identical local validate.yml bodies. One job lints
# every workflow file with actionlint; a fix or version bump lands once,
# here, instead of N times.
#
# The caller owns what `workflow_call` cannot carry: triggers,
# workflow-level permissions, and concurrency. Check-run naming: a
# reusable workflow's job reports as "<caller job> / <this job's name>",
# so a caller whose job key is `validate` produces the check
# "validate / repository validation" — that composed string is what
# rulesets and agent-automerge `required-checks` must name.
#
# actionlint's repo config (.github/actionlint.yaml, e.g. self-hosted
# runner labels) is read from the caller's own checkout, so per-repo label
# vocabularies keep working unchanged.

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: >-
          Exact native actionlint release version to run. The default tracks the
          version baked into the fleet runner image
          (apps/runner-autoscaler/runner-image/actionlint-version).
        required: false
        type: string
        default: '1.7.7'
      runs-on:
        description: >-
          Runner labels as a JSON array string, passed straight to
          fromJSON(). Defaults to GitHub-hosted ubuntu-latest on purpose:
          validation must stay green-capable before a repo's self-hosted
          fleet capacity deploys. Linux x64/arm64 runners need curl, tar,
          Python 3 and pip; no Docker daemon is required.
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions: {}

jobs:
  validate:
    name: repository validation
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: jlapenna/agent-lcars/.github/actions/setup-repo-checks@main
        with:
          tool: actionlint
          actionlint-version: ${{ inputs.actionlint-version }}

      - name: actionlint
        run: actionlint -color
