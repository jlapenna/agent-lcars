name: Configure GitHub App webhook

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: configure-github-app-webhook
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WEBHOOK_CONFIG_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WEBHOOK_CONFIG_SA }}

      - name: Configure and verify the production webhook
        env:
          APP_CLIENT_ID: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          WEBHOOK_URL: https://agent-console.supersprinkles.racing/api/control-plane/webhook
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$(gcloud secrets versions access latest \
            --secret=AGENT_LCARS_WEBHOOK_SECRET \
            --project="${{ vars.GCP_PROJECT_ID }}")" \
            node tools/configure-github-app-webhook.mjs
