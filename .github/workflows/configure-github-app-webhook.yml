name: Configure GitHub App webhook

on:
  workflow_dispatch:
    inputs:
      webhook_secret_version:
        description: Secret Manager version already deployed to App Hosting
        required: true
        type: string
  # A verify-only pass, which needs no secret because it changes nothing.
  # Without this the assertions below only ran when an operator happened to
  # dispatch the workflow: push-watch was inert in production for five days
  # with every check green (#1754, #1761).
  # Daily rather than weekly: #1542 established that GitHub drops most
  # scheduled runs in this repository, so a weekly cadence can silently mean
  # months between checks. Daily is cheap (a handful of read-only App API
  # calls) and gives drift several chances a week to be caught.
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: configure-github-app-webhook
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WEBHOOK_CONFIG_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WEBHOOK_CONFIG_SA }}

      - name: Configure and verify the production webhook
        env:
          APP_CLIENT_ID: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          WEBHOOK_SECRET_VERSION: ${{ inputs.webhook_secret_version }}
          WEBHOOK_URL: https://lcars.jlapenna.net/api/control-plane/webhook
          VERIFY_ONLY: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          umask 077
          # A scheduled run asserts configuration and changes nothing, so it
          # never touches the webhook secret. Fetching one would only give
          # the unattended path a credential it has no use for -- and there
          # is no version input to fetch by.
          if [[ "$VERIFY_ONLY" == "true" ]]; then
            node tools/configure-github-app-webhook.mjs
            exit 0
          fi
          if [[ ! "$WEBHOOK_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "webhook_secret_version must be a positive integer" >&2
            exit 1
          fi
          webhook_secret_file="$RUNNER_TEMP/agent-lcars-webhook-secret"
          gcloud secrets versions access "$WEBHOOK_SECRET_VERSION" \
            --secret=AGENT_LCARS_WEBHOOK_SECRET \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --out-file="$webhook_secret_file"
          WEBHOOK_SECRET_FILE="$webhook_secret_file" \
            node tools/configure-github-app-webhook.mjs
