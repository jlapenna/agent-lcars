name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Still ubuntu-latest, not self-hosted, for now: this job's `nx run-many`
    # includes @agent-lcars/runner-autoscaler:test-race (`go test -race`),
    # which requires cgo. The self-hosted runner image has no C toolchain,
    # and the `runner` user it executes as has no sudo to install one at
    # runtime (only the image build's earlier `USER root` phase could).
    # test-race is the *only* test target this Go app has in CI and it
    # caught a real data race the day before this comment was written
    # (#338) -- not something to drop to unblock this migration. Move this
    # job once the runner image bakes in a C toolchain (see follow-up
    # issue); ci.yml's `e2e` job, codeql.yml, and agent-router.yml already
    # don't have this dependency and are self-hosted below/elsewhere.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Moved ahead of "Validate GitHub Actions workflows": that step's
      # `go install` needs a `go` binary on PATH, which GitHub-hosted
      # ubuntu-latest ships preinstalled but this repo's self-hosted runner
      # image does not (it's built for the Node/pnpm toolchain, not Go) --
      # setup-go must run first here, not merely somewhere in the job.
      #
      # This repo's only Go module lives at apps/runner-autoscaler/go.mod,
      # not the repo root. setup-go's default dependency-cache lookup only
      # checks the root, so without cache-dependency-path every run logs a
      # "Restore cache failed: Dependencies file is not found" warning and
      # never actually caches the module/build cache (agent-lcars#318).
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/runner-autoscaler/go.mod
          cache-dependency-path: apps/runner-autoscaler/go.mod

      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name agent-router.yml ! -name codex.yml -print0 \
            | xargs -0 "$(go env GOPATH)/bin/actionlint"
          "$(go env GOPATH)/bin/actionlint" \
            -ignore 'unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"' \
            .github/workflows/agent-router.yml .github/workflows/codex.yml

      - name: Test agent dispatch preparation
        run: bash .github/actions/prepare-agent-dispatch/prepare.test.sh

      - name: Test dispatch broker contracts
        run: node --test .github/actions/dispatch-broker/*.test.mjs

      - name: Test dispatch broker canary lifecycle (#307)
        run: node --test .github/actions/run-dispatch-canary/*.test.mjs

      - name: Test deliverable verification
        run: bash .github/actions/verify-deliverable/verify-deliverable.test.sh

      - name: Test failure reporting
        run: bash .github/actions/report-failure/report-failure.test.sh

      - name: Test hermetic E2E environment
        run: node --test tools/e2e-hermetic-env.test.mjs
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency integrity
        run: pnpm check:dependencies

      - name: Check contracts
        run: pnpm check:contracts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check circular dependencies
        run: pnpm lint:circular

      - name: Test, typecheck, and build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NX_MAX_PARALLEL: 2
        run: pnpm exec nx run-many -t test typecheck build test-race --all --parallel=2

  e2e:
    name: E2E
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Self-hosted for everything trusted (push to main, merge_group,
    # workflow_dispatch, and a same-repo PR branch); ubuntu-latest only for
    # a pull_request whose head is a fork -- the one case where this public
    # repo would be building/running someone else's arbitrary code (see
    # codeql.yml's `analyze` job for the same rationale in more detail).
    # No cgo dependency here (that's the `verify` job's problem), so this
    # job doesn't need the ubuntu-latest carve-out `verify` currently has.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.DEFAULT_RUNNER_LABEL }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # firebase-tools' Firestore emulator requires Java 21+; ubuntu-latest's
      # default `java` on PATH is only 17 (confirmed the hard way: this job
      # failed with "firebase-tools no longer supports Java version before
      # 21" before this step was added). Matches members' own setup-ci
      # action's java-version pin.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # No @visual specs exist yet, so this runs directly on the runner
      # rather than through tools/e2e-docker.sh's pinned rendering
      # environment -- revisit (run via that Dockerfile instead, matching
      # local dev) once one is added and screenshot-rendering consistency
      # actually matters.
      - name: Run console e2e suite
        run: ./tools/e2e-local.sh

      # always(), not failure(): the populated-page captures
      # (populated-dashboard.spec.ts, #40) are attached to this report and
      # exist to be looked at after a *passing* run. Uploading only on
      # failure would mean the one artifact they live in is thrown away
      # exactly when they're useful.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/console-e2e/test-output/playwright-report
          retention-days: 7
