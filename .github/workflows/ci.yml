name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Self-hosted for everything trusted (push to main, merge_group,
    # workflow_dispatch, and a same-repo PR branch -- opening one already
    # requires write access to this repo); ubuntu-latest only for a
    # pull_request whose head is a fork (#408's rationale). This job's `nx
    # run-many` includes @agent-lcars/runner-autoscaler:test-race (`go test
    # -race`), which needs cgo -- the runner image now bakes in a C
    # toolchain (gcc/libc6-dev, #410) via EXTRA_APT_PACKAGES, so this no
    # longer needs the ubuntu-latest carve-out it had between #408 and #410.
    #
    # CI_RUNNER_LABEL, not DEFAULT_RUNNER_LABEL (#451): this job runs up to
    # 30 minutes, while the former DEFAULT_RUNNER_LABEL glue-job dependency
    # was retired from agent-router.yml in #798. CI_RUNNER_LABEL remains its
    # own dedicated pool
    # (homelab's homelab-autoscale-lcars-ci) sized for long-running jobs.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_RUNNER_LABEL }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This job runs the whole `test typecheck build --all` gate on an
      # ephemeral autoscaled runner, so its local cache starts cold every
      # time and the remote cache is the only thing standing between a push
      # and a full-tree recompile.
      - uses: ./.github/actions/setup-nx-remote-cache
        with:
          url: ${{ vars.NX_CACHE_URL }}
          write-token: ${{ secrets.NX_CACHE_TOKEN }}

      # The trusted JIT image bakes Go and actionlint from these exact source
      # versions. Fork PRs stay on GitHub-hosted runners, and a temporarily
      # stale image must remain recoverable, so prove the baked tools before
      # skipping the hosted-runner setup/install fallbacks.
      - name: Detect baked CI tooling
        id: ci-tooling
        shell: bash
        run: |
          expected_go_version="$(sed -nE 's/^go ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' apps/runner-autoscaler/go.mod)"
          expected_actionlint_version="$(tr -d '\r\n' < apps/runner-autoscaler/runner-image/actionlint-version)"
          go_ready=false
          actionlint_ready=false

          if command -v go >/dev/null 2>&1 && \
            [[ "$(go env GOVERSION)" == "go${expected_go_version}" ]]; then
            go_ready=true
          fi

          baked_actionlint_version=/usr/local/share/agent-lcars-tooling/actionlint-version
          if [[ -r "$baked_actionlint_version" && \
            "$(tr -d '\r\n' < "$baked_actionlint_version")" == "$expected_actionlint_version" ]] && \
            command -v actionlint >/dev/null 2>&1 && \
            actionlint -version >/dev/null 2>&1; then
            actionlint_ready=true
          fi

          echo "go_ready=$go_ready" >> "$GITHUB_OUTPUT"
          echo "actionlint_ready=$actionlint_ready" >> "$GITHUB_OUTPUT"

      # This repo's only Go module lives at apps/runner-autoscaler/go.mod,
      # not the repo root. setup-go's default dependency-cache lookup only
      # checks the root, so without cache-dependency-path every run logs a
      # "Restore cache failed: Dependencies file is not found" warning and
      # never actually caches the module/build cache (agent-lcars#318).
      - uses: actions/setup-go@v7
        if: steps.ci-tooling.outputs.go_ready != 'true'
        with:
          go-version-file: apps/runner-autoscaler/go.mod
          cache-dependency-path: apps/runner-autoscaler/go.mod
          cache: false

      - name: Validate GitHub Actions workflows
        run: |
          if [[ "${{ steps.ci-tooling.outputs.actionlint_ready }}" == 'true' ]]; then
            actionlint_command=actionlint
          else
            actionlint_version="$(tr -d '\r\n' < apps/runner-autoscaler/runner-image/actionlint-version)"
            go install "github.com/rhysd/actionlint/cmd/actionlint@v${actionlint_version}"
            actionlint_command="$(go env GOPATH)/bin/actionlint"
          fi
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name codex.yml -print0 \
            | xargs -0 "$actionlint_command"
          "$actionlint_command" \
            -ignore 'unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"' \
            .github/workflows/codex.yml

      - name: Test agent dispatch preparation
        run: bash .github/actions/prepare-agent-dispatch/prepare.test.sh

      - name: Test issue claiming
        run: bash .github/actions/claim-issue/claim.test.sh

      - name: Test workflows-permission grant verification (#868)
        run: bash .github/actions/mint-agent-token/verify-workflows-grant.test.sh

      - name: Test deliverable verification
        run: bash .github/actions/verify-deliverable/verify-deliverable.test.sh

      - name: Test failure reporting
        run: bash .github/actions/report-failure/report-failure.test.sh

      - name: Test post-agent gate orchestration (#645 Phase 3)
        run: bash .github/actions/post-agent-gates/post-agent-gates.test.sh

      - name: Test runner-image toolchain preflight (#468)
        run: bash apps/runner-autoscaler/runner-image/toolchain-health.test.sh

      - name: Test runner-image externals repair (#395)
        run: bash apps/runner-autoscaler/runner-image/externals-health.test.sh

      - name: Test repo-variable assertion
        run: bash .github/actions/assert-repo-vars/assert.test.sh

      - name: Test live-base merging
        run: bash .github/actions/merge-live-base/merge-live-base.test.sh

      - name: Test published-action contracts
        run: node .github/actions/published-actions.contract.test.mjs

      - name: Test hermetic E2E environment
        run: node --test tools/e2e-hermetic-env.test.mjs

      - name: Test e2e-docker isolation (#908)
        run: bash tools/e2e-docker-isolation.test.sh

      - uses: ./.github/actions/setup-node-pnpm

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: apps/github-actions-exporter/requirements.lock

      - name: Check dependency integrity
        run: pnpm check:dependencies

      - name: Check contracts
        run: pnpm check:contracts

      - name: Test Nx remote-cache read failure is non-fatal (#942)
        run: bash tools/nx-remote-cache-read-failure.test.sh

      # dispatch-broker's action.yml runs the committed bundle at
      # dispatch-broker/dist/main.mjs, not the loose sources next to it
      # (built by apps/dispatch-broker's `build` target -- see its "// why"). A committed build artifact that
      # can silently drift from the sources it was built from is worse than
      # no bundle at all: someone could edit apps/dispatch-broker/src,
      # forget to rebuild, and ship an action that still runs the OLD
      # behavior with no signal anything is wrong. Rebuilding here and
      # diffing against what is committed turns that into a loud CI
      # failure instead.
      #
      # rerun-infra-killed-runs/dist/main.mjs is the same pattern, built by
      # the sibling `build-rerun-infra-killed-runs` target from
      # apps/dispatch-broker/src/rerun-infra-killed-runs -- checked here
      # too: the same drift (source moved, committed bundle/import left
      # stale) broke this action outright (five straight scheduled-run
      # failures) with nothing in CI to catch it.
      #
      # deliverable-watchdog/dist/main.mjs is #721's independent scheduled
      # observer. It shares the same committed-bundle contract: the workflow
      # must execute exactly the reviewed TypeScript source, never a stale
      # artifact left behind by a missed local build.
      - name: Check committed operational action bundles match their source
        run: |
          pnpm nx build @agent-lcars/dispatch-broker
          pnpm nx build-rerun-infra-killed-runs @agent-lcars/dispatch-broker
          pnpm nx build-deliverable-watchdog @agent-lcars/dispatch-broker
          git diff --exit-code -- .github/actions/dispatch-broker/dist .github/actions/rerun-infra-killed-runs/dist .github/actions/deliverable-watchdog/dist

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check circular dependencies
        run: pnpm lint:circular

      - name: Test, typecheck, and build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NX_MAX_PARALLEL: 2
          # actions/setup-go's cache key (OS/arch/go-version/dependency-file
          # hash) has no notion of "does this environment have a C
          # compiler" -- a self-hosted run cached before the runner image
          # had gcc (#410) persists `go env`'s CGO_ENABLED=0 default
          # indefinitely (confirmed: `go env` reports CC='gcc' but
          # CGO_ENABLED='0' even now that gcc is actually installed).
          # Force it rather than trust the cached auto-detection.
          CGO_ENABLED: '1'
        run: pnpm exec nx run-many -t test typecheck build test-race --all --parallel=2

      # `next build` does not execute dynamic server-route imports. Exercise
      # the actual standalone artifact so traced runtime assets (notably the
      # Cloud Tasks GAPIC JSON used by hosted webhook admission) cannot pass
      # CI and then fail only after an App Hosting rollout. The trace resolves
      # the exact installed Cloud Tasks package (#1023), so this deployable
      # smoke can safely reuse the deterministic Nx build artifact. Exercise
      # that contract with remote reads disabled: clean the first build's
      # outputs, restore them from the builder-local L1, and boot what Nx
      # restored (#1030).
      - name: Smoke test cached deployable console bundle
        run: ./tools/console-cache-restore-smoke.sh

      # This bundle is outside the default build graph, but is what both the
      # telemetry-watcher image and the runner sidecar execute. Keep its
      # isolated startup gate in normal CI now that image publishing is owned
      # by the canonical homelab controller.
      - name: Smoke test telemetry-watcher bundle
        run: ./tools/telemetry-watcher-standalone-smoke.sh

  e2e:
    name: E2E
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # !!! DO NOT MERGE until jlapenna/homelab#520's lcars-e2e scale set is
    # actually deployed and its listener is confirmed registering runners
    # (see that PR's own "Deploy procedure" section) !!! Until then this
    # job's trusted path has no runner label to land on and every push
    # would hang until the 30-minute timeout. Tracked on agent-lcars#920.
    #
    # The runner IS the pinned sandbox now (agent-lcars#920, mirroring
    # supersprinklesracing/sprinkles' own e2e pool): tools/e2e-runner/
    # Dockerfile derives FROM the published tools/e2e/Dockerfile sandbox
    # plus the JIT runner agent, and jlapenna/homelab's orchestrator.yml
    # pins that image as the lcars-e2e pool's runner_image. That's what
    # lets this job invoke the suite directly below -- no
    # tools/e2e-docker.sh wrapper, no host Docker socket, and (once a
    # @visual spec exists) screenshot rendering that matches
    # tools/e2e-docker.sh's local runs byte-for-byte, closing the gap the
    # job-level comment used to carry here.
    #
    # Fork PRs still run on ubuntu-latest via tools/e2e-local.sh -- lcars-e2e
    # is a trusted self-hosted pool, off-limits to untrusted fork code the
    # same way CI_RUNNER_LABEL already is for `verify` above (see
    # codeql.yml's `analyze` job for the same fork-PR rationale in more
    # detail). Literal 'lcars-e2e', not a vars.* indirection: this job is
    # only correct on a runner whose image IS the pinned sandbox, so
    # nothing should be able to silently redirect it elsewhere (mirrors
    # sprinkles' own e2e.yml `runs-on: [e2e]`).
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'lcars-e2e' }}
    timeout-minutes: 30

    steps:
      # The current lcars-e2e runner image predates committed visual
      # baselines, so bootstrap the pinned client once for that transition.
      # After tools/e2e-runner/Dockerfile is published this becomes a cheap
      # no-op; keeping it makes a stale image recoverable instead of turning
      # LFS pointers into "Could not decode expected image as PNG" failures.
      - name: Ensure Git LFS is available
        shell: bash
        env:
          GIT_LFS_VERSION: 3.7.1
          GIT_LFS_SHA256_AMD64: 1c0b6ee5200ca708c5cebebb18fdeb0e1c98f1af5c1a9cba205a4c0ab5a5ec08
          GIT_LFS_SHA256_ARM64: 73a9c90eeb4312133a63c3eaee0c38c019ea7bfa0953d174809d25b18588dd8d
        run: |
          if command -v git-lfs >/dev/null 2>&1; then
            git-lfs --version
            exit 0
          fi

          case "$(uname -m)" in
            x86_64)
              lfs_arch=amd64
              lfs_sha256="$GIT_LFS_SHA256_AMD64"
              ;;
            aarch64 | arm64)
              lfs_arch=arm64
              lfs_sha256="$GIT_LFS_SHA256_ARM64"
              ;;
            *)
              echo "Unsupported Git LFS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          lfs_archive="$RUNNER_TEMP/git-lfs.tar.gz"
          lfs_extract="$RUNNER_TEMP/git-lfs-extract"
          lfs_bin="$RUNNER_TEMP/git-lfs-bin"
          mkdir -p "$lfs_extract" "$lfs_bin"
          curl --fail --location --silent --show-error \
            "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/git-lfs-linux-${lfs_arch}-v${GIT_LFS_VERSION}.tar.gz" \
            --output "$lfs_archive"
          echo "${lfs_sha256}  ${lfs_archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$lfs_archive" --directory "$lfs_extract"
          install -m 0755 \
            "$lfs_extract/git-lfs-${GIT_LFS_VERSION}/git-lfs" \
            "$lfs_bin/git-lfs"
          echo "$lfs_bin" >> "$GITHUB_PATH"
          "$lfs_bin/git-lfs" --version

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      # The E2E targets are explicitly cache:false, so tests always run. Its
      # hermetic wrapper admits only this L2 capability pair to let the
      # deterministic console bundle reuse or warm the remote cache.
      - uses: ./.github/actions/setup-nx-remote-cache
        with:
          url: ${{ vars.NX_CACHE_URL }}
          write-token: ${{ secrets.NX_CACHE_TOKEN }}

      - uses: ./.github/actions/setup-node-pnpm

      # The trusted JIT runner image bakes OpenJDK 21 for the Firestore
      # emulator. Fork PRs use GitHub-hosted runners, where Java 17 remains
      # the default, so retain setup-java only as that fallback. Kept
      # unconditional (not narrowed to the fork branch) because it already
      # correctly no-ops on lcars-e2e -- the baked marker check below finds
      # nothing to install there either way, and narrowing it would just be
      # two ways to express the same runtime condition.
      - name: Detect Java 21 runtime
        id: java-runtime
        shell: bash
        run: |
          java_major=''
          if command -v java >/dev/null 2>&1; then
            java_major="$(
              java -version 2>&1 |
                sed -nE 's/.*version "([0-9]+).*/\1/p' |
                head -n 1
            )" || java_major=''
          fi
          if [[ "$java_major" =~ ^[0-9]+$ ]] && (( java_major >= 21 )); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.java-runtime.outputs.ready != 'true'
        with:
          distribution: temurin
          java-version: '21'

      # The trusted E2E path runs on the lcars-e2e sandbox lineage (FROM
      # mcr.microsoft.com/playwright), which preinstalls browsers at
      # /ms-playwright along with their system dependencies -- being that
      # environment is the pool's entire purpose. Only a truly bare host
      # (fork PRs on ubuntu-latest) takes the --with-deps path; the first
      # lcars-e2e run (31464244136) proved that fallback hard-fails without
      # root there, so this detection is load-bearing, not an optimization.
      # (The generic JIT image's #905 bake and its version marker were
      # reverted per #920 -- E2E never runs on that image anymore.)
      - name: Detect preinstalled Playwright browsers
        id: playwright-deps
        shell: bash
        run: |
          if compgen -G '/ms-playwright/chromium-*' > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browser from baked dependencies
        if: steps.playwright-deps.outputs.ready == 'true'
        run: pnpm exec playwright install chromium

      - name: Install Playwright browser and dependencies
        if: steps.playwright-deps.outputs.ready != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # One e2e entrypoint for every environment (fork ubuntu-latest,
      # trusted lcars-e2e, dev machines): tools/e2e-local.sh. Its `env -i`
      # allowlist is load-bearing on the trusted path too -- a Codex P1/P2
      # pair on #931 flagged that the earlier bespoke direct invocation ran
      # the suite under the runner's full ambient environment (GITHUB_TOKEN
      # included), satisfying the hermetic validator's marker without the
      # isolation the marker asserts. The script's port-fixing and lock are
      # harmless no-ops on a fresh ephemeral container, and its two-phase
      # NEXT_PUBLIC_*/AUTH_SECRET handling replaces the bespoke prepare
      # step this converged away. The sandbox's preinstalled browsers cross
      # the boundary via the PLAYWRIGHT_BROWSERS_PATH carve-out the script
      # forwards when the image sets it.
      - name: Run console e2e suite
        run: ./tools/e2e-local.sh

      # Preserve Playwright's HTML report, traces, screenshots, and error
      # context after the ephemeral runner exits. `if: always()` is
      # load-bearing: failures are when these artifacts matter most (#991).
      - name: Upload console e2e diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-e2e-diagnostics-${{ github.run_attempt }}
          path: apps/console-e2e/test-output/
          if-no-files-found: ignore
          retention-days: 14
