name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: repository-owned Terraform
    # This credential-free check takes seconds; keep it independent of the
    # large self-hosted pool used by full verification and E2E (#2208).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Detect matching baked Terraform
        id: terraform-tooling
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 tools/detect-baked-ci-tools.py terraform

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.terraform-tooling.outputs.ready != 'true'
        with:
          terraform_version: v1.16.5

      - name: Verify repository-owned Terraform
        run: |
          ./tools/contract-tests/github-ruleset-root.test.sh
          terraform -chdir=infra/github-ruleset init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/github-ruleset fmt -check -recursive
          terraform -chdir=infra/github-ruleset validate

  # actionlint accepts `self-hosted` beside any label, but a runner scale set
  # (every label in .github/actionlint.yaml) matches only its own name, so
  # `[self-hosted, lcars-ci]` queues forever (homelab hit exactly this on
  # 2026-10-04). This runs on a GitHub-hosted runner with no `needs`, so it
  # still reports when the label error is on a self-hosted job itself. The
  # dependency-free check comes from @jlapenna/repo-tools at the commit the
  # lockfile pins, without a pnpm install.
  runner-labels:
    name: Runner label combinations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Reject self-hosted paired with a runner scale-set label
        run: |
          sha="$(grep -oE 'codeload\.github\.com/jlapenna/repo-tools/tar\.gz/[0-9a-f]{40}' pnpm-lock.yaml | head -n 1)"
          sha="${sha##*/}"
          if [ -z "$sha" ]; then
            echo "::error::pnpm-lock.yaml does not pin @jlapenna/repo-tools to a commit."
            exit 1
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/check-runner-labels.mjs" \
            "https://raw.githubusercontent.com/jlapenna/repo-tools/$sha/bin/check-runner-labels.mjs"
          node "$RUNNER_TEMP/check-runner-labels.mjs"

  # A timer or cron firing more often than hourly usually means the design
  # should react to an event instead of polling. Every such schedule in this
  # repository (systemd timers, workflow crons, Kubernetes CronJobs) must carry
  # an adjacent `# schedule-justification:` comment; the check scans every
  # tracked file, so `git grep schedule-justification` is the inventory. Like
  # the runner-label check, it runs the dependency-free script from
  # @jlapenna/repo-tools at the commit the lockfile pins.
  schedules:
    name: Schedule justifications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Reject unjustified sub-hourly schedules
        run: |
          sha="$(grep -oE 'codeload\.github\.com/jlapenna/repo-tools/tar\.gz/[0-9a-f]{40}' pnpm-lock.yaml | head -n 1)"
          sha="${sha##*/}"
          if [ -z "$sha" ]; then
            echo "::error::pnpm-lock.yaml does not pin @jlapenna/repo-tools to a commit."
            exit 1
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/check-schedules.mjs" \
            "https://raw.githubusercontent.com/jlapenna/repo-tools/$sha/bin/check-schedules.mjs"
          node "$RUNNER_TEMP/check-schedules.mjs" --list

  verify-full:
    name: Full verification
    # Self-hosted for everything trusted (push to main, workflow_dispatch,
    # and a same-repo PR branch -- opening one already
    # requires write access to this repo); ubuntu-latest only for a
    # pull_request whose head is a fork (#408's rationale). This job's `nx
    # run-many` includes @agent-lcars/runner-autoscaler:test-race (`go test
    # -race`), which needs cgo -- the runner image now bakes in a C
    # toolchain (gcc/libc6-dev, #410) via EXTRA_APT_PACKAGES, so this no
    # longer needs the ubuntu-latest carve-out it had between #408 and #410.
    #
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'lcars-ci' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The runner writes already-masked live output to rotating page files.
      # Start immediately after checkout so this long gate is observable
      # before GitHub makes the completed job archive available. The action
      # cleanly no-ops on the hosted fork-PR carve-out above.
      - name: Start live CI log stream
        continue-on-error: true
        uses: ./.github/actions/ci-log-stream
        with:
          mode: start
          # No fleet default lives in the action itself (#1751); this
          # repository variable supplies this deployment's Loki endpoint.
          # Unset (a fork with no CI_LOG_LOKI_URL variable) cleanly disables
          # the shipper rather than silently pushing to homelab's Loki.
          loki-url: ${{ vars.CI_LOG_LOKI_URL }}

      - name: Detect matching baked Terraform
        id: terraform-tooling
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 tools/detect-baked-ci-tools.py terraform

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.terraform-tooling.outputs.ready != 'true'
        with:
          terraform_version: v1.16.5

      # Keep the IAM authorization tests on the same required Verify check as
      # the code gate. The test file mocks both Google providers, and disabling
      # the backend prevents CI from reading GCS state or needing credentials.
      - name: Verify Terraform
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform test

      # This job runs the whole `test typecheck build --all` gate on an
      # ephemeral autoscaled runner, so its local cache starts cold every
      # time and the remote cache is the only thing standing between a push
      # and a full-tree recompile.
      - uses: ./.github/actions/setup-nx-remote-cache
        with:
          url: ${{ vars.NX_CACHE_URL }}
          write-token: ${{ secrets.NX_CACHE_TOKEN }}

      # The trusted JIT image bakes Go and actionlint from these exact source
      # versions. Fork PRs stay on GitHub-hosted runners, and a temporarily
      # stale image must remain recoverable, so prove the baked tools before
      # skipping the hosted-runner setup/install fallbacks.
      - name: Detect baked CI tooling
        id: ci-tooling
        shell: bash
        run: |
          expected_go_version="$(sed -nE 's/^go ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' apps/runner-autoscaler/go.mod)"
          expected_actionlint_version="$(tr -d '\r\n' < apps/runner-autoscaler/runner-image/actionlint-version)"
          go_ready=false
          actionlint_ready=false

          if command -v go >/dev/null 2>&1 && \
            [[ "$(go env GOVERSION)" == "go${expected_go_version}" ]]; then
            go_ready=true
          fi

          baked_actionlint_version=/usr/local/share/agent-lcars-tooling/actionlint-version
          if [[ -r "$baked_actionlint_version" && \
            "$(tr -d '\r\n' < "$baked_actionlint_version")" == "$expected_actionlint_version" ]] && \
            command -v actionlint >/dev/null 2>&1 && \
            actionlint -version >/dev/null 2>&1; then
            actionlint_ready=true
          fi

          echo "go_ready=$go_ready" >> "$GITHUB_OUTPUT"
          echo "actionlint_ready=$actionlint_ready" >> "$GITHUB_OUTPUT"

      # This repo's only Go module lives at apps/runner-autoscaler/go.mod,
      # not the repo root. setup-go's default dependency-cache lookup only
      # checks the root, so without cache-dependency-path every run logs a
      # "Restore cache failed: Dependencies file is not found" warning and
      # never actually caches the module/build cache (agent-lcars#318).
      - uses: actions/setup-go@v7
        if: steps.ci-tooling.outputs.go_ready != 'true'
        with:
          go-version-file: apps/runner-autoscaler/go.mod
          cache-dependency-path: apps/runner-autoscaler/go.mod
          cache: false

      - name: Validate GitHub Actions workflows
        run: |
          if [[ "${{ steps.ci-tooling.outputs.actionlint_ready }}" == 'true' ]]; then
            actionlint_command=actionlint
          else
            actionlint_version="$(tr -d '\r\n' < apps/runner-autoscaler/runner-image/actionlint-version)"
            go install "github.com/rhysd/actionlint/cmd/actionlint@v${actionlint_version}"
            actionlint_command="$(go env GOPATH)/bin/actionlint"
          fi
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -0 "$actionlint_command"

      - name: Test the work-session-expiry workflow
        run: bash tools/workflow-session-expiry.test.sh

      - name: Test OpenCode configuration
        run: bash tools/opencode-config.test.sh

      - name: Test the agent-tools package install
        run: bash packages/fleet-tools/tests/package-install.test.sh

      - name: Test generic OIDC POST transport (#1340)
        run: bash .github/actions/oidc-post/oidc-post.test.sh

      - name: Reject retired control-plane dispatch admission
        run: bash tools/no-legacy-control-plane-request.test.sh

      # The check itself, against this checkout - the #1255 incident's
      # self-referential skill symlink passed CI here and broke every
      # consumer's whole-repo action download at 'Set up job' (#1265).
      - name: Check repository symlink integrity
        run: bash tools/check-repo-symlinks.sh

      # The check itself, against this checkout. Lint-staged's fast layer
      # only runs on staged *.sh files at commit time; this covers the
      # whole tools/, .github/, apps/ tree on every push and PR, including
      # any pre-existing script a commit never touched. jlapenna/homelab#1074
      # was exactly this shape (a bare `return` after `||` under `set -e`)
      # silently killing merge-to-live's image publisher for hours; see
      # jlapenna/homelab#1087.
      - name: Check for bare `return` after `||` in shell scripts
        run: bash tools/check-shell-bare-return.sh

      - name: Test workflows-permission grant verification (#868)
        run: bash .github/actions/mint-agent-token/verify-workflows-grant.test.sh

      - name: Test the GitHub attachment download helper
        run: bash agents/shared/skills/agent-protocol/scripts/download-github-attachment.test.sh

      - name: Test generic in-job daemon lifecycle (#1246)
        run: bash apps/telemetry-watcher/bin/job-daemon.test.sh

      - name: Test runner-image toolchain preflight (#468)
        run: bash apps/runner-autoscaler/runner-image/toolchain-health.test.sh

      - name: Test runner-image build-time invariant gate (#2033)
        run: |
          node --test apps/runner-autoscaler/runner-image/repo-tools-bins.test.mjs
          bash apps/runner-autoscaler/runner-image/verify-image-invariants.test.sh

      - name: Test reviewed OpenCode release installation
        run: bash apps/runner-autoscaler/runner-image/install-opencode-release.test.sh

      - name: Test baked OpenCode store concurrent-reader gate (#2071)
        run: bash apps/runner-autoscaler/runner-image/check-opencode-concurrent-readers.test.sh

      # The runner image build runs this same file with `node --test`; without
      # this step a broken import passed Verify and blocked every image
      # promotion after #1960.
      - name: Test the OpenCode LiteLLM proxy
        run: node --test apps/runner-autoscaler/runner-image/opencode-litellm-proxy.test.mjs

      - name: Test control-plane native cross-compilation (#1436)
        run: bash apps/runner-autoscaler/control-plane-image.test.sh

      - name: Test the action-archive-cache populate script
        run: bash apps/runner-autoscaler/runner-image/populate-action-archive-cache.test.sh

      - name: Test runner-image externals repair (#395)
        run: bash apps/runner-autoscaler/runner-image/externals-health.test.sh

      - name: Test direct-runner.sh
        run: bash apps/runner-autoscaler/runner-image/direct-runner.test.sh

      - name: Test prepare-dispatch.sh
        run: bash apps/runner-autoscaler/runner-image/runtime/prepare-dispatch.test.sh

      - name: Test repo-variable assertion
        run: bash .github/actions/assert-repo-vars/assert.test.sh

      - name: Test live-base merging
        run: bash .github/actions/merge-live-base/merge-live-base.test.sh

      - name: Test published-action contracts
        run: node .github/actions/published-actions.contract.test.mjs

      - name: Test codex issue guardrail hook
        run: node --test packages/fleet-tools/tests/codex-issue-guardrail.test.cjs

      - uses: ./.github/actions/setup-node-pnpm

      # These are incident-derived safety, CLI, and artifact contracts. They
      # used to run in an advisory `ci-tooling.yml` lane, which meant no person
      # or system acted on failure. Keep the earned coverage in the required
      # Verify path; policy/config assertions run through `check:contracts`
      # below. The optional local console-cache diagnostic had no shipping
      # consumer and was deleted with that advisory lane (#1605).
      - name: Test repository symlink integrity
        run: bash tools/check-repo-symlinks.test.sh

      - name: Test direct-runner evidence CLI
        run: python3 -m unittest discover -s .agents/skills/debug-agent-run/scripts -p 'test_*.py'

      - name: Test shell bare-return lint (jlapenna/homelab#1087)
        run: bash tools/check-shell-bare-return.test.sh

      - name: Test E2E runner node-tar repair (#1435)
        run: bash tools/e2e-runner/node-tar-health.test.sh

      - name: Test probe scratch cleanup (homelab#1542)
        run: node --test tools/probes/scratch.test.mjs

      - name: Test hermetic E2E environment
        run: node --test tools/e2e-hermetic-env.test.mjs tools/e2e/run-console-emulators.test.mjs

      - name: Test e2e-docker isolation (#908)
        run: bash tools/e2e-docker-isolation.test.sh

      - name: Test Nx remote-cache read failure is non-fatal (#942)
        run: bash tools/nx-remote-cache-read-failure.test.sh

      - name: Test bounded Nx native binding cache (#1458)
        run: bash tools/nx-native-file-cache.test.sh

      - name: Detect matching baked uv and Python
        id: python-tooling
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 tools/detect-baked-ci-tools.py python

      - name: Cache dependencies for baked uv
        if: steps.python-tooling.outputs.ready == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.python-tooling.outputs.cache_dir }}
          key: uv-baked-${{ runner.os }}-${{ runner.arch }}-${{ steps.python-tooling.outputs.uv_version }}-${{ steps.python-tooling.outputs.python_version }}-${{ hashFiles('apps/github-actions-exporter/requirements.lock') }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.python-tooling.outputs.ready != 'true'
        with:
          version: 0.12.23
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: apps/github-actions-exporter/requirements.lock

      - name: Check dependency integrity
        run: pnpm check:dependencies

      - name: Check contracts
        run: pnpm check:contracts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check circular dependencies
        run: pnpm lint:circular

      - name: Test, typecheck, and build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NX_MAX_PARALLEL: 2
          # actions/setup-go's cache key (OS/arch/go-version/dependency-file
          # hash) has no notion of "does this environment have a C
          # compiler" -- a self-hosted run cached before the runner image
          # had gcc (#410) persists `go env`'s CGO_ENABLED=0 default
          # indefinitely (confirmed: `go env` reports CC='gcc' but
          # CGO_ENABLED='0' even now that gcc is actually installed).
          # Force it rather than trust the cached auto-detection.
          CGO_ENABLED: '1'
        run: ./tools/nx run-many -t test typecheck build test-race --all --parallel=2

      # The trusted JIT runner image bakes OpenJDK 21 for the Firestore
      # emulator; ubuntu-latest (the fork-PR carve-out above) still
      # defaults to Java 17. setup-java consults its own tool cache, not
      # PATH, so it re-downloads Temurin every run regardless -- detect
      # first and only fall back to install when the baked runtime isn't
      # already 21.
      - name: Detect Java 21 runtime
        id: emulator-java-runtime
        shell: bash
        run: |
          java_major=''
          if command -v java >/dev/null 2>&1; then
            java_major="$(
              java -version 2>&1 |
                sed -nE 's/.*version "([0-9]+).*/\1/p' |
                head -n 1
            )" || java_major=''
          fi
          if [[ "$java_major" =~ ^[0-9]+$ ]] && (( java_major >= 21 )); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Java for the Firestore emulator
        uses: actions/setup-java@v6
        if: steps.emulator-java-runtime.outputs.ready != 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Store contract against the Firestore emulator
        run: ./tools/nx run @agent-lcars/orchestrator:test-firestore

      - name: OpenAPI document is current
        run: ./tools/nx run @agent-lcars/work:openapi-check

      # This bundle is outside the default build graph, but is what both the
      # telemetry-watcher image and the runner sidecar execute. Keep its
      # isolated startup gate in normal CI now that image publishing is owned
      # by the canonical homelab controller.
      - name: Smoke test telemetry-watcher bundle
        run: ./tools/telemetry-watcher-standalone-smoke.sh

      - name: Stop live CI log stream
        if: always()
        continue-on-error: true
        uses: ./.github/actions/ci-log-stream
        with:
          mode: stop

  # `Verify` is the branch-ruleset check. Required success always means the
  # full gate for this revision actually passed, including while a PR is a
  # draft. A draft success cannot survive readiness as unearned full proof.
  verify:
    name: Verify
    needs: [verify-full, runner-labels, schedules]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full verification
        env:
          VERIFY_FULL_RESULT: ${{ needs.verify-full.result }}
        run: |
          if [ "$VERIFY_FULL_RESULT" != 'success' ]; then
            echo "::error::Full verification concluded '$VERIFY_FULL_RESULT'."
            exit 1
          fi

      - name: Require valid runner label combinations
        env:
          RUNNER_LABELS_RESULT: ${{ needs.runner-labels.result }}
        run: |
          if [ "$RUNNER_LABELS_RESULT" != 'success' ]; then
            echo "::error::Runner label combinations concluded '$RUNNER_LABELS_RESULT'."
            exit 1
          fi

      - name: Require justified schedules
        env:
          SCHEDULES_RESULT: ${{ needs.schedules.result }}
        run: |
          if [ "$SCHEDULES_RESULT" != 'success' ]; then
            echo "::error::Schedule justifications concluded '$SCHEDULES_RESULT'."
            exit 1
          fi

  runner-image-pnpm-store-seed:
    name: Runner image pnpm-store seed
    # The production JIT image intentionally has only a Docker client and no
    # daemon socket. Run this focused container-layer assertion on the hosted
    # runner instead; it needs no secrets and is safe for fork pull requests.
    # It also fetches the real fleet seed through the production stage, so a
    # seed the publisher could not build fails here rather than after merge.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine whether pnpm-store seed is affected
        id: seed-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run=true

          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]]; then
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || \
                 ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "::warning::No usable pnpm-store seed comparison base; running the check."
            elif ! changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"; then
              echo "::warning::Changed-file detection failed; running the pnpm-store seed check."
            # The image and this selector own the immutable seed contract.
            elif ! grep -Eq '^(apps/runner-autoscaler/runner-image/|package\.json$|\.github/workflows/ci\.yml$)' <<<"$changed_files"; then
              run=false
            fi
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [[ "$run" == false ]]; then
            echo "::notice::pnpm-store seed inputs are unaffected; skipping the immutable-seed assertion."
          fi

      - name: Prove immutable pnpm-store seed behavior
        if: steps.seed-scope.outputs.run == 'true'
        run: bash apps/runner-autoscaler/runner-image/pnpm-store-seed.test.sh

  e2e-control-flag:
    name: E2E control flag
    if: ${{ vars.E2E_ENABLED == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: jlapenna/agent-lcars/.github/actions/control-flag@main
        with:
          name: E2E_ENABLED
          lane: required E2E verification
          restore-command: gh variable set E2E_ENABLED --body true

  e2e-scope:
    name: Console E2E selection
    if: ${{ vars.E2E_ENABLED != 'false' }}
    # Selection must finish before reserving the scarce pinned browser pool.
    # This graph/diff query needs no fleet network or runtime credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.e2e-scope.outputs.run }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      # Keep repository-wide CI from exercising the console after unrelated
      # actions/control-plane/docs changes. Nx owns the dependency graph, so
      # changes to console dependencies still select this project; the small
      # explicit list covers E2E harness/workflow files outside that graph.
      # Unknown event shapes or an affected-query failure run the suite rather
      # than silently losing coverage.
      - name: Determine whether console E2E is affected
        id: e2e-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run=false

          if [[ "$EVENT_NAME" != pull_request && "$EVENT_NAME" != push ]]; then
            run=true
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || \
               ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::No usable E2E comparison base; running the suite."
            run=true
          else
            if ! affected_json="$(
              ./tools/nx show projects --affected \
                --base="$BASE_SHA" \
                --head="$HEAD_SHA" \
                --projects='@agent-lcars/console-e2e' \
                --json
            )"; then
              echo "::warning::Nx affected detection failed; running the suite."
              run=true
            elif ! affected_count="$(
              node -e \
                "const fs=require('node:fs'); const projects=JSON.parse(fs.readFileSync(0, 'utf8')); if (!Array.isArray(projects) || projects.some(p => typeof p !== 'string')) process.exit(1); process.stdout.write(String(projects.length))" \
                <<< "$affected_json"
            )"; then
              echo "::warning::Nx affected output was invalid; running the suite."
              run=true
            elif (( affected_count > 0 )); then
              run=true
            elif ! changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"; then
              echo "::warning::Changed-file detection failed; running the suite."
              run=true
            elif grep -E \
              '^(\.github/workflows/ci\.yml|tools/e2e-local\.sh|tools/e2e-docker\.sh|tools/kill-e2e-ports\.sh|tools/e2e/|tools/e2e-runner/)' \
              <<< "$changed_files" >/dev/null; then
              run=true
            fi
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [[ "$run" == false ]]; then
            echo "::notice::Console and its E2E harness are unaffected; skipping browser setup and tests."
          fi

  e2e-browser:
    name: Console E2E browser suite
    needs: e2e-scope
    if: ${{ needs.e2e-scope.outputs.run == 'true' }}
    # The runner IS the pinned sandbox now (agent-lcars#920, mirroring
    # supersprinklesracing/sprinkles' own e2e pool): tools/e2e-runner/
    # Dockerfile derives FROM the published tools/e2e/Dockerfile sandbox
    # plus the JIT runner agent, and jlapenna/homelab's orchestrator.yml
    # pins that image as the lcars-e2e pool's runner_image. That's what lets
    # this job invoke the suite directly below -- no tools/e2e-docker.sh
    # wrapper or host Docker socket.
    #
    # Fork PRs still run on ubuntu-latest via tools/e2e-local.sh -- lcars-e2e
    # is a trusted self-hosted pool, off-limits to untrusted fork code the
    # same way the trusted Verify pool is for `verify` above (see
    # codeql.yml's `analyze` job for the same fork-PR rationale in more
    # detail). Literal 'lcars-e2e', not a vars.* indirection: this job is
    # only correct on a runner whose image IS the pinned sandbox, so
    # nothing should be able to silently redirect it elsewhere (mirrors
    # sprinkles' own e2e.yml `runs-on: [e2e]`).
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'lcars-e2e' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      # The E2E targets are explicitly cache:false, so selected tests always
      # run. Its hermetic wrapper admits only this L2 capability pair to let
      # the deterministic console bundle reuse or warm the remote cache.
      - uses: ./.github/actions/setup-nx-remote-cache
        if: needs.e2e-scope.outputs.run == 'true'
        with:
          url: ${{ vars.NX_CACHE_URL }}
          write-token: ${{ secrets.NX_CACHE_TOKEN }}

      # The trusted JIT runner image bakes OpenJDK 21 for the Firestore
      # emulator. Fork PRs use GitHub-hosted runners, where Java 17 remains
      # the default, so retain setup-java only as that fallback. Kept
      # unconditional (not narrowed to the fork branch) because it already
      # correctly no-ops on lcars-e2e -- the baked marker check below finds
      # nothing to install there either way, and narrowing it would just be
      # two ways to express the same runtime condition.
      - name: Detect Java 21 runtime
        id: java-runtime
        if: needs.e2e-scope.outputs.run == 'true'
        shell: bash
        run: |
          java_major=''
          if command -v java >/dev/null 2>&1; then
            java_major="$(
              java -version 2>&1 |
                sed -nE 's/.*version "([0-9]+).*/\1/p' |
                head -n 1
            )" || java_major=''
          fi
          if [[ "$java_major" =~ ^[0-9]+$ ]] && (( java_major >= 21 )); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: needs.e2e-scope.outputs.run == 'true' && steps.java-runtime.outputs.ready != 'true'
        with:
          distribution: temurin
          java-version: '21'

      # A stale sandbox retains OS dependencies but may lack this lockfile's
      # browser revision. Ask the installed Playwright to launch its exact
      # headless Chromium; checking only a chromium-* directory missed drift.
      - name: Detect matching preinstalled Playwright browser
        id: playwright-deps
        if: needs.e2e-scope.outputs.run == 'true'
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          ready=false
          dependencies_ready=false
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]] && \
            compgen -G "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}/chromium-*" >/dev/null; then
            dependencies_ready=true
            if node --input-type=module -e '
              import { chromium } from "@playwright/test";
              const browser = await chromium.launch({ timeout: 5000 });
              await browser.close();
            ' >/dev/null 2>&1; then
              ready=true
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "dependencies_ready=$dependencies_ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != true ]]; then
            echo "::notice::The matching baked Playwright browser is unavailable; using browser installation."
          fi

      - name: Install Playwright browser from baked dependencies
        if: needs.e2e-scope.outputs.run == 'true' && steps.playwright-deps.outputs.ready != 'true' && steps.playwright-deps.outputs.dependencies_ready == 'true'
        run: pnpm exec playwright install chromium

      - name: Install Playwright browser and dependencies
        if: needs.e2e-scope.outputs.run == 'true' && steps.playwright-deps.outputs.dependencies_ready != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # One e2e entrypoint for every environment (fork ubuntu-latest,
      # trusted lcars-e2e, dev machines): tools/e2e-local.sh. Its `env -i`
      # allowlist is load-bearing on the trusted path too -- a Codex P1/P2
      # pair on #931 flagged that the earlier bespoke direct invocation ran
      # the suite under the runner's full ambient environment (GITHUB_TOKEN
      # included), satisfying the hermetic validator's marker without the
      # isolation the marker asserts. The script's port-fixing and lock are
      # harmless no-ops on a fresh ephemeral container, and its two-phase
      # NEXT_PUBLIC_*/AUTH_SECRET handling replaces the bespoke prepare
      # step this converged away. The sandbox's preinstalled browsers cross
      # the boundary via the PLAYWRIGHT_BROWSERS_PATH carve-out the script
      # forwards when the image sets it.
      # The bounded marker is consumed by the GitHub Actions exporter after
      # this job completes. Keep it on the real suite step so performance
      # telemetry cannot claim a full execution when the browser suite was
      # skipped or never started.
      - name: Run console e2e suite [full-suite]
        if: needs.e2e-scope.outputs.run == 'true'
        run: ./tools/e2e-local.sh

      # Preserve Playwright's HTML report, traces, screenshots, and error
      # context after the ephemeral runner exits. `if: always()` is
      # load-bearing: failures are when these artifacts matter most (#991).
      - name: Upload console e2e diagnostics
        if: always() && needs.e2e-scope.outputs.run == 'true'
        # Diagnostics are ancillary. An artifact-service outage must not turn
        # a fully passing Playwright suite into a red required E2E check
        # (run 34252742315: 93 passed, FinalizeArtifact returned 403).
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-e2e-diagnostics-${{ github.run_attempt }}
          path: apps/console-e2e/test-output/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E
    needs: [e2e-scope, e2e-browser]
    # Missing is enabled; preserve the visible emergency-control exception.
    # always() exposes selection/browser failure rather than skipping a
    # required check because one dependency failed or was cancelled.
    if: ${{ always() && vars.E2E_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful E2E selection and selected browser execution
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.e2e-scope.result }}
          BROWSER_RESULT: ${{ needs.e2e-browser.result }}
          RUN_BROWSER: ${{ needs.e2e-scope.outputs.run }}
        run: |
          set -euo pipefail
          if [[ "$SELECTION_RESULT" != success ]]; then
            echo "::error::Console E2E selection did not succeed ($SELECTION_RESULT)."
            exit 1
          fi
          case "$RUN_BROWSER:$BROWSER_RESULT" in
            true:success)
              echo "Selected console browser suite passed."
              ;;
            false:skipped)
              echo "Console and its E2E harness are unaffected."
              ;;
            *)
              echo "::error::Console E2E result is incomplete (selected=$RUN_BROWSER, browser=$BROWSER_RESULT)."
              exit 1
              ;;
          esac
