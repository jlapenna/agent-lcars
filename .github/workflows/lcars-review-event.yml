name: LCARS review event

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

concurrency:
  group: lcars-review-event-${{ github.event.action == 'synchronize' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  notify:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - run: echo "LCARS review updated"
