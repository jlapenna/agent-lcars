name: LCARS review event

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        closed,
        edited,
        ready_for_review,
        converted_to_draft,
      ]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - run: echo "LCARS review updated"
