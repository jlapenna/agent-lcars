name: LCARS review event

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  notify:
    if: github.event.review.user.login == 'agent-lcars[bot]'
    # Keep GitHub-hosted: pull_request_review loads from the PR merge ref even
    # for forks, so routing this notifier to ARC would expose fleet runners to
    # untrusted fork workflow code (jlapenna/homelab#3284).
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - run: echo "LCARS review updated"
