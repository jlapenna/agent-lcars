name: Agent Bootstrap-Independent Finalizer

# Shared, GitHub-hosted finalizer for claude.yml/codex.yml/opencode.yml
# (#639 / #645 Phase 3). Every worker delegates the authoritative hosted
# callback to this isolated reusable workflow after its untrusted job settles;
# the server verifies this workflow's signed `job_workflow_ref`. If checkout,
# snapshotting, runner loss, or the reporter itself prevents the primary
# post-agent gates from completing, this workflow also parks the task. Worker
# outputs are intentionally absent from this interface: the isolated job
# derives lifecycle evidence from GitHub's job metadata and exact attempt
# markers, then calls the hosted server without checking out worker-controlled
# repository state.
#
# The filename is retained because it is part of the hosted completion OIDC
# trust contract. The workflow is the authoritative completion finalizer, not
# the retired Action router/reconcile fallback. Its additional Claude probe
# keeps the model credential in a distinct read-only job and projects only a
# classified result from a separate secretless job.

on:
  schedule:
    # Recovery probes are admitted only while a Claude lane incident is open,
    # so this cadence does not spend a model turn during healthy operation.
    - cron: '29 * * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      issue:
        required: true
        type: string
      generation:
        required: true
        type: string
      intent-id:
        required: true
        type: string
      dispatch-token:
        required: true
        type: string
      worker-workflow:
        required: true
        type: string
      worker-result:
        required: true
        type: string
      mode:
        required: false
        default: implement
        type: string
      runbook:
        required: false
        default: ''
        type: string
      agent:
        required: true
        type: string
      fleet-login:
        required: true
        type: string
      maintainer:
        required: false
        default: ''
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions: {}

jobs:
  finalize:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    steps:
      - name: Report and park bootstrap-independent failure
        if: inputs.worker-result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          AGENT: ${{ inputs.agent }}
          WORKER_RESULT: ${{ inputs.worker-result }}
          MAINTAINER: ${{ inputs.maintainer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: <!-- agent-lcars:bootstrap-fallback:v1 run=${{ github.run_id }} -->
        run: |
          set -euo pipefail
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::Invalid fallback issue number"; exit 1 ;;
          esac

          existing="$(gh api --paginate --slurp \
            "repos/$REPO/issues/$ISSUE/comments?per_page=100" \
            --jq "[.[][] | select(.body | contains(\"$MARKER\"))] | first | .id // empty")"
          if [ -z "$existing" ]; then
            if [ "$WORKER_RESULT" = "cancelled" ]; then
              outcome="was cancelled"
            else
              outcome="ended with GitHub job result '$WORKER_RESULT'"
            fi
            gh issue comment "$ISSUE" --repo "$REPO" --body "$MARKER

          $AGENT agent run $outcome: $RUN_URL

          The independent GitHub-hosted finalizer safely repeats failure parking for every non-success worker result. The primary self-hosted reporter may already have completed; the marker keeps this fallback idempotent."
          else
            echo "::notice::Fallback report already exists as comment $existing"
          fi

          jq -cn '{labels: ["status:needs-human"]}' |
            gh api "repos/$REPO/issues/$ISSUE/labels" \
              --method POST --input - >/dev/null
          if [ -n "$MAINTAINER" ]; then
            jq -cn --arg login "$MAINTAINER" '{assignees: [$login]}' |
              gh api "repos/$REPO/issues/$ISSUE/assignees" \
                --method POST --input - >/dev/null
          else
            echo "::warning::MAINTAINER_LOGIN is unset; failure was commented and parked but could not be assigned."
          fi

      - name: Derive trusted completion evidence
        id: evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          GENERATION: ${{ inputs.generation }}
          INTENT_ID: ${{ inputs.intent-id }}
          WORKER_WORKFLOW: ${{ inputs.worker-workflow }}
          WORKER_RESULT: ${{ inputs.worker-result }}
          MODE: ${{ inputs.mode }}
          RUNBOOK: ${{ inputs.runbook }}
        run: |
          set -euo pipefail
          case "$ISSUE:$GENERATION" in
            *[!0-9:]*|:*|*:|*:*:*)
              echo "::error::Invalid completion issue or generation"
              exit 1
              ;;
          esac
          case "$WORKER_WORKFLOW" in
            claude.yml)
              agent_step='Run Claude Code'
              expected_comment_login='claude[bot]'
              exclude_pr_author='agent-lcars[bot]'
              ;;
            codex.yml)
              agent_step='Run Codex'
              expected_comment_login='agent-lcars[bot]'
              exclude_pr_author='claude[bot]'
              ;;
            opencode.yml)
              agent_step='Run OpenCode'
              expected_comment_login='agent-lcars[bot]'
              exclude_pr_author='claude[bot]'
              ;;
            agent-dispatch-canary.yml)
              agent_step='Verify the exact canary artifact through the outcome finalizer'
              expected_comment_login='github-actions[bot]'
              exclude_pr_author=''
              ;;
            *)
              echo "::error::Unsupported worker workflow"
              exit 1
              ;;
          esac

          jobs_file="$(mktemp)"
          trap 'rm -f "$jobs_file"' EXIT
          if ! gh api --paginate --slurp \
            "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$jobs_file"; then
            echo "::warning::Could not read trusted worker job metadata"
          fi
          worker_job="$(jq -c --arg step "$agent_step" \
            '[.[]?.jobs[]? | select(any(.steps[]?; .name == $step))] | last // empty' \
            "$jobs_file")"

          readiness_failure=''
          if [ -n "$worker_job" ]; then
            if [ "$WORKER_WORKFLOW" = 'codex.yml' ]; then
              credential_failure="$(jq -r '
                [ .steps[]?
                  | select(.name == "Authenticate to GCP for the subscription credential"
                      or .name == "Restore subscription authentication")
                  | select(.conclusion == "failure")
                ] | length' <<<"$worker_job")"
              if [ "$credential_failure" -gt 0 ]; then
                readiness_failure='credential'
              fi
            fi
          fi

          # Claude's structured execution file lives in the untrusted worker
          # filesystem. A later GitHub step conclusion cannot make evidence
          # derived from those bytes authoritative: the worker can rewrite the
          # file after returning. Until Claude readiness has a distinct probe
          # unavailable to the worker, omit that signal at this trust boundary.

          if [ "$WORKER_RESULT" != 'success' ]; then
            if [ -z "$worker_job" ]; then
              echo "::warning::Omitting unverified lifecycle outcome"
              exit 0
            fi
            agent_conclusion="$(jq -r --arg step "$agent_step" \
              '[.steps[]? | select(.name == $step)] | last | .conclusion // ""' \
              <<<"$worker_job")"
            case "$agent_conclusion" in
              ''|skipped) outcome_kind='startup-failure' ;;
              success)
                post_gate_conclusion="$(jq -r \
                  '[.steps[]? | select(.name == "Run post-agent gates")] | last | .conclusion // ""' \
                  <<<"$worker_job")"
                if [ "$post_gate_conclusion" = 'failure' ]; then
                  outcome_kind='outcome-gate-failure'
                else
                  outcome_kind='trajectory-failure'
                fi
                ;;
              failure)
                if [ "$WORKER_WORKFLOW" = 'agent-dispatch-canary.yml' ]; then
                  outcome_kind='outcome-gate-failure'
                else
                  outcome_kind='trajectory-failure'
                fi
                ;;
              *) outcome_kind='trajectory-failure' ;;
            esac
            printf 'outcome-kind=%s\n' "$outcome_kind" >> "$GITHUB_OUTPUT"
            if [ -n "$readiness_failure" ]; then
              printf 'readiness-failure=%s\n' "$readiness_failure" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          attempt_id="g${GENERATION}:${INTENT_ID}"
          claim_marker="<!-- attempt-claim:${attempt_id} -->"
          outcome_kind=''
          outcome_reference=''

          if pr_json="$(gh api --paginate --slurp \
            "repos/$REPO/pulls?state=all&per_page=100")"; then
            pr_hits="$(jq -r --arg marker "$claim_marker" \
              '.[][] | select((((.title // "") + "\n" + (.body // "")) | contains($marker))) | .number' \
              <<<"$pr_json")"
            if [ -n "$pr_hits" ]; then
              outcome_kind='pull-request'
              if [[ "$pr_hits" != *$'\n'* ]]; then
                outcome_reference="$pr_hits"
              fi
            fi
          else
            echo "::warning::Could not verify exact pull-request outcome"
          fi

          if [ -z "$outcome_kind" ]; then
            if comments_json="$(gh api --paginate --slurp \
              "repos/$REPO/issues/$ISSUE/comments?per_page=100")"; then
              comment_hits="$(jq -r --arg marker "$claim_marker" \
                '.[][] | select((.body // "") | contains($marker)) | .id' \
                <<<"$comments_json")"
              if [ -n "$comment_hits" ]; then
                outcome_kind='comment'
                no_op_hits="$(jq -r --arg marker "$claim_marker" \
                  '.[][] | select(((.body // "") | contains($marker)) and ((.body // "") | contains("<!-- agent-result:v1:no-op -->"))) | .id' \
                  <<<"$comments_json")"
                if [ -n "$no_op_hits" ]; then
                  outcome_kind='no-op'
                fi
              fi
            else
              echo "::warning::Could not verify exact comment outcome"
            fi
          fi

          if [ -z "$outcome_kind" ]; then
            if issue_json="$(gh api "repos/$REPO/issues/$ISSUE")" && \
              jq -e '.pull_request != null' >/dev/null <<<"$issue_json"; then
              if reviews_json="$(gh api --paginate --slurp \
                "repos/$REPO/pulls/$ISSUE/reviews?per_page=100")"; then
                review_hits="$(jq -r --arg marker "$claim_marker" \
                  '.[][] | select((.body // "") | contains($marker)) | .id' \
                  <<<"$reviews_json")"
                if [ -n "$review_hits" ]; then
                  outcome_kind='review'
                fi
              else
                echo "::warning::Could not verify exact review outcome"
              fi
            fi
          fi

          # The trusted worker gate still permits five inference paths while
          # exact attempt-marker adoption soaks. Re-derive those outcomes
          # from immutable GitHub step timing and current GitHub artifacts;
          # never accept the worker's own output file across this boundary.
          started_at="$(jq -r --arg step "$agent_step" \
            '[.steps[]? | select(.name == $step)] | last | .started_at // ""' \
            <<<"$worker_job")"
          if [ -z "$outcome_kind" ] && \
            [ "$WORKER_WORKFLOW" != 'agent-dispatch-canary.yml' ] && \
            [ -n "$started_at" ]; then
            if inference_pr_json="$(gh api \
              "repos/$REPO/pulls?state=all&sort=updated&direction=desc&per_page=50")"; then
              matching_prs="$(jq -c \
                --arg started "$started_at" --arg num "$ISSUE" \
                --arg exclude "$exclude_pr_author" --arg mode "$MODE" \
                --arg expected "$expected_comment_login" '
                  ($exclude | split(",") | map(select(length > 0))) as $excluded
                  | [.[] | .user.login as $author
                      | (.number == ($num | tonumber)) as $is_anchor
                      | select(.updated_at >= $started)
                      | select($mode == "reply" or ($excluded | index($author)) == null)
                      | select($mode == "reply" or $is_anchor or $author == $expected)
                      | select(
                          (((.title // "") + " " + (.body // ""))
                            | test("#" + $num + "([^0-9]|$)"))
                          or $is_anchor
                        )]
                  | map(.number)' <<<"$inference_pr_json")"
              matching_pr_count="$(jq -r 'length' <<<"$matching_prs")"
              if [ "$matching_pr_count" -gt 0 ]; then
                outcome_kind='pull-request'
                if [ "$matching_pr_count" -eq 1 ]; then
                  outcome_reference="$(jq -r '.[0]' <<<"$matching_prs")"
                fi
              fi
            else
              echo "::warning::Could not verify inferred pull-request outcome"
            fi
          fi

          needs_human_now='false'
          if [ -z "$outcome_kind" ] && [ -n "$started_at" ]; then
            if inference_issue_json="$(gh api "repos/$REPO/issues/$ISSUE")"; then
              closed_at="$(jq -r \
                'if .state == "closed" then (.closed_at // "") else "" end' \
                <<<"$inference_issue_json")"
              if [ -n "$closed_at" ] && [[ "$closed_at" > "$started_at" ]]; then
                outcome_kind='closed'
              fi
              needs_human_now="$(jq -r \
                '[.labels[].name] | contains(["status:needs-human"])' \
                <<<"$inference_issue_json")"
            else
              echo "::warning::Could not verify inferred issue outcome"
            fi
          fi

          if [ -z "$outcome_kind" ] && [ "$needs_human_now" = 'true' ] && \
            [ -n "$started_at" ]; then
            if timeline_hits="$(gh api --paginate \
              "repos/$REPO/issues/$ISSUE/timeline?per_page=100" \
              --jq ".[] | select(.event == \"labeled\" and (.label.name // \"\") == \"status:needs-human\" and .created_at >= \"$started_at\") | .created_at")"; then
              if [ -n "$timeline_hits" ]; then
                outcome_kind='park'
              fi
            else
              echo "::warning::Could not verify inferred park outcome"
            fi
          fi

          if [ -z "$outcome_kind" ] && [ -n "$started_at" ] && \
            { [ "$MODE" = 'reply' ] || [ -n "$RUNBOOK" ]; }; then
            if inference_comments_json="$(gh api --paginate --slurp \
              "repos/$REPO/issues/$ISSUE/comments?since=$started_at&per_page=100")"; then
              comment_count="$(jq -r --arg login "$expected_comment_login" \
                '[.[][] | select(.user.login == $login)] | length' \
                <<<"$inference_comments_json")"
              if [ "$comment_count" -gt 0 ]; then
                outcome_kind='comment'
              fi
            else
              echo "::warning::Could not verify inferred comment outcome"
            fi
          fi

          if [ -z "$outcome_kind" ] && [ "$MODE" = 'review' ] && \
            [ -n "$started_at" ]; then
            if inference_reviews_json="$(gh api --paginate --slurp \
              "repos/$REPO/pulls/$ISSUE/reviews?per_page=100")"; then
              review_count="$(jq -r --arg login "$expected_comment_login" \
                --arg started "$started_at" '
                  [.[][] | select(.user.login == $login)
                    | select(.submitted_at >= $started)] | length' \
                <<<"$inference_reviews_json")"
              if [ "$review_count" -gt 0 ]; then
                outcome_kind='review'
              fi
            else
              echo "::warning::Could not verify inferred review outcome"
            fi
          fi

          if [ "$WORKER_WORKFLOW" = 'agent-dispatch-canary.yml' ] && \
            [ "$outcome_kind" != 'comment' ]; then
            echo "::error::Successful dispatch canary lacks its exact comment outcome"
            printf '%s\n' 'outcome-kind=outcome-gate-failure' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          printf 'outcome-kind=%s\n' "${outcome_kind:-unknown-success}" >> "$GITHUB_OUTPUT"
          if [ -n "$outcome_reference" ]; then
            printf 'outcome-reference=%s\n' "$outcome_reference" >> "$GITHUB_OUTPUT"
          fi

      - name: Return completion observation to the broker
        id: callback
        if: always()
        env:
          ISSUE: ${{ inputs.issue }}
          GENERATION: ${{ inputs.generation }}
          INTENT_ID: ${{ inputs.intent-id }}
          DISPATCH_TOKEN: ${{ inputs.dispatch-token }}
          WORKER_WORKFLOW: ${{ inputs.worker-workflow }}
          OUTCOME_KIND: ${{ steps.evidence.outputs.outcome-kind }}
          OUTCOME_REFERENCE: ${{ steps.evidence.outputs.outcome-reference }}
          READINESS_FAILURE: ${{ steps.evidence.outputs.readiness-failure }}
          COMPLETION_URL: https://agent-console.supersprinkles.racing/api/control-plane/completion
          OIDC_AUDIENCE: agent-lcars-dispatch-completion
        run: |
          set -euo pipefail
          set +x
          payload_file="$(mktemp)"
          oidc_response_file="$(mktemp)"
          completion_response_file="$(mktemp)"
          trap 'rm -f "$payload_file" "$oidc_response_file" "$completion_response_file"' EXIT

          jq -cn '
            {
              issue: (env.ISSUE | tonumber),
              generation: (env.GENERATION | tonumber),
              intentId: env.INTENT_ID,
              token: env.DISPATCH_TOKEN,
              workflow: env.WORKER_WORKFLOW
            }
            + (if env.OUTCOME_KIND != "" then {outcome: env.OUTCOME_KIND} else {} end)
            + (if env.OUTCOME_REFERENCE != "" then {
                outcomeReference: {
                  kind: "pull-request",
                  number: (env.OUTCOME_REFERENCE | tonumber)
                }
              } else {} end)
            + (if env.READINESS_FAILURE != "" then {
                readinessFailure: env.READINESS_FAILURE
              } else {} end)
          ' > "$payload_file"

          oidc_url="$(node -e '
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set("audience", process.env.OIDC_AUDIENCE);
            process.stdout.write(url.toString());
          ')"
          oidc_status='000'
          for attempt in 1 2 3; do
            if oidc_status="$(curl --silent --show-error \
              --output "$oidc_response_file" --write-out '%{http_code}' \
              --config - <<EOF
          url = "$oidc_url"
          request = "GET"
          connect-timeout = 5
          max-time = 15
          header = "Accept: application/json"
          header = "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          EOF
            )" && [[ "$oidc_status" == 2?? ]]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$attempt"; fi
          done
          if [[ "$oidc_status" != 2?? ]]; then
            echo "::error::GitHub OIDC token request failed with HTTP $oidc_status"
            exit 1
          fi
          id_token="$(jq -er '.value | select(type == "string" and length > 0)' \
            "$oidc_response_file")"

          completion_status='000'
          for attempt in 1 2 3; do
            if completion_status="$(curl --silent --show-error \
              --output "$completion_response_file" --write-out '%{http_code}' \
              --config - <<EOF
          url = "$COMPLETION_URL"
          request = "POST"
          connect-timeout = 5
          max-time = 15
          header = "Accept: application/json"
          header = "Authorization: Bearer $id_token"
          header = "Content-Type: application/json"
          data-binary = "@$payload_file"
          EOF
            )" && [[ "$completion_status" == 2?? ]]; then
              break
            fi
            case "$completion_status" in
              408|429|5??|000) ;;
              *)
                echo "::error::Hosted completion rejected with HTTP $completion_status"
                exit 1
                ;;
            esac
            if [ "$attempt" -lt 3 ]; then sleep "$attempt"; fi
          done
          unset id_token
          if [[ "$completion_status" != 2?? ]]; then
            echo "::error::Hosted completion failed with HTTP $completion_status"
            exit 1
          fi
          printf '%s\n' 'completion-sent=true' >> "$GITHUB_OUTPUT"

      - name: Preserve failed callback for scheduled reconciliation
        if: always() && steps.callback.outputs.completion-sent != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          FLEET_LOGIN: ${{ inputs.fleet-login }}
        run: |
          set -euo pipefail
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::Invalid fallback issue number"; exit 1 ;;
          esac
          if [ -z "$FLEET_LOGIN" ]; then
            echo "::error::Fleet login is required for callback reconciliation"
            exit 1
          fi

          payload_file="$(mktemp)"
          trap 'rm -f "$payload_file"' EXIT
          jq -cn --arg login "$FLEET_LOGIN" '{assignees: [$login]}' > "$payload_file"
          for attempt in 1 2 3; do
            if timeout 15s gh api "repos/$REPO/issues/$ISSUE/assignees" \
              --method POST --input "$payload_file" >/dev/null; then
              echo "::notice::Preserved callback failure for the fleet-assignee reconcile sweep"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$attempt"; fi
          done
          echo "::error::Could not preserve callback failure for scheduled reconciliation"
          exit 1

  claude-probe-admission:
    if: >-
      github.event_name != 'workflow_call' ||
      (inputs.worker-workflow == 'claude.yml' && inputs.worker-result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: read
    outputs:
      should-probe: ${{ steps.admit.outputs.should-probe }}
    steps:
      - name: Admit only a failed Claude worker or an open lane incident
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKER_WORKFLOW: ${{ inputs.worker-workflow }}
          WORKER_RESULT: ${{ inputs.worker-result }}
          MARKER: '<!-- agent-lcars:lane-readiness:v1:claude -->'
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_call' ] && \
            [ "$WORKER_WORKFLOW" = 'claude.yml' ] && \
            [ "$WORKER_RESULT" != 'success' ]; then
            echo 'should-probe=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_incidents="$(gh api --paginate --slurp \
            "repos/$REPO/issues?state=open&per_page=100" | \
            jq --arg marker "$MARKER" \
              '[.[][] | select(.pull_request == null) | select((.body // "") | contains($marker))] | length')"
          if [ "$open_incidents" -gt 0 ]; then
            echo 'should-probe=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should-probe=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Claude readiness probe skipped: no open lane incident'
          fi

  claude-probe:
    needs: claude-probe-admission
    if: needs.claude-probe-admission.outputs.should-probe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: claude-readiness-probe-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      readiness-state: ${{ steps.classify.outputs.readiness-state }}
    steps:
      - name: Prepare isolated probe workspace
        run: mkdir -p "$RUNNER_TEMP/claude-readiness-probe"

      - name: Run one isolated Claude harness turn
        id: probe
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@c038e4dcdedfbbca18dfb17df35a17e40ded4ddc # v1.0.186
        env:
          CLAUDE_WORKING_DIR: ${{ runner.temp }}/claude-readiness-probe
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Reply with exactly READY. Do not inspect files or use tools.'
          claude_args: >-
            --max-turns 1
            --setting-sources user
            --tools ""
            --disable-slash-commands

      - name: Checkout trusted classifier revision
        if: always()
        uses: actions/checkout@v7

      - name: Classify isolated Claude readiness
        id: classify
        if: always()
        uses: ./.github/actions/dispatch-broker
        with:
          operation: classify-claude-readiness
          execution-file: ${{ steps.probe.outputs.execution_file }}
          probe-conclusion: ${{ steps.probe.outcome }}

      - name: Fail closed on unknown probe evidence
        if: always() && steps.classify.outputs.readiness-state == 'unknown'
        run: |
          echo '::error::Claude readiness evidence was missing, malformed, or contradictory'
          exit 1

  claude-probe-project:
    needs: claude-probe
    if: >-
      always() &&
      (needs.claude-probe.outputs.readiness-state == 'credential-failure' ||
       needs.claude-probe.outputs.readiness-state == 'healthy')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted projection revision
        uses: actions/checkout@v7

      - name: Project trusted Claude readiness
        uses: ./.github/actions/dispatch-broker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAINTAINER_LOGIN: ${{ vars.MAINTAINER_LOGIN }}
        with:
          operation: claude-readiness
          readiness-state: ${{ needs.claude-probe.outputs.readiness-state }}
          evidence-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
