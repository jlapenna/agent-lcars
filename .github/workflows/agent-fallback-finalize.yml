name: Agent Bootstrap-Independent Finalizer

# Shared, GitHub-hosted finalizer for claude.yml/codex.yml/opencode.yml
# (#639 / #645 Phase 3). Every worker delegates the authoritative hosted
# callback to this isolated reusable workflow after its untrusted job settles;
# the server verifies this workflow's signed `job_workflow_ref`. This runs
# regardless of checkout, snapshotting, or runner loss on the worker's own
# job -- it is a separate job/workflow with no dependency on worker-side
# state. Worker outputs are intentionally absent from this interface: the
# isolated job derives lifecycle evidence from GitHub's job metadata and
# exact attempt markers, then calls the hosted server without checking out
# worker-controlled repository state.
#
# #813 centralized failure reporting: the orchestrator (libs/orchestrator,
# driven through apps/console's /api/control-plane/completion route -- see
# apps/console/src/lib/orchestrator-dispatch.ts) is now the primary writer
# of the outcome comment, driven by this workflow's own completion callback
# below ("Return completion observation to the broker"). This workflow's own
# direct GitHub write ("Report and park bootstrap-independent failure") is
# the minimum bootstrap-safe fallback: it fires ONLY when that callback
# itself could not reach the hosted control plane, not on every non-success
# worker result. (Before #1015 Wave 4's cutover, the callback's authoritative
# writer was the legacy dispatch controller's projector,
# apps/dispatch-broker/src/modules/projector.ts's projectWorkerFailure --
# retired along with the rest of the legacy admission/completion/reconcile
# decision loop it drove.)
#
# The filename is retained because it is part of the hosted completion OIDC
# trust contract. The workflow is the authoritative completion finalizer, not
# the retired Action router/reconcile fallback. Its former Claude-lane-
# readiness probe (an isolated read-only job that classified a Claude
# failure as infra-vs-agent via .github/actions/dispatch-broker) was deleted
# in #1015 Wave 4 along with that action; the probe's own purpose was
# exactly the kind of legacy decision loop that Wave 4 retires.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      issue:
        required: false
        default: ''
        type: string
      work:
        description: 'Native work item JSON: {id, spec} for a work-anchored dispatch, or {spec} merged onto issue context for a GitHub anchor (see prepare-agent-dispatch/action.yml)'
        required: false
        default: ''
        type: string
      generation:
        required: true
        type: string
      intent-id:
        required: true
        type: string
      dispatch-token:
        required: true
        type: string
      worker-workflow:
        required: true
        type: string
      worker-result:
        required: true
        type: string
      agent:
        required: true
        type: string
      fleet-login:
        required: true
        type: string
      maintainer:
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  finalize:
    # A reusable workflow inherits the caller's event name: workers are
    # dispatched by workflow_dispatch, so checking for workflow_call here
    # skips the authoritative completion callback in production. Call
    # inputs `issue`/`work` are populated only for the reusable-worker
    # path and remain empty for this workflow's own manual
    # workflow_dispatch entry point. A native run carries `work` with no
    # `issue`; either anchor admits the job.
    if: inputs.issue != '' || inputs.work != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    steps:
      - name: Derive trusted completion evidence
        id: evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          WORK: ${{ inputs.work }}
          GENERATION: ${{ inputs.generation }}
          INTENT_ID: ${{ inputs.intent-id }}
          WORKER_WORKFLOW: ${{ inputs.worker-workflow }}
          WORKER_RESULT: ${{ inputs.worker-result }}
        run: |
          set -euo pipefail
          # GENERATION is validated unconditionally -- an issue-anchored
          # and a native run both carry it, and both need it trustworthy
          # for the `g${GENERATION}:${INTENT_ID}` attempt id built below.
          case "$GENERATION" in
            ''|*[!0-9]*)
              echo "::error::Invalid completion generation"
              exit 1
              ;;
          esac
          # A native run carries WORK with no ISSUE -- the same
          # generation/intentId identity that gates an issue-anchored
          # completion is still validated for it separately (the
          # dispatch token check downstream), so only the issue-shaped
          # half of this check applies when there is an issue to check.
          if [ -z "$ISSUE" ] && [ -n "$WORK" ]; then
            :
          else
            case "$ISSUE" in
              ''|*[!0-9]*)
                echo "::error::Invalid completion issue"
                exit 1
                ;;
            esac
          fi
          # Each lane's agent step name(s), as a JSON array of candidates.
          # The worker job is identified by these STEP names, never by its
          # job id or display name: since #1340 A-R1 the worker job lives
          # in the single parameterized agent-lane.yml (job id `agent`,
          # jobs-API name "<caller job> / <shim job> / agent" through the
          # nested reusable calls), and every pipeline's agent steps exist
          # in that one job with the inactive pipelines' steps reported as
          # conclusion 'skipped'. The jq below already handles skipped
          # candidates: the opencode lane is era-split — the
          # dispatch-bootstrap era runs 'Run OpenCode' while the consumer
          # era runs 'Run OpenCode (CLI)' — and whichever era ran, the
          # OTHER step still appears in the jobs API with conclusion
          # 'skipped'. Matching only 'Run OpenCode' therefore resolved
          # every consumer-era run's agent conclusion to 'skipped' and
          # misclassified real agent failures as startup-failure; the
          # skipped sibling-pipeline steps of the unified lane ride the
          # same non-skipped-candidate preference.
          case "$WORKER_WORKFLOW" in
            claude.yml) agent_steps='["Run Claude Code"]' ;;
            codex.yml) agent_steps='["Run Codex"]' ;;
            opencode.yml) agent_steps='["Run OpenCode","Run OpenCode (CLI)"]' ;;
            *)
              echo "::error::Unsupported worker workflow"
              exit 1
              ;;
          esac

          jobs_file="$(mktemp)"
          trap 'rm -f "$jobs_file"' EXIT
          if ! gh api --paginate --slurp \
            "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$jobs_file"; then
            echo "::warning::Could not read trusted worker job metadata"
          fi
          worker_job="$(jq -c --argjson steps "$agent_steps" \
            '[.[]?.jobs[]? | select(any(.steps[]?; .name as $n | $steps | index($n)))] | last // empty' \
            "$jobs_file")"

          if [ "$WORKER_RESULT" != 'success' ]; then
            if [ -z "$worker_job" ]; then
              echo "::warning::Omitting unverified lifecycle outcome"
              exit 0
            fi
            # Among the candidate step names, prefer the one that actually
            # ran: skipped candidates are the inactive era's step, not
            # evidence. Only when EVERY candidate is skipped does 'skipped'
            # win — the agent never started, which IS a startup failure.
            agent_conclusion="$(jq -r --argjson steps "$agent_steps" \
              '[.steps[]? | select(.name as $n | $steps | index($n))]
               | ((map(select(.conclusion != "skipped")) | last) // last)
               | .conclusion // ""' \
              <<<"$worker_job")"
            case "$agent_conclusion" in
              ''|skipped) outcome_kind='startup-failure' ;;
              success)
                post_gate_conclusion="$(jq -r \
                  '[.steps[]? | select(.name == "Run post-agent gates")] | last | .conclusion // ""' \
                  <<<"$worker_job")"
                if [ "$post_gate_conclusion" = 'failure' ]; then
                  outcome_kind='outcome-gate-failure'
                else
                  outcome_kind='trajectory-failure'
                fi
                ;;
              failure)
                outcome_kind='trajectory-failure'
                ;;
              *) outcome_kind='trajectory-failure' ;;
            esac
            printf 'outcome-kind=%s\n' "$outcome_kind" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          attempt_id="g${GENERATION}:${INTENT_ID}"
          claim_marker="<!-- attempt-claim:${attempt_id} -->"
          outcome_kind=''
          outcome_reference=''

          if pr_json="$(gh api --paginate --slurp \
            "repos/$REPO/pulls?state=all&per_page=100")"; then
            pr_hits="$(jq -r --arg marker "$claim_marker" \
              '.[][] | select((((.title // "") + "\n" + (.body // "")) | contains($marker))) | .number' \
              <<<"$pr_json")"
            if [ -n "$pr_hits" ]; then
              outcome_kind='pull-request'
              if [[ "$pr_hits" != *$'\n'* ]]; then
                outcome_reference="$pr_hits"
              fi
            fi
          else
            echo "::warning::Could not verify exact pull-request outcome"
          fi

          # A native run has no ISSUE, so there is no comment/review
          # thread to read -- the PR-marker lookup above is the whole
          # evidence surface for it. Deliberately NOT gated on
          # `-z "$outcome_kind"` the way the no-op/comment classification
          # below still is: an explicit park must be checked regardless of
          # what the PR lookup above already found, and must win when
          # present (Codex review on jlapenna/agent-lcars#1564). A run
          # that opens a PR and only then discovers a blocker stamps the
          # SAME attempt-claim marker on both the PR and its structured
          # park comment; skipping this lookup once outcome_kind was
          # already 'pull-request' silently turned a run that explicitly
          # said "I am blocked" into a reported success, with
          # status:needs-human never applied and the operator never
          # pointed at the blocker -- the exact silent-failure shape this
          # whole marker-stamping mechanism exists to eliminate, one level
          # up. no-op and the plain-comment classification stay gated on
          # `-z "$outcome_kind"`: unlike park, a no-op run is
          # protocol-defined to never open a PR in the same run (nothing
          # needed doing, so there is nothing to push -- agent-protocol.md
          # #6's push-early discipline is implement-mode only), so an
          # earlier PR find silently winning there is not a realistic
          # scenario, let alone one that hides a blocker.
          if [ -n "$ISSUE" ]; then
            if comments_json="$(gh api --paginate --slurp \
              "repos/$REPO/issues/$ISSUE/comments?per_page=100")"; then
              park_hits="$(jq -r --arg marker "$claim_marker" \
                '.[][] | select(((.body // "") | contains($marker)) and ((.body // "") | contains("<!-- agent-result:v1:park -->"))) | .id' \
                <<<"$comments_json")"
              if [ -n "$park_hits" ]; then
                # agent-protocol.md #4's issue-anchor park path: a
                # structured, marker-stamped comment IS the deliverable,
                # same shape as no-op below, but this run still needs a
                # human, so it is kept distinct rather than folded into
                # 'comment' -- see toRunResult/needsHumanLabel in
                # apps/console/src/lib/orchestrator-dispatch.ts and
                # orchestrator-routes.ts, which key off this exact string
                # to still flag the issue even though the run succeeded.
                # outcome_reference (a same-run PR number, if the PR
                # lookup above found one) is deliberately left set here,
                # not cleared: the completion payload still carries it
                # alongside outcome=park, and the console links the
                # half-finished PR next to the "parked" note instead of
                # hiding it.
                outcome_kind='park'
              elif [ -z "$outcome_kind" ]; then
                comment_hits="$(jq -r --arg marker "$claim_marker" \
                  '.[][] | select((.body // "") | contains($marker)) | .id' \
                  <<<"$comments_json")"
                if [ -n "$comment_hits" ]; then
                  outcome_kind='comment'
                  no_op_hits="$(jq -r --arg marker "$claim_marker" \
                    '.[][] | select(((.body // "") | contains($marker)) and ((.body // "") | contains("<!-- agent-result:v1:no-op -->"))) | .id' \
                    <<<"$comments_json")"
                  if [ -n "$no_op_hits" ]; then
                    outcome_kind='no-op'
                  fi
                fi
              fi
            else
              echo "::warning::Could not verify exact comment outcome"
            fi
          fi

          if [ -z "$outcome_kind" ] && [ -n "$ISSUE" ]; then
            if issue_json="$(gh api "repos/$REPO/issues/$ISSUE")" && \
              jq -e '.pull_request != null' >/dev/null <<<"$issue_json"; then
              if reviews_json="$(gh api --paginate --slurp \
                "repos/$REPO/pulls/$ISSUE/reviews?per_page=100")"; then
                review_hits="$(jq -r --arg marker "$claim_marker" \
                  '.[][] | select((.body // "") | contains($marker)) | .id' \
                  <<<"$reviews_json")"
                if [ -n "$review_hits" ]; then
                  outcome_kind='review'
                fi
              else
                echo "::warning::Could not verify exact review outcome"
              fi
            fi
          fi

          # WORKER_RESULT is 'success', which means the trusted worker gate
          # (verify-deliverable.sh) already required an exact attempt-claim
          # marker on a durable artifact before it let the job succeed
          # (#815 retired the five inference clauses this step used to
          # re-derive here as a fallback). If none of the three exact
          # lookups above found it - e.g. transient read-after-write lag on
          # the GitHub API this isolated job hit independently of the
          # worker - fall back to the unknown-success classification below
          # rather than re-inferring an outcome from a time window and a
          # shared bot login.
          printf 'outcome-kind=%s\n' "${outcome_kind:-unknown-success}" >> "$GITHUB_OUTPUT"
          if [ -n "$outcome_reference" ]; then
            printf 'outcome-reference=%s\n' "$outcome_reference" >> "$GITHUB_OUTPUT"
          fi

      - name: Return completion observation to the broker
        id: callback
        if: always()
        env:
          ISSUE: ${{ inputs.issue }}
          GENERATION: ${{ inputs.generation }}
          INTENT_ID: ${{ inputs.intent-id }}
          DISPATCH_TOKEN: ${{ inputs.dispatch-token }}
          WORKER_WORKFLOW: ${{ inputs.worker-workflow }}
          OUTCOME_KIND: ${{ steps.evidence.outputs.outcome-kind }}
          OUTCOME_REFERENCE: ${{ steps.evidence.outputs.outcome-reference }}
          COMPLETION_URL: https://lcars.jlapenna.net/api/control-plane/completion
          OIDC_AUDIENCE: agent-lcars-dispatch-completion
        run: |
          set -euo pipefail
          set +x
          payload_file="$(mktemp)"
          oidc_response_file="$(mktemp)"
          completion_response_file="$(mktemp)"
          trap 'rm -f "$payload_file" "$oidc_response_file" "$completion_response_file"' EXIT

          jq -cn '
            (if env.ISSUE != "" then {issue: (env.ISSUE | tonumber)} else {} end)
            + {
              generation: (env.GENERATION | tonumber),
              intentId: env.INTENT_ID,
              token: env.DISPATCH_TOKEN,
              workflow: env.WORKER_WORKFLOW
            }
            + (if env.OUTCOME_KIND != "" then {outcome: env.OUTCOME_KIND} else {} end)
            + (if env.OUTCOME_REFERENCE != "" then {
                outcomeReference: {
                  kind: "pull-request",
                  number: (env.OUTCOME_REFERENCE | tonumber)
                }
              } else {} end)
          ' > "$payload_file"

          oidc_url="$(node -e '
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set("audience", process.env.OIDC_AUDIENCE);
            process.stdout.write(url.toString());
          ')"
          oidc_status='000'
          for attempt in 1 2 3; do
            if oidc_status="$(curl --silent --show-error \
              --output "$oidc_response_file" --write-out '%{http_code}' \
              --config - <<EOF
          url = "$oidc_url"
          request = "GET"
          connect-timeout = 5
          max-time = 15
          header = "Accept: application/json"
          header = "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          EOF
            )" && [[ "$oidc_status" == 2?? ]]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$attempt"; fi
          done
          if [[ "$oidc_status" != 2?? ]]; then
            echo "::error::GitHub OIDC token request failed with HTTP $oidc_status"
            exit 1
          fi
          id_token="$(jq -er '.value | select(type == "string" and length > 0)' \
            "$oidc_response_file")"

          completion_status='000'
          for attempt in 1 2 3 4; do
            if completion_status="$(curl --silent --show-error \
              --output "$completion_response_file" --write-out '%{http_code}' \
              --config - <<EOF
          url = "$COMPLETION_URL"
          request = "POST"
          connect-timeout = 5
          max-time = 15
          header = "Accept: application/json"
          header = "Authorization: Bearer $id_token"
          header = "Content-Type: application/json"
          data-binary = "@$payload_file"
          EOF
            )" && [[ "$completion_status" == 2?? ]]; then
              break
            fi
            case "$completion_status" in
              408|429|5??|000) ;;
              *)
                echo "::error::Hosted completion rejected with HTTP $completion_status"
                exit 1
                ;;
            esac
            if [ "$attempt" -lt 4 ]; then
              if [[ "$completion_status" == 503 ]]; then
                # #1521: binding is fail-closed (see run-binding.ts) -- a
                # 503 means GitHub itself was unreachable when the console
                # tried to prove this token, not that the completion was
                # rejected. Worth a longer wait than the other retryable
                # codes get.
                echo "::notice::Hosted completion unavailable (503); retrying in $((attempt * 15))s"
                sleep $((attempt * 15))
              else
                sleep "$attempt"
              fi
            fi
          done
          unset id_token
          if [[ "$completion_status" != 2?? ]]; then
            echo "::error::Hosted completion failed with HTTP $completion_status"
            exit 1
          fi
          printf '%s\n' 'completion-sent=true' >> "$GITHUB_OUTPUT"

      # #813: the ONLY remaining direct write in this workflow, narrowed to
      # the minimum bootstrap-safe fallback the issue asks for -- fires
      # when the controller has no way to have already projected this
      # failure through the callback above:
      #   - the authenticated completion callback could not be delivered at
      #     all (steps.callback.outputs.completion-sent != 'true'), or
      #   - it WAS delivered, but carried no typed outcome for the
      #     controller to classify -- "Derive trusted completion evidence"
      #     exits 0 without setting outcome-kind when it cannot even read
      #     this run's own job/step metadata (e.g. the Actions jobs API
      #     itself failed, or no matching worker job was found at all), so
      #     completion-sent can be 'true' with nothing for the projector to
      #     act on (Codex review on #923).
      # In every other case (the callback succeeded AND carried a typed
      # outcome), the orchestrator already posted the outcome comment through
      # that same callback (apps/console/src/lib/orchestrator-dispatch.ts) --
      # writing it again here, unconditionally, would be exactly the second
      # uncoordinated write path #813 retired.
      #
      # `always()` is load-bearing, not decoration: this step runs AFTER
      # the callback step, and an `if:` with no explicit status-check
      # function implicitly ANDs in `success()` -- without `always()`, a
      # failed callback (steps.callback itself exiting non-zero, exactly
      # the scenario this fallback exists for) would make GitHub Actions
      # skip this step entirely rather than run it (Codex review on #923).
      - name: Report and park bootstrap-independent failure
        if: >-
          always() &&
          inputs.worker-result != 'success' &&
          (steps.callback.outputs.completion-sent != 'true' ||
           steps.evidence.outputs.outcome-kind == '')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          WORK: ${{ inputs.work }}
          AGENT: ${{ inputs.agent }}
          WORKER_RESULT: ${{ inputs.worker-result }}
          MAINTAINER: ${{ inputs.maintainer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: <!-- agent-lcars:bootstrap-fallback:v1 run=${{ github.run_id }} -->
        run: |
          set -euo pipefail
          # A native run carries WORK with no ISSUE -- there is no GitHub
          # issue/PR to comment on or label, and none is needed: the item
          # reads 'parked' from the orchestrator settle instead (this
          # step's whole job is a GitHub-issue-shaped last resort for when
          # that settle's own callback above could not be delivered).
          if [ -z "$ISSUE" ] && [ -n "$WORK" ]; then
            WORK_ID="$(printf '%s' "$WORK" | jq -r '.id // empty')"
            echo "::warning::Native work item $WORK_ID has no anchor issue to park directly; skipping the fallback issue comment/label calls. The item reads 'parked' from the orchestrator settle."
            exit 0
          fi
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::Invalid fallback issue number"; exit 1 ;;
          esac

          existing="$(gh api --paginate --slurp \
            "repos/$REPO/issues/$ISSUE/comments?per_page=100" \
            --jq "[.[][] | select(.body | contains(\"$MARKER\"))] | first | .id // empty")"
          if [ -z "$existing" ]; then
            if [ "$WORKER_RESULT" = "cancelled" ]; then
              outcome="was cancelled"
            else
              outcome="ended with GitHub job result '$WORKER_RESULT'"
            fi
            gh issue comment "$ISSUE" --repo "$REPO" --body "$MARKER

          $AGENT agent run $outcome: $RUN_URL

          The independent GitHub-hosted finalizer's own completion callback could not reach the hosted control plane, so this is the last-resort direct report. The marker keeps this fallback idempotent across retries of this same run."
          else
            echo "::notice::Fallback report already exists as comment $existing"
          fi

          jq -cn '{labels: ["status:needs-human"]}' |
            gh api "repos/$REPO/issues/$ISSUE/labels" \
              --method POST --input - >/dev/null
          if [ -n "$MAINTAINER" ]; then
            jq -cn --arg login "$MAINTAINER" '{assignees: [$login]}' |
              gh api "repos/$REPO/issues/$ISSUE/assignees" \
                --method POST --input - >/dev/null
          else
            echo "::warning::MAINTAINER_LOGIN is unset; failure was commented and parked but could not be assigned."
          fi

      - name: Preserve failed callback for scheduled reconciliation
        if: always() && steps.callback.outputs.completion-sent != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          WORK: ${{ inputs.work }}
          FLEET_LOGIN: ${{ inputs.fleet-login }}
        run: |
          set -euo pipefail
          # Anchor-agnostic in purpose (preserve evidence that this run's
          # completion callback never landed), but its one mechanism -- the
          # fleet-assignee reconcile sweep -- is GitHub-issue-shaped: it
          # discovers open fleet-assigned issues/PRs (dispatch-reconcile.yml),
          # which a native run has none of. Drop only the issue-number
          # validation for that branch; an issue-anchored run still gets it.
          if [ -z "$ISSUE" ] && [ -n "$WORK" ]; then
            WORK_ID="$(printf '%s' "$WORK" | jq -r '.id // empty')"
            echo "::warning::Native work item $WORK_ID has no anchor issue for the fleet-assignee reconcile sweep to preserve; skipping."
            exit 0
          fi
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::Invalid fallback issue number"; exit 1 ;;
          esac
          if [ -z "$FLEET_LOGIN" ]; then
            echo "::error::Fleet login is required for callback reconciliation"
            exit 1
          fi

          payload_file="$(mktemp)"
          trap 'rm -f "$payload_file"' EXIT
          jq -cn --arg login "$FLEET_LOGIN" '{assignees: [$login]}' > "$payload_file"
          for attempt in 1 2 3; do
            if timeout 15s gh api "repos/$REPO/issues/$ISSUE/assignees" \
              --method POST --input "$payload_file" >/dev/null; then
              echo "::notice::Preserved callback failure for the fleet-assignee reconcile sweep"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$attempt"; fi
          done
          echo "::error::Could not preserve callback failure for scheduled reconciliation"
          exit 1
