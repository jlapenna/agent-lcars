name: Fleet onboarding audit

on:
  schedule:
    - cron: '43 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/onboarding-audit.yml'
      - '.github/workflows/agent-automerge.yml'
      - '.github/actions/assert-repo-vars/**'
      - 'apps/console/apphosting.yaml'
      - 'config/github-labels.json'
      - 'config/github-variables.json'
      - 'infra/github-ruleset/**'
      - 'tools/verify-onboarding.mjs'

permissions:
  contents: read

concurrency:
  group: onboarding-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      # Fail locally before attempting to authenticate with an empty App ID.
      - uses: ./.github/actions/assert-repo-vars
        with:
          vars: |
            AGENT_LCARS_CLIENT_ID=${{ vars.AGENT_LCARS_CLIENT_ID }}
            AGENT_FLEET_LOGIN=${{ vars.AGENT_FLEET_LOGIN }}
      - name: Audit watched repositories and declared registrations
        env:
          APP_CLIENT_ID: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          AGENT_FLEET_LOGIN: ${{ vars.AGENT_FLEET_LOGIN }}
          # Public resolved identities only; credentials keep separate inputs.
          REGISTRATIONS_YAML: ${{ vars.ONBOARDING_AUDIT_REGISTRATIONS }}
          # Reuse only the Fleet App. The verifier mints read-only installation
          # tokens within its existing grants and revokes them on completion.
          # Other App identities and permission gaps remain unverifiable; the
          # full maintainer audit is an onboarding step, not a scheduled secret.
        shell: bash
        run: |
          if [[ -n "$REGISTRATIONS_YAML" ]]; then
            umask 077
            registrations="$(mktemp "$RUNNER_TEMP/onboarding-registrations.XXXXXX.yml")"
            trap 'rm -f -- "$registrations"' EXIT
            export REGISTRATIONS_PATH="$registrations"
            node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { resolvedRegistrationInventory } from './tools/verify-onboarding.mjs';
          try {
            const config = resolvedRegistrationInventory(process.env.REGISTRATIONS_YAML);
            writeFileSync(process.env.REGISTRATIONS_PATH, JSON.stringify(config), { mode: 0o600 });
          } catch {
            console.error('Invalid resolved registration inventory; expected the accepted ARC audit receipt.');
            process.exitCode = 1;
          }
          NODE
            node tools/verify-onboarding.mjs --registrations="$registrations"
          else
            node tools/verify-onboarding.mjs
          fi
