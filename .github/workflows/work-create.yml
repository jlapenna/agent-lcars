# Drive the native work API from GitHub Actions: create an item, read it, or
# cancel it.
#
# The work API (`PUT /api/work/v1/items/{id}`) accepts Google ID tokens whose
# subject carries a grant in AGENT_LCARS_WORK_GRANTS. This workflow mints one
# for the Codex agent service account through the repository-bounded GitHub
# WIF pool — the same impersonation the codex lane already uses — so a
# maintainer can create items with `gh workflow run work-create.yml` from
# anywhere, without a browser session or a personal service account.
name: Work API

on:
  workflow_dispatch:
    inputs:
      action:
        description: >-
          create (needs title+description), get, cancel, redispatch (need
          id), schedule-create (needs title+description+cron),
          schedule-disable (needs id)
        required: false
        default: create
        type: choice
        options:
          [create, get, cancel, redispatch, schedule-create, schedule-disable]
      title:
        description: create — item title (≤256 chars)
        required: false
        default: ''
        type: string
      description:
        description: create — what the agent should do (≤16384 chars)
        required: false
        default: ''
        type: string
      repo:
        description: Target repository (owner/name)
        required: false
        default: jlapenna/agent-lcars
        type: string
      pipeline:
        description: Pipeline the item runs on
        required: false
        default: claude
        type: string
      id:
        description: Item/schedule id (26-char Crockford ULID); generated when empty for create/schedule-create
        required: false
        default: ''
        type: string
      cron:
        description: schedule-create — 5-field UTC cron expression (min hour dom mon dow)
        required: false
        default: ''
        type: string
      console_url:
        description: Console origin hosting the work API
        required: false
        default: https://lcars.jlapenna.net
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint a work API bearer for the Codex agent service account
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CODEX_AGENT_SA }}
          token_format: id_token
          id_token_audience: agent-lcars-work
          id_token_include_email: true

      - name: Call the work API
        env:
          ACTION: ${{ inputs.action }}
          BEARER: ${{ steps.auth.outputs.id_token }}
          CONSOLE_URL: ${{ inputs.console_url }}
          ITEM_ID: ${{ inputs.id }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
          REPO: ${{ inputs.repo }}
          PIPELINE: ${{ inputs.pipeline }}
          CRON: ${{ inputs.cron }}
        run: |
          set -euo pipefail
          api="$CONSOLE_URL/api/work/v1/items"
          schedules_api="$CONSOLE_URL/api/work/v1/schedules"
          response="$(mktemp)"
          call() { # method url [body]
            if [ "$#" -ge 3 ]; then
              curl -sS -o "$response" -w '%{http_code}' -X "$1" "$2" \
                -H "authorization: Bearer $BEARER" -H 'content-type: application/json' --data "$3"
            else
              curl -sS -o "$response" -w '%{http_code}' -X "$1" "$2" \
                -H "authorization: Bearer $BEARER"
            fi
          }
          show() { jq . "$response" 2>/dev/null || cat "$response"; echo; }
          case "$ACTION" in
            create | schedule-create) needs_id=false ;;
            *) needs_id=true ;;
          esac
          if [ "$needs_id" = true ] && [ -z "$ITEM_ID" ]; then
            echo "::error::$ACTION needs an id"; exit 1
          fi
          if [ "$needs_id" = false ] && [ -z "$ITEM_ID" ]; then
            ITEM_ID="$(node -e '
              const A = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
              let t = Date.now(), s = "";
              for (let i = 0; i < 10; i++) { s = A[t % 32] + s; t = Math.floor(t / 32); }
              const r = require("crypto").randomBytes(16);
              let x = "";
              for (let i = 0; i < 16; i++) x += A[r[i] % 32];
              process.stdout.write(s + x);
            ')"
          fi
          if ! printf '%s' "$ITEM_ID" | grep -Eq '^[0-9A-HJKMNP-TV-Z]{26}$'; then
            echo "::error::id must be a 26-character Crockford ULID"; exit 1
          fi
          case "$ACTION" in
            create)
              if [ -z "$TITLE" ] || [ -z "$DESCRIPTION" ]; then
                echo "::error::create needs title and description"; exit 1
              fi
              body="$(jq -cn --arg t "$TITLE" --arg d "$DESCRIPTION" --arg r "$REPO" --arg p "$PIPELINE" \
                '{spec: {title: $t, description: $d, pipeline: $p, target: {repo: $r}}}')"
              status="$(call PUT "$api/$ITEM_ID" "$body")"
              echo "PUT /api/work/v1/items/$ITEM_ID -> $status"; show
              [ "$status" = "201" ] || { echo "::error::work API returned $status"; exit 1; }
              run_id="$(jq -r '.runs[0].runId // empty' "$response")"
              {
                echo "## Work item created"
                echo
                echo "- id: \`$ITEM_ID\`"
                echo "- page: $CONSOLE_URL/work/$ITEM_ID"
                echo "- run: \`${run_id:-?}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            get)
              status="$(call GET "$api/$ITEM_ID")"
              echo "GET /api/work/v1/items/$ITEM_ID -> $status"; show
              [ "$status" = "200" ] || { echo "::error::work API returned $status"; exit 1; }
              {
                echo "## Work item $ITEM_ID"
                echo
                echo '```json'
                jq '{state, spec: {title: .spec.title}, runs: [.runs[] | {runId, state, result}]}' "$response"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            cancel)
              status="$(call POST "$api/$ITEM_ID/cancel")"
              echo "POST /api/work/v1/items/$ITEM_ID/cancel -> $status"; show
              case "$status" in
                200|409) echo "- cancel $ITEM_ID -> $status" >> "$GITHUB_STEP_SUMMARY" ;;
                *) echo "::error::work API returned $status"; exit 1 ;;
              esac
              ;;
            redispatch)
              status="$(call POST "$api/$ITEM_ID/redispatch")"
              echo "POST /api/work/v1/items/$ITEM_ID/redispatch -> $status"; show
              case "$status" in
                200|409) echo "- redispatch $ITEM_ID -> $status" >> "$GITHUB_STEP_SUMMARY" ;;
                *) echo "::error::work API returned $status"; exit 1 ;;
              esac
              ;;
            schedule-create)
              if [ -z "$TITLE" ] || [ -z "$DESCRIPTION" ] || [ -z "$CRON" ]; then
                echo "::error::schedule-create needs title, description, and cron"; exit 1
              fi
              body="$(jq -cn --arg c "$CRON" --arg t "$TITLE" --arg d "$DESCRIPTION" --arg r "$REPO" --arg p "$PIPELINE" \
                '{cron: $c, spec: {title: $t, description: $d, pipeline: $p, target: {repo: $r}}}')"
              status="$(call PUT "$schedules_api/$ITEM_ID" "$body")"
              echo "PUT /api/work/v1/schedules/$ITEM_ID -> $status"; show
              [ "$status" = "201" ] || { echo "::error::work API returned $status"; exit 1; }
              {
                echo "## Schedule created"
                echo
                echo "- id: \`$ITEM_ID\`"
                echo "- cron: \`$CRON\`"
                echo "- page: $CONSOLE_URL/work/schedules"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            schedule-disable)
              status="$(call POST "$schedules_api/$ITEM_ID/disable")"
              echo "POST /api/work/v1/schedules/$ITEM_ID/disable -> $status"; show
              case "$status" in
                200|409) echo "- schedule-disable $ITEM_ID -> $status" >> "$GITHUB_STEP_SUMMARY" ;;
                *) echo "::error::work API returned $status"; exit 1 ;;
              esac
              ;;
            *) echo "::error::unknown action $ACTION"; exit 1 ;;
          esac
