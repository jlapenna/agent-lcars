name: IAM Contract Audit

# Assert that live fleet identity state still matches tools/iam-contract/
# model.json. docs/fleet-credentials.md is prose nobody verifies; this is the
# executable half (jlapenna/agent-lcars#1376). GitHub-hosted on purpose: an
# audit of the fleet's credentials should not depend on the self-hosted runner
# pool those credentials help operate.

on:
  schedule:
    - cron: '41 12 * * *'
  workflow_dispatch:
  # Changing either the model or the checker re-runs it against live state on
  # the PR, so a model edit cannot be merged on config-green alone.
  pull_request:
    paths:
      - 'tools/iam-contract/**'
      - '.github/workflows/iam-contract-audit.yml'

permissions:
  contents: read

concurrency:
  group: iam-contract-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The GitHub surface: App ownership, installations, the repositories each
  # installation covers, and the liveness of every workflow ref a WIF provider
  # condition trusts. Needs only the fleet App private key this repo already
  # holds, so it runs today with no new infrastructure.
  github-surface:
    name: GitHub Apps and trusted workflow refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No pnpm install: the checker deliberately has zero dependencies so an
      # audit cannot be blocked by the dependency graph it is auditing.
      - name: Assert GitHub App and workflow-ref contract
        env:
          AGENT_LCARS_CLIENT_ID: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          AGENT_LCARS_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
        run: node tools/iam-contract/check.mjs --sections apps,workflow-refs

  # The GCP surface: WIF pools/providers and their conditions, user-managed
  # service account keys, and the CLAUDE_CODE_OAUTH_TOKEN binding set - across
  # projects agent-lcars and supersprinklesracing.
  gcp-surface:
    name: WIF, service account keys, and secret bindings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # No identity reachable from this repo's shared 'github' pool can read
      # IAM in either project today: the pool admits only claude-token-reader,
      # codex-agent and telemetry-writer, none of which hold an IAM/WIF read
      # role, and github-deployer's own pool admits deploy-console.yml alone.
      # Rather than fake the assertion, the job runs it when a read-only
      # auditor identity is configured and says exactly what is unasserted
      # when it is not. See docs/iam-contract.md for the two repo variables
      # and the Terraform that provisions them.
      - name: Detect auditor credentials
        id: creds
        env:
          AUDIT_WIF_PROVIDER: ${{ vars.GCP_IAM_AUDIT_WIF_PROVIDER }}
          AUDIT_SA: ${{ vars.GCP_IAM_AUDIT_SA }}
        run: |
          set -euo pipefail
          if [[ -n "$AUDIT_WIF_PROVIDER" && -n "$AUDIT_SA" ]]; then
            echo 'configured=true' >>"$GITHUB_OUTPUT"
          else
            echo 'configured=false' >>"$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.creds.outputs.configured == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_IAM_AUDIT_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IAM_AUDIT_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.creds.outputs.configured == 'true'

      - name: Assert WIF, key and secret-binding contract
        if: steps.creds.outputs.configured == 'true'
        run: node tools/iam-contract/check.mjs --sections wif,keys,secrets

      - name: Report the unasserted surface
        if: steps.creds.outputs.configured != 'true'
        run: |
          echo "::warning title=GCP IAM contract not asserted::GCP_IAM_AUDIT_WIF_PROVIDER and GCP_IAM_AUDIT_SA are unset, so WIF pool/provider conditions, user-managed service account keys and the CLAUDE_CODE_OAUTH_TOKEN binding set were NOT checked on this run. Run 'node tools/iam-contract/check.mjs --sections wif,keys,secrets' locally, or provision the auditor identity per docs/iam-contract.md."
