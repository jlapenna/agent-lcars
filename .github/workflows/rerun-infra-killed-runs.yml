name: Rerun Infra-Killed CI Runs

# Scheduled AND manually runnable self-healing pass for agent-lcars#536:
# PR #469's Verify run (30893470148, 2026-08-04) died right after checkout
# with conclusion `failure` and every step's own conclusion `null` -- the
# self-hosted runner was evicted/killed under the job before it ever
# recorded a single step outcome (adjacent to the workdir-sweep issues
# #477/#478 and pool saturation). "Verify" is the ONLY required status
# check (see the "Protect main" ruleset), so that reads as an ordinary red
# required check indistinguishable from a real failure, and auto-merge
# stalls until a human notices the all-null-steps shape and reruns it by
# hand.
#
# This is deliberately a NEW, narrowly-scoped workflow rather than an
# addition to dispatch-reconcile.yml's `operation: reconcile` scan, even
# though that scan already runs on a similar cadence: its backing action
# (dispatch-broker) is purpose-built for the agent dispatch ledger on
# issues/PRs (normalize/broker/preflight/completion-callback/reconcile),
# not for CI run health, and its workflow permissions (`actions: write,
# contents: read, issues: read`) lack the `pull-requests: write` this
# self-healer needs to leave its audit-trail comment on the PR the killed
# run belongs to. Bolting an unrelated Jobs-API/rerun-failed-jobs scan onto
# that action's operation switch would mix two independent scanning
# domains behind one entry point for no benefit -- a second small
# self-contained action (rerun-infra-killed-runs, mirroring
# plan-image-publish's shape: one composite action, one main.mjs, one pure
# detect.mjs) keeps each scanner's blast radius and permission scope
# exactly as small as its own job needs.
#
# See detect.mjs for the precise infra-killed signature (a run only
# qualifies when EVERY one of its failed jobs has every recorded step's
# conclusion null -- a mixed run with even one real step failure is left
# red, never masked) and main.mjs for why GitHub's own `run_attempt`
# counter is sufficient, on its own, to guarantee each run is only ever
# automatically reran once.
#
# The report-recovery-observations job (agent-lcars#864/#869/#875) reports
# one ci_retry recovery observation per rerun to the hosted ingestion
# endpoint -- the first real caller of that endpoint, deliberately scoped to
# this repo's own OIDC identity (no consumer-repo trust exists yet; see
# #870). It is a separate job, not a step inside `scan`, for the same
# blast-radius reason the module comment above gives for keeping this a
# second small action: reporting needs `id-token: write` and a network call
# to a different system, and a failure to report must never affect the
# actual self-healing rerun `scan` already completed.

on:
  schedule:
    # Every 30 minutes, offset from :00/:30 to avoid the scheduling
    # stampede (see label-contract-audit.yml's '17 13 * * *' for daily
    # granularity, dispatch-reconcile.yml's '7,37 * * * *' for the same
    # convention at this granularity -- :22/:52 avoids both).
    - cron: '22,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Repo-wide, scanner-only group: prevents two overlapping scheduled/
  # manual passes from redundantly examining (and potentially
  # double-rerunning, if both read the same run's run_attempt before
  # either's rerun call lands) the same batch of recent failed runs. A
  # redundant extra scan would mostly be harmless (rerun-failed-jobs on an
  # already-attempt-2 run just 404s/409s and is caught by this workflow's
  # own per-candidate try/catch), but there is no reason to pay for the
  # race.
  group: rerun-infra-killed-runs-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ['${{ vars.DEFAULT_RUNNER_LABEL }}']
    timeout-minutes: 5
    outputs:
      rerun-run-ids: ${{ steps.run.outputs.rerun-run-ids }}
    steps:
      # Needed to resolve the local composite action below.
      - name: Checkout trusted revision
        uses: actions/checkout@v7

      - name: Scan ci.yml for infra-killed runs and rerun them once
        id: run
        uses: ./.github/actions/rerun-infra-killed-runs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  report-recovery-observations:
    needs: scan
    if: needs.scan.outputs.rerun-run-ids != '' && needs.scan.outputs.rerun-run-ids != '[]'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Report one ci_retry recovery observation per rerun
        env:
          RERUN_RUN_IDS: ${{ needs.scan.outputs.rerun-run-ids }}
          RECOVERY_URL: https://agent-console.supersprinkles.racing/api/control-plane/recovery-observation
          RECOVERY_AUDIENCE: agent-lcars-recovery-observation
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_KIND: ${{ github.event_name == 'workflow_dispatch' && 'operator' || 'schedule' }}
        run: |
          set -uo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "$RERUN_RUN_IDS" | jq -c '.[]' | while read -r entry; do
            run_id=$(jq -r '.runId' <<<"$entry")
            run_attempt=$(jq -r '.runAttempt' <<<"$entry")
            anchor=$(jq -r '.anchor' <<<"$entry")
            run_url=$(jq -r '.runUrl' <<<"$entry")
            exact_identity="run:${run_id}:${run_attempt}"
            operation_key="recovery/v1:ci_retry:${REPOSITORY_ID}:${anchor}:${exact_identity}"

            body=$(jq -n \
              --arg operationKey "$operation_key" \
              --argjson repositoryId "$REPOSITORY_ID" \
              --arg repository "$REPOSITORY" \
              --argjson anchor "$anchor" \
              --arg exactIdentity "$exact_identity" \
              --arg sourceKind "$SOURCE_KIND" \
              --arg observedAt "$now" \
              --arg evidence "$run_url" \
              '{
                operationKey: $operationKey,
                target: {
                  domain: "ci_retry",
                  repositoryId: $repositoryId,
                  repository: $repository,
                  anchor: $anchor,
                  exactIdentity: $exactIdentity
                },
                sourceKind: $sourceKind,
                observedAt: $observedAt,
                evidence: $evidence
              }')

            token_response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RECOVERY_AUDIENCE") \
              || { echo "::warning::rerun-infra-killed-runs: could not mint an OIDC token to report run $run_id"; continue; }
            oidc_token=$(jq -er '.value | select(type == "string" and length > 0)' \
              <<<"$token_response") \
              || { echo "::warning::rerun-infra-killed-runs: OIDC token response for run $run_id had no usable value"; continue; }

            curl --fail-with-body --silent --show-error --max-time 30 \
              -X POST \
              -H "Authorization: Bearer $oidc_token" \
              -H "Content-Type: application/json" \
              -d "$body" \
              "$RECOVERY_URL" \
              || echo "::warning::rerun-infra-killed-runs: failed to report the recovery observation for run $run_id"
          done
