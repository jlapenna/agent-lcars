name: Rerun Infra-Killed CI Runs

# Scheduled AND manually runnable self-healing pass for agent-lcars#536:
# PR #469's Verify run (30893470148, 2026-08-04) died right after checkout
# with conclusion `failure` and every step's own conclusion `null` -- the
# self-hosted runner was evicted/killed under the job before it ever
# recorded a single step outcome (adjacent to the workdir-sweep issues
# #477/#478 and pool saturation). "Verify" is the ONLY required status
# check (see the "Protect main" ruleset), so that reads as an ordinary red
# required check indistinguishable from a real failure, and auto-merge
# stalls until a human notices the all-null-steps shape and reruns it by
# hand.
#
# This is deliberately a NEW, narrowly-scoped workflow rather than an
# addition to dispatch-reconcile.yml's `operation: reconcile` scan, even
# though that scan already runs on a similar cadence: its backing action
# (dispatch-broker) is purpose-built for the agent dispatch ledger on
# issues/PRs (normalize/broker/preflight/completion-callback/reconcile),
# not for CI run health, and its workflow permissions (`actions: write,
# contents: read, issues: read`) lack the `pull-requests: write` this
# self-healer needs to leave its audit-trail comment on the PR the killed
# run belongs to. Bolting an unrelated Jobs-API/rerun-failed-jobs scan onto
# that action's operation switch would mix two independent scanning
# domains behind one entry point for no benefit -- a second small
# self-contained action (rerun-infra-killed-runs, mirroring
# plan-image-publish's shape: one composite action, one main.mjs, one pure
# detect.mjs) keeps each scanner's blast radius and permission scope
# exactly as small as its own job needs.
#
# See detect.mjs for the precise infra-killed signature (a run only
# qualifies when EVERY one of its failed jobs has every recorded step's
# conclusion null -- a mixed run with even one real step failure is left
# red, never masked) and main.mjs for why GitHub's own `run_attempt`
# counter is sufficient, on its own, to guarantee each run is only ever
# automatically reran once.

on:
  schedule:
    # Every 30 minutes, offset from :00/:30 to avoid the scheduling
    # stampede (see label-contract-audit.yml's '17 13 * * *' for daily
    # granularity, dispatch-reconcile.yml's '7,37 * * * *' and
    # dispatch-canary.yml's '13 * * * *' for the same convention at this
    # granularity -- :22/:52 avoids all three).
    - cron: '22,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Repo-wide, scanner-only group: prevents two overlapping scheduled/
  # manual passes from redundantly examining (and potentially
  # double-rerunning, if both read the same run's run_attempt before
  # either's rerun call lands) the same batch of recent failed runs. A
  # redundant extra scan would mostly be harmless (rerun-failed-jobs on an
  # already-attempt-2 run just 404s/409s and is caught by this workflow's
  # own per-candidate try/catch), but there is no reason to pay for the
  # race.
  group: rerun-infra-killed-runs-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ['${{ vars.DEFAULT_RUNNER_LABEL }}']
    timeout-minutes: 5
    steps:
      # Needed to resolve the local composite action below.
      - name: Checkout trusted revision
        uses: actions/checkout@v7

      - name: Scan ci.yml for infra-killed runs and rerun them once
        uses: ./.github/actions/rerun-infra-killed-runs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  alert:
    needs: scan
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@v7

      - name: Alert on scanner failure / resolve on recovery
        uses: ./.github/actions/canary-alert
        with:
          token: ${{ github.token }}
          workflow-status: ${{ needs.scan.result }}
          workflow-file: rerun-infra-killed-runs.yml
          maintainer: ${{ vars.MAINTAINER_LOGIN }}
