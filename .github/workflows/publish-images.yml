name: Publish images

# Builds and publishes every image this repo produces:
#   1. the autoscaler control-plane (apps/runner-autoscaler/Dockerfile);
#   2. the JIT worker image (apps/runner-autoscaler/runner-image/Dockerfile)
#      every other CI job in this fleet actually executes inside;
#   3. the standalone telemetry-watcher daemon
#      (apps/telemetry-watcher/Dockerfile), the per-host image pike runs;
#   4. the GitHub Actions metrics exporter
#      (apps/github-actions-exporter/Dockerfile), scraped by Prometheus;
#   5. the pinned Playwright E2E sandbox (tools/e2e/Dockerfile), pulled by
#      tools/e2e-docker.sh for local/CI-consistent screenshot rendering
#      (agent-lcars#908);
#   6. the lcars-e2e pool's JIT runner image (tools/e2e-runner/Dockerfile) --
#      (5) above plus the runner agent, mirroring supersprinklesracing/
#      sprinkles' own e2e-runner precedent. jlapenna/homelab's orchestrator
#      config pins this as that pool's runner_image, so the pool's own
#      environment IS the pinned sandbox and never needs a Docker socket
#      (agent-lcars#920, homelab#168's hardening stays intact).
# jlapenna/homelab pulls the published service images rather than building from source
# (agent-lcars#52) -- this workflow is the one place that source gets
# compiled into a real, published artifact.
#
# (5) is content-hash tagged rather than staged-then-promoted like (1)-(4):
# tools/e2e/Dockerfile has no COPY instructions (nothing else it could build
# FROM changes its bytes), so the tag itself already only ever names one
# possible set of bytes -- there is no separate "mutable trusted tag" a
# scan-in-progress window could expose the fleet to the way :latest/
# :jit-node24 could for the other four (see the staging-tag rationale
# below). It is still scanned like every other image here (agent-lcars#224);
# a scan failure just means the job goes red with the tag already pushed,
# which is fine for an image nothing auto-consumes -- only an explicit
# `docker pull` of that exact tag (a developer, or a future CI job) ever
# reaches it.
#
# (6), unlike (5), IS staged-then-promoted to a mutable :latest tag, same as
# (1)/(2)/(3): jlapenna/homelab's orchestrator.yml pins it by digest and the
# fleet's autoscaler actually boots runners from it (agent-lcars#920), the
# same "mutable trusted tag" exposure the staging pattern exists to close
# for those three -- unlike (5), which nothing auto-consumes.
#
# (3) was added in agent-lcars#231, after its absence caused a real outage.
# Nothing in CI built it, so it only ever reached the registry when someone
# ran `docker build` by hand. The members -> sprinkles allowlist fix landed
# in #137 and then sat unpublished for weeks while pike kept running a
# pre-fix image, reporting 0 active CLI sessions while ~10 were live
# (homelab#202, and the postmortem in homelab's docs/incidents.md).
#
# Note that (2) and (3) are DIFFERENT artifacts built from the same source:
# (2) bakes the telemetry bundle into the runner image for CI issue-agent
# telemetry, while (3) is the long-lived workstation daemon. A telemetry
# change must rebuild both -- which is why the plan step below always
# routes a bundle-input change to both.
#
# Each image's build/scan/promote steps are individually gated on the plan
# step's per-image output (agent-lcars#441), so a push that only touches one
# image group's inputs skips the other groups entirely. Building every group
# unconditionally, serially, used to spend ~20 minutes of builder capacity
# -- dominated by the emulated arm64 JIT build -- even for a push that
# touched only one image's inputs, or none of them at all: a
# telemetry-watcher deployment-config-only change (agent-lcars#440, exactly
# `apps/telemetry-watcher/deploy/**`) still triggered a full, wasted
# ~20-minute run that built nothing (agent-lcars#441's issue comment has the
# concrete run link).
#
# This stays ONE job, not one job per image. An earlier version of this fix
# split control-plane/jit-runner/watcher into separate jobs so independent
# images could build in parallel -- but `lcars-build-client` is deliberately
# capped at `max_runners: 1` in jlapenna/homelab's orchestrator config
# ("image publishing is serialized by the registry anyway, and one holder of
# the push credential at a time is the point"), so those jobs could never
# actually run concurrently: no benefit, for real added complexity (job
# output plumbing, three duplicated checkout/buildx-setup/registry-login
# sequences). An early real dispatch of the 5-job version measured 52m09s
# and was first blamed on a per-job runner cold-start tax -- that
# explanation turned out to be wrong (the delay was almost entirely the
# dispatch queuing behind an unrelated already-running publish in this
# workflow's own concurrency group, not a property of job count; see
# docs/image-publish-routing.md's dated correction for the full story).
# Step-level `if:` gates still get the same "skip unrelated image work"
# benefit as separate jobs, with less complexity and without ever needing
# concurrency this pool can't provide anyway. See
# `.github/actions/plan-image-publish/plan.mjs` for the routing rules and
# the bundle-input invariant they preserve.
#
# Runs on lcars-build-client: a socketless pool that holds no Docker socket
# and needs no local Docker daemon (agent-lcars#101). Images are built by a
# dedicated rootless BuildKit service on oldbook, reached over mutually
# authenticated TLS via Buildx's remote driver, so a compromised job here
# cannot administer the host it landed on.
#
# The client certificate arrives as a read-only bind-mount from the
# encrypted homelab secret store -- NOT from GitHub Actions secrets. The
# control plane runs locally, so the whole BuildKit PKI shares one storage
# and rotation path (homelab's ansible/deploy_buildkit.yml).
#
# Every build attests provenance and an SBOM (docker/build-push-action's
# `provenance`/`sbom` inputs) and is scanned via the local `scan-image`
# composite action before it becomes the tag the fleet actually pulls
# (agent-lcars#224). The scan targets the just-pushed REGISTRY reference,
# not a local image -- this runner has no Docker socket to hold one
# (agent-lcars#101), so there is nothing local to scan. See
# scan-image/action.yml for the severity bar and how authentication is
# reused from the registry login step below.
#
# Each image is pushed to a STAGING tag (`:<github.sha>`) first, scanned
# there, and only then promoted -- via `docker buildx imagetools create`,
# a registry-side manifest copy, not a rebuild -- to the mutable tag the
# fleet consumes (`:latest` / `:jit-node24`). Scanning the mutable tag
# itself would be too late to matter: the autoscaler's `ensureRunnerImage`
# treats a moving tag as immediately consumable the moment it's pushed, so
# a scan that only runs (and fails) AFTER that push would just turn this
# CI run red without having stopped anything from reaching the fleet.
#
# Each multi-platform image is scanned once PER PLATFORM (see
# scan-image/action.yml's `platform` input) -- Trivy has no notion of
# "scan every platform in this manifest list"; given one it resolves and
# scans an arbitrary single manifest, so scanning a multi-arch reference
# only once would silently leave the other architecture never scanned.

on:
  push:
    branches: [main]
    paths:
      - apps/runner-autoscaler/**
      # The exporter Dockerfile copies exactly these two inputs in addition
      # to itself. README/tests/Nx config are CI inputs, not image inputs.
      - apps/github-actions-exporter/Dockerfile
      - apps/github-actions-exporter/exporter.py
      - apps/github-actions-exporter/requirements.lock
      - .github/workflows/publish-images.yml
      # Changing how an image is scanned/attested/promoted, or how image
      # builds are ROUTED, is as much a reason to republish-and-exercise as
      # changing what's IN the image -- a scan-image or plan-image-publish
      # regression is invisible until the next real publish run otherwise.
      # See agent-lcars#224 and agent-lcars#441.
      - .github/actions/scan-image/**
      - .github/actions/plan-image-publish/**
      # A telemetry change rebuilds TWO images, for two different reasons:
      #
      #   - The JIT worker image's Dockerfile clones this repo's own `main`
      #     at build time and bakes in `nx bundle
      #     @agent-lcars/telemetry-watcher` (see runner-image/Dockerfile).
      #     Without this trigger every self-hosted runner keeps the old
      #     sidecar until an unrelated autoscaler change or manual dispatch
      #     happens to trigger one (the same silent-staleness failure mode
      #     #52 exists to eliminate).
      #   - The standalone daemon image pike runs. Its absence from CI is
      #     what #231 fixed; before that, this same paths filter already
      #     matched telemetry changes and published something, just not
      #     this image -- which is precisely why the gap was easy to miss.
      #
      # The two exclusions right below are deliberately narrow: they cover
      # only the standalone daemon's OWN deployment config and top-level
      # README, neither of which reaches the published image (see
      # plan.mjs's WATCHER_EXEMPT_* for the concrete rationale and
      # agent-lcars#440 for the regression this fixes -- a deployment-pin
      # change that used to trigger this whole workflow for nothing).
      # Everything else under the app -- src/**, project.json, tsconfig*,
      # eslint/vitest config -- stays a trigger; see plan.mjs for why this
      # repo defaults to rebuilding rather than risk silent staleness.
      - apps/telemetry-watcher/**
      - '!apps/telemetry-watcher/deploy/**'
      - '!apps/telemetry-watcher/README.md'
      # Everything else the daemon bundle inlines. esbuild resolves these
      # into the artifact, so a change here changes what ships even though
      # nothing under apps/telemetry-watcher/ was touched. Omitting them
      # would recreate this workflow's own bug at one remove: a Renovate
      # dependency bump landing on main would leave production running a
      # bundle built from superseded code until some unrelated change
      # happened to match a path above.
      #
      # The lockfile and patches matter for the same reason -- every third
      # party dep (including @google-cloud/firestore) is inlined, so
      # bumping one rewrites the bundle. The cost is that dependency-only
      # pushes now republish; that is the correct direction to be wrong in,
      # and the registry-backed layer cache absorbs most of it.
      - libs/telemetry/**
      - libs/logging/**
      - libs/env-vars/**
      - libs/util/**
      - libs/util-server/**
      - package.json
      - pnpm-lock.yaml
      - patches/**
      # The E2E sandbox image's entire content (agent-lcars#908) -- see the
      # header comment above for why this one file is its sole input.
      - tools/e2e/Dockerfile
      # The lcars-e2e runner image's own build context (agent-lcars#920).
      # A sandbox-only change above already reschedules this image too (see
      # plan.mjs's e2eRunner routing) -- this entry is for changes scoped to
      # the runner layer itself (its Dockerfile).
      - tools/e2e-runner/**
  workflow_dispatch:

permissions:
  contents: read
  # Lets scan-image's SARIF upload step (github/codeql-action/upload-sarif)
  # publish Trivy's results to this repo's code-scanning UI. Public repo,
  # so code scanning is free -- no GitHub Advanced Security license needed.
  security-events: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    # The push trigger is already branch-scoped to main above; workflow_dispatch
    # is not (it lets any write-access collaborator pick an arbitrary ref in
    # the UI/API) and this workflow publishes the exact images the whole
    # self-hosted fleet pulls and trusts on every job. Restrict manual
    # dispatch to main too, so an unreviewed branch can never reach the
    # registry this way.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # Pinned literally, deliberately: this previously read
    # `fromJSON(vars.CI_RUNS_ON || ...)`, which let a mutable repository
    # variable redirect the one workflow that publishes fleet-trusted
    # images to an arbitrary pool -- including a socket-mounted one. That
    # is inconsistent with the dispatch-ref restriction directly above,
    # which exists for exactly the same trust reason.
    #
    # The repo-variable refactor deliberately does NOT apply here. Here the
    # label IS the security control, not configuration: anyone who can edit
    # a repository variable could otherwise redirect fleet-image publishing.
    # A fork edits this line.
    runs-on: lcars-build-client
    # Raised from 20: arm64 is emulated on the builder (no native aarch64
    # host is available -- see agent-lcars#101), and a cold BuildKit cache
    # makes the JIT runner image build the dominant cost. Steady-state runs
    # are far quicker once the cache is warm.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: base-ref (github.event.before) must actually be
          # present locally for the plan step's diff to succeed. A shallow
          # checkout would make every push look non-diffable and silently
          # force a full publish every time -- see
          # plan-image-publish/main.mjs's fallback.
          fetch-depth: 0

      # Decides which image groups below actually need building for
      # this push, from the set of changed paths -- see
      # .github/actions/plan-image-publish/plan.mjs for the routing rules.
      # Every later step's `if` reads this step's outputs directly (e.g.
      # `steps.plan.outputs.control-plane == 'true'`).
      #
      # workflow_dispatch carries no `before` SHA at all (that field only
      # exists on push events) -- treat a manual dispatch as an explicit
      # "republish everything" request rather than trying to guess a base
      # to diff against, same as plan.mjs's null-changedFiles fallback.
      - name: Plan which images this push touches
        id: plan
        uses: ./.github/actions/plan-image-publish
        with:
          base-ref: ${{ github.event_name == 'workflow_dispatch' && '' || github.event.before }}
          head-ref: ${{ github.sha }}

      # This repo's only Go module lives at apps/runner-autoscaler/go.mod,
      # not the repo root. setup-go's default dependency-cache lookup only
      # checks the root, so without cache-dependency-path every run logs a
      # "Restore cache failed: Dependencies file is not found" warning and
      # never actually caches the module/build cache (agent-lcars#318).
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/runner-autoscaler/go.mod
          cache-dependency-path: apps/runner-autoscaler/go.mod
          cache: false

      - uses: ./.github/actions/setup-node-pnpm

      # The exporter is a Python Nx project. The whole-workspace gate below
      # invokes its targets even when another image triggered this run.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: |
          steps.plan.outputs.control-plane == 'true' ||
          steps.plan.outputs.jit-runner == 'true' ||
          steps.plan.outputs.watcher == 'true' ||
          steps.plan.outputs.exporter == 'true' ||
          steps.plan.outputs.e2e == 'true' ||
          steps.plan.outputs.e2e-runner == 'true'
        with:
          version: 0.12.3
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: apps/github-actions-exporter/requirements.lock

      # Whole workspace, not a per-project list. AGENTS.md requires the
      # affected test/typecheck/build targets before publishing, and the
      # published artifacts pull in far more than the two app directories:
      # the daemon bundle inlines @agent-lcars/logging, @agent-lcars/env, @agent-lcars/util,
      # @agent-lcars/util-server and @agent-lcars/telemetry. `nx run-many -p <app>`
      # runs only that project's own targets -- a dependency's specs would
      # be skipped while its code shipped, which is exactly the trigger this
      # workflow's paths filter was just widened to catch.
      #
      # Enumerating the closure by hand instead would drift the moment an
      # import is added, and drift silently -- the failure mode this whole
      # workflow exists to eliminate. `--all` cannot drift. The tradeoff is
      # real: an unrelated project's broken test now blocks publishing. That
      # is a loud failure, and loud beats silent here. The shared Nx cache
      # (NX_CACHE_URL) keeps the marginal cost small.
      #
      # Skipped entirely when plan found nothing to build (all four outputs
      # false) -- nothing here would gate.
      - name: Build and test before publishing
        if: |
          steps.plan.outputs.control-plane == 'true' ||
          steps.plan.outputs.jit-runner == 'true' ||
          steps.plan.outputs.watcher == 'true' ||
          steps.plan.outputs.exporter == 'true' ||
          steps.plan.outputs.e2e == 'true' ||
          steps.plan.outputs.e2e-runner == 'true'
        run: ./tools/nx run-many -t build test typecheck --all

      # Only relevant to the two images that bake in this bundle. Skipped
      # for a control-plane-only push -- there is nothing here for a Go
      # binary change to invalidate.
      #
      # The `bundle` target is deliberately outside the default build graph
      # (nothing depends on it -- see apps/telemetry-watcher/README.md), so
      # ci.yml's `nx run-many -t test typecheck build --all` never exercises
      # it. That makes this the ONLY gate on the artifact both the runner
      # sidecar and the daemon image actually execute, and bundling failures
      # are invisible to unit tests: esbuild inlines every dependency, so a
      # transitive dep that cannot be inlined breaks only at runtime.
      #
      # Runs the bundle from an empty directory on purpose. Executing it in
      # place can succeed via an ambient node_modules resolution that will
      # not exist inside the image -- the README calls this out as the
      # manual verification step; this is that step, automated.
      #
      # Deliberately NOT `docker run`: this pool holds no Docker socket (the
      # assertion below is the point of #101), so a container-based smoke
      # test cannot work here. Plain node needs no daemon.
      - name: Verify the telemetry-watcher bundle runs standalone
        if: steps.plan.outputs.jit-runner == 'true' || steps.plan.outputs.watcher == 'true'
        run: |
          ./tools/nx bundle @agent-lcars/telemetry-watcher

          smoke="$(mktemp -d)"
          cp dist/apps/telemetry-watcher/sidecar.cjs "$smoke/"
          mkdir -p "$smoke/projects" "$smoke/codex" "$smoke/checkout"

          # No credentials configured, so it falls back to the log-only
          # store by design and writes nothing to Firestore. It is a daemon
          # and never exits on its own, hence `timeout`; `|| true` swallows
          # timeout's 124, and the grep below is what actually decides
          # pass/fail -- a genuine crash also lands here and still fails.
          ( cd "$smoke" \
            && AGENT_TELEMETRY_CLAUDE_PROJECTS_DIR="$smoke/projects" \
               AGENT_TELEMETRY_CODEX_SESSIONS_DIR="$smoke/codex" \
               AGENT_TELEMETRY_CHECKOUT_ROOTS="$smoke/checkout" \
               AGENT_TELEMETRY_ANTIGRAVITY_SUMMARY_DB='' \
               timeout 30s node sidecar.cjs ) > "$smoke/out.log" 2>&1 || true

          if ! grep -q "starting; watching" "$smoke/out.log"; then
            echo "::error::telemetry-watcher bundle did not start standalone"
            cat "$smoke/out.log"
            exit 1
          fi
          grep "starting; watching" "$smoke/out.log"

      # No docker/setup-qemu-action: nothing is built locally any more.
      # Emulation for linux/arm64 lives on the builder (qemu-user-static,
      # installed by homelab's ansible/deploy_buildkit.yml), which is where
      # the RUN steps actually execute under the remote driver.
      #
      # driver-opts take ABSOLUTE FILE PATHS. Do not switch these to the
      # BUILDER_NODE_<n>_AUTH_TLS_* environment variables shown in Docker's
      # GitHub Actions docs -- those carry PEM *contents*, which is the
      # shape that only makes sense when the material comes from GitHub
      # secrets. Here it is a read-only bind-mount from the local secret
      # store, so paths are correct and the PEM never transits GitHub.
      # The builder endpoint stays literal for the same reason `runs-on`
      # above does: this workflow publishes the images the whole fleet
      # pulls and trusts, so where it builds is a trust decision, not
      # configuration. A mutable repository variable here would let anyone
      # who can edit variables point fleet-image builds at a builder they
      # control. A fork edits this line.
      #
      # Skipped when nothing needs building -- no image job below would use it.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: |
          steps.plan.outputs.control-plane == 'true' ||
          steps.plan.outputs.jit-runner == 'true' ||
          steps.plan.outputs.watcher == 'true' ||
          steps.plan.outputs.exporter == 'true' ||
          steps.plan.outputs.e2e == 'true' ||
          steps.plan.outputs.e2e-runner == 'true'
        with:
          driver: remote
          endpoint: tcp://oldbook.lan.jlapenna.net:1234
          driver-opts: |
            cacert=/secrets/buildkit-ca.pem
            cert=/secrets/buildkit-client-cert.pem
            key=/secrets/buildkit-client-key.pem

      # Records which builder and platforms actually served the build --
      # the first thing worth seeing when a publish misbehaves.
      - name: Show builder
        if: |
          steps.plan.outputs.control-plane == 'true' ||
          steps.plan.outputs.jit-runner == 'true' ||
          steps.plan.outputs.watcher == 'true' ||
          steps.plan.outputs.exporter == 'true' ||
          steps.plan.outputs.e2e == 'true' ||
          steps.plan.outputs.e2e-runner == 'true'
        run: docker buildx inspect --bootstrap

      # Fail loudly rather than silently falling back to a local daemon if
      # this ever lands on a socket-mounted pool by mistake. The absence of
      # this socket is the entire point of agent-lcars#101.
      - name: Assert the runner holds no Docker socket
        if: |
          steps.plan.outputs.control-plane == 'true' ||
          steps.plan.outputs.jit-runner == 'true' ||
          steps.plan.outputs.watcher == 'true' ||
          steps.plan.outputs.exporter == 'true' ||
          steps.plan.outputs.e2e == 'true' ||
          steps.plan.outputs.e2e-runner == 'true'
        run: |
          if [ -S /var/run/docker.sock ]; then
            echo "::error::/var/run/docker.sock is present; this job must run on a socketless pool"
            exit 1
          fi
          echo "no docker socket present"

      # The registry keeps anonymous pulls but requires a Bearer token for
      # writes. BuildKit receives this client-side credential through the
      # remote build session; the builder stores no publisher password.
      - name: Log in to the registry
        if: |
          steps.plan.outputs.control-plane == 'true' ||
          steps.plan.outputs.jit-runner == 'true' ||
          steps.plan.outputs.watcher == 'true' ||
          steps.plan.outputs.exporter == 'true' ||
          steps.plan.outputs.e2e == 'true' ||
          steps.plan.outputs.e2e-runner == 'true'
        run: |
          test -r /secrets/registry-password || {
            echo "::error::registry credential not mounted; check the lane's file_mounts"
            exit 1
          }
          docker login docker-registry.lan.jlapenna.net \
            --username publisher --password-stdin < /secrets/registry-password

      # Pushed to the staging tag (:<sha>) first -- see this workflow's own
      # header comment for why :latest is only promoted below, after both
      # platform scans pass.
      - name: Build and push control-plane image (staging)
        if: steps.plan.outputs.control-plane == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/runner-autoscaler
          file: apps/runner-autoscaler/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/runner-autoscaler:${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/runner-autoscaler:buildcache
          cache-to: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/runner-autoscaler:buildcache,mode=max
          # Attestations require BuildKit >= 0.11 and Buildx >= 0.10 on the
          # builder oldbook runs, and are only supported by the
          # docker-container/kubernetes/remote drivers (never the default
          # `docker` driver) -- both conditions this remote builder already
          # needs to meet for the multi-platform push above to work at
          # all. See agent-lcars#224.
          provenance: true
          sbom: true

      - name: Scan control-plane image (linux/amd64)
        if: steps.plan.outputs.control-plane == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/runner-autoscaler:${{ github.sha }}
          platform: linux/amd64
          category: runner-autoscaler-linux-amd64

      - name: Scan control-plane image (linux/arm64)
        if: steps.plan.outputs.control-plane == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/runner-autoscaler:${{ github.sha }}
          platform: linux/arm64
          category: runner-autoscaler-linux-arm64

      # Only reached once both scans above have passed. A single-source
      # `imagetools create` against an existing manifest list is a
      # documented "carbon copy" (docker/buildx's own reference docs) --
      # including the attestation manifests the build above attached, so
      # promoting this way doesn't lose the provenance/SBOM data by
      # re-deriving a fresh manifest list. This is the same tool this
      # repo's own runner-image/Dockerfile already uses to mirror its
      # upstream base image, and it works via the registry API against
      # whatever the currently logged-in credential can read/write -- it
      # does not dispatch a build, so it needs no BuildKit compute.
      - name: Promote control-plane image to :latest
        if: steps.plan.outputs.control-plane == 'true'
        run: |
          docker buildx imagetools create \
            --tag ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/runner-autoscaler:latest \
            ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/runner-autoscaler:${{ github.sha }}

      # The router/reconciler pool intentionally has its own image. Keep it
      # adjacent to the normal autoscaler image so a control-plane Dockerfile
      # change follows the same staged-build, scan, and promotion contract.
      - name: Build and push control-plane runner image (staging)
        if: steps.plan.outputs.control-plane == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/runner-autoscaler/control-plane-image
          file: apps/runner-autoscaler/control-plane-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/control-plane-runner:${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/control-plane-runner:buildcache
          cache-to: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/control-plane-runner:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Scan control-plane runner image (linux/amd64)
        if: steps.plan.outputs.control-plane == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/control-plane-runner:${{ github.sha }}
          platform: linux/amd64
          category: control-plane-runner-linux-amd64

      - name: Scan control-plane runner image (linux/arm64)
        if: steps.plan.outputs.control-plane == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/control-plane-runner:${{ github.sha }}
          platform: linux/arm64
          category: control-plane-runner-linux-arm64

      - name: Promote control-plane runner image to :latest
        if: steps.plan.outputs.control-plane == 'true'
        run: |
          docker buildx imagetools create \
            --tag ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/control-plane-runner:latest \
            ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/control-plane-runner:${{ github.sha }}

      # Pushed to the staging tag (:<sha>) first, same reason as the
      # control-plane image above. The FINAL tag name is unaffected and
      # still keeps existing consumers working: every consuming workflow
      # across members and agent-lcars already hardcodes
      # ${{ vars.HOMELAB_REGISTRY }}/homelab-runner:jit-node24 --
      # renaming it is out of scope for this migration.
      - name: Build and push JIT worker runner image (staging)
        if: steps.plan.outputs.jit-runner == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/runner-autoscaler/runner-image
          file: apps/runner-autoscaler/runner-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.HOMELAB_REGISTRY }}/homelab-runner:${{ github.sha }}
          # Busts the Dockerfile's internal `git clone` layer on every real
          # publish -- see that Dockerfile's own comment. Without this, the
          # registry-backed cache below could restore a stale clone of
          # agent-lcars main from a prior build.
          build-args: |
            CACHE_BUST=${{ github.sha }}
            # Build the exact reviewed commit that triggered this publish.
            # `git fetch origin <sha>` in the Dockerfile supports a detached
            # commit as well as the local-build fallback of `main`.
            AGENT_LCARS_REF=${{ github.sha }}
            # cgo needs a C compiler; the runner image otherwise has none
            # (it's built for the Node/pnpm toolchain). apps/runner-autoscaler:test-race
            # (`go test -race`) is this Go app's only test target, and it
            # fails outright without this (agent-lcars#410).
            EXTRA_APT_PACKAGES=gcc libc6-dev
          cache-from: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/homelab-runner:buildcache
          cache-to: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/homelab-runner:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Scan JIT worker runner image (linux/amd64)
        if: steps.plan.outputs.jit-runner == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/homelab-runner:${{ github.sha }}
          platform: linux/amd64
          category: homelab-runner-linux-amd64

      - name: Scan JIT worker runner image (linux/arm64)
        if: steps.plan.outputs.jit-runner == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/homelab-runner:${{ github.sha }}
          platform: linux/arm64
          category: homelab-runner-linux-arm64

      # Only reached once both scans above have passed -- see the
      # control-plane image's promotion step above for why `imagetools
      # create` is safe to use here (registry-side carbon copy, preserves
      # attestations, no BuildKit compute needed).
      - name: Promote JIT worker runner image to :jit-node24
        if: steps.plan.outputs.jit-runner == 'true'
        run: |
          docker buildx imagetools create \
            --tag ${{ vars.HOMELAB_REGISTRY }}/homelab-runner:jit-node24 \
            ${{ vars.HOMELAB_REGISTRY }}/homelab-runner:${{ github.sha }}

      # The standalone per-host daemon image (agent-lcars#231). Two things
      # differ from the two images above, both deliberate:
      #
      #   context: .    -- this Dockerfile does `COPY . .` from the REPO
      #     ROOT and runs pnpm install + `nx bundle` inside the build, unlike
      #     the autoscaler's self-contained subdirectory contexts. Scoping
      #     this to apps/telemetry-watcher fails in a confusing way.
      #
      #   platforms     -- amd64 only. The images above are multi-arch
      #     because the runner fleet is; this one's only consumer is pike,
      #     which is amd64. arm64 here would mean a full monorepo install
      #     and esbuild bundle under qemu emulation, on a max_runners:1
      #     lane, for a platform nothing pulls. Revisit if the watcher ever
      #     runs on an arm host.
      #
      # Only ONE tag is pushed here now (the sha tag) -- :latest is
      # promoted separately below, after the scan passes, same staging
      # pattern as the other two images. Before agent-lcars#224 both tags
      # were pushed atomically in this one step, which is exactly the gap
      # that made scanning-after-push meaningless: by the time any scan
      # ran, :latest -- the tag homelab pulls -- was already live.
      - name: Build and push telemetry-watcher daemon image (staging)
        if: steps.plan.outputs.watcher == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/telemetry-watcher/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/telemetry-watcher:${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/telemetry-watcher:buildcache
          cache-to: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/telemetry-watcher:buildcache,mode=max
          provenance: true
          sbom: true

      # Single-platform (amd64 only, see above) -- image-ref is already
      # unambiguous, so no `platform` input is needed here (contrast with
      # the two multi-arch images above, each scanned once per platform).
      - name: Scan telemetry-watcher daemon image
        if: steps.plan.outputs.watcher == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/telemetry-watcher:${{ github.sha }}
          category: telemetry-watcher

      # Only reached once the scan above has passed. homelab pins this
      # image as tag@digest deliberately (its compose is under
      # docker:pinDigests), so a moving-only tag would not serve that
      # consumer -- the sha tag pushed above already covers it. :latest is
      # promoted here purely for a stable pull target, matching the other
      # two images; see the control-plane image's promotion step above for
      # why `imagetools create` is safe to use for this. Note Renovate
      # cannot bump homelab's pin -- it is disabled for
      # docker-registry.lan.jlapenna.net/** there, since its runner cannot
      # reach a LAN registry -- so publishing guarantees the artifact
      # EXISTS but a human still moves the pin.
      - name: Promote telemetry-watcher daemon image to :latest
        if: steps.plan.outputs.watcher == 'true'
        run: |
          docker buildx imagetools create \
            --tag ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/telemetry-watcher:latest \
            ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/telemetry-watcher:${{ github.sha }}

      # The exporter runs on the amd64 observability host. Keep it
      # single-platform, like the watcher, until an arm64 consumer exists.
      - name: Build and push GitHub Actions exporter image (staging)
        if: steps.plan.outputs.exporter == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/github-actions-exporter
          file: apps/github-actions-exporter/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/github-actions-exporter:${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/github-actions-exporter:buildcache
          cache-to: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/github-actions-exporter:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Scan GitHub Actions exporter image
        if: steps.plan.outputs.exporter == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/github-actions-exporter:${{ github.sha }}
          category: github-actions-exporter

      - name: Promote GitHub Actions exporter image to :latest
        if: steps.plan.outputs.exporter == 'true'
        run: |
          docker buildx imagetools create \
            --tag ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/github-actions-exporter:latest \
            ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/github-actions-exporter:${{ github.sha }}

      # Must match the derivation in tools/e2e-docker.sh's own IMAGE
      # computation (agent-lcars#908) -- that script refuses to build
      # locally, so a mismatch here silently strands every consumer against
      # a tag this workflow never publishes. Also needed whenever ONLY the
      # e2e-runner image is scheduled (a tools/e2e-runner/** -only change):
      # its build-arg below always names the sandbox at the CURRENT
      # Dockerfile's tag, even on a run that isn't rebuilding that sandbox
      # itself (agent-lcars#920) -- the tag must resolve to an already-
      # published image in that case, which plan.mjs's shared-input
      # invariant (a sandbox change always reschedules the runner too)
      # guarantees stays true.
      - name: Compute e2e image tag
        id: e2e_tag
        if: steps.plan.outputs.e2e == 'true' || steps.plan.outputs.e2e-runner == 'true'
        run: |
          echo "tag=df-$(sha256sum tools/e2e/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Pushed straight to its final content-hash tag, not a staging tag --
      # see this workflow's own header comment for why that two-step
      # (needed for the OTHER four images' mutable :latest/:jit-node24 tags)
      # doesn't apply here.
      - name: Build and push e2e sandbox image
        if: steps.plan.outputs.e2e == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: tools/e2e
          file: tools/e2e/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e:${{ steps.e2e_tag.outputs.tag }}
          cache-from: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e:buildcache
          cache-to: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Scan e2e sandbox image (linux/amd64)
        if: steps.plan.outputs.e2e == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e:${{ steps.e2e_tag.outputs.tag }}
          platform: linux/amd64
          category: e2e-linux-amd64

      - name: Scan e2e sandbox image (linux/arm64)
        if: steps.plan.outputs.e2e == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e:${{ steps.e2e_tag.outputs.tag }}
          platform: linux/arm64
          category: e2e-linux-arm64

      # The lcars-e2e pool's JIT runner image (agent-lcars#920): the sandbox
      # above plus the runner agent, so jlapenna/homelab's orchestrator.yml
      # can pin a runner_image whose own environment already IS that
      # sandbox -- no Docker socket needed in that pool at all (mirrors
      # supersprinklesracing/sprinkles' own e2e-runner precedent). Staged
      # then promoted to :latest below, same as the JIT worker/control-plane
      # images above -- unlike the sandbox, this one IS a mutable tag the
      # fleet actually boots from (see this workflow's own header comment).
      - name: Build and push e2e runner image (staging)
        if: steps.plan.outputs.e2e-runner == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Repo root, NOT tools/e2e-runner: the Dockerfile COPYs
          # apps/runner-autoscaler/runner-image/externals-health.sh (agent-lcars#920
          # fix, PR #930 review) so its externals-repair entrypoint reuses the
          # exact same shared logic the generic JIT worker image and the
          # control plane's own maintenance sweep already use, instead of a
          # second hand-copied version that could drift.
          context: .
          file: tools/e2e-runner/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            SANDBOX_IMAGE=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e:${{ steps.e2e_tag.outputs.tag }}
          tags: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e-runner:${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e-runner:buildcache
          cache-to: type=registry,ref=${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e-runner:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Scan e2e runner image (linux/amd64)
        if: steps.plan.outputs.e2e-runner == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e-runner:${{ github.sha }}
          platform: linux/amd64
          category: e2e-runner-linux-amd64

      - name: Scan e2e runner image (linux/arm64)
        if: steps.plan.outputs.e2e-runner == 'true'
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e-runner:${{ github.sha }}
          platform: linux/arm64
          category: e2e-runner-linux-arm64

      # Only reached once both scans above have passed -- see the
      # control-plane image's promotion step for why `imagetools create` is
      # safe to use here (registry-side carbon copy, preserves attestations,
      # no BuildKit compute needed).
      - name: Promote e2e runner image to :latest
        if: steps.plan.outputs.e2e-runner == 'true'
        run: |
          docker buildx imagetools create \
            --tag ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e-runner:latest \
            ${{ vars.HOMELAB_REGISTRY }}/agent-lcars/e2e-runner:${{ github.sha }}

      - name: Log out of the registry
        if: always()
        run: docker logout docker-registry.lan.jlapenna.net || true
