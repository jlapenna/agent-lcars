name: Label Contract Audit

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.full_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - full_name: jlapenna/agent-lcars
            owner: jlapenna
            repository: agent-lcars
          - full_name: jlapenna/homelab
            owner: jlapenna
            repository: homelab
          - full_name: supersprinklesracing/sprinkles
            owner: supersprinklesracing
            repository: sprinkles

    steps:
      - uses: actions/checkout@v7

      - name: Mint read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repository }}
          permission-issues: read

      - name: Check labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node tools/sync-github-labels.mjs --repo="${{ matrix.full_name }}"
