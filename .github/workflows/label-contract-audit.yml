name: Label Contract Audit

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.full_name }}
    runs-on: ['lcars-default']
    strategy:
      fail-fast: false
      matrix:
        include:
          - full_name: jlapenna/agent-lcars
            owner: jlapenna
            repository: agent-lcars
          - full_name: jlapenna/homelab
            owner: jlapenna
            repository: homelab
          - full_name: supersprinklesracing/sprinkles
            owner: supersprinklesracing
            repository: sprinkles
          - full_name: supersprinklesracing/www
            owner: supersprinklesracing
            repository: www
          - full_name: supersprinklesracing/girosf
            owner: supersprinklesracing
            repository: girosf
          - full_name: jlapenna/nx-cache-server
            owner: jlapenna
            repository: nx-cache-server
          - full_name: jlapenna/sync-padd
            owner: jlapenna
            repository: sync-padd

    steps:
      - uses: actions/checkout@v7

      # issues:write, not read: the sync below creates/edits declared labels
      # and deletes reappearing legacy ones (GitHub's label endpoints sit
      # under the Issues permission).
      - name: Mint write token
        id: app-token
        uses: ./.github/actions/mint-agent-token
        with:
          client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repository }}
          permission-issues: write

      # Self-healing sync, not a report-only audit: --apply re-creates or
      # fixes any declared label that drifted; --migrate moves open items
      # off a reappearing legacy label onto its declared replacements; and
      # --prune then deletes any label on the repo's migrations/remove
      # lists that reappeared (Renovate re-mints defaults like
      # `dependencies`/`javascript`/`go` on its own PRs, which used to flap
      # this job red every day). --prune touches ONLY the manifest's
      # migrations/remove lists - a live label that is simply undeclared is
      # left alone, so every live label must either be declared or
      # consciously listed for removal.
      - name: Sync labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node tools/sync-github-labels.mjs --apply --migrate --prune --repo="${{ matrix.full_name }}"
