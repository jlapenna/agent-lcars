name: Label Contract Audit

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.full_name }}
    runs-on: ['${{ vars.DEFAULT_RUNNER_LABEL }}']
    strategy:
      fail-fast: false
      matrix:
        include:
          - full_name: jlapenna/agent-lcars
            owner: jlapenna
            repository: agent-lcars
          - full_name: jlapenna/homelab
            owner: jlapenna
            repository: homelab
          - full_name: supersprinklesracing/sprinkles
            owner: supersprinklesracing
            repository: sprinkles

    steps:
      - uses: actions/checkout@v7

      - name: Mint read token
        id: app-token
        uses: ./.github/actions/mint-agent-token
        with:
          client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repository }}
          permission-issues: read

      - name: Check labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node tools/sync-github-labels.mjs --repo="${{ matrix.full_name }}"

  alert:
    needs: audit
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@v7

      - name: Alert on label-audit failure / resolve on recovery
        uses: ./.github/actions/canary-alert
        with:
          token: ${{ github.token }}
          workflow-status: ${{ needs.audit.result }}
          workflow-file: label-contract-audit.yml
          maintainer: ${{ vars.MAINTAINER_LOGIN }}
