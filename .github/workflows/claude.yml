name: Claude Issue Agent

# First issue-agent pipeline, alongside codex.yml and opencode.yml. This
# workflow is workflow_dispatch-only: the hosted controller owns every event
# trigger (label added, an OWNER's `@claude` reply, etc.), authorizes the
# request, and dispatches this workflow with an immutable broker binding.
#
# Thin caller (issue #1312 U1): the worker job's whole step sequence lives
# in the published reusable lane, .github/workflows/agent-lane-claude.yml,
# consumed here same-repo (so it resolves from this run's own dispatched
# ref). This file keeps only what workflow_call cannot carry: the
# workflow_dispatch input contract, the contract-tested run-name, the
# permissions grant, and the repo-variable spellings passed down as
# inputs. The shared agent protocol is the complete behavioral contract.

# Keep the console's leading issue-number join key and add the immutable
# broker marker used to reconcile a dispatch after an interrupted bind.
# Native runs render a fixed label; the work id is already in the dispatch
# marker tail, which is what the console binds on.
run-name: "${{ inputs.issue != '' && format('#{0}', inputs.issue) || 'native work' }}: Claude issue agent [dispatch:g${{ inputs.broker_generation }}:${{ inputs.broker_intent_id }}]"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to run against (manual testing)'
        required: false
        default: ''
      mode:
        description: 'Dispatch mode for hosted-controller issue work'
        required: false
        default: 'implement'
      reply:
        description: 'Original maintainer reply when mode is reply'
        required: false
        default: ''
      runbook:
        description: 'Optional skill for a runbook dispatch'
        required: false
        default: ''
      context:
        description: 'Optional deployment or router context'
        required: false
        default: ''
      work:
        description: 'Native work item JSON: {id, spec} for a work-anchored dispatch, or {spec} merged onto issue context for a GitHub anchor (see prepare-agent-dispatch/action.yml)'
        required: false
        default: ''
      broker_intent_id:
        description: 'Immutable broker intent ID'
        required: true
      broker_generation:
        description: 'Monotonic broker generation'
        required: true
      broker_dispatch_token:
        description: 'Immutable broker dispatch token'
        required: true

# Least privilege: enough for Claude to comment on the issue, push a feature
# branch, open a pull request, and read CI results on the PRs it opens.
# actions:write (on the workflow's own GITHUB_TOKEN, not the app token) lets
# the agent re-run failed CI on its PRs; without it a transient CI failure
# hard-blocks the agent on a human re-run.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

# No per-issue concurrency group here (deliberately - see #321). Dispatch
# dedup/serialization is the hosted orchestrator's job now: libs/orchestrator
# is a durable per-task mutex (a task never has two live runs at once -
# admission for a task whose run is live is refused, or at most recorded as
# the task's single pendingRequest and minted into a fresh run only after
# the live one settles), so a second dispatch request for the same issue
# never becomes a second worker run. A workflow-level group here would
# be actively harmful on top of that: GitHub keeps exactly ONE pending run
# per group, so a second queued run for this group is silently killed
# before any step - including the reusable lane's post-agent gates - can
# fire.

jobs:
  claude:
    # The hosted controller authorizes the request before dispatching this
    # worker via workflow_dispatch. This job only checks that the dispatch
    # actually carries an anchor -- an issue number or a native work item.
    if: github.event_name == 'workflow_dispatch' && (inputs.issue != '' || inputs.work != '')
    uses: ./.github/workflows/agent-lane-claude.yml
    with:
      issue: ${{ inputs.issue }}
      mode: ${{ inputs.mode }}
      reply: ${{ inputs.reply }}
      runbook: ${{ inputs.runbook }}
      context: ${{ inputs.context }}
      work: ${{ inputs.work }}
      broker-generation: ${{ inputs.broker_generation }}
      broker-intent-id: ${{ inputs.broker_intent_id }}
      # claude-agent-lcars is registered in jlapenna/homelab's
      # github-runner-autoscaler/orchestrator.yml as
      # homelab-autoscale-claude-agent-lcars (homelab#97). Do NOT point
      # this at homelab-autoscale-claude-agent; that label is a distinct
      # registration reserved for the members repo's runner fleet.
      runs-on-label: ${{ vars.AGENT_RUNNER_LABEL }}
      job-timeout-minutes: 90
      agent-timeout-minutes: 60
      max-turns: 200
      # This repo is the hosted-orchestrator thin executor (#1015) and
      # preserves the dispatch brief for trajectory evaluation.
      dispatch-bootstrap: true
      # This repo's own dispatches run under the console's issue-side
      # projections (sub-project 5): the console owns the eyes reaction,
      # fleet claim, and park label/comment, so the lane skips its own
      # claim step. Every other consumer omits this and keeps today's
      # behavior.
      #
      # Derived from provenance, not hardcoded (found by review on
      # jlapenna/homelab#906): this workflow is also runnable by hand via
      # workflow_dispatch from the Actions UI, and a hand-run dispatch
      # projects nothing -- no eyes reaction, no fleet assignee. A literal
      # `true` here made the lane skip its own claim step unconditionally,
      # silently leaving a manually-dispatched issue unclaimed.
      #
      # `broker_intent_id` cannot be that signal: it is declared
      # `required: true` above, so the Actions UI forces an operator to
      # supply *some* value on a hand-run dispatch too, and the condition
      # can never be false. `work` is the correct signal instead --
      # `required: false` with a `''` default above, and
      # `orchestrator-dispatch.ts`'s `handleDispatchRun` sends a
      # `work: JSON.stringify({...})` payload on every dispatch it makes,
      # for a native work-anchored run and a GitHub-anchored one alike
      # (sub-project 5: every anchor carries a work payload). A manual
      # `workflow_dispatch` leaves `work` at its declared `''` default, so
      # non-empty `work` is true console provenance -- "this dispatch
      # carries a control-plane work payload" is the same statement as
      # "the control plane made this dispatch."
      #
      # Consumer-repo caveat: this used to evaluate to `false` in every
      # consumer repo even for a console-dispatched run, because
      # `orchestrator-dispatch.ts` gated the `work` input to the
      # control-plane repository only -- #1544 wave 2 removed that gate
      # (dispatch now sends `work` for every admitted target), so this now
      # also evaluates true for a console-dispatched run against an
      # admitted consumer repo. Until wave 3 removes this lane's own claim
      # step (pending a live consumer dispatch observed taking this
      # projected-claim path), both claim effects fire: this lane's own
      # claim below, and the console's projection. Both are idempotent
      # (`claimGithubAnchor`'s doc comment: a repeated reaction returns the
      # existing one, assigning an already-assigned login is a no-op), so
      # the double-claim is harmless.
      control-plane-projections: ${{ inputs.work != '' }}
      protected-snapshot: true
      agent-fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      agent-lcars-client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
      nx-cache-url: ${{ vars.NX_CACHE_URL }}
      # Use the image's normal pnpm store: matching package content comes from
      # its immutable lower-layer seed, while misses stay in this ephemeral
      # runner container's private writable layer.
      telemetry-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
      telemetry-service-account: ${{ vars.GCP_TELEMETRY_WRITER_SA }}
      brief-budget-minutes: '60'
      brief-artifact-checkpoint-minutes: '25'
      brief-finalize-checkpoint-minutes: '45'
    secrets:
      AGENT_LCARS_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
      NX_CACHE_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}
      AGENT_CI_RERUN_TOKEN: ${{ secrets.AGENT_CI_RERUN_TOKEN }}

  fallback-finalize:
    needs: claude
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.issue != '' || inputs.work != '')
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    uses: ./.github/workflows/agent-fallback-finalize.yml
    with:
      issue: ${{ inputs.issue }}
      work: ${{ inputs.work }}
      generation: ${{ inputs.broker_generation }}
      intent-id: ${{ inputs.broker_intent_id }}
      dispatch-token: ${{ inputs.broker_dispatch_token }}
      worker-workflow: claude.yml
      worker-result: ${{ needs.claude.result }}
      agent: Claude
      fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      maintainer: ${{ vars.MAINTAINER_LOGIN }}
