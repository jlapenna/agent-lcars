name: Console Anchor Projection Backfill

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: console-anchor-projection-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Ingest open anchors through the protected control plane
        uses: jlapenna/agent-lcars/.github/actions/oidc-post@main
        with:
          endpoint: https://lcars.jlapenna.net/api/control-plane/projections/reconcile
          audience: agent-lcars-anchor-projection-backfill
          timeout-seconds: '840'
