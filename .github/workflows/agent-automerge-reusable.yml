name: Agent PR Auto-Merge (Reusable)

# Fleet-published App-only auto-merge workflow (docs/published-actions.md).
# Callers supply trusted pull_request_target, push, successful same-repository
# pull_request workflow_run, daily schedule and manual workflow_dispatch events.
# No job checks out or executes PR-head content. Repository-scoped App tokens
# preserve GitHub's normal CI/deploy events, linked-issue closure and branch
# deletion. Native repository rulesets remain the merge authority.
#
# Workers own the initial squash arm; reconciliation repairs missed arms,
# updates eligible behind branches and dismisses stale bot review objections.
# Required inputs, the App trust boundary and live predicates are exercised by
# tools/contract-tests/agent-automerge-*.test.ts and actionlint.

on:
  workflow_call:
    inputs:
      bot-logins:
        description: >-
          JSON array of REST-shaped bot logins (e.g.
          '["claude[bot]","agent-lcars[bot]"]') whose PRs are auto-merged --
          pass the caller's AGENT_BOT_LOGINS repo variable. REST shape is
          canonical (docs/bot-identity-formats.md).
        required: true
        type: string
      fleet-login:
        description: >-
          Assignable fleet-claim login (agent-lcars-bot) recorded as the
          assignee of agent-authored PRs -- pass the caller's
          AGENT_FLEET_LOGIN repo variable.
        required: true
        type: string
      app-token-enabled:
        description: >-
          Mint and use a repository-scoped Agent LCARS App installation token
          for merge operations. Must be explicitly true. False or omitted
          rejects the unsupported legacy GITHUB_TOKEN merge mode.
        required: false
        type: boolean
        default: false
      app-client-id:
        description: >-
          Agent LCARS GitHub App client ID. Required when app-token-enabled is
          true; pass the caller's AGENT_LCARS_CLIENT_ID repository variable.
        required: false
        type: string
        default: ''
      runs-on:
        description: >-
          Runner labels as a JSON array string, passed straight to
          fromJSON(). Use a small glue pool, never the pool backing long
          agent sessions -- this job must not queue behind an in-flight
          agent run.
        required: true
        type: string
      required-checks:
        description: >-
          Deprecated compatibility input; ignored. Existing callers may keep
          their JSON check-name array until updated. GitHub's native ruleset
          and current check rollup enforce merge requirements.
        required: false
        type: string
        default: ''
    secrets:
      APP_PRIVATE_KEY:
        description: >-
          Agent LCARS App private key. Required when app-token-enabled is true;
          pass the caller's AGENT_LCARS_PRIVATE_KEY repository secret.
        required: false

permissions: {}

jobs:
  validate-configuration:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 1
    steps:
      - name: Require explicit App merge identity
        env:
          APP_TOKEN_ENABLED: ${{ inputs.app-token-enabled }}
        run: |
          if [ "$APP_TOKEN_ENABLED" != true ]; then
            echo "::error::Legacy GITHUB_TOKEN merge mode is retired. Set app-token-enabled: true and supply app-client-id and APP_PRIVATE_KEY."
            exit 1
          fi

  cancel-parked-automerge:
    needs: validate-configuration
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'status:needs-human' &&
      contains(fromJSON(inputs.bot-logins), github.event.pull_request.user.login)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      # disablePullRequestAutoMerge needs the same scope that arming it does
      # (the `automerge` job below). With pull-requests: write alone GitHub
      # answers "Resource not accessible by integration", so a PR parked
      # after it was armed still merged: #2003, run 35492121036.
      contents: write
      pull-requests: write
    steps:
      - name: Disable auto-merge for the parked agent PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VIEW=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest)
          if jq -e '.autoMergeRequest != null' <<<"$VIEW" >/dev/null; then
            gh pr merge "$PR" --repo "$REPO" --disable-auto
          fi
          gh pr view "$PR" --repo "$REPO" --json autoMergeRequest \
            --jq 'if .autoMergeRequest == null then . else error("auto-merge remains armed on parked PR") end'

  automerge:
    needs: validate-configuration
    # App credentials are admitted only from pull_request_target, whose
    # workflow code comes from the trusted default branch.
    # The membership test reads the caller-supplied JSON directly (fromJSON,
    # no fallback), so an empty bot-logins fails loudly rather than skipping.
    if: >
      inputs.app-token-enabled && github.event_name == 'pull_request_target' &&
      contains(fromJSON(inputs.bot-logins), github.event.pull_request.user.login) &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'status:needs-human')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Multiple admission events for the same PR can land close together;
    # serialize their `gh pr ready`/`gh pr merge --auto` calls per PR.
    concurrency:
      group: automerge-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # This job's own `if:` above also reads bot-logins. A step can only
      # run once the job has already started, so this assert cannot make an
      # empty bot-logins loud on a run the `if:` itself would otherwise
      # skip - it only guarantees the loud failure on runs that do reach
      # this step.
      - name: Assert required inputs are set
        env:
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
          AGENT_FLEET_LOGIN: ${{ inputs.fleet-login }}
          APP_CLIENT_ID: ${{ inputs.app-client-id }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$AGENT_BOT_LOGINS" ] && missing="$missing bot-logins"
          [ -z "$AGENT_FLEET_LOGIN" ] && missing="$missing fleet-login"
          [ -z "$APP_CLIENT_ID" ] && missing="$missing app-client-id"
          [ -z "$APP_PRIVATE_KEY" ] && missing="$missing APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required workflow input(s):$missing"
            exit 1
          fi

      - name: Mint repository-scoped Agent LCARS token
        id: mint-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # Ownership spine, matching the fleet lanes' own "Claim the issue as
      # agent-lcars-bot" step: agent-authored PRs carry the fleet's assignee
      # just like the anchor issues they came from. The fleet login is the
      # assignee because bot App identities (claude[bot]) are not assignable
      # users - the assignees API silently drops them. Additive and
      # idempotent; non-blocking so a hiccup can't cost the auto-merge arm
      # below.
      - name: Claim the PR as the fleet login
        env:
          GH_TOKEN: ${{ steps.mint-app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FLEET_LOGIN: ${{ inputs.fleet-login }}
        run: |
          jq -cn --arg login "$FLEET_LOGIN" '{assignees: [$login]}' |
            gh api "repos/$REPO/issues/$PR/assignees" \
              --method POST --input - >/dev/null \
            || echo "::warning::Could not assign $FLEET_LOGIN to #$PR"

      - name: Clear outstanding review requests
        env:
          GH_TOKEN: ${{ steps.mint-app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REQUESTS=$(gh api "repos/$REPO/pulls/$PR/requested_reviewers")
          PAYLOAD=$(jq -c '{reviewers: [.users[].login], team_reviewers: [.teams[].slug]}' <<<"$REQUESTS")
          if jq -e '(.reviewers | length) + (.team_reviewers | length) > 0' <<<"$PAYLOAD" >/dev/null; then
            gh api "repos/$REPO/pulls/$PR/requested_reviewers" \
              --method DELETE --input - <<<"$PAYLOAD" >/dev/null
          fi
          gh api "repos/$REPO/pulls/$PR/requested_reviewers" \
            --jq 'if (.users | length) == 0 and (.teams | length) == 0 then . else error("review requests remain") end'

      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ steps.mint-app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR" --repo "$REPO" --auto --squash

          gh pr view "$PR" --repo "$REPO" --json state,autoMergeRequest \
            --jq 'if .state == "MERGED" or .autoMergeRequest != null then . else error("auto-merge is not armed") end'

  # Event delivery is not durable across an Actions outage. Workers own the
  # primary arm, and this sweep is the independent repair path for an agent
  # that timed out before handoff or a pull_request event that never ran. It
  # intentionally leaves drafts alone: draft is the fleet's parked/WIP state.
  # Event-driven for App-enabled callers: a push to main is when an armed PR
  # falls BEHIND, and a successful PR CI completion is when an armed PR's
  # checks turn green (the two moments the behind-branch and stale-review
  # steps can act). App merges and App-pushed PR heads emit both events
  # normally, so these callers need no short poll, only a daily backstop for
  # transitions that emit no event (docs/published-actions.md).
  # workflow_run executes with secrets even when
  # the triggering CI ran for a fork PR, so only same-repository PR runs are
  # admitted; fork PRs are never agent-authored here anyway. No job reachable
  # from workflow_run or pull_request_target checks out or runs PR content,
  # and no run script interpolates `${{ }}` (contract-tested).
  reconcile-automerge:
    needs: validate-configuration
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && inputs.app-token-enabled) ||
      (github.event_name == 'workflow_run' && inputs.app-token-enabled &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    # The open-PR sweep below calls `gh pr view --json statusCheckRollup`, and
    # gh expands that into a GraphQL query spanning three resources:
    # the rollup's CheckRun nodes (`checks: read`), StatusContext nodes
    # (`statuses: read`), each context's
    # `checkSuite.workflowRun` (`actions: read`), and the PR itself
    # (`pull-requests`). GitHub fails the *whole* field when any one of them
    # is missing -- it does not return a partial rollup -- so the sweep exits
    # non-zero and every run of this workflow fails. Granting only part of the
    # set just moves the error one level deeper into the same query.
    #
    # Both this job and the caller must declare the scopes: a reusable
    # workflow cannot widen the caller's token ceiling.
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    concurrency:
      group: agent-automerge-reconcile-open-prs
      cancel-in-progress: false
    steps:
      - name: Assert required inputs are set
        env:
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
          APP_CLIENT_ID: ${{ inputs.app-client-id }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          missing=""
          if [ -z "$AGENT_BOT_LOGINS" ]; then
            missing="$missing bot-logins"
          fi
          [ -z "$APP_CLIENT_ID" ] && missing="$missing app-client-id"
          [ -z "$APP_PRIVATE_KEY" ] && missing="$missing APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required workflow input(s) or secret(s):$missing"
            exit 1
          fi
          if ! jq -e 'type == "array" and all(.[]; type == "string")' \
            <<<"$AGENT_BOT_LOGINS" >/dev/null; then
            echo "::error::bot-logins must be a JSON array of strings"
            exit 1
          fi

      - name: Mint repository-scoped Agent LCARS token
        id: mint-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write

      - name: Arm ready open agent PRs missed by event delivery
        env:
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
          APP_LOGIN: ${{ steps.mint-app-token.outputs.app-slug && format('app/{0}', steps.mint-app-token.outputs.app-slug) || '' }}
          LEGACY_AUTOMERGE_LOGIN: app/github-actions
          GH_TOKEN: ${{ steps.mint-app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          OPEN_PRS_FILE="$RUNNER_TEMP/agent-automerge-open-prs.tsv"
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .user.login, .draft, ([.labels[].name] | index("status:needs-human") != null)] | @tsv' \
            >"$OPEN_PRS_FILE"
          mapfile -t OPEN_PRS <"$OPEN_PRS_FILE"

          CHECKED=0
          ARMED=0
          FAILED=0
          for ROW in "${OPEN_PRS[@]}"; do
            IFS=$'\t' read -r PR AUTHOR DRAFT PARKED <<<"$ROW"
            if [ "$DRAFT" = true ] || \
               ! jq -e --arg login "$AUTHOR" 'index($login) != null' \
                 <<<"$AGENT_BOT_LOGINS" >/dev/null; then
              continue
            fi

            if [ "$PARKED" = true ]; then
              VIEW=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest)
              if jq -e '.autoMergeRequest != null' <<<"$VIEW" >/dev/null; then
                if ! gh pr merge "$PR" --repo "$REPO" --disable-auto; then
                  echo "::error::Could not disable auto-merge for parked agent PR #$PR."
                  FAILED=$((FAILED + 1))
                  continue
                fi
              fi
              if ! gh pr view "$PR" --repo "$REPO" --json autoMergeRequest \
                --jq 'if .autoMergeRequest == null then . else error("auto-merge remains armed on parked PR") end' >/dev/null; then
                echo "::error::Auto-merge remains armed on parked agent PR #$PR."
                FAILED=$((FAILED + 1))
              fi
              continue
            fi

            CHECKED=$((CHECKED + 1))
            REQUESTS=$(gh api "repos/$REPO/pulls/$PR/requested_reviewers")
            PAYLOAD=$(jq -c '{reviewers: [.users[].login], team_reviewers: [.teams[].slug]}' <<<"$REQUESTS")
            if jq -e '(.reviewers | length) + (.team_reviewers | length) > 0' <<<"$PAYLOAD" >/dev/null; then
              if ! gh api "repos/$REPO/pulls/$PR/requested_reviewers" \
                --method DELETE --input - <<<"$PAYLOAD" >/dev/null; then
                echo "::error::Could not clear review requests for agent PR #$PR."
                FAILED=$((FAILED + 1))
                continue
              fi
            fi
            if ! gh api "repos/$REPO/pulls/$PR/requested_reviewers" \
              --jq 'if (.users | length) == 0 and (.teams | length) == 0 then . else error("review requests remain") end' >/dev/null; then
              echo "::error::Review requests remain on agent PR #$PR."
              FAILED=$((FAILED + 1))
              continue
            fi

            VIEW=$(gh pr view "$PR" --repo "$REPO" --json state,autoMergeRequest)
            if jq -e '.state == "MERGED"' <<<"$VIEW" >/dev/null; then
              echo "PR #$PR merged while reconciliation was inspecting it."
              continue
            fi
            if jq -e '.autoMergeRequest != null' <<<"$VIEW" >/dev/null; then
              if jq -e --arg login "$APP_LOGIN" \
                   '.autoMergeRequest.enabledBy.login == $login' \
                   <<<"$VIEW" >/dev/null; then
                echo "PR #$PR is already armed by the expected identity."
                continue
              fi

              LEGACY_ACTOR=$(jq -r '.autoMergeRequest.enabledBy.login // "unknown"' <<<"$VIEW")
              if [ "$LEGACY_ACTOR" != "$LEGACY_AUTOMERGE_LOGIN" ]; then
                echo "PR #$PR is already armed by $LEGACY_ACTOR; preserving that explicit actor."
                continue
              fi
              echo "Migrating PR #$PR auto-merge from $LEGACY_ACTOR to $APP_LOGIN."
              if ! gh pr merge "$PR" --repo "$REPO" --disable-auto; then
                echo "::error::Could not disable legacy auto-merge for agent PR #$PR."
                FAILED=$((FAILED + 1))
                continue
              fi
              if ! gh pr view "$PR" --repo "$REPO" --json autoMergeRequest \
                --jq 'if .autoMergeRequest == null then . else error("legacy auto-merge remains armed") end' >/dev/null; then
                echo "::error::Legacy auto-merge remains armed on agent PR #$PR."
                FAILED=$((FAILED + 1))
                continue
              fi
            fi

            if ! gh pr merge "$PR" --repo "$REPO" --auto --squash; then
              echo "::error::Could not arm auto-merge for agent PR #$PR."
              FAILED=$((FAILED + 1))
              continue
            fi

            VIEW=$(gh pr view "$PR" --repo "$REPO" --json state,autoMergeRequest)
            if jq -e --arg login "$APP_LOGIN" '
              .state == "MERGED" or
              (.autoMergeRequest != null and .autoMergeRequest.enabledBy.login == $login)
            ' <<<"$VIEW" >/dev/null; then
              echo "Armed squash auto-merge for agent PR #$PR."
              ARMED=$((ARMED + 1))
            else
              echo "::error::PR #$PR remained open without auto-merge after the arm command."
              FAILED=$((FAILED + 1))
            fi
          done

          echo "Reconciliation checked=$CHECKED armed=$ARMED failed=$FAILED"
          [ "$FAILED" -eq 0 ]

      # #1953: GitHub's `dismiss_stale_reviews` branch protection does NOT
      # auto-remove a review authored by a GitHub App, so once a fleet review
      # bot (agent-lcars[bot]) submits CHANGES_REQUESTED it keeps
      # reviewDecision blocked across EVERY later push. An auto-merge-armed PR
      # then parks forever with green checks and no error anywhere:
      # mergeStateStatus never reaches CLEAN (measured on supersprinklesracing
      # PR #5577, 2026-09-13). Same silent-stall family as the behind-branch
      # stall below, but the trigger is the review gate, not a behind head.
      # This self-heals only where it cannot be wrong. The PR must be
      # agent-authored (the same bot-logins admission gate as the arm step --
      # a human PR keeps human review), auto-merge already armed (the opt-in),
      # every review thread resolved, and every completed check green with
      # none running. Even then it removes only CHANGES_REQUESTED reviews that
      # are BOTH authored by a bot-logins identity AND stale -- submitted
      # before the current head commit's committer date. A review of the live
      # head is a live objection and is kept; a human-authored review is never
      # touched. The REST dismissals endpoint needs `message`
      # (`dismissal_message` 422s). Bounded to a handful per run, matching the
      # behind-branch sweep; a GITHUB_TOKEN refusal is tallied as a failure
      # rather than a warning, because surfacing the stuck state is half the
      # point here (the app-token follow-up is only needed if that refusal is
      # ever actually observed).
      - name: Dismiss stale bot CHANGES_REQUESTED reviews on armed green agent PRs
        env:
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
          GH_TOKEN: ${{ steps.mint-app-token.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MAX_DISMISSALS=5
          CANDIDATES=0
          DISMISSED=0
          FAILED=0

          OPEN_PRS_FILE="$RUNNER_TEMP/agent-automerge-review-prs.tsv"
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.draft == false) | [.number, .user.login, ([.labels[].name] | index("status:needs-human") != null)] | @tsv' \
            >"$OPEN_PRS_FILE"
          mapfile -t OPEN_PRS <"$OPEN_PRS_FILE"

          for ROW in "${OPEN_PRS[@]}"; do
            if [ "$DISMISSED" -ge "$MAX_DISMISSALS" ]; then
              echo "Reached the per-run cap of $MAX_DISMISSALS stale review dismissal(s); stopping."
              break
            fi

            IFS=$'\t' read -r PR AUTHOR PARKED <<<"$ROW"

            # The agent-authorship admission gate, identical in scope to the
            # arm step above: a human PR's review gate stays human.
            if [ "$PARKED" = true ] || \
               ! jq -e --arg login "$AUTHOR" 'index($login) != null' \
                 <<<"$AGENT_BOT_LOGINS" >/dev/null; then
              continue
            fi

            VIEW=$(GH_TOKEN="$GH_READ_TOKEN" gh pr view "$PR" --repo "$REPO" \
              --json autoMergeRequest,reviewDecision,headRefOid,statusCheckRollup)

            # Auto-merge armed is the opt-in, and a requested-changes decision
            # is the only reason this step cares about the PR at all.
            if ! jq -e '
              .autoMergeRequest != null and
              .reviewDecision == "CHANGES_REQUESTED"
            ' <<<"$VIEW" >/dev/null; then
              continue
            fi

            # Every completed check must be green and none may still be
            # running -- the same gate the behind-branch sweep uses, so a
            # review is never dismissed while the fix that addressed it is
            # still validating. StatusContext (legacy commit status) carries
            # `state` instead of CheckRun's status/conclusion.
            if ! jq -e '
              ([.statusCheckRollup[]?] | all(.status == null or .status == "COMPLETED")) and
              ([.statusCheckRollup[]?] | all(
                if has("conclusion") and .conclusion != "" then .conclusion == "SUCCESS"
                elif has("state") then .state == "SUCCESS"
                else true end
              ))
            ' <<<"$VIEW" >/dev/null; then
              continue
            fi

            # An unresolved thread is a reviewer still asking for something --
            # the same guard the behind-branch sweep applies. --paginate so a
            # busier PR's threads past the first 50 are not silently dropped.
            # shellcheck disable=SC2016
            UNRESOLVED=$(gh api graphql --paginate \
              -f query='query($owner:String!,$name:String!,$pr:Int!,$endCursor:String){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){
                    reviewThreads(first:50, after:$endCursor){
                      nodes { isResolved }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' \
              -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)' \
              | wc -l)
            if [ "$UNRESOLVED" -gt 0 ]; then
              echo "PR #$PR is blocked by CHANGES_REQUESTED but has $UNRESOLVED unresolved review thread(s); leaving it for a human."
              continue
            fi

            HEAD_SHA=$(jq -r '.headRefOid' <<<"$VIEW")
            HEAD_DATE=$(gh api "repos/$REPO/commits/$HEAD_SHA" \
              --jq '.commit.committer.date')

            # Select only stale bot-authored requested-changes reviews.
            # submitted_at and the committer date are both ISO-8601 UTC with a
            # trailing Z, so a lexicographic string compare is chronological.
            # `index` returns null for an absent login and 0 for the first --
            # jq treats 0 as truthy, so a login at position 0 still matches.
            REVIEWS=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100")
            STALE_BOT_REVIEWS=$(jq -c \
              --arg head_date "$HEAD_DATE" \
              --argjson bots "$AGENT_BOT_LOGINS" '
              [
                .[]
                | select(.state == "CHANGES_REQUESTED")
                | select(.user.login as $l | $bots | index($l) != null)
                | select(.submitted_at < $head_date)
                | { id, login: .user.login, submitted_at }
              ]
            ' <<<"$REVIEWS")
            STALE_COUNT=$(jq 'length' <<<"$STALE_BOT_REVIEWS")
            if [ "$STALE_COUNT" -eq 0 ]; then
              echo "PR #$PR is CHANGES_REQUESTED but carries no stale bot-authored requested-changes review; leaving it as a live gate."
              continue
            fi

            CANDIDATES=$((CANDIDATES + 1))
            while IFS=$'\t' read -r RID RLOGIN RSUBMITTED; do
              if [ -z "$RID" ]; then
                continue
              fi
              DISMISS_ERR="$RUNNER_TEMP/agent-automerge-review-dismiss-$PR.err"
              if gh api "repos/$REPO/pulls/$PR/reviews/$RID/dismissals" \
                --method PUT \
                --field message="Auto-dismissed by the fleet auto-merge sweep (#1953): this stale requested-changes review ($RLOGIN, submitted $RSUBMITTED) predates the current head $HEAD_SHA; all required checks are green and every review thread is resolved." \
                >/dev/null 2>"$DISMISS_ERR"; then
                echo "Dismissed stale CHANGES_REQUESTED review $RID ($RLOGIN) on PR #$PR."
                DISMISSED=$((DISMISSED + 1))
              else
                echo "::error::Could not dismiss stale CHANGES_REQUESTED review $RID on PR #$PR: $(tr '\n' ' ' <"$DISMISS_ERR")"
                FAILED=$((FAILED + 1))
              fi
              rm -f "$DISMISS_ERR"
            done < <(jq -r '.[] | [.id, .login, .submitted_at] | @tsv' <<<"$STALE_BOT_REVIEWS")
          done

          echo "Stale-bot-review sweep: candidates=$CANDIDATES reviews_dismissed=$DISMISSED failed=$FAILED (cap=$MAX_DISMISSALS)"
          [ "$FAILED" -eq 0 ]

      # #1748: the fleet's `Protect main` ruleset requires an up-to-date
      # head, and GitHub's auto-merge never updates a branch on its own --
      # so once any other PR merges, every armed PR behind it sits forever
      # until a human rebases it (jlapenna/homelab#1121 sat 16h behind a
      # green, armed, no-review-comments PR for exactly this reason). This
      # is the opt-in half of the mechanism: auto-merge already being armed
      # is the opt-in, so this also acts on human-authored PRs.
      # Dependency bots retain ownership of their branches (#2049).
      # Parked (status:needs-human) and draft PRs are left alone, matching the arm step above. A branch update restarts
      # CI, so this only touches a PR whose checks are already green with
      # nothing still running, to avoid manufacturing churn on one that is
      # mid-flight. Bounded to a handful of updates per run so one sweep
      # cannot rewrite half the queue's heads at once.
      - name: Update behind branches of auto-merge-armed PRs
        env:
          GH_TOKEN: ${{ steps.mint-app-token.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MAX_UPDATES=5
          CANDIDATES=0
          UPDATED=0
          FAILED=0

          OPEN_PRS_FILE="$RUNNER_TEMP/agent-automerge-behind-prs.tsv"
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.draft == false) | .number' \
            >"$OPEN_PRS_FILE"
          mapfile -t OPEN_PRS <"$OPEN_PRS_FILE"

          for PR in "${OPEN_PRS[@]}"; do
            if [ "$UPDATED" -ge "$MAX_UPDATES" ]; then
              echo "Reached the per-run cap of $MAX_UPDATES branch update(s); stopping."
              break
            fi

            VIEW=$(GH_TOKEN="$GH_READ_TOKEN" gh pr view "$PR" --repo "$REPO" \
              --json author,autoMergeRequest,labels,mergeStateStatus,statusCheckRollup)

            # Auto-merge armed by anyone is the opt-in for this sweep --
            # unlike the arm step above, this is not limited to agent
            # bot-logins. Dependency bots must rebase under their own identity:
            # a GITHUB_TOKEN update can suppress CI and make Renovate treat
            # the branch as externally modified (#2049).
            if ! jq -e '
              ((.author.login // "" | ascii_downcase) as $author |
                ["renovate[bot]", "app/renovate", "dependabot[bot]", "app/dependabot"] | index($author) == null) and
              .autoMergeRequest != null and
              ([.labels[].name] | index("status:needs-human") == null)
            ' <<<"$VIEW" >/dev/null; then
              continue
            fi

            # Every completed check must be green and none may still be
            # running. A StatusContext (legacy commit status) carries
            # `state` instead of CheckRun's `status`/`conclusion`; handle
            # both GitHub check-run and commit-status shapes.
            if ! jq -e '
              ([.statusCheckRollup[]?] | all(.status == null or .status == "COMPLETED")) and
              ([.statusCheckRollup[]?] | all(
                if has("conclusion") and .conclusion != "" then .conclusion == "SUCCESS"
                elif has("state") then .state == "SUCCESS"
                else true end
              ))
            ' <<<"$VIEW" >/dev/null; then
              continue
            fi

            # A stale UNKNOWN is GitHub still computing mergeability, which
            # is typical right after the push to main that triggered this
            # sweep. Re-view a few times, briefly apart, before giving up on
            # this PR: event-driven callers may not sweep again soon.
            STATUS=$(jq -r '.mergeStateStatus' <<<"$VIEW")
            UNKNOWN_READS=0
            while [ "$STATUS" = UNKNOWN ] && [ "$UNKNOWN_READS" -lt 3 ]; do
              UNKNOWN_READS=$((UNKNOWN_READS + 1))
              sleep 5
              STATUS=$(gh pr view "$PR" --repo "$REPO" \
                --json mergeStateStatus --jq '.mergeStateStatus')
            done
            if [ "$STATUS" != BEHIND ]; then
              continue
            fi
            CANDIDATES=$((CANDIDATES + 1))

            # gh pr view has no reviewThreads field (unlike GraphQL); ask
            # GraphQL directly, the same way the PR-workflow doc's
            # thread-resolution recipe does. --paginate walks every page so
            # a busier PR's threads past the first 50 are not silently
            # dropped.
            # shellcheck disable=SC2016
            UNRESOLVED=$(gh api graphql --paginate \
              -f query='query($owner:String!,$name:String!,$pr:Int!,$endCursor:String){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){
                    reviewThreads(first:50, after:$endCursor){
                      nodes { isResolved }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' \
              -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)' \
              | wc -l)
            if [ "$UNRESOLVED" -gt 0 ]; then
              echo "PR #$PR is BEHIND but has $UNRESOLVED unresolved review thread(s); leaving it for a human."
              continue
            fi

            UPDATE_ERR="$RUNNER_TEMP/agent-automerge-update-branch-$PR.err"
            if gh pr update-branch "$PR" --repo "$REPO" --rebase >/dev/null 2>"$UPDATE_ERR"; then
              METHOD=rebase
            elif gh pr update-branch "$PR" --repo "$REPO" >/dev/null 2>"$UPDATE_ERR"; then
              # The rebase form of the update-branch API is refused for some
              # PRs (e.g. a merge conflict rebase cannot resolve); fall back
              # to GitHub's default merge-commit update rather than leaving
              # the PR stuck.
              echo "::warning::Rebase update-branch was refused for PR #$PR ($(tr '\n' ' ' <"$UPDATE_ERR")); used the default merge update instead."
              METHOD=merge
            else
              echo "::error::Could not update behind branch for PR #$PR: $(tr '\n' ' ' <"$UPDATE_ERR")"
              rm -f "$UPDATE_ERR"
              FAILED=$((FAILED + 1))
              continue
            fi
            rm -f "$UPDATE_ERR"

            NEW_HEAD=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
            echo "Updated behind branch for PR #$PR via $METHOD; new head $NEW_HEAD."
            UPDATED=$((UPDATED + 1))
          done

          echo "Behind-branch update sweep: candidates=$CANDIDATES updated=$UPDATED failed=$FAILED (cap=$MAX_UPDATES)"
          [ "$FAILED" -eq 0 ]
