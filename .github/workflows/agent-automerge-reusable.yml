name: Agent PR Auto-Merge (Reusable)

# Fleet-published reusable workflow (docs/published-actions.md): the whole
# agent auto-merge surface behind one `workflow_call` interface, so every
# fleet repo (agent-lcars, supersprinklesracing/sprinkles, jlapenna/homelab)
# runs the same logic and a fix lands once (#1312 U4). Synthesized from the
# union of this repo's own agent-automerge.yml and sprinkles'
# claude-automerge.yml, which had diverged from a common ancestor:
#
# - From agent-lcars: the AGENT_BOT_LOGINS-membership admission gate (a
#   repo-variable JSON array instead of hardcoded logins), the assert-inputs
#   steps, per-PR concurrency on the arm job, the explicit linked-issue
#   close after a GITHUB_TOKEN merge, and the close-orphaned-anchors cron
#   sweep (with its reopen-respecting timeline check).
# - From sprinkles: latest-run-per-check-name selection (a superseded
#   cancelled/failed run must not poison a healthy replacement, #4165),
#   failure fast-exit with cancellation tolerance (#4400), the targeted
#   post-merge monitor (workflow_dispatch pr/head_sha passthrough for
#   unstrand-style healing), the current-main-descendant safety target for
#   delayed monitors, the post-submit kill switch, and the
#   deploy -> post-deploy-verify run-ID bridge.
#
# The caller owns everything `workflow_call` cannot carry: triggers (the
# cron schedule, pull_request/pull_request_review, the repo's own
# workflow_run workflow names, workflow_dispatch and its targeted-monitor
# inputs), workflow-level permissions, and the per-repo parameter values.
# See agent-automerge.yml for this repo's own caller, which doubles as the
# reference consumer.
#
# Why this exists at all (the shared mechanism): these are private repos
# with a single maintainer, and the rulesets' required_approving_review_count
# is already 0 - a human-review click before merge is pure friction for
# agent-authored PRs, not a security boundary. Any PR whose author is one of
# the caller's known coding-agent bot identities gets squash auto-merge
# enabled the moment a ready PR is opened/marked ready, gated only on the
# ruleset's required checks. A scheduled/manual reconciliation sweep repairs a
# missed event after an Actions outage. GITHUB_TOKEN-authored auto-merges then
# do not emit downstream push workflows, and GITHUB_TOKEN-dispatched workflows do not
# emit workflow_run events, so the restore-main-checks job rebuilds the
# missing main-branch CI/deploy chain explicitly, and close-orphaned-anchors
# sweeps up the linked issues GitHub's own "Closes #N" handling never closes
# for GITHUB_TOKEN merges (measured repeatedly - see the step comments).
#
# Contract guardrails: a reusable workflow's `on.workflow_call` surface is
# not covered by published-actions.contract.test.mjs (composite actions
# only); this file's contract is guarded by actionlint, by review of this
# inputs block, and by tools/contract-tests/ - worker-workflow-contract.test.ts
# pins the admission gates, and agent-automerge-required-checks.test.ts
# executes the embedded jq check-evaluation programs against fixtures
# (ported from sprinkles' claude-automerge-required-checks.test.cjs when the
# logic moved here).

on:
  workflow_call:
    inputs:
      bot-logins:
        description: >-
          JSON array of REST-shaped bot logins (e.g.
          '["claude[bot]","agent-lcars[bot]"]') whose PRs are auto-merged --
          pass the caller's AGENT_BOT_LOGINS repo variable. REST shape is
          canonical (docs/bot-identity-formats.md).
        required: true
        type: string
      fleet-login:
        description: >-
          Assignable fleet-claim login (agent-lcars-bot) recorded as the
          assignee of agent-authored PRs -- pass the caller's
          AGENT_FLEET_LOGIN repo variable.
        required: true
        type: string
      runs-on:
        description: >-
          Runner labels as a JSON array string, passed straight to
          fromJSON(). Use a small glue pool, never the pool backing long
          agent sessions -- this job must not queue behind an in-flight
          agent run.
        required: true
        type: string
      required-checks:
        description: >-
          JSON array of the ruleset's required status-check context names
          (e.g. '["Verify"]') that gate the merge and that
          restore-main-checks waits on.
        required: true
        type: string
      ci-workflow:
        description: >-
          Workflow file whose main-branch run is restored (dispatched) after
          a GITHUB_TOKEN merge when missing, and whose success gates the
          deploy chain below. Empty disables the restore chain entirely.
        required: false
        type: string
        default: ci.yml
      extra-main-workflows:
        description: >-
          JSON array of additional workflow files restored on main
          (fire-and-forget) when missing, e.g. sprinkles' '["e2e.yml"]'.
          Skipped when post-submit-enabled is not 'true'.
        required: false
        type: string
        default: '[]'
      deploy-workflow:
        description: >-
          Workflow file dispatched on main after the restored ci-workflow
          run succeeds (GITHUB_TOKEN chains suppress the natural
          workflow_run trigger). Empty disables the deploy restore.
        required: false
        type: string
        default: ''
      post-deploy-verify-workflow:
        description: >-
          Workflow file dispatched with `-f deploy_run_id=<id>` after the
          restored deploy run reaches a terminal conclusion (success or
          failure). Requires deploy-workflow. Empty disables the bridge and
          the deploy run is dispatched fire-and-forget instead.
        required: false
        type: string
        default: ''
      post-submit-enabled:
        description: >-
          Post-submit kill switch ('true' to enable). Anything else skips
          restoring extra-main-workflows and the deploy chain -- pass the
          caller's POST_SUBMIT_ENABLED repo variable if it has one.
        required: false
        type: string
        default: 'true'
      check-wait-minutes:
        description: >-
          How long the persistent restore paths (pull_request and targeted
          workflow_dispatch monitors) wait for the required checks before
          erroring. A cancelled check is retriable, not terminal, so a repo
          with an auto-rerun healer should budget past its retry window.
        required: false
        type: number
        default: 20
      restore-timeout-minutes:
        description: >-
          timeout-minutes for the restore-main-checks job. Budget
          check-wait-minutes plus the restored CI and deploy runs' own
          durations.
        required: false
        type: number
        default: 45
      monitor-pr:
        description: >-
          Targeted post-merge monitor -- agent-authored PR number to watch.
          Forward the caller's own workflow_dispatch `pr` input here (an
          unstrand-style healer dispatches it explicitly because
          GITHUB_TOKEN-created PR runs can never emit workflow_run). Empty
          on every other event; a plain workflow_dispatch with this empty
          runs the orphaned-anchor sweep instead.
        required: false
        type: string
        default: ''
      monitor-head-sha:
        description: >-
          Targeted post-merge monitor -- the exact PR head whose checks
          must become green. Forward the caller's workflow_dispatch
          `head_sha` input alongside monitor-pr.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  automerge:
    # The event guard is redundant for scheduled runs (a scheduled run has
    # no `pull_request` payload, so the login check already fails) but
    # explicit: this job must never look like it could fire off a caller's
    # cron. The membership test reads the caller-supplied JSON directly
    # (fromJSON, no fallback), so an empty bot-logins fails loudly here
    # rather than skipping silently.
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      contains(fromJSON(inputs.bot-logins), github.event.pull_request.user.login) &&
      github.event.pull_request.draft == false &&
      (github.event_name != 'pull_request_review' ||
       github.event.review.state == 'approved')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # `pull_request:[opened]` and `pull_request_review:[submitted]` for the
    # same PR can both land here close together; without a per-PR group
    # their `gh pr ready`/`gh pr merge --auto` calls race. Serialize per PR
    # rather than dropping either invocation.
    concurrency:
      group: automerge-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # This job's own `if:` above also reads bot-logins. A step can only
      # run once the job has already started, so this assert cannot make an
      # empty bot-logins loud on a run the `if:` itself would otherwise
      # skip - it only guarantees the loud failure on runs that do reach
      # this step.
      - name: Assert required inputs are set
        env:
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
          AGENT_FLEET_LOGIN: ${{ inputs.fleet-login }}
        run: |
          missing=""
          [ -z "$AGENT_BOT_LOGINS" ] && missing="$missing bot-logins"
          [ -z "$AGENT_FLEET_LOGIN" ] && missing="$missing fleet-login"
          if [ -n "$missing" ]; then
            echo "::error::Missing required workflow input(s):$missing"
            exit 1
          fi

      # Ownership spine, matching the fleet lanes' own "Claim the issue as
      # agent-lcars-bot" step: agent-authored PRs carry the fleet's assignee
      # just like the anchor issues they came from. The fleet login is the
      # assignee because bot App identities (claude[bot]) are not assignable
      # users - the assignees API silently drops them. Additive and
      # idempotent; non-blocking so a hiccup can't cost the auto-merge arm
      # below.
      - name: Claim the PR as the fleet login
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FLEET_LOGIN: ${{ inputs.fleet-login }}
        run: |
          jq -cn --arg login "$FLEET_LOGIN" '{assignees: [$login]}' |
            gh api "repos/$REPO/issues/$PR/assignees" \
              --method POST --input - >/dev/null \
            || echo "::warning::Could not assign $FLEET_LOGIN to #$PR"

      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR" --repo "$REPO" --auto --squash

          gh pr view "$PR" --repo "$REPO" --json state,autoMergeRequest \
            --jq 'if .state == "MERGED" or .autoMergeRequest != null then . else error("auto-merge is not armed") end'

  # Event delivery is not durable across an Actions outage. Workers own the
  # primary arm, and this sweep is the independent repair path for an agent
  # that timed out before handoff or a pull_request event that never ran. It
  # intentionally leaves drafts alone: draft is the fleet's parked/WIP state.
  reconcile-automerge:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.monitor-pr == '')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: agent-automerge-reconcile-open-prs
      cancel-in-progress: false
    steps:
      - name: Assert required inputs are set
        env:
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
        run: |
          if [ -z "$AGENT_BOT_LOGINS" ]; then
            echo "::error::Missing required workflow input: bot-logins"
            exit 1
          fi
          if ! jq -e 'type == "array" and all(.[]; type == "string")' \
            <<<"$AGENT_BOT_LOGINS" >/dev/null; then
            echo "::error::bot-logins must be a JSON array of strings"
            exit 1
          fi

      - name: Arm ready open agent PRs missed by event delivery
        env:
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          OPEN_PRS_FILE="$RUNNER_TEMP/agent-automerge-open-prs.tsv"
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .user.login, .draft] | @tsv' \
            >"$OPEN_PRS_FILE"
          mapfile -t OPEN_PRS <"$OPEN_PRS_FILE"

          CHECKED=0
          ARMED=0
          FAILED=0
          for ROW in "${OPEN_PRS[@]}"; do
            IFS=$'\t' read -r PR AUTHOR DRAFT <<<"$ROW"
            if [ "$DRAFT" = true ] || \
               ! jq -e --arg login "$AUTHOR" 'index($login) != null' \
                 <<<"$AGENT_BOT_LOGINS" >/dev/null; then
              continue
            fi

            CHECKED=$((CHECKED + 1))
            VIEW=$(gh pr view "$PR" --repo "$REPO" --json state,autoMergeRequest)
            if jq -e '.state == "MERGED" or .autoMergeRequest != null' \
              <<<"$VIEW" >/dev/null; then
              echo "PR #$PR is already merged or auto-merge-armed."
              continue
            fi

            if ! gh pr merge "$PR" --repo "$REPO" --auto --squash; then
              echo "::error::Could not arm auto-merge for agent PR #$PR."
              FAILED=$((FAILED + 1))
              continue
            fi

            VIEW=$(gh pr view "$PR" --repo "$REPO" --json state,autoMergeRequest)
            if jq -e '.state == "MERGED" or .autoMergeRequest != null' \
              <<<"$VIEW" >/dev/null; then
              echo "Armed squash auto-merge for agent PR #$PR."
              ARMED=$((ARMED + 1))
            else
              echo "::error::PR #$PR remained open without auto-merge after the arm command."
              FAILED=$((FAILED + 1))
            fi
          done

          echo "Reconciliation checked=$CHECKED armed=$ARMED failed=$FAILED"
          [ "$FAILED" -eq 0 ]

  restore-main-checks:
    # Three ways in: a workflow_run completion (the fast path - only fires
    # when a human push triggered the PR's CI), the original pull_request
    # invocation (the persistent path for GITHUB_TOKEN-created PRs, whose
    # CI completions cannot emit workflow_run), and a targeted
    # workflow_dispatch monitor (an unstrand-style healer naming pr +
    # head_sha explicitly).
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.monitor-pr != '') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       contains(fromJSON(inputs.bot-logins), github.event.pull_request.user.login))
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.restore-timeout-minutes }}
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: agent-postmerge-${{ inputs.monitor-head-sha || github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    steps:
      # Same partial guarantee as the automerge job's assert: it fires only
      # on runs the job-level `if:` admitted, but on those it names every
      # missing input at once instead of failing on the first use.
      - name: Assert required inputs are set
        env:
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
        run: |
          missing=""
          [ -z "$AGENT_BOT_LOGINS" ] && missing="$missing bot-logins"
          [ -z "$REQUIRED_CHECKS" ] && missing="$missing required-checks"
          if [ -n "$missing" ]; then
            echo "::error::Missing required workflow input(s):$missing"
            exit 1
          fi
          if [ "$(jq 'length' <<<"$REQUIRED_CHECKS")" -eq 0 ]; then
            echo "::error::required-checks must name at least one check; an empty list would report green vacuously."
            exit 1
          fi

      - name: Dispatch missing post-merge CI/deploy runs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.monitor-head-sha || github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ inputs.monitor-pr || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          EXTRA_MAIN_WORKFLOWS: ${{ inputs.extra-main-workflows }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow }}
          POST_DEPLOY_VERIFY_WORKFLOW: ${{ inputs.post-deploy-verify-workflow }}
          POST_SUBMIT_ENABLED: ${{ inputs.post-submit-enabled }}
          CHECK_WAIT_MINUTES: ${{ inputs.check-wait-minutes }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            # A GITHUB_TOKEN-created PR can run CI, but that run does not
            # emit a workflow_run event. Keep the original PR-triggered job,
            # and any targeted monitor dispatched by an unstrand-style
            # healer, alive so either can observe the checks and restore the
            # merge chain.
            PR="$EVENT_PR"
            WAIT_FOR_CHECKS=true
          else
            PR=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq 'map(select(.state == "open" or .merged_at != null))[0].number // empty')
            WAIT_FOR_CHECKS=false
          fi
          if [ -z "$PR" ]; then
            echo "No pull request is associated with $HEAD_SHA; nothing to restore."
            exit 0
          fi

          # REST endpoint on purpose: the REST login shape (claude[bot]) is
          # what AGENT_BOT_LOGINS declares - see docs/bot-identity-formats.md
          # for the GraphQL (app/claude) mismatch this avoids.
          AUTHOR=$(gh api "repos/$REPO/pulls/$PR" --jq '.user.login')
          if ! jq -e --arg a "$AUTHOR" 'index($a) != null' <<<"$AGENT_BOT_LOGINS" >/dev/null; then
            echo "PR #$PR is not agent-authored ($AUTHOR); nothing to restore."
            exit 0
          fi

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            CURRENT_HEAD=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
            if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
              echo "Targeted monitor for #$PR@$HEAD_SHA was superseded by $CURRENT_HEAD; the current-head dispatch remains responsible."
              exit 0
            fi
          fi

          # workflow_run invocations exit unless they can already observe
          # every required check green. The persistent paths wait
          # check-wait-minutes for the same gate.
          #
          # A cancelled check is not terminal: an auto-rerun healer can
          # replace it after runner capacity returns (sprinkles#4400), so
          # cancellation is deliberately excluded from the failure exit.
          #
          # GitHub retains every historical check run under a context name,
          # including ones superseded by a later run on the same exact PR
          # head (e.g. a cancelled Verify run followed by a replacement
          # that succeeds). Aggregating all of them would let a stale
          # cancelled/failed run permanently poison a healthy replacement
          # (sprinkles#4165), so select only the single authoritative
          # latest run per required name - ordered by its own startedAt
          # timestamp, with the numeric run ID parsed from detailsUrl as a
          # tiebreaker for identical timestamps - before ever asking
          # whether the required checks are green or failed.
          CHECKS_GREEN=false
          CHECKS_FAILED=false
          CHECKS='[]'
          for _ in $(seq 1 $((CHECK_WAIT_MINUTES * 12))); do
            if ! ROLLUP=$(gh pr view "$PR" --repo "$REPO" --json statusCheckRollup); then
              echo "::warning::gh pr view failed for #$PR; retrying."
              sleep 5
              continue
            fi
            CHECKS=$(jq -c --argjson req "$REQUIRED_CHECKS" '
              [.statusCheckRollup[] | select(.name as $required | $req | index($required) != null)]
              | map(. + {runId: ((.detailsUrl // "")
                  | (try capture("/runs/(?<id>[0-9]+)").id catch "0") | tonumber)})
              | group_by(.name)
              | map(sort_by(.startedAt, .runId) | last)
              | map({name, conclusion})
            ' <<<"$ROLLUP")
            if jq -e --argjson req "$REQUIRED_CHECKS" '
              . as $latest
              | $req | all(. as $name
                  | $latest | any(.name == $name and .conclusion == "SUCCESS"))
            ' <<<"$CHECKS" >/dev/null; then
              CHECKS_GREEN=true
              break
            fi
            # A failed, timed-out, or startup-failed check cannot recover
            # on its own; stop waiting. Cancellation deliberately keeps
            # waiting - see above.
            if jq -e '
              map(select(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT"
                         or .conclusion == "STARTUP_FAILURE"))
              | length > 0
            ' <<<"$CHECKS" >/dev/null; then
              CHECKS_FAILED=true
              break
            fi
            [ "$WAIT_FOR_CHECKS" = true ] || break
            sleep 5
          done
          if [ "$CHECKS_GREEN" != true ]; then
            if [ "$CHECKS_FAILED" = true ]; then
              echo "::error::PR #$PR has a required check that concluded unsuccessfully:"
              jq -c '.[]' <<<"$CHECKS"
              exit 1
            fi
            if [ "$WAIT_FOR_CHECKS" = true ]; then
              echo "::error::PR #$PR did not produce green required checks within $CHECK_WAIT_MINUTES minutes."
              exit 1
            fi
            echo "PR #$PR does not have every required check green yet."
            exit 0
          fi

          # Auto-merge normally fires immediately after the last required
          # check. Give GitHub up to two minutes to publish the merge
          # commit.
          MERGE_SHA=""
          for _ in $(seq 1 24); do
            MERGE_SHA=$(gh pr view "$PR" --repo "$REPO" --json state,mergeCommit \
              --jq 'if .state == "MERGED" then .mergeCommit.oid // "" else "" end')
            [ -n "$MERGE_SHA" ] && break
            sleep 5
          done
          if [ -z "$MERGE_SHA" ]; then
            echo "::warning::PR #$PR is green but did not merge within two minutes; auto-merge remains responsible."
            exit 0
          fi

          # Close the PR's linked issues ourselves.
          #
          # GitHub is supposed to do this: "Closes #N" in an agent-authored
          # PR body creates a real link, and merging is supposed to close
          # it. It does for a human merge and has never once worked for a
          # GITHUB_TOKEN `gh pr merge --auto` (agent-lcars#214 measured two
          # clean negative data points even with issues:write granted).
          #
          # So stop relying on the platform for it. `closingIssuesReferences`
          # is GitHub's own resolution of the closing keywords, so this
          # closes exactly what the PR declared - no keyword regex of our
          # own to drift. Filtering to OPEN keeps it idempotent across the
          # pull_request and workflow_run invocations, which both reach
          # here. A swallowed failure here would reproduce the exact bug
          # this step exists to fix - an empty result and an anchor left
          # open, with nothing in the log saying why - so retry, and if it
          # still fails, say so loudly. Empty output with a zero exit is
          # the legitimate "this PR closes nothing" case and is not
          # retried.
          LINKED=""
          LOOKUP_OK=false
          GQL_ERR=$(mktemp)
          for attempt in 1 2 3; do
            # SC2016: the $owner/$name/$pr below are GraphQL variables bound
            # by the -F flags, not shell expansions - single quotes required.
            # shellcheck disable=SC2016
            if LINKED=$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$pr:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){
                    closingIssuesReferences(first:20){nodes{number state}}}}}' \
              -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                    | select(.state == "OPEN") | .number' 2>"$GQL_ERR"); then
              LOOKUP_OK=true
              break
            fi
            LINKED=""
            echo "::warning::Linked-issue lookup for PR #$PR failed (attempt $attempt/3): $(tr '\n' ' ' <"$GQL_ERR")"
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          rm -f "$GQL_ERR"
          if [ "$LOOKUP_OK" != true ]; then
            echo "::warning::Could not determine which issues PR #$PR closes; any anchor it declared stays open and needs closing by hand."
          fi

          for ISSUE in $LINKED; do
            if gh issue close "$ISSUE" --repo "$REPO" \
              --comment "Closed by #$PR ($MERGE_SHA)." >/dev/null 2>&1; then
              echo "Closed #$ISSUE, linked from merged PR #$PR."
            else
              echo "::warning::Could not close #$ISSUE, linked from merged PR #$PR."
            fi
          done

          if [ -z "$CI_WORKFLOW" ]; then
            echo "No ci-workflow is configured; the restore chain is disabled."
            exit 0
          fi

          # A delayed monitor can wake after later PRs have already
          # advanced main. workflow_dispatch always runs the workflow from
          # the named ref's CURRENT commit, so waiting for a newly
          # dispatched run on an older merge SHA would be impossible. Prove
          # main still contains this PR, then reuse/restore the safety
          # chain at the current descendant SHA instead.
          SAFETY_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          MAIN_RELATION=$(gh api "repos/$REPO/compare/$MERGE_SHA...$SAFETY_SHA" --jq '.status')
          case "$MAIN_RELATION" in
            identical | ahead) ;;
            *)
              echo "::error::Current main $SAFETY_SHA does not descend from merged PR #$PR ($MERGE_SHA); refusing to restore checks on an unrelated commit."
              exit 1
              ;;
          esac
          if [ "$SAFETY_SHA" != "$MERGE_SHA" ]; then
            echo "PR #$PR merged at $MERGE_SHA; current main descendant $SAFETY_SHA is the safety-net target."
          fi

          # Natural human/App merges already emit push runs. GITHUB_TOKEN
          # merges do not, so dispatch only the missing workflow(s). The
          # post-submit kill switch suppresses the extra workflows and the
          # deploy chain but never the main-branch CI safety net. Concurrent
          # invocations serialize through the job concurrency group above,
          # so the second sees the runs created by the first, preventing
          # duplicate dispatches.
          sleep 10
          CI_DISPATCHED=false
          WORKFLOWS=("$CI_WORKFLOW")
          if [ "$POST_SUBMIT_ENABLED" != "true" ]; then
            echo "::notice title=Post-submit disabled::Skipping recovery dispatch for the extra main workflows."
          else
            while read -r EXTRA; do
              [ -n "$EXTRA" ] && WORKFLOWS+=("$EXTRA")
            done < <(jq -r '.[]' <<<"$EXTRA_MAIN_WORKFLOWS")
          fi
          for WORKFLOW in "${WORKFLOWS[@]}"; do
            COUNT=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW/runs?branch=main&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$SAFETY_SHA\")] | length")
            if [ "$COUNT" -eq 0 ]; then
              echo "Dispatching missing $WORKFLOW for merged PR #$PR at safety target $SAFETY_SHA."
              gh workflow run "$WORKFLOW" --repo "$REPO" --ref main
              [ "$WORKFLOW" = "$CI_WORKFLOW" ] && CI_DISPATCHED=true
            else
              echo "$WORKFLOW already has a main run for safety target $SAFETY_SHA."
            fi
          done

          if [ "$CI_DISPATCHED" != true ]; then
            echo "$CI_WORKFLOW already has a main run for $SAFETY_SHA; its own event chain owns the rest."
            exit 0
          fi

          # A workflow dispatched with GITHUB_TOKEN may run other
          # workflows, but its completion does not emit another
          # workflow_run event, and its own event type (workflow_dispatch,
          # not push) would fail a deploy listener's `event == 'push'` gate
          # anyway - wait for the exact restored run and dispatch the
          # deploy explicitly instead of relying on the chain.
          CI_RUN=""
          for _ in $(seq 1 24); do
            CI_RUN=$(gh api "repos/$REPO/actions/workflows/$CI_WORKFLOW/runs?branch=main&event=workflow_dispatch&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$SAFETY_SHA\")][0].id // empty")
            [ -n "$CI_RUN" ] && break
            sleep 5
          done
          if [ -z "$CI_RUN" ]; then
            echo "::error::The restored main $CI_WORKFLOW run for $SAFETY_SHA did not appear."
            exit 1
          fi

          # `read ... < <(gh ...)` (process substitution) runs the command
          # in a subshell whose exit status `set -e`/`pipefail` cannot see,
          # so a transient `gh` failure would leave CI_STATUS/CI_CONCLUSION
          # holding the PREVIOUS iteration's values (or produce a ragged
          # TSV from an empty conclusion) instead of failing loud. Capture
          # the output into a variable first with an explicit check, and
          # clear both vars every iteration so a failed attempt can't leak
          # a stale "completed"/"success" into the comparison below.
          CI_STATUS="" CI_CONCLUSION=""
          for _ in $(seq 1 180); do
            CI_STATUS="" CI_CONCLUSION=""
            if ! CI_VIEW=$(gh run view "$CI_RUN" --repo "$REPO" \
              --json status,conclusion --jq '[.status, (.conclusion // "")] | @tsv'); then
              echo "::warning::gh run view failed for run $CI_RUN; retrying."
              sleep 5
              continue
            fi
            read -r CI_STATUS CI_CONCLUSION <<<"$CI_VIEW"
            [ "$CI_STATUS" = completed ] && break
            sleep 5
          done
          if [ "$CI_STATUS" != completed ] || [ "$CI_CONCLUSION" != success ]; then
            echo "::error::Restored main CI run $CI_RUN ended status=$CI_STATUS conclusion=$CI_CONCLUSION; the deploy chain remains gated."
            exit 1
          fi

          if [ -z "$DEPLOY_WORKFLOW" ]; then
            echo "Restored main CI run $CI_RUN succeeded; no deploy workflow is configured."
            exit 0
          fi
          if [ "$POST_SUBMIT_ENABLED" != "true" ]; then
            echo "::notice title=Post-submit disabled::Skipping recovery dispatch for automatic deployment."
            exit 0
          fi

          DEPLOY_COUNT=$(gh api "repos/$REPO/actions/workflows/$DEPLOY_WORKFLOW/runs?branch=main&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$SAFETY_SHA\")] | length")
          if [ "$DEPLOY_COUNT" -gt 0 ]; then
            echo "$DEPLOY_WORKFLOW already has a run for safety target $SAFETY_SHA."
            exit 0
          fi

          if [ -z "$POST_DEPLOY_VERIFY_WORKFLOW" ]; then
            echo "Main CI run $CI_RUN passed; dispatching the missing $DEPLOY_WORKFLOW run."
            gh workflow run "$DEPLOY_WORKFLOW" --repo "$REPO" --ref main
            exit 0
          fi

          # The deploy can legitimately conclude failure after some targets
          # shipped, so the verifier accepts both success and failure and
          # relies on its own per-issue safety checks. workflow_dispatch
          # resolves --ref main at dispatch time, so capture the run URL
          # returned by gh instead of trying to rediscover the run using
          # SAFETY_SHA after main moves.
          echo "Main CI run $CI_RUN passed; dispatching the missing $DEPLOY_WORKFLOW run."
          DEPLOY_URL=$(gh workflow run "$DEPLOY_WORKFLOW" --repo "$REPO" --ref main)
          DEPLOY_RUN=${DEPLOY_URL##*/}
          if [ -z "$DEPLOY_URL" ] || ! [[ "$DEPLOY_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::Dispatching the restored deploy did not return a run URL (got: $DEPLOY_URL)."
            exit 1
          fi

          DEPLOY_STATUS="" DEPLOY_CONCLUSION=""
          for _ in $(seq 1 360); do
            DEPLOY_STATUS="" DEPLOY_CONCLUSION=""
            if ! DEPLOY_VIEW=$(gh run view "$DEPLOY_RUN" --repo "$REPO" \
              --json status,conclusion --jq '[.status, (.conclusion // "")] | @tsv'); then
              echo "::warning::gh run view failed for run $DEPLOY_RUN; retrying."
              sleep 5
              continue
            fi
            read -r DEPLOY_STATUS DEPLOY_CONCLUSION <<<"$DEPLOY_VIEW"
            [ "$DEPLOY_STATUS" = completed ] && break
            sleep 5
          done
          if [ "$DEPLOY_STATUS" != completed ] || \
             { [ "$DEPLOY_CONCLUSION" != success ] && [ "$DEPLOY_CONCLUSION" != failure ]; }; then
            echo "::error::Restored deploy run $DEPLOY_RUN ended status=$DEPLOY_STATUS conclusion=$DEPLOY_CONCLUSION."
            exit 1
          fi

          echo "Restored deploy run $DEPLOY_RUN is terminal ($DEPLOY_CONCLUSION); dispatching post-deploy verification."
          gh workflow run "$POST_DEPLOY_VERIFY_WORKFLOW" --repo "$REPO" --ref main \
            -f deploy_run_id="$DEPLOY_RUN"

  # Backstop for the reach gap the trigger comments in the caller describe:
  # the inline close in restore-main-checks is the fast path, but it only
  # runs when its own event fired, which a bot-triggered CI run does not
  # emit. This sweep does not depend on any event cascade, so it catches
  # the anchors that path never reaches. It runs on the caller's cron and
  # on a plain workflow_dispatch (one without targeted-monitor inputs).
  close-orphaned-anchors:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.monitor-pr == '')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: read
    # Runs on a cron and on workflow_dispatch with no group of its own; a
    # static group serializes overlapping runs (defense in depth alongside
    # the $RUNNER_TEMP isolation below, which keeps a still-possible
    # overlap from clobbering shared state).
    concurrency:
      group: agent-automerge-close-orphaned-anchors
      cancel-in-progress: false
    steps:
      # This job's `if:` above does not consume bot-logins, so unlike the
      # assert steps in the other two jobs in this file, this one is a
      # full guarantee: every run of this job reaches this step.
      - name: Assert required inputs are set
        env:
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
        run: |
          if [ -z "$AGENT_BOT_LOGINS" ]; then
            echo "::error::Missing required workflow input: bot-logins"
            exit 1
          fi

      - name: Close open anchors of recently-merged agent PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AGENT_BOT_LOGINS: ${{ inputs.bot-logins }}
        run: |
          set -euo pipefail

          # Bounded to a day: an issue the maintainer deliberately reopens
          # long after its PR merged must not be re-closed forever by a cron.
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          # Belt-and-suspenders alongside the job-level concurrency group
          # above: a fixed /tmp path let one overlapping run's write clobber
          # another's read mid-sweep. $RUNNER_TEMP is unique per job run, so
          # use that instead.
          MERGED_JSON="$RUNNER_TEMP/agent-automerge-merged.json"

          # `gh pr list --json author` answers in the GRAPHQL shape
          # (`app/claude`) while AGENT_BOT_LOGINS is REST-shaped
          # (`claude[bot]`) - comparing them raw is exactly the silent
          # mismatch that broke agent-lcars#175, and
          # docs/bot-identity-formats.md makes REST canonical. Normalize
          # before the membership test.
          gh pr list --repo "$REPO" --state merged --limit 50 \
            --json number,author,mergedAt,closingIssuesReferences >"$MERGED_JSON"

          CANDIDATES=$(jq -r --argjson bots "$AGENT_BOT_LOGINS" --arg since "$SINCE" '
            .[]
            | select(.mergedAt > $since)
            | .author.login as $raw
            | (if ($raw | startswith("app/")) then ($raw[4:] + "[bot]") else $raw end) as $login
            | select($bots | index($login) != null)
            | . as $pr
            | .closingIssuesReferences[]?
            | "\($pr.number) \(.number) \($pr.mergedAt)"
          ' "$MERGED_JSON")

          if [ -z "$CANDIDATES" ]; then
            echo "No agent PRs merged since $SINCE declared a closing issue."
            exit 0
          fi

          # A sweep that reports nothing is indistinguishable from a sweep
          # that never ran - the failure mode this whole mechanism exists to
          # correct. Always print what was examined.
          CHECKED=0 CLOSED=0 KEPT=0 FAILED=0

          while read -r PR ISSUE MERGED_AT; do
            [ -n "${ISSUE:-}" ] || continue
            CHECKED=$((CHECKED + 1))

            STATE=$(gh issue view "$ISSUE" --repo "$REPO" --json state --jq .state 2>/dev/null || echo "")
            if [ "$STATE" != OPEN ]; then
              continue
            fi

            # Respect a deliberate reopen: if someone reopened this after the
            # PR merged, they want it open and the sweep must not fight them.
            #
            # `--paginate --jq` runs the filter once PER PAGE and concatenates
            # the results, so a long timeline yields "0\n1" and the numeric
            # test below dies with "integer expression expected" - falling
            # through to the close path and re-closing a reopened issue on
            # every sweep. `--slurp` aggregates the pages, but gh (2.96.0)
            # rejects `--slurp` together with `--jq`, so the aggregation has
            # to happen in a real jq downstream of it.
            #
            # A lookup failure must skip, not default to "no reopens": under
            # `set -o pipefail` the `if !` catches it. Guessing here would
            # close an issue precisely when we cannot tell whether someone
            # reopened it on purpose.
            if ! REOPENED=$(gh api "repos/$REPO/issues/$ISSUE/timeline" --paginate --slurp 2>/dev/null \
              | jq --arg merged "$MERGED_AT" \
                '[.[][] | select(.event == "reopened" and .created_at > $merged)] | length'); then
              echo "::warning::Could not read #$ISSUE's timeline; leaving it open rather than guessing."
              KEPT=$((KEPT + 1))
              continue
            fi
            if [ "${REOPENED:-0}" -gt 0 ]; then
              echo "#$ISSUE was reopened after PR #$PR merged; leaving it open."
              KEPT=$((KEPT + 1))
              continue
            fi

            if gh issue close "$ISSUE" --repo "$REPO" \
              --comment "Closed by #$PR, which declared it and has merged." >/dev/null 2>&1; then
              echo "Swept: closed #$ISSUE, linked from merged PR #$PR."
              CLOSED=$((CLOSED + 1))
            else
              echo "::warning::Could not close #$ISSUE, linked from merged PR #$PR."
              FAILED=$((FAILED + 1))
            fi
          done <<< "$CANDIDATES"

          echo "Sweep since $SINCE: $CHECKED linked anchor(s) examined, $CLOSED closed, $KEPT left open (reopened after merge, or timeline unreadable), $FAILED close attempt(s) failed."
          if [ "$CLOSED" -gt 0 ]; then
            echo "::warning::Swept $CLOSED anchor(s) the inline close in restore-main-checks did not reach."
          fi
