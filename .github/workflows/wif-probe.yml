name: wif-probe

# Temporary diagnostic for #1368. Deleted once the token read is fixed.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate exactly as the lane does
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/611425338852/locations/global/workloadIdentityPools/github/providers/github
          service_account: claude-token-reader@agent-lcars.iam.gserviceaccount.com
          token_format: access_token
          export_environment_variables: false

      - name: Who am I, and what does the API actually say
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "--- tokeninfo (identity behind the token) ---"
          curl -s "https://oauth2.googleapis.com/tokeninfo?access_token=$TOKEN" | tr ',' '\n' | grep -viE 'access_token|"exp"' || true
          echo "--- secret read attempt (status + body) ---"
          code=$(curl -s -o /tmp/body.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://secretmanager.googleapis.com/v1/projects/agent-lcars/secrets/CLAUDE_CODE_OAUTH_TOKEN/versions/latest:access")
          echo "HTTP $code"
          # Redact the payload; print only the error envelope.
          python3 -c "
import json,sys
d=json.load(open('/tmp/body.json'))
if 'error' in d: print(json.dumps(d['error'], indent=2)[:1500])
else: print('SUCCESS: payload present, length', len(d.get('payload',{}).get('data','')))
"
