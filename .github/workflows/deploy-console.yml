name: Deploy console

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact CI-validated revision for recovered deployment
        required: false
        type: string
      delivery_mode:
        description: Recovery provenance (recovered-ci for auto-merge repair)
        required: false
        type: string

# The reusable auto-merge recovery reads this source marker from Actions run
# metadata; keep it identical to the revision checked out and annotated below.
run-name: Deploy console [source:${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}]

permissions:
  contents: read
  actions: read
  id-token: write
  pull-requests: write

jobs:
  # CI's workflow_run conclusion is a rollup of every job in that run,
  # including E2E (timeout-minutes: 30, not a required merge gate) -- a
  # timed-out E2E job reports "cancelled", which drags the whole run's
  # conclusion to "cancelled" even when Verify (the actual required check
  # gating the merge that triggered this run) passed cleanly (#543). Gate
  # deploy on Verify's own job conclusion instead of the run's rollup, so a
  # slow/hung non-required job can't silently block production deploys.
  gate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    # This GitHub-only check must not wait for large fleet-runner placement.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      verify_passed: ${{ steps.check.outputs.verify_passed }}
    steps:
      - name: Check Verify job's conclusion
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "verify_passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Verify") | .conclusion')
          echo "Verify job conclusion for run $RUN_ID: '$CONCLUSION'"

          if [ "$CONCLUSION" = "success" ]; then
            echo "verify_passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "verify_passed=false" >> "$GITHUB_OUTPUT"

          # Superseded, not failed (#2872): CI's main concurrency group keeps
          # one pending push run, so a newer merge cancels the waiting one
          # before Verify starts. Its source reaches production through the
          # descendant's own CI and deploy. Skip only when the newest main CI
          # push run is for a strict descendant; this never admits a deploy,
          # and any other non-success Verify still fails the gate.
          if [ "$RUN_CONCLUSION" = "cancelled" ] &&
             { [ -z "$CONCLUSION" ] || [ "$CONCLUSION" = "cancelled" ]; }; then
            LATEST=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty')
            if [ -n "$LATEST" ] && [ "$LATEST" != "$HEAD_SHA" ] &&
               [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...$LATEST" --jq .status)" = "ahead" ]; then
              echo "::notice::CI run $RUN_ID for $HEAD_SHA was superseded by main CI for descendant $LATEST; skipping deploy."
              exit 0
            fi
          fi

          echo "::error::Verify did not pass for CI run $RUN_ID (conclusion: '${CONCLUSION:-missing}')."
          exit 1

  build:
    needs: gate
    if: needs.gate.outputs.verify_passed == 'true'
    # Native amd64 construction within the hosted lane's complete
    # 1 CPU / 5 GiB / 14 GiB / 15-minute envelope. No remote builder.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      image_digest: ${{ steps.package.outputs.image_digest }}
      tar_sha256: ${{ steps.package.outputs.tar_sha256 }}
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      NX_PARALLEL: '1'
      LCARS_CONSOLE_BUILD_CPUS: '1'
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install pinned OCI tooling
        run: |
          bash tools/install-crane.sh "$RUNNER_TEMP/console-bin"
          echo "$RUNNER_TEMP/console-bin" >> "$GITHUB_PATH"
      - name: Build and verify the Console image
        id: package
        run: |
          node tools/build-console-container.mjs .console-deploy
          echo "image_digest=$(jq -r .imageDigest .console-deploy/image.json)" >> "$GITHUB_OUTPUT"
          echo "tar_sha256=$(jq -r .tarSha256 .console-deploy/image.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: console-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: .console-deploy
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.verify_passed == 'true'
    # Ineligible CI completions must not replace a pending main deployment
    # before gate.if runs. Serialize only deployments admitted by the gate.
    concurrency:
      group: deploy-console
      cancel-in-progress: false
      # Keep newer eligible work when an older gate finishes late. Source
      # freshness is checked again after this FIFO queue grants the lock.
      queue: max
    # Import and rollout only: the independent build job owns construction.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    environment: production

    steps:
      # A green source may trail an unverified main tip. Admit forward
      # movement from the last actual rollout, not exact equality with tip.
      # Keep this inside the lock, before credentials or rollout effects.
      - name: Check automatic source cannot roll production backward
        id: source
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          import datetime, json, math, os, re, subprocess, time, urllib.parse
          from email.utils import parsedate_to_datetime
          from concurrent.futures import ThreadPoolExecutor

          def admit(value):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'deploy_current={str(value).lower()}\n')

          if os.environ['EVENT_NAME'] == 'workflow_dispatch' and os.environ.get('DELIVERY_MODE') != 'recovered-ci':
              admit(True)
              raise SystemExit(0)

          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_SHA']
          if not re.fullmatch('[0-9a-f]{40}', source):
              raise ValueError('Automatic deployment source is not an exact commit')

          def api(route, pages=False):
              def read(page_route):
                  result = subprocess.check_output(['gh', 'api', f'repos/{repo}/{page_route}'], text=True, timeout=30)
                  return json.loads(result)
              first = read(route)
              if not pages:
                  return first
              # Independent read-only pages share one bounded concurrency;
              # complete-count validation below still rejects missing data.
              page_count = math.ceil(first['total_count'] / 100)
              with ThreadPoolExecutor(max_workers=4) as readers:
                  rest = list(readers.map(lambda page: read(f'{route}&page={page}'), range(2, page_count + 1)))
              return [first, *rest]

          def timestamp(value):
              if not isinstance(value, str):
                  raise ValueError('Missing deployment evidence timestamp')
              date = datetime.datetime.fromisoformat(value.replace('Z', '+00:00'))
              if date.tzinfo is None:
                  raise ValueError('Deployment evidence timestamp has no timezone')
              return date.timestamp()

          def records(pages, field):
              counts = {page['total_count'] for page in pages}
              rows = {row['id']: row for page in pages for row in page[field]}
              if len(counts) != 1 or len(rows) != next(iter(counts)):
                  raise ValueError('Deployment history is incomplete or changed during discovery')
              return list(rows.values())

          def server_clock():
              response = subprocess.check_output([
                  'gh', 'api', f'repos/{repo}/git/ref/heads/main',
                  '--include', '-H', 'Cache-Control: no-cache',
              ], text=True, timeout=30)
              headers, separator, body = response.partition('\n\n')
              if not separator:
                  raise ValueError('GitHub clock response has no header boundary')
              values = {}
              for header in headers.splitlines()[1:]:
                  name, colon, value = header.partition(':')
                  if colon:
                      values.setdefault(name.lower(), []).append(value.strip())
              if len(values.get('date', [])) != 1 or any(age != '0' for age in values.get('age', [])):
                  raise ValueError('GitHub clock response is missing or stale')
              date = parsedate_to_datetime(values['date'][0])
              if date.tzinfo is None or date.utcoffset() != datetime.timedelta(0):
                  raise ValueError('GitHub clock response has no UTC authority')
              return int(date.timestamp()), json.loads(body)

          discovery_second, main_response = server_clock()
          main = main_response['object']['sha']
          if not isinstance(main, str) or not re.fullmatch('[0-9a-f]{40}', main):
              raise ValueError('Could not verify the current main tip')
          if api(f'compare/{source}...{main}')['status'] not in ('ahead', 'identical'):
              raise ValueError('Automatic source is not on current main history')

          # Local wall-clock skew cannot omit an already completed rollout.
          # A second fresh server response qualifies closure of the pinned second.
          time.sleep(1)
          closed_second, _ = server_clock()
          if closed_second <= discovery_second:
              raise ValueError('GitHub deployment discovery second is not closed')

          # Read history at a fixed creation ceiling, unfiltered: GitHub caps a
          # `created=`-filtered run listing at 1,000 results while its
          # total_count still reports every match, so a filtered full scan can
          # never be complete. Runs created after the ceiling cannot have
          # rollout effects yet; their exact count comes from a filtered count
          # query, which stays far below the cap. A run created mid-scan can
          # shift a row past the pages read, so the total must be unchanged
          # across the scan, and the unique rows at or before the ceiling must
          # equal that total minus the newer runs (a run created after the
          # total but before the newer count makes them disagree). Any
          # mismatch is a changed snapshot and retries; incomplete evidence
          # still refuses.
          route = 'actions/workflows/deploy-console.yml/runs?per_page=100'

          def history(ceiling):
              before = api(route)['total_count']
              rows = {row['id']: row for page in api(route, True) for row in page['workflow_runs']}
              total = api(route)['total_count']
              if total != before:
                  raise ValueError('Deployment history is incomplete or changed during discovery')
              newer = api(f"{route}&created={urllib.parse.quote('>' + ceiling, safe='')}")['total_count']
              bound = timestamp(ceiling)
              runs = [row for row in rows.values() if timestamp(row['created_at']) <= bound]
              if newer >= 1000 or len(runs) != total - newer:
                  raise ValueError('Deployment history is incomplete or changed during discovery')
              return runs

          ceiling = datetime.datetime.fromtimestamp(discovery_second, datetime.timezone.utc).isoformat().replace('+00:00', 'Z')
          runs = None
          for attempt in range(3):
              try:
                  runs = history(ceiling)
              except ValueError:
                  if attempt == 2:
                      raise
                  time.sleep(1)
                  continue
              break
          # Creation order is not effect order: an old run can be rerun later.
          # Discover all metadata before using updated_at as an upper bound;
          # validate observed step timestamps against that bound below.
          ordered = sorted(((timestamp(run['updated_at']), run) for run in runs), key=lambda pair: pair[0], reverse=True)
          completed_rollout = float('-inf')
          effects = []
          rollout_names = {'Build locally and deploy App Hosting backend', 'Deploy with managed App Hosting build', 'Deploy prebuilt container to App Hosting'}
          for updated, run in ordered:
              if updated < completed_rollout:
                  break
              if str(run['id']) == os.environ.get('GITHUB_RUN_ID'):
                  continue
              jobs = records(api(f"actions/runs/{run['id']}/jobs?filter=all&per_page=100", True), 'jobs')
              markers = re.findall(r'\[source:([0-9a-f]{40})\]', run.get('display_title', ''))
              effect_source = markers[0] if len(markers) == 1 else None
              for job in jobs:
                  if job.get('name') != 'deploy':
                      continue
                  steps = job.get('steps')
                  if not isinstance(steps, list):
                      raise ValueError('Deployment job has no step inventory')
                  if not steps and job.get('started_at') and job.get('conclusion') != 'skipped':
                      raise ValueError('Started deployment job has empty step evidence')
                  for step in steps:
                      if step['name'] not in rollout_names or step.get('conclusion') == 'skipped':
                          continue
                      if not step.get('started_at'):
                          if step.get('conclusion') is None and step.get('status') in ('queued', 'pending'):
                              continue
                          raise ValueError('Possible rollout is missing start evidence')
                      started = timestamp(step['started_at'])
                      ended = timestamp(step['completed_at']) if step.get('completed_at') else updated
                      if ended < started or ended > updated:
                          raise ValueError('Run timestamp does not bound its rollout evidence')
                      effects.append((ended, effect_source))
                      if step.get('conclusion') == 'success':
                          if step.get('status') != 'completed' or not step.get('completed_at'):
                              raise ValueError('Successful rollout is missing completion evidence')
                          completed_rollout = max(completed_rollout, ended)

          for ended, deployed in effects:
              if ended < completed_rollout:
                  continue
              if deployed is None:
                  raise ValueError('Possible rollout has no immutable source marker')
              # Failed/cancelled rollout commands can have effects; a failed
              # later serving check also does not erase an earlier rollout.
              status = api(f'compare/{deployed}...{source}')['status']
              if status == 'behind':
                  print(f'::notice::Skipping automatic source {source}; newer rollout source is {deployed}.')
                  admit(False)
                  raise SystemExit(0)
              if status not in ('ahead', 'identical'):
                  raise ValueError('Cannot order automatic source against rollout source')
          admit(True)
          PY_SOURCE

      - uses: actions/checkout@v7
        if: steps.source.outputs.deploy_current == 'true'
        with:
          ref: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        if: steps.source.outputs.deploy_current == 'true'
        with:
          node-version: '24.22.1'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.source.outputs.deploy_current == 'true'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .console-deploy
          merge-multiple: true

      - name: Verify the immutable image artifact
        if: steps.source.outputs.deploy_current == 'true'
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
          TAR_SHA256: ${{ needs.build.outputs.tar_sha256 }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$TAR_SHA256" =~ ^[0-9a-f]{64}$ && "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "$TAR_SHA256  .console-deploy/console-image.tar" | sha256sum -c -
          test "$(jq -r .commit .console-deploy/image.json)" = "$SOURCE_SHA"
          test "$(jq -r .imageDigest .console-deploy/image.json)" = "$IMAGE_DIGEST"
          cmp tools/deploy-console-prebuilt.mjs .console-deploy/deploy-console-prebuilt.mjs
          bash tools/install-crane.sh "$RUNNER_TEMP/console-bin"
          echo "$RUNNER_TEMP/console-bin" >> "$GITHUB_PATH"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.source.outputs.deploy_current == 'true'
        id: gcp-auth
        with:
          # This provider accepts only deploy-console.yml from main. The
          # project-IAM deployer is intentionally unreachable through the
          # repository-wide worker provider.
          workload_identity_provider: ${{ vars.GCP_DEPLOYER_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.source.outputs.deploy_current == 'true'

      - name: Deploy prebuilt container to App Hosting
        id: prebuilt
        if: steps.source.outputs.deploy_current == 'true'
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          BACKEND: ${{ vars.APPHOSTING_BACKEND_ID }}
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          DOCKER_CONFIG: ${{ runner.temp }}/console-registry-auth
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$ACCESS_TOKEN" | crane auth login --username oauth2accesstoken --password-stdin us-central1-docker.pkg.dev
          image="us-central1-docker.pkg.dev/$PROJECT/firebaseapphosting-images/console:$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          crane push .console-deploy/console-image.tar "$image"
          test "$(crane digest "$image")" = "$IMAGE_DIGEST"
          node .console-deploy/deploy-console-prebuilt.mjs \
            --project "$PROJECT" --region us-central1 --backend "$BACKEND" \
            --root-dir apps/console --runtime nodejs24 --commit "$SOURCE_SHA" \
            --image "${image%:*}@$IMAGE_DIGEST"

      - name: Resolve exact deployed App Hosting build
        id: release
        if: steps.source.outputs.deploy_current == 'true'
        continue-on-error: true
        env:
          BUILD: ${{ steps.prebuilt.outputs.build_name }}
        run: |
          test -n "$BUILD"
          echo "version=${BUILD##*/}" >> "$GITHUB_OUTPUT"

      # Catch dead-on-arrival rollouts (#1340 D4): App Hosting can report
      # a build READY while the origin serves nothing but 500s, and until
      # now nothing between "deploy succeeded" and production traffic ever
      # asked the console a single HTTP question. A hard gate, unlike the
      # best-effort release annotation above: an unverified rollout must
      # mark this run red.
      - name: Verify the deployed console is serving
        if: steps.source.outputs.deploy_current == 'true'
        uses: ./.github/actions/deploy-verify
        with:
          url: https://lcars.jlapenna.net

      - name: Annotate the deployed PR with its App Hosting version
        if: steps.source.outputs.deploy_current == 'true' && steps.release.outputs.version != ''
        # A release annotation is useful metadata, but an API or permission
        # hiccup after a successful production rollout must not mark that
        # rollout as failed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          APP_URL="https://lcars.jlapenna.net"
          BODY=$(printf \
            ":rocket: Deployed to production as App Hosting version \`%s\`.\n\n- App: %s\n- Deploy run: %s" \
            "$VERSION" "$APP_URL" "$RUN_URL")

          PRS=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$DEPLOYED_SHA/pulls" \
            --jq '.[].number' | sort -un)
          if [ -z "$PRS" ]; then
            echo "No pull request is associated with deployed commit $DEPLOYED_SHA."
            exit 0
          fi

          while read -r PR; do
            gh pr comment "$PR" --body "$BODY"
            echo "Annotated PR #$PR with App Hosting version $VERSION."
          done <<< "$PRS"

          {
            echo "### Production release"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Pull requests: $(echo "$PRS" | sed 's/^/#/' | paste -sd, -)"
            echo "- App: $APP_URL"
          } >> "$GITHUB_STEP_SUMMARY"
