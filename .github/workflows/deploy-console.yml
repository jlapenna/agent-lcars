name: Deploy console

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact CI-validated revision for recovered deployment
        required: false
        type: string
      delivery_mode:
        description: Recovery provenance (recovered-ci for auto-merge repair)
        required: false
        type: string
      build_mode:
        description: App Hosting build path
        type: choice
        required: true
        # The managed path is the production default until the App Hosting
        # prebuilt importer is repaired (#1128). Prebuilt remains available
        # only for an intentional diagnostic dispatch.
        default: managed
        options:
          - prebuilt
          - managed

# The reusable auto-merge recovery reads this source marker from Actions run
# metadata; keep it identical to the revision checked out and annotated below.
run-name: Deploy console [source:${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}]

permissions:
  contents: read
  actions: read
  id-token: write
  pull-requests: write

jobs:
  # CI's workflow_run conclusion is a rollup of every job in that run,
  # including E2E (timeout-minutes: 30, not a required merge gate) -- a
  # timed-out E2E job reports "cancelled", which drags the whole run's
  # conclusion to "cancelled" even when Verify (the actual required check
  # gating the merge that triggered this run) passed cleanly (#543). Gate
  # deploy on Verify's own job conclusion instead of the run's rollup, so a
  # slow/hung non-required job can't silently block production deploys.
  gate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    # This GitHub-only check must not wait for large fleet-runner placement.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify_passed: ${{ steps.check.outputs.verify_passed }}
    steps:
      - name: Check Verify job's conclusion
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "verify_passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Verify") | .conclusion')
          echo "Verify job conclusion for run $RUN_ID: '$CONCLUSION'"

          if [ "$CONCLUSION" = "success" ]; then
            echo "verify_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "verify_passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Verify did not pass for CI run $RUN_ID (conclusion: '${CONCLUSION:-missing}')."
            exit 1
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.verify_passed == 'true'
    # Ineligible CI completions must not replace a pending main deployment
    # before gate.if runs. Serialize only deployments admitted by the gate.
    concurrency:
      group: deploy-console
      cancel-in-progress: false
      # Keep newer eligible work when an older gate finishes late. Source
      # freshness is checked again after this FIFO queue grants the lock.
      queue: max
    runs-on: ['lcars-ci']
    timeout-minutes: 40
    environment: production

    steps:
      # A green source may trail an unverified main tip. Admit forward
      # movement from the last actual rollout, not exact equality with tip.
      # Keep this inside the lock, before credentials or rollout effects.
      - name: Check automatic source cannot roll production backward
        id: source
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          import datetime, json, math, os, re, subprocess, time
          from urllib.parse import urlencode
          from concurrent.futures import ThreadPoolExecutor

          def admit(value):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'deploy_current={str(value).lower()}\n')

          if os.environ['EVENT_NAME'] == 'workflow_dispatch' and os.environ.get('DELIVERY_MODE') != 'recovered-ci':
              admit(True)
              raise SystemExit(0)

          # The deploy job owns the lock. Future creations cannot have rollout
          # effects yet; retain the inclusive entry second, then let it close.
          discovery_second = int(time.time())
          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_SHA']
          if not re.fullmatch('[0-9a-f]{40}', source):
              raise ValueError('Automatic deployment source is not an exact commit')

          def api(route, pages=False, first=None):
              def read(page_route):
                  result = subprocess.check_output(['gh', 'api', f'repos/{repo}/{page_route}'], text=True, timeout=30)
                  return json.loads(result)
              first = read(route) if first is None else first
              if not pages:
                  return first
              # Independent read-only pages share one bounded concurrency;
              # complete-count validation below still rejects missing data.
              count = first['total_count']
              if isinstance(count, bool) or not isinstance(count, int) or count < 0:
                  raise ValueError('Invalid deployment history count')
              page_count = math.ceil(count / 100)
              with ThreadPoolExecutor(max_workers=4) as readers:
                  rest = list(readers.map(lambda page: read(f'{route}&page={page}'), range(2, page_count + 1)))
              return [first, *rest]

          def timestamp(value):
              if not isinstance(value, str):
                  raise ValueError('Missing deployment evidence timestamp')
              date = datetime.datetime.fromisoformat(value.replace('Z', '+00:00'))
              if date.tzinfo is None:
                  raise ValueError('Deployment evidence timestamp has no timezone')
              return date.timestamp()

          def records(pages, field):
              counts = {page['total_count'] for page in pages}
              rows = {row['id']: row for page in pages for row in page[field]}
              if len(counts) != 1 or len(rows) != next(iter(counts)):
                  raise ValueError('Deployment history is incomplete or changed during discovery')
              return list(rows.values())

          main = api('git/ref/heads/main')['object']['sha']
          if not isinstance(main, str) or not re.fullmatch('[0-9a-f]{40}', main):
              raise ValueError('Could not verify the current main tip')
          if api(f'compare/{source}...{main}')['status'] not in ('ahead', 'identical'):
              raise ValueError('Automatic source is not on current main history')

          remaining = discovery_second + 1 - time.time()
          if remaining > 1:
              raise ValueError('Deployment discovery clock moved backward')
          if remaining > 0:
              time.sleep(remaining)
          if time.time() < discovery_second + 1:
              raise ValueError('Deployment discovery second is not closed')

          def workflow_runs(lower, upper):
              def instant(second):
                  return datetime.datetime.fromtimestamp(second, datetime.timezone.utc).isoformat().replace('+00:00', 'Z')
              route = 'actions/workflows/deploy-console.yml/runs?' + urlencode({
                  'per_page': 100, 'created': f'{instant(lower)}..{instant(upper)}',
              })
              first = api(route)
              count = first['total_count']
              if isinstance(count, bool) or not isinstance(count, int) or count < 0:
                  raise ValueError('Invalid deployment history count')
              # Filtered Actions searches expose at most 1000 results. Equality
              # may hide more; partition until each complete window is smaller.
              if count >= 1000:
                  if lower == upper:
                      raise ValueError('Deployment history exceeds the single-second search bound')
                  middle = (lower + upper) // 2
                  return workflow_runs(lower, middle) + workflow_runs(middle + 1, upper)
              rows = records(api(route, True, first), 'workflow_runs')
              for run in rows:
                  if not lower <= timestamp(run.get('created_at')) <= upper:
                      raise ValueError('Deployment history escaped its creation window')
              return rows

          runs = workflow_runs(0, discovery_second)
          if len({run['id'] for run in runs}) != len(runs):
              raise ValueError('Deployment history repeats a run across creation windows')
          # Creation order is not effect order: an old run can be rerun later.
          # Discover all metadata before using updated_at as an upper bound;
          # validate observed step timestamps against that bound below.
          ordered = sorted(((timestamp(run['updated_at']), run) for run in runs), key=lambda pair: pair[0], reverse=True)
          completed_rollout = float('-inf')
          effects = []
          rollout_names = {'Build locally and deploy App Hosting backend', 'Deploy with managed App Hosting build'}
          for updated, run in ordered:
              if updated < completed_rollout:
                  break
              if str(run['id']) == os.environ.get('GITHUB_RUN_ID'):
                  continue
              jobs = records(api(f"actions/runs/{run['id']}/jobs?filter=all&per_page=100", True), 'jobs')
              markers = re.findall(r'\[source:([0-9a-f]{40})\]', run.get('display_title', ''))
              effect_source = markers[0] if len(markers) == 1 else None
              for job in jobs:
                  if job.get('name') != 'deploy':
                      continue
                  steps = job.get('steps')
                  if not isinstance(steps, list):
                      raise ValueError('Deployment job has no step inventory')
                  if not steps and job.get('started_at') and job.get('conclusion') != 'skipped':
                      raise ValueError('Started deployment job has empty step evidence')
                  for step in steps:
                      if step['name'] not in rollout_names or step.get('conclusion') == 'skipped':
                          continue
                      if not step.get('started_at'):
                          if step.get('conclusion') is None and step.get('status') in ('queued', 'pending'):
                              continue
                          raise ValueError('Possible rollout is missing start evidence')
                      started = timestamp(step['started_at'])
                      ended = timestamp(step['completed_at']) if step.get('completed_at') else updated
                      if ended < started or ended > updated:
                          raise ValueError('Run timestamp does not bound its rollout evidence')
                      effects.append((ended, effect_source))
                      if step.get('conclusion') == 'success':
                          if step.get('status') != 'completed' or not step.get('completed_at'):
                              raise ValueError('Successful rollout is missing completion evidence')
                          completed_rollout = max(completed_rollout, ended)

          for ended, deployed in effects:
              if ended < completed_rollout:
                  continue
              if deployed is None:
                  raise ValueError('Possible rollout has no immutable source marker')
              # Failed/cancelled rollout commands can have effects; a failed
              # later serving check also does not erase an earlier rollout.
              status = api(f'compare/{deployed}...{source}')['status']
              if status == 'behind':
                  print(f'::notice::Skipping automatic source {source}; newer rollout source is {deployed}.')
                  admit(False)
                  raise SystemExit(0)
              if status not in ('ahead', 'identical'):
                  raise ValueError('Cannot order automatic source against rollout source')
          admit(True)
          PY_SOURCE

      - uses: actions/checkout@v7
        if: steps.source.outputs.deploy_current == 'true'
        with:
          ref: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup-nx-remote-cache
        if: steps.source.outputs.deploy_current == 'true' && inputs.build_mode == 'prebuilt'
        with:
          url: ${{ vars.NX_CACHE_URL }}
          write-token: ${{ secrets.NX_CACHE_TOKEN }}

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.source.outputs.deploy_current == 'true'

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.source.outputs.deploy_current == 'true'
        id: gcp-auth
        with:
          # This provider accepts only deploy-console.yml from main. The
          # project-IAM deployer is intentionally unreachable through the
          # repository-wide worker provider.
          workload_identity_provider: ${{ vars.GCP_DEPLOYER_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.source.outputs.deploy_current == 'true' && inputs.build_mode == 'prebuilt'

      - name: Build locally and deploy App Hosting backend
        id: prebuilt
        if: steps.source.outputs.deploy_current == 'true' && inputs.build_mode == 'prebuilt'
        shell: bash
        run: |
          set -euo pipefail
          node tools/deploy-console-prebuilt.mjs \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region us-central1 \
            --backend "${{ vars.APPHOSTING_BACKEND_ID }}" \
            --root-dir apps/console \
            --runtime nodejs24 \
            --commit "${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}"

      - name: Deploy with managed App Hosting build
        id: managed
        # workflow_run has no inputs, so it intentionally follows the
        # managed production default. A manual prebuilt dispatch is opt-in.
        if: steps.source.outputs.deploy_current == 'true' && inputs.build_mode != 'prebuilt'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec firebase deploy \
            --only "apphosting:${{ vars.APPHOSTING_BACKEND_ID }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive 2>&1 | tee firebase-deploy.log

          # The CLI deploys an archive rather than a Git source reference.
          # Preserve its exact upload URI so the annotation step can resolve
          # the build this invocation created without guessing "latest".
          SOURCE_URI=$(grep -oE 'gs://[A-Za-z0-9._/-]+' firebase-deploy.log | tail -1)
          if [ -z "$SOURCE_URI" ]; then
            echo "::error::Firebase deploy succeeded but did not report its uploaded source URI."
            exit 1
          fi
          echo "source_uri=$SOURCE_URI" >> "$GITHUB_OUTPUT"

      - name: Resolve exact deployed App Hosting build
        id: release
        if: steps.source.outputs.deploy_current == 'true'
        # The prebuilt tool already proves the exact artifact is live. Keep
        # release annotation lookup best-effort, matching the managed path's
        # historical behavior: an API hiccup after a successful rollout must
        # not turn that rollout red.
        continue-on-error: true
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          PREBUILT_BUILD: ${{ steps.prebuilt.outputs.build_name }}
          MANAGED_SOURCE_URI: ${{ steps.managed.outputs.source_uri }}
        shell: bash
        run: |
          set -euo pipefail

          BACKEND=$(pnpm exec firebase apphosting:backends:get "${{ vars.APPHOSTING_BACKEND_ID }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --json --non-interactive \
            | jq -r '.result.name')
          if [ -z "$BACKEND" ] || [ "$BACKEND" = null ]; then
            echo "::error::Could not resolve the App Hosting backend resource."
            exit 1
          fi

          if [ -n "$PREBUILT_BUILD" ]; then
            BUILD=$PREBUILT_BUILD
          else
            BUILDS=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://firebaseapphosting.googleapis.com/v1/$BACKEND/builds?pageSize=100&orderBy=create_time%20desc")
            BUILD=$(jq -r '
              first(
                .builds[]
                | select(.source.archive.userStorageUri == env.MANAGED_SOURCE_URI)
                | select(.state == "READY")
                | .name
              ) // empty
            ' <<< "$BUILDS")
          fi

          if [ -z "$BUILD" ]; then
            echo "::error::Could not resolve the exact deployed App Hosting build."
            exit 1
          fi
          BUILD_RESOURCE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebaseapphosting.googleapis.com/v1beta/$BUILD")
          if [ "$(jq -r '.state' <<< "$BUILD_RESOURCE")" != READY ]; then
            echo "::error::$BUILD is not READY."
            exit 1
          fi
          echo "version=${BUILD##*/}" >> "$GITHUB_OUTPUT"

      # Catch dead-on-arrival rollouts (#1340 D4): App Hosting can report
      # a build READY while the origin serves nothing but 500s, and until
      # now nothing between "deploy succeeded" and production traffic ever
      # asked the console a single HTTP question. A hard gate, unlike the
      # best-effort release annotation above: an unverified rollout must
      # mark this run red.
      - name: Verify the deployed console is serving
        if: steps.source.outputs.deploy_current == 'true'
        uses: ./.github/actions/deploy-verify
        with:
          url: https://lcars.jlapenna.net

      - name: Annotate the deployed PR with its App Hosting version
        if: steps.source.outputs.deploy_current == 'true' && steps.release.outputs.version != ''
        # A release annotation is useful metadata, but an API or permission
        # hiccup after a successful production rollout must not mark that
        # rollout as failed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          APP_URL="https://lcars.jlapenna.net"
          BODY=$(printf \
            ":rocket: Deployed to production as App Hosting version \`%s\`.\n\n- App: %s\n- Deploy run: %s" \
            "$VERSION" "$APP_URL" "$RUN_URL")

          PRS=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$DEPLOYED_SHA/pulls" \
            --jq '.[].number' | sort -un)
          if [ -z "$PRS" ]; then
            echo "No pull request is associated with deployed commit $DEPLOYED_SHA."
            exit 0
          fi

          while read -r PR; do
            gh pr comment "$PR" --body "$BODY"
            echo "Annotated PR #$PR with App Hosting version $VERSION."
          done <<< "$PRS"

          {
            echo "### Production release"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Pull requests: $(echo "$PRS" | sed 's/^/#/' | paste -sd, -)"
            echo "- App: $APP_URL"
          } >> "$GITHUB_STEP_SUMMARY"
