name: Deploy console

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: deploy-console
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ['${{ vars.DEFAULT_RUNNER_LABEL }}']
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@v3
        id: gcp-auth
        with:
          # Variables, not secrets: neither value is confidential, and both
          # are fully determined by infra/terraform/main.tf -- it defines
          # exactly one workload identity pool ("github") and one provider
          # ("github") in project agent-lcars (number 611425338852), so the
          # provider path has no other possible value, and the deployer SA
          # is google_service_account.github_deployer's account_id. The
          # agent workflows read the same GCP_WIF_PROVIDER variable, so
          # there is now one place to change it instead of a secret and a
          # variable that had to be kept in sync by hand.
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - name: Deploy App Hosting backend
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec firebase deploy \
            --only "apphosting:${{ vars.APPHOSTING_BACKEND_ID }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive 2>&1 | tee firebase-deploy.log

          # The CLI deploys an archive rather than a Git source reference.
          # Preserve its exact upload URI so the annotation step can resolve
          # the build this invocation created without guessing "latest".
          SOURCE_URI=$(grep -oE 'gs://[A-Za-z0-9._/-]+' firebase-deploy.log | tail -1)
          if [ -z "$SOURCE_URI" ]; then
            echo "::error::Firebase deploy succeeded but did not report its uploaded source URI."
            exit 1
          fi
          echo "source_uri=$SOURCE_URI" >> "$GITHUB_OUTPUT"

      - name: Annotate the deployed PR with its App Hosting version
        # A release annotation is useful metadata, but an API or permission
        # hiccup after a successful production rollout must not mark that
        # rollout as failed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOURCE_URI: ${{ steps.deploy.outputs.source_uri }}
        shell: bash
        run: |
          set -euo pipefail

          BACKEND=$(pnpm exec firebase apphosting:backends:get "${{ vars.APPHOSTING_BACKEND_ID }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --json --non-interactive \
            | jq -r '.result.name')
          if [ -z "$BACKEND" ] || [ "$BACKEND" = null ]; then
            echo "::error::Could not resolve the App Hosting backend resource."
            exit 1
          fi

          BUILDS=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebaseapphosting.googleapis.com/v1/$BACKEND/builds?pageSize=100")
          BUILD=$(jq -r '
            first(
              .builds[]
              | select(.source.archive.userStorageUri == env.SOURCE_URI)
              | select(.state == "READY")
              | .name
            ) // empty
          ' <<< "$BUILDS")
          if [ -z "$BUILD" ]; then
            echo "::error::Could not find a READY App Hosting build for $SOURCE_URI."
            exit 1
          fi

          VERSION=${BUILD##*/}
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          APP_URL="https://agent-console.supersprinkles.racing"
          BODY=$(printf \
            ":rocket: Deployed to production as App Hosting version \`%s\`.\n\n- App: %s\n- Deploy run: %s" \
            "$VERSION" "$APP_URL" "$RUN_URL")

          PRS=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$DEPLOYED_SHA/pulls" \
            --jq '.[].number' | sort -un)
          if [ -z "$PRS" ]; then
            echo "No pull request is associated with deployed commit $DEPLOYED_SHA."
            exit 0
          fi

          while read -r PR; do
            gh pr comment "$PR" --body "$BODY"
            echo "Annotated PR #$PR with App Hosting version $VERSION."
          done <<< "$PRS"

          {
            echo "### Production release"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Pull requests: $(echo "$PRS" | sed 's/^/#/' | paste -sd, -)"
            echo "- App: $APP_URL"
          } >> "$GITHUB_STEP_SUMMARY"
