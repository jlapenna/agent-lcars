name: Agent Issue Router

# GitHub cannot filter issue labels or comment bodies at the trigger level.
# Keep those broad subscriptions in one cheap router, then dispatch exactly
# one agent workflow for the selected pipeline.
run-name: >-
  route #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to route'
        required: true
      pipeline:
        description: 'Agent pipeline to route to'
        required: true
        type: choice
        options: [claude, codex, opencode]
      mode:
        description: 'Dispatch mode'
        required: false
        default: implement
      runbook:
        description: 'Optional skill for a runbook dispatch'
        required: false
        default: ''
      context:
        description: 'Optional deployment or router context'
        required: false
        default: ''

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  route:
    if: >
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
       github.actor == vars.MAINTAINER_LOGIN &&
       startsWith(github.event.label.name, 'agent:')) ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.comment.user.type != 'Bot' &&
       github.event.comment.author_association == 'OWNER' &&
       ((contains(github.event.comment.body, '@claude') &&
         (contains(github.event.issue.labels.*.name, 'agent:claude') ||
          github.event.issue.pull_request != null)) ||
        (contains(github.event.comment.body, '/codex') &&
         contains(github.event.issue.labels.*.name, 'agent:codex')) ||
        ((contains(github.event.comment.body, '/opencode') ||
          contains(github.event.comment.body, '/oc')) &&
         contains(github.event.issue.labels.*.name, 'agent:opencode')))) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.issue != '' && github.event.inputs.pipeline != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the selected agent
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          COMMENT_AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
          INPUT_PIPELINE: ${{ github.event.inputs.pipeline }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_RUNBOOK: ${{ github.event.inputs.runbook }}
          INPUT_CONTEXT: ${{ github.event.inputs.context }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ISSUE="${ISSUE:-$INPUT_ISSUE}"
          LABEL="${LABEL:-agent:$INPUT_PIPELINE}"
          MODE="${INPUT_MODE:-implement}"
          if [[ -z "$LABELS" && -n "$ISSUE" ]]; then
            LABELS=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')
          fi

          has_label() {
            [[ ",${LABELS}," == *",$1,"* ]]
          }

          select_agent() {
            local pipeline="$1"
            local selected="agent:$pipeline"
            for agent_label in agent:claude agent:codex agent:opencode; do
              if [[ "$agent_label" != "$selected" ]] && has_label "$agent_label"; then
                gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$agent_label"
              fi
            done
            for stale_status in status:ready-for-agent status:needs-human; do
              if has_label "$stale_status"; then
                gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$stale_status"
              fi
            done
            LABEL="$selected"
          }

          if [[ "${GITHUB_EVENT_NAME:-}" == "issue_comment" ]]; then
            if [[ "$COMMENT_USER_TYPE" == "Bot" || "$COMMENT_AUTHOR_ASSOC" != "OWNER" ]]; then
              echo "No dispatch: comment is not from the repository owner."
              exit 0
            fi
            if [[ "$COMMENT_BODY" == *"@claude"* ]] &&
               { has_label agent:claude || [[ "$IS_PR_COMMENT" == "true" ]]; }; then
              select_agent claude
              MODE=reply
            elif [[ "$COMMENT_BODY" == *"/codex"* ]] && has_label agent:codex; then
              select_agent codex
              MODE=reply
            elif [[ ("$COMMENT_BODY" == *"/opencode"* || "$COMMENT_BODY" == *"/oc"*) ]] &&
                 has_label agent:opencode; then
              select_agent opencode
              MODE=reply
            else
              echo "No dispatch: comment has no authorized agent command."
              exit 0
            fi
          fi
          if [[ "${GITHUB_EVENT_NAME:-}" == "issues" ]]; then
            select_agent "${LABEL#agent:}"
          fi

          workflow=""
          case "$LABEL" in
            agent:claude) workflow=claude.yml ;;
            agent:codex) workflow=codex.yml ;;
            agent:opencode) workflow=opencode.yml ;;
          esac
          if [[ -z "$workflow" ]]; then
            echo "No dispatch: unsupported agent label $LABEL."
            exit 0
          fi
          echo "Dispatching $workflow for issue #$ISSUE."
          gh workflow run "$workflow" --repo "$REPO" --ref main \
            -f issue="$ISSUE" -f mode="$MODE" -f reply="$COMMENT_BODY" \
            -f runbook="$INPUT_RUNBOOK" -f context="$INPUT_CONTEXT"
