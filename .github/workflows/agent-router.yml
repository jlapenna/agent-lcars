name: Dispatch Canary Router

# Canary-only compatibility transport. Production issue/comment/pull-request
# events and manual maintainer intents enter through the GitHub App webhook and
# hosted controller. The former rollback inputs are intentionally absent: this
# workflow exists only so the secretless production canary can exercise the
# historical Actions admission boundary while that boundary remains observable.
#
# The trailing [router-group:...] marker (formatRouterGroupMarker,
# libs/dispatch-contracts/src/marker.js) is what lets
# findConflictingRouterRun (apps/dispatch-broker/src/github-api.ts)
# identify a conflicting run straight off the run listing (#545) instead of
# fetching each candidate's unreliable /concurrency_groups sub-resource.
run-name: >-
  canary #${{ inputs.issue }}
  [router-group:${{ github.repository_id }}:${{ inputs.issue }}]

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Canary broker input kind
        required: true
        default: canary
        type: choice
        options: [canary]
      issue:
        description: Canonical canary issue number
        required: true
      caller_id:
        description: Canary caller UUID reused across HTTP retries
        required: true
        default: ''

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  normalize:
    if: inputs.kind == 'canary'
    runs-on: ubuntu-latest
    # Deliberately NO concurrency group here. This job used to take a
    # repository-wide `-control-plane-normalize` queue to keep normalize load
    # off the small control-plane pool -- but a GitHub concurrency group is a
    # lossy queue, not a throughput limiter: at most ONE run per group may be
    # pending, so a newer arrival evicts the older pending one. `cancel-in-
    # progress: false` protects the *running* run and does nothing for the
    # queued one.
    #
    # Because that group was repository-wide, ANY two router events anywhere
    # in the repo landing close together dropped the older one outright --
    # cancelled before its first step, so no ledger comment, no anomaly, no
    # trace at all. Observed in production: near every router run over a
    # multi-hour window was `cancelled` with zero steps executed, including a
    # `labeled` event that should have dispatched an agent and simply did not.
    # dispatch-reconcile.yml eventually re-drives such an issue, so this
    # surfaced as mysterious dispatch latency rather than an outright hole.
    #
    # Normalize is read-only and capped at 2 minutes, and the runner pool
    # already applies the right backpressure: jobs wait for a free runner
    # instead of being cancelled. Serialization that actually matters is the
    # `broker` job's per-task group below, which is unchanged.
    timeout-minutes: 2
    outputs:
      eligible: ${{ steps.normalize.outputs.eligible }}
      issue: ${{ steps.normalize.outputs.issue }}
      repository-id: ${{ steps.normalize.outputs.repository-id }}
      is-pr: ${{ steps.normalize.outputs.is-pr }}
      group: ${{ steps.normalize.outputs.group }}
      payload: ${{ steps.normalize.outputs.payload }}
    steps:
      - name: Checkout trusted broker revision
        uses: actions/checkout@v7

      - name: Assert required repo variables are set
        uses: ./.github/actions/assert-repo-vars
        with:
          vars: |
            MAINTAINER_LOGIN=${{ vars.MAINTAINER_LOGIN }}

      - name: Normalize and authorize transport evidence
        id: normalize
        uses: ./.github/actions/dispatch-broker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAINTAINER_LOGIN: ${{ vars.MAINTAINER_LOGIN }}
        with:
          operation: normalize

  broker:
    needs: normalize
    if: needs.normalize.outputs.eligible == 'true'
    # The compatibility boundary is now independent of the retired
    # self-hosted control-plane pool. Per-task serialization remains below.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level `permissions:` REPLACES the workflow-level block above
    # entirely for this job (GitHub Actions semantics) rather than adding to
    # it, so every permission broker's own steps actually use must be
    # restated here -- not copied from the workflow-level block, which is
    # `normalize`'s own grant. The broker uses the Issues REST surface for
    # ledger comments on both issues and pull requests, but GitHub still
    # authorizes `/issues/*` comment writes on PR anchors against
    # `pull-requests: write`, so both grants are required here.
    permissions:
      contents: read # actions/checkout below.
      issues: write # ledger comments/labels/pin/assignee-park (github-api.ts).
      pull-requests: write # `/issues/*` ledger writes on PR anchors.
      actions: write # workflow_dispatch + run listings (github-api.ts).
      # Dispatch-storage WIF token minting for the conditional auth step
      # below. A grant this job always carries, even when
      # conditional -- but that step's own `if:` means an 'off' run never
      # spends it: no OIDC token request is made, so nothing is minted.
      id-token: write
    concurrency:
      # Reserved repository-wide prefix; contract test proves no other job or
      # workflow can case-fold into this broker namespace.
      group: ${{ needs.normalize.outputs.group }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted broker revision
        uses: actions/checkout@v7

      # Conditional on a storage-writing mode so an 'off' (or unset)
      # documents. Same google-github-actions/auth usage as
      # The dedicated provider accepts only this workflow from main; the
      # service account is additionally confined by IAM to the dedicated
      # dispatch-controller database.
      - name: Authenticate to GCP for dispatch storage
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_DISPATCH_BROKER_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DISPATCH_BROKER_SA }}
          token_format: access_token

      - name: Apply serialized broker transition
        uses: ./.github/actions/dispatch-broker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAINTAINER_LOGIN: ${{ vars.MAINTAINER_LOGIN }}
          HOSTED_CONTROLLER_LOGIN: ${{ vars.HOSTED_CONTROLLER_LOGIN }}
          ANCHOR_IS_PR: ${{ needs.normalize.outputs.is-pr }}
          # The broker always uses the Firestore authority path. The storage
          # token and project ID are consumed by its adapter, never by agent
          # code.
          DISPATCH_STORAGE_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          DISPATCH_FIRESTORE_DATABASE_ID: ${{ vars.DISPATCH_FIRESTORE_DATABASE_ID }}
          DISPATCH_AUTHORITY_EPOCH: ${{ vars.DISPATCH_AUTHORITY_EPOCH }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        with:
          operation: broker
          payload: ${{ needs.normalize.outputs.payload }}
          group: ${{ needs.normalize.outputs.group }}
