name: Agent Issue Router

# GitHub cannot filter issue labels or comment bodies at the trigger level.
# Keep those broad subscriptions in one cheap router, then dispatch exactly
# one agent workflow for the selected pipeline.
run-name: >-
  route #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to route'
        required: true
      pipeline:
        description: 'Agent pipeline to route to'
        required: true
        type: choice
        options: [claude, codex, opencode]
      mode:
        description: 'Dispatch mode'
        required: false
        default: implement
      runbook:
        description: 'Optional skill for a runbook dispatch'
        required: false
        default: ''
      context:
        description: 'Optional deployment or router context'
        required: false
        default: ''

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  route:
    # Cheap coarse gate only - avoid spinning up a runner for obvious noise
    # (an unsupported event, or the very common case of a bot commenting on
    # an issue/PR). The full authorization/command matrix, including the
    # MAINTAINER_LOGIN actor check and author_association check, lives
    # entirely in .github/actions/route-decision/route-decision.sh (tested
    # by route-decision.test.sh), which is the source of truth and
    # re-validates everything below independently. Keep this permissive.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'labeled') ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert required repo variables are set
        env:
          MAINTAINER_LOGIN: ${{ vars.MAINTAINER_LOGIN }}
        run: |
          if [ -z "$MAINTAINER_LOGIN" ]; then
            echo "::error::Missing required repo variable: MAINTAINER_LOGIN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      # route-decision.sh is a pure decision function with no network
      # access, so the one live GitHub read it depends on - the current
      # label snapshot, with a re-fetch fallback when the event payload's
      # own snapshot is empty - is resolved here and passed in.
      - name: Resolve current issue labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          issue="${ISSUE:-$INPUT_ISSUE}"
          resolved_labels="$LABELS"
          if [[ -z "$resolved_labels" && -n "$issue" ]]; then
            resolved_labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')
          fi
          echo "labels=$resolved_labels" >> "$GITHUB_OUTPUT"

      - name: Compute route decision
        id: route
        uses: ./.github/actions/route-decision
        with:
          maintainer-login: ${{ vars.MAINTAINER_LOGIN }}
          labels: ${{ steps.labels.outputs.labels }}

      - name: Update issue labels for the routed agent
        if: steps.route.outputs.dispatch == 'true' && steps.route.outputs['labels-to-remove'] != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.route.outputs.issue }}
          LABELS_TO_REMOVE: ${{ steps.route.outputs['labels-to-remove'] }}
        run: |
          set -euo pipefail
          IFS=',' read -ra labels <<< "$LABELS_TO_REMOVE"
          for label in "${labels[@]}"; do
            [[ -z "$label" ]] && continue
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$label"
          done

      - name: Dispatch the selected agent
        if: steps.route.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ steps.route.outputs.workflow }}
          ISSUE: ${{ steps.route.outputs.issue }}
          MODE: ${{ steps.route.outputs.mode }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_RUNBOOK: ${{ github.event.inputs.runbook }}
          INPUT_CONTEXT: ${{ github.event.inputs.context }}
        run: |
          set -euo pipefail
          echo "Dispatching $WORKFLOW for issue #$ISSUE."
          gh workflow run "$WORKFLOW" --repo "$REPO" --ref main \
            -f issue="$ISSUE" -f mode="$MODE" -f reply="$COMMENT_BODY" \
            -f runbook="$INPUT_RUNBOOK" -f context="$INPUT_CONTEXT"
