name: Agent Issue Router
# Control-plane runner policy: keep normalization and broker admission on the
# dedicated self-hosted CI pool, separate from the agent worker fleet.

# Every transport is normalized read-only before one job-level concurrency
# queue serializes control-plane writes for the canonical repository/issue.
# The ledger, not queue arrival, decides semantic ordering.
#
# The trailing [router-group:...] marker (formatRouterGroupMarker,
# libs/dispatch-contracts/src/marker.js) is what lets
# findConflictingRouterRun (apps/dispatch-broker/src/github-api.ts)
# identify a conflicting run straight off the run listing (#545) instead of
# fetching each candidate's unreliable /concurrency_groups sub-resource.
# GitHub Actions evaluates run-name unconditionally for every trigger type,
# so this fallback chain (event issue -> event PR -> manual input) must keep
# covering all four: issues, issue_comment, pull_request, workflow_dispatch.
run-name: >-
  route #${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}:
  ${{ github.event.issue.title || github.event.pull_request.title || inputs.kind || 'manual' }}
  [router-group:${{ github.repository_id }}:${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}]

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      kind:
        description: Broker input kind
        required: false
        default: intent
        type: choice
        options: [intent, completion, reconcile, canary]
      issue:
        description: Issue number to route
        required: true
      pipeline:
        description: Agent pipeline for an intent
        required: false
        type: choice
        options: [claude, codex, opencode]
      mode:
        description: Dispatch mode
        required: false
        default: implement
      reply:
        description: Original maintainer reply when explicitly routed
        required: false
        default: ''
      runbook:
        description: Optional skill for a runbook dispatch
        required: false
        default: ''
      context:
        description: Optional deployment or router context
        required: false
        default: ''
      caller_id:
        description: Caller-generated UUID reused across HTTP retries
        required: false
        default: ''
      completion_payload:
        description: Base64url worker binding for a completion observation
        required: false
        default: ''

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  normalize:
    # Control-plane work has a protected, always-warm self-hosted pool.
    runs-on: ${{ vars.CONTROL_PLANE_RUNNER_LABEL }}
    # Deliberately NO concurrency group here. This job used to take a
    # repository-wide `-control-plane-normalize` queue to keep normalize load
    # off the small control-plane pool -- but a GitHub concurrency group is a
    # lossy queue, not a throughput limiter: at most ONE run per group may be
    # pending, so a newer arrival evicts the older pending one. `cancel-in-
    # progress: false` protects the *running* run and does nothing for the
    # queued one.
    #
    # Because that group was repository-wide, ANY two router events anywhere
    # in the repo landing close together dropped the older one outright --
    # cancelled before its first step, so no ledger comment, no anomaly, no
    # trace at all. Observed in production: near every router run over a
    # multi-hour window was `cancelled` with zero steps executed, including a
    # `labeled` event that should have dispatched an agent and simply did not.
    # dispatch-reconcile.yml eventually re-drives such an issue, so this
    # surfaced as mysterious dispatch latency rather than an outright hole.
    #
    # Normalize is read-only and capped at 2 minutes, and the runner pool
    # already applies the right backpressure: jobs wait for a free runner
    # instead of being cancelled. Serialization that actually matters is the
    # `broker` job's per-task group below, which is unchanged.
    timeout-minutes: 2
    outputs:
      eligible: ${{ steps.normalize.outputs.eligible }}
      issue: ${{ steps.normalize.outputs.issue }}
      repository-id: ${{ steps.normalize.outputs.repository-id }}
      group: ${{ steps.normalize.outputs.group }}
      payload: ${{ steps.normalize.outputs.payload }}
    steps:
      - name: Checkout trusted broker revision
        uses: actions/checkout@v7

      - name: Assert required repo variables are set
        uses: ./.github/actions/assert-repo-vars
        with:
          vars: |
            MAINTAINER_LOGIN=${{ vars.MAINTAINER_LOGIN }}

      - name: Normalize and authorize transport evidence
        id: normalize
        uses: ./.github/actions/dispatch-broker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAINTAINER_LOGIN: ${{ vars.MAINTAINER_LOGIN }}
        with:
          operation: normalize

  broker:
    needs: normalize
    if: needs.normalize.outputs.eligible == 'true'
    # Broker writes stay on the protected self-hosted control-plane pool.
    runs-on: ${{ vars.CONTROL_PLANE_RUNNER_LABEL }}
    timeout-minutes: 5
    concurrency:
      # Reserved repository-wide prefix; contract test proves no other job or
      # workflow can case-fold into this broker namespace.
      group: ${{ needs.normalize.outputs.group }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted broker revision
        uses: actions/checkout@v7

      - name: Apply serialized broker transition
        uses: ./.github/actions/dispatch-broker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAINTAINER_LOGIN: ${{ vars.MAINTAINER_LOGIN }}
          ANCHOR_IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
        with:
          operation: broker
          payload: ${{ needs.normalize.outputs.payload }}
          group: ${{ needs.normalize.outputs.group }}
