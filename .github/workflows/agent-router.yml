name: Agent Issue Router

# GitHub cannot filter issue labels or comment bodies at the trigger level.
# Keep those broad subscriptions in one cheap router, then dispatch exactly
# one agent workflow for the selected pipeline.
run-name: >-
  route #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to route'
        required: true
      pipeline:
        description: 'Agent pipeline to route to'
        required: true
        type: choice
        options: [claude, codex, opencode]
      mode:
        description: 'Dispatch mode'
        required: false
        default: implement
      runbook:
        description: 'Optional skill for a runbook dispatch'
        required: false
        default: ''
      context:
        description: 'Optional deployment or router context'
        required: false
        default: ''

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  route:
    if: >
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
       github.actor == vars.MAINTAINER_LOGIN &&
       (github.event.label.name == 'claude' ||
        github.event.label.name == 'codex' ||
        github.event.label.name == 'opencode')) ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.comment.user.type != 'Bot' &&
       github.event.comment.author_association == 'OWNER' &&
       ((contains(github.event.comment.body, '@claude') &&
         (contains(github.event.issue.labels.*.name, 'claude') ||
          github.event.issue.pull_request != null)) ||
        (contains(github.event.comment.body, '/codex') &&
         contains(github.event.issue.labels.*.name, 'codex') &&
         !contains(github.event.issue.labels.*.name, 'claude')) ||
        ((contains(github.event.comment.body, '/opencode') ||
          contains(github.event.comment.body, '/oc')) &&
         contains(github.event.issue.labels.*.name, 'opencode') &&
         !contains(github.event.issue.labels.*.name, 'claude') &&
         !contains(github.event.issue.labels.*.name, 'codex')))) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.issue != '' && github.event.inputs.pipeline != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the selected agent
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          COMMENT_AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
          INPUT_PIPELINE: ${{ github.event.inputs.pipeline }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_RUNBOOK: ${{ github.event.inputs.runbook }}
          INPUT_CONTEXT: ${{ github.event.inputs.context }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ISSUE="${ISSUE:-$INPUT_ISSUE}"
          LABEL="${LABEL:-$INPUT_PIPELINE}"
          MODE="${INPUT_MODE:-implement}"
          if [[ -z "$LABELS" && -n "$ISSUE" ]]; then
            LABELS=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')
          fi

          has_label() {
            [[ ",${LABELS}," == *",$1,"* ]]
          }

          if [[ "${GITHUB_EVENT_NAME:-}" == "issue_comment" ]]; then
            if [[ "$COMMENT_USER_TYPE" == "Bot" || "$COMMENT_AUTHOR_ASSOC" != "OWNER" ]]; then
              echo "No dispatch: comment is not from the repository owner."
              exit 0
            fi
            if [[ "$COMMENT_BODY" == *"@claude"* ]] &&
               { has_label claude || [[ "$IS_PR_COMMENT" == "true" ]]; }; then
              LABEL=claude
              MODE=reply
            elif [[ "$COMMENT_BODY" == *"/codex"* ]] && has_label codex; then
              LABEL=codex
              MODE=reply
            elif [[ ("$COMMENT_BODY" == *"/opencode"* || "$COMMENT_BODY" == *"/oc"*) ]] &&
                 has_label opencode; then
              LABEL=opencode
              MODE=reply
            else
              echo "No dispatch: comment has no authorized agent command."
              exit 0
            fi
          fi
          workflow=""
          case "$LABEL" in
            claude) workflow=claude.yml ;;
            codex) has_label claude || workflow=codex.yml ;;
            opencode)
              if ! has_label claude && ! has_label codex; then workflow=opencode.yml; fi
              ;;
          esac
          if [[ -z "$workflow" ]]; then
            echo "No dispatch: a higher-precedence agent label is already present."
            exit 0
          fi
          echo "Dispatching $workflow for issue #$ISSUE."
          gh workflow run "$workflow" --repo "$REPO" --ref main \
            -f issue="$ISSUE" -f mode="$MODE" -f reply="$COMMENT_BODY" \
            -f runbook="$INPUT_RUNBOOK" -f context="$INPUT_CONTEXT"
