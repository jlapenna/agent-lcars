name: Publish LCARS review status

# Use the default branch's workflow and token for fork reviews as well.
# Never check out PR code or consume artifacts from the triggering run.
on:
  pull_request_target:
    types:
      [
        opened,
        reopened,
        synchronize,
        closed,
        edited,
        ready_for_review,
        converted_to_draft,
      ]
  workflow_run:
    workflows: ['LCARS review event']
    types: [completed]
  workflow_dispatch:

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: publish-lcars-review-status
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ['agent-lcars-ci-control']
    timeout-minutes: 5
    steps:
      - name: Reconcile open PR heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Re-read every open head. Fork events can lack PR numbers, and
          # GitHub may coalesce queued runs in the concurrency group.
          pulls=$(gh api --paginate "repos/$REPO/pulls?base=$BASE&state=open&per_page=100" --jq '.[] | [.number, .head.sha, .draft, .user.login, .head.ref] | @tsv')
          declare -A states descriptions prs
          while IFS=$'\t' read -r pr head is_draft pr_user head_ref; do
            [[ -n "$pr" ]] || continue
            reviews=$(gh api --paginate --slurp "repos/$REPO/pulls/$pr/reviews?per_page=100")
            state=$(jq -r --arg head "$head" '
              [ .[][] | select(.user.login == "agent-lcars[bot]" and .commit_id == $head) ]
              | reduce .[] as $r ("pending";
                  if $r.state == "CHANGES_REQUESTED" then "blocked"
                  elif $r.state == "COMMENTED" and . != "blocked" and
                    ($r.body // "" | split("\n") | any(rtrimstr("\r") == "<!-- lcars-review:block -->")) then "comment_blocked"
                  elif ($r.body // "" | contains("<!-- attempt-claim:")) and
                    ($r.state == "APPROVED" or ($r.state == "COMMENTED" and ($r.body | split("\n") | any(rtrimstr("\r") == "<!-- lcars-review:pass -->")) and . != "blocked"))
                  then "success" else . end)
            ' <<< "$reviews")
            if [[ "$state" == pending && "$is_draft" == false &&
                  ( "$pr_user" == "renovate[bot]" || "$pr_user" == "dependabot[bot]" ) &&
                  "$head_ref" != "renovate/runner-cli-runtimes" &&
                  "$head_ref" != "renovate/anthropic-review-workflow" ]]; then
              pr_commits=$(gh api --paginate --slurp "repos/$REPO/pulls/$pr/commits?per_page=100")
              if jq -e --arg head "$head" --arg author "$pr_user" '
                [.[][]] as $commits |
                ($commits | length) >= 1 and ($commits | length) <= 100 and
                any($commits[]; .sha == $head) and
                all($commits[]; .author.login == $author)
              ' <<< "$pr_commits" >/dev/null; then
                state=automated_pass
              fi
            fi
            case "$state" in
              blocked|comment_blocked) state=pending; description="LCARS requested changes" ;;
              pending) description="Awaiting LCARS code review; comment /review to request one" ;;
              automated_pass) state=success; description="Automated dependency update; CI gates merge" ;;
              success) description="LCARS reviewed this commit" ;;
            esac
            # A commit status is shared across PRs with the same SHA.
            # Every such PR needs its own review before the SHA can pass.
            if [[ ${states[$head]:-} != pending ]]; then
              states[$head]=$state
              descriptions[$head]=$description
              prs[$head]=$pr
            fi
          done <<< "$pulls"
          for head in "${!states[@]}"; do
            state=${states[$head]}
            description=${descriptions[$head]}
            pr=${prs[$head]}
            current=$(gh api "repos/$REPO/commits/$head/status" --jq '.statuses[] | select(.context == "LCARS review") | [.state, .description] | @tsv')
            [[ "$current" != "$state"$'\t'"$description" ]] || continue
            gh api --method POST "repos/$REPO/statuses/$head" -f context='LCARS review' \
              -f state="$state" -f description="$description" \
              -f target_url="https://github.com/$REPO/pull/$pr" --silent
          done
