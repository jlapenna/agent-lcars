name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    # Self-hosted for everything trusted (push to main, workflow_dispatch,
    # scheduled, and a same-repo PR branch -- opening one already requires
    # write access to this repo); ubuntu-latest only for a pull_request
    # whose head is a fork -- the one case where this public repo would be
    # analyzing someone else's arbitrary code, since a fork PR needs no
    # repo permissions at all to open. See ci.yml's `e2e` job for the same
    # rationale.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.DEFAULT_RUNNER_LABEL }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
