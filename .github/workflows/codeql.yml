name: CodeQL

# Thin caller of the fleet-published codeql-reusable.yml (#1340 A-R6 —
# see docs/published-actions.md). This file owns what `workflow_call`
# cannot carry: the triggers (including this repo's weekly cron),
# concurrency, and workflow-level permissions. The analyze steps — and
# the reasoning for their unconditional ubuntu-latest runner — live in
# the reusable.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    uses: ./.github/workflows/codeql-reusable.yml
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      languages: javascript-typescript
