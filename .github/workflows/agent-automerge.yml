name: Agent PR Auto-Merge

# Thin caller of the fleet-published agent-automerge-reusable.yml (#1312 U4
# moved the logic there so homelab and sprinkles run this same surface -
# see docs/published-actions.md). This file owns what `workflow_call`
# cannot carry: the triggers below and this repo's parameter values. Any PR
# whose author is one of this repo's known coding-agent bot identities
# (vars.AGENT_BOT_LOGINS - a JSON array) gets squash
# auto-merge enabled the moment it's opened/marked ready, gated on this
# repository's required CI checks. Adding a new agent pipeline later that
# follows the shared agent-protocol.md conventions only
# needs its bot login appended to that one repo variable - never a change
# to this workflow.

on:
  pull_request:
    # `synchronize` and `reopened` are recovery triggers: if the opening event
    # was missed while Actions was unavailable, the next normal PR mutation
    # retries the idempotent arm instead of leaving the PR stranded until cron.
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]
  # The schedule retains the missed-event reconciliation sweep. App-token
  # merges emit the normal push/workflow_run chain, close linked issues, and
  # delete merged branches, so this caller no longer subscribes to CI
  # workflow_run events or enables the reusable's legacy restore jobs.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  # The reusable's App token is scoped separately and more narrowly. These
  # caller permissions retain enough GITHUB_TOKEN authority for the parked-PR
  # cancellation job and for a deliberate future fallback rollout.
  issues: write
  pull-requests: write

# Multiple pull-request/review events for the same PR need only the most
# recent auto-merge evaluation. Scheduled reconciliation uses its own run ID,
# so it never cancels an event-driven arm.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' }}

jobs:
  automerge:
    uses: ./.github/workflows/agent-automerge-reusable.yml
    with:
      bot-logins: ${{ vars.AGENT_BOT_LOGINS }}
      fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      app-token-enabled: true
      app-client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
      # Self-hosted, general-purpose lcars-default pool. Glue work stays off
      # the QueueExecutor direct-container route.
      runs-on: '["lcars-default"]'
      # The required CI checks in the Protect main ruleset.
      required-checks: '["E2E","Verify","Runner image pnpm-store seed","repository-owned Terraform"]'
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
