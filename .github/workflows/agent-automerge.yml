name: Agent PR Auto-Merge

# Thin caller of the fleet-published agent-automerge-reusable.yml (#1312 U4
# moved the logic there so homelab and sprinkles run this same surface -
# see docs/published-actions.md). This file owns what `workflow_call`
# cannot carry: the triggers below and this repo's parameter values. Any PR
# whose author is one of this repo's known coding-agent bot identities
# (vars.AGENT_BOT_LOGINS - a JSON array, currently claude[bot] from
# claude.yml and agent-lcars[bot] from opencode.yml/codex.yml) gets squash
# auto-merge enabled the moment it's opened/marked ready, gated only on the
# ruleset's required "Verify" check. Adding a new agent pipeline later that
# follows the shared agent-protocol.md conventions only
# needs its bot login appended to that one repo variable - never a change
# to this workflow.

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review:
    types: [submitted]
  # GITHUB_TOKEN-authored auto-merges do not emit downstream push workflows:
  # a push to main that results from the reusable's own GITHUB_TOKEN
  # squash-merge does not trigger ci.yml's `push: branches: [main]` trigger,
  # so deploy-console.yml's `workflow_run: [CI]` listener never fires either.
  # Once CI finishes (naturally, or restored by the reusable), the
  # restore-main-checks job verifies the required check and explicitly
  # restores the missing main-branch CI/deploy runs.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # The same GITHUB_TOKEN suppression, one level up: CI runs triggered by a
  # bot's own push do not emit `workflow_run` either, so for a purely
  # bot-driven PR the restore job never runs at all and its anchor stays
  # open. Measured 2026-07-29: #220's CI was triggered by
  # github-actions[bot], no workflow_run fired, #215 was closed by hand 13
  # minutes later; #198's last CI was triggered by a human push,
  # workflow_run fired, and #194 closed automatically 15 seconds after the
  # merge. The reusable's close-orphaned-anchors sweep, running on this
  # cron, is the periodic backstop for the first case.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  # Needed by the reusable's explicit `gh issue close`. agent-lcars#214
  # added this scope on the theory that it alone would let the platform's
  # own "Closes #N" handling fire for a GITHUB_TOKEN auto-merge; measured
  # afterwards, it does not - see the reusable's close step comment for the
  # two negative data points. Keep the scope, but it is the explicit close
  # that does the work, not this line.
  issues: write
  pull-requests: write

jobs:
  automerge:
    uses: ./.github/workflows/agent-automerge-reusable.yml
    with:
      bot-logins: ${{ vars.AGENT_BOT_LOGINS }}
      fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      # Self-hosted, the general-purpose lcars-default pool - NOT
      # claude-agent-lcars, which backs 90-180 minute agent sessions.
      # Sharing that pool would queue this glue work behind an in-flight
      # agent run, the same antipattern sprinkles' own claude-automerge.yml
      # was moved off of.
      runs-on: ${{ format('["{0}"]', vars.DEFAULT_RUNNER_LABEL) }}
      # One CI workflow (ci.yml, "Verify" + "E2E" jobs, only "Verify"
      # required by the Protect main ruleset).
      required-checks: '["Verify"]'
      ci-workflow: ci.yml
      deploy-workflow: deploy-console.yml
