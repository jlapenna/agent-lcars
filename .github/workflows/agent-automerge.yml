name: Agent PR Auto-Merge

# Thin caller of the fleet-published agent-automerge-reusable.yml (#1312 U4
# moved the logic there so homelab and sprinkles run this same surface -
# see docs/published-actions.md). This file owns what `workflow_call`
# cannot carry: the triggers below and this repo's parameter values. Any PR
# whose author is one of this repo's known coding-agent bot identities
# (vars.AGENT_BOT_LOGINS - a JSON array) gets squash
# auto-merge enabled the moment it's opened/marked ready, gated on this
# repository's required CI checks. Adding a new agent pipeline later that
# follows the shared agent-protocol.md conventions only
# needs its bot login appended to that one repo variable - never a change
# to this workflow.

on:
  # App credentials must only enter workflow code loaded from the trusted
  # default branch. pull_request_target provides the PR metadata this workflow
  # needs without evaluating the PR head; no job in this workflow checks out or
  # executes PR content. A same-repository pull_request trigger would expose the
  # fleet private key to workflow YAML changed on that branch.
  pull_request_target:
    # `synchronize` and `reopened` are recovery triggers: if the opening event
    # was missed while Actions was unavailable, the next normal PR mutation
    # retries the idempotent arm instead of leaving the PR stranded.
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  # Reconciliation is event-driven; there is deliberately no cron. A push to
  # main is when an armed PR falls behind (and, after an App-token rollout,
  # when any PR still armed by github-actions[bot] is re-armed as the App).
  # App-token merges emit the normal push chain, close linked issues, and
  # delete merged branches, so the reusable's legacy restore and
  # orphan-anchor jobs stay off.
  push:
    branches: [main]
  # A PR's CI succeeding is when an armed PR turns green, the moment the
  # behind-branch update and stale bot-review dismissal can act. App-pushed
  # PR heads emit workflow_run normally. The reusable admits only successful
  # pull_request-triggered runs here.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Manual repair, e.g. after an Actions outage dropped events: a plain
  # dispatch runs the same reconciliation sweep.
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  # The reusable's App token is scoped separately and more narrowly. These
  # caller permissions retain enough GITHUB_TOKEN authority for the parked-PR
  # cancellation job and for a deliberate future fallback rollout.
  issues: write
  pull-requests: write
  statuses: read

# Multiple pull-request-target events for the same PR need only the most recent
# auto-merge evaluation. Push, workflow_run, and dispatch reconciliation use
# their own run IDs, so they never cancel an event-driven arm.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  automerge:
    uses: ./.github/workflows/agent-automerge-reusable.yml
    with:
      bot-logins: ${{ vars.AGENT_BOT_LOGINS }}
      fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      app-token-enabled: true
      app-client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
      # Self-hosted, general-purpose lcars-default pool. Glue work stays off
      # the QueueExecutor direct-container route.
      runs-on: '["lcars-default"]'
      # The required CI checks in the Protect main ruleset.
      required-checks: '["E2E","Verify","Runner image pnpm-store seed","repository-owned Terraform"]'
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
