name: Publish LCARS merge candidate

# Use the default branch's workflow and token for fork reviews as well.
# Never check out PR code or consume artifacts from the triggering run.
# Configure the required check to use the Agent LCARS App after verification.
# GitHub binds the result to a commit SHA.
# Publish only on the GitHub-generated test merge commit for this comparison.
on:
  workflow_run:
    workflows: ['LCARS review event']
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
  # Reconcile even when the PR changes its review-event workflow or a fork run awaits approval.
  schedule:
    - cron: '37 * * * *'

permissions:
  pull-requests: read
  checks: read
  contents: read

concurrency:
  group: publish-lcars-merge-candidate
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: agent-lcars-ci-control
    timeout-minutes: 5
    steps:
      - uses: jlapenna/agent-lcars/.github/actions/publish-lcars-review@main
        with:
          client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
