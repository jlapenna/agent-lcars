name: Vendored Skill Sync

# Fleet-published reusable workflow (docs/published-actions.md) that keeps a
# vendored third-party agent skill identical to its upstream source. A
# version pin alone is not enough: an upstream change to the skill's
# SKILL.md or scripts would never reach the vendored copy. Each run copies
# the complete upstream skill directory, plus the upstream license, from the
# Git tree of the current commit of `upstream-ref` and, when the copy differs from the
# default branch, opens or refreshes one PR authored by the Agent LCARS App.
# That PR rides the caller's agent auto-merge and review gates like any other
# agent PR. When upstream matches again, a stale sync PR is closed.
#
# Nothing from a pull request is checked out or executed: callers trigger
# this only on `schedule` and `workflow_dispatch`, and the job refuses any
# other event. Upstream content is copied as files, never run.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner labels as a JSON array string, passed to fromJSON(). Use the
          caller's short-lived glue-job pool.
        required: true
        type: string
      skill-dir:
        description: Vendored skill directory, `.agents/skills/<name>`.
        required: true
        type: string
      upstream-repo:
        description: Upstream GitHub repository, `owner/name`.
        required: true
        type: string
      upstream-path:
        description: Skill directory inside the upstream repository.
        required: true
        type: string
      upstream-ref:
        description: Upstream branch or tag to follow.
        required: false
        type: string
        default: main
      upstream-license:
        description: >-
          Upstream license file copied into the skill directory as LICENSE.
        required: false
        type: string
        default: LICENSE
    secrets:
      APP_PRIVATE_KEY:
        description: >-
          Agent LCARS App private key -- the fleet's shared
          AGENT_LCARS_PRIVATE_KEY repo secret.
        required: true

permissions: {}

jobs:
  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions: {}
    env:
      SKILL_DIR: ${{ inputs.skill-dir }}
      UPSTREAM_REPO: ${{ inputs.upstream-repo }}
      UPSTREAM_PATH: ${{ inputs.upstream-path }}
      UPSTREAM_REF: ${{ inputs.upstream-ref }}
      UPSTREAM_LICENSE: ${{ inputs.upstream-license }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ $SKILL_DIR =~ ^\.agents/skills/[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
            fail "skill-dir must be .agents/skills/<name>"
          [[ $UPSTREAM_REPO =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
            fail "upstream-repo must be owner/name"
          # Canonical relative paths only (no empty, `.` or `..` components,
          # no leading or trailing slash), matching what `git ls-tree` prints.
          for value in "$UPSTREAM_PATH" "$UPSTREAM_LICENSE" "$UPSTREAM_REF"; do
            [[ $value =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ && /$value/ != */./* && /$value/ != */../* ]] ||
              fail "invalid upstream path or ref: $value"
          done

      - name: Mint Agent LCARS identity token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          # Public App client ID (see renovate-auto-approve.yml).
          client-id: Iv23liO6X8pLJLcTFzyv
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.token.outputs.token }}

      - name: Copy the upstream skill
        id: copy
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          sha=$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_REF" --jq .sha)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || fail "no commit for $UPSTREAM_REF"
          work=$(mktemp -d)
          up="$work/upstream"
          git init -q "$up"
          git -C "$up" fetch -q --depth 1 "https://github.com/$UPSTREAM_REPO.git" "$sha"
          [[ $(git -C "$up" rev-parse FETCH_HEAD) == "$sha" ]] || fail "fetched the wrong upstream commit"
          # Read blobs straight from the commit's tree rather than a source
          # archive or checkout, so export-ignore and checkout filters cannot
          # drop or alter files. Only regular files are accepted: a symlink or
          # submodule entry fails the run, so nothing outside the upstream
          # tree can reach the commit this job pushes. Each blob is written
          # unfiltered into this repository and staged by object ID and mode,
          # so the caller's attributes (eol, filters, ignores) cannot change
          # the bytes or hide a difference.
          declare -A entries=()
          stage_blob() { # <mode> <type> <oid> <upstream path> <vendored name>
            [[ $2 == blob && ($1 == 100644 || $1 == 100755) ]] ||
              fail "upstream $4 is not a regular file (mode $1)"
            local local_oid
            local_oid=$(git -C "$up" cat-file blob "$3" | git hash-object -w --no-filters --stdin)
            [[ $local_oid == "$3" ]] || fail "upstream $4 changed while copying"
            entries["$SKILL_DIR/$5"]="$1 $3"
          }
          while IFS= read -r -d '' entry; do
            path=${entry#*$'\t'}
            read -r mode type oid <<<"${entry%%$'\t'*}"
            stage_blob "$mode" "$type" "$oid" "$path" "${path#"$UPSTREAM_PATH"/}"
          done < <(git -C "$up" ls-tree -r -z --full-tree FETCH_HEAD -- "$UPSTREAM_PATH/")
          for path in "${!entries[@]}"; do
            [[ $path != "$SKILL_DIR/LICENSE/"* ]] ||
              fail "upstream skill path ${path#"$SKILL_DIR/"} collides with the vendored LICENSE"
          done
          [[ -n ${entries["$SKILL_DIR/SKILL.md"]:-} ]] ||
            fail "$UPSTREAM_REPO@$sha has no SKILL.md in $UPSTREAM_PATH"
          license=$(git -C "$up" ls-tree -z --full-tree FETCH_HEAD -- "$UPSTREAM_LICENSE" | tr -d '\0')
          [[ -n $license ]] || fail "$UPSTREAM_REPO@$sha has no $UPSTREAM_LICENSE"
          read -r mode type oid <<<"${license%%$'\t'*}"
          stage_blob "$mode" "$type" "$oid" "$UPSTREAM_LICENSE" LICENSE
          git rm -r -q --cached --ignore-unmatch -- "$SKILL_DIR"
          for path in "${!entries[@]}"; do
            read -r mode oid <<<"${entries[$path]}"
            printf '%s %s\t%s\0' "$mode" "$oid" "$path"
          done | git update-index -z --add --index-info
          rm -rf "$work"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Open, refresh or close the sync PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BASE: ${{ github.event.repository.default_branch }}
          SHA: ${{ steps.copy.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          bot_email='311841118+agent-lcars[bot]@users.noreply.github.com'
          name=${SKILL_DIR##*/}
          branch="chore/sync-skill-$name"
          # Only a same-repository PR into the base, authored by the App, is
          # this workflow's. Fork PRs cannot write this repository's branch
          # and are ignored; any other same-repository PR on the reserved
          # branch stops the run rather than being edited or overwritten.
          prs=$(gh api --paginate \
            "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$branch&per_page=100" \
            --jq '.[] | {number, login: .user.login, base: .base.ref, head: .head.repo.full_name}' |
            jq -s .)
          pr=$(jq -r --arg repo "$REPO" --arg base "$BASE" '[.[] | select(.head == $repo
            and .base == $base and .login == "agent-lcars[bot]")][0].number // empty' <<<"$prs")
          foreign=$(jq -r --arg repo "$REPO" --arg pr "$pr" '[.[] | select(.head == $repo
            and (.number | tostring) != $pr)] | length' <<<"$prs")
          [[ $foreign == 0 ]] || fail "an unmanaged PR uses the reserved branch $branch"
          # Observe the branch tip once, failing closed on lookup errors; every
          # write below is leased to exactly this tip (or to its absence).
          tip=""
          rc=0
          out=$(git ls-remote --exit-code origin "refs/heads/$branch") || rc=$?
          if [[ $rc == 0 ]]; then
            tip=${out%%$'\t'*}
            git fetch -q origin "$tip"
            [[ $(git log -1 --format=%ae "$tip") == "$bot_email" ]] ||
              fail "branch $branch was last written by someone other than this workflow"
          elif [[ $rc != 2 ]]; then
            fail "could not read refs/heads/$branch (git ls-remote exit $rc)"
          fi
          lease="--force-with-lease=refs/heads/$branch:$tip"
          # The copy step staged the exact upstream entries in the index.
          if git diff --cached --quiet; then
            echo "$SKILL_DIR matches $UPSTREAM_REPO@$SHA"
            # A default branch that moved during the run may no longer match.
            live=$(gh api "repos/$REPO/commits/$BASE" --jq .sha)
            if [[ $live != "$(git rev-parse HEAD)" ]]; then
              echo "$BASE moved during this run; leaving cleanup to the next run"
              exit 0
            fi
            if [[ -n $pr ]]; then
              # Close only the PR state this run observed: a maintainer push,
              # branch update or retarget since then leaves it alone.
              now=$(gh api "repos/$REPO/pulls/$pr" \
                --jq '[.state, .head.sha, .head.repo.full_name, .base.ref] | join(" ")')
              if [[ $now != "open $tip $REPO $BASE" ]]; then
                echo "PR #$pr changed since this run read it; leaving it open"
                exit 0
              fi
              gh pr close "$pr" --repo "$REPO" \
                --comment "$SKILL_DIR already matches $UPSTREAM_REPO@$SHA."
            fi
            if [[ -n $tip ]]; then
              git push -q "$lease" origin ":refs/heads/$branch"
            fi
            exit 0
          fi
          git -c user.name='agent-lcars[bot]' -c user.email="$bot_email" \
            commit -q -m "chore(skills): sync $name from $UPSTREAM_REPO" \
            -m "Copied $UPSTREAM_PATH and $UPSTREAM_LICENSE from $UPSTREAM_REPO@$SHA."
          body="Copies \`$UPSTREAM_PATH\` and \`$UPSTREAM_LICENSE\` from
          https://github.com/$UPSTREAM_REPO/tree/$SHA into \`$SKILL_DIR\`, so the
          vendored skill matches upstream \`$UPSTREAM_REF\`.

          Opened by the Vendored Skill Sync workflow; run $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID."
          # An open PR keeps its head, so a weekly run does not restart its
          # review or checks, only while that head already carries this skill
          # tree and the default branch has not touched the skill since the
          # head forked; merging it then still yields exactly this tree. Its
          # body is refreshed either way so the upstream link stays current.
          # The checkout is shallow, so GitHub supplies the merge base.
          fork=""
          if [[ -n $pr && -n $tip ]] && git diff --quiet HEAD "$tip" -- "$SKILL_DIR"; then
            fork=$(gh api "repos/$REPO/compare/$(git rev-parse HEAD~1)...$tip" --jq .merge_base_commit.sha)
            git fetch -q --depth 1 origin "$fork"
          fi
          if [[ -n $fork ]] && git diff --quiet "$fork" HEAD~1 -- "$SKILL_DIR"; then
            gh pr edit "$pr" --repo "$REPO" --body "$body"
            echo "PR #$pr already carries this content"
            exit 0
          fi
          git push -q "$lease" origin "HEAD:refs/heads/$branch"
          if [[ -n $pr ]]; then
            gh pr edit "$pr" --repo "$REPO" --body "$body"
          else
            gh pr create --repo "$REPO" --base "$BASE" --head "$branch" \
              --title "chore(skills): sync $name from $UPSTREAM_REPO" --body "$body"
          fi
