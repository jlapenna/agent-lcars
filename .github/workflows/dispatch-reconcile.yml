name: Hosted Dispatch Reconciler

# Periodically and manually invoke App Hosting's reconciliation endpoint. It
# discovers open agent-labeled or fleet-assigned anchors, then processes each
# directly through the hosted controller under its Firestore authority lease.
# This scheduler is deliberately GitHub-hosted so recovery remains available
# when the self-hosted worker pool is unavailable.

on:
  schedule:
    # Offset from :00/:30 to avoid the scheduling stampede.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # This prevents redundant full scans. Per-anchor serialization remains the
  # hosted controller's Firestore authority lease.
  group: dispatch-reconcile-scan
  cancel-in-progress: false

jobs:
  hosted-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      id-token: write
    steps:
      # Referenced @main rather than as a local path on purpose: this
      # workflow only ever runs from main (schedule/workflow_dispatch), and
      # the remote reference keeps the job checkout-free.
      - name: Invoke hosted reconciler with GitHub Actions OIDC
        uses: jlapenna/agent-lcars/.github/actions/request-control-plane@main # latest
        with:
          endpoint: https://lcars.jlapenna.net/api/control-plane/reconcile
          audience: agent-lcars-dispatch-reconcile
          # A full reconcile scan processes every discovered anchor
          # synchronously; keep the pre-#1340 inline block's budget.
          timeout-seconds: '360'
