name: Dispatch Ledger Reconciler

# Scheduled AND manually runnable maintenance pass over every open,
# agent-labeled OR agent-fleet-assigned issue/PR (#305, child of the
# dispatch-broker reliability epic #301; the fleet-assigned lane closes a
# #363 review gap -- see `discoverReconcileCandidates` in
# `libs/dispatch-reconcile/src/scan.ts`). The scheduled scan runs in the
# existing App Hosting backend,
# invoked from a GitHub-hosted runner with a narrowly validated GitHub
# Actions OIDC token.
# That puts the repair path outside the self-hosted control-plane runner pool
# it repairs (#736). A manual Action fallback remains available during soak.
#
# Every actual repair happens inside the SAME per-issue serialized broker
# job agent-router.yml already runs for every other trigger (issue events,
# comments, completion callbacks): the follow-on `kind: reconcile` run goes
# through agent-router.yml's own normalize -> broker jobs, the reserved
# per-issue `agent-lcars-dispatch-v1-<repositoryId>-<issue>` concurrency
# group, and #349's already-hardened indirect concurrency corroboration for
# workflow_dispatch-triggered runs (GitHub never reports concurrency-group
# membership for a workflow_dispatch/schedule-triggered run's own listing --
# only #349's positive-corroboration check works here). There is still
# exactly one writer and one ordering domain per issue; this workflow adds
# no new one.
#
# What it repairs (`apps/dispatch-broker/src/main.ts`'s
# reconcileLedger/trackMissingRun): a dispatch
# generation stuck `dispatching`/`dispatch-unknown` with no worker run ever
# showing up (a crashed worker, or a queue-evicted intent #345/#347
# deliberately failed red for) gets bounded-retried and, past the bound,
# parked `status:needs-human`. A completed worker run whose completion
# callback never landed (a red pre-#349 run, a timeout, a force-cancel) gets
# finalized by the same reconcileActive() logic every ordinary event already
# runs. A pending intent queued behind either of those gets promoted and
# (re-)dispatched automatically once its blocking generation resolves -- no
# separate "stale pending" mechanism is needed. A genuine concurrent
# duplicate-run collision is surfaced as a `duplicate-attempt` anomaly and
# parked, never silently resolved.

on:
  schedule:
    # Every 30 minutes, offset from :00/:30 to avoid the scheduling
    # stampede (see label-contract-audit.yml's '17 13 * * *' for the same
    # convention at daily granularity).
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      transport:
        description: Reconciliation scan transport
        required: true
        default: hosted
        type: choice
        options: [hosted, action-fallback]

permissions: {}

concurrency:
  # A single, repo-wide, reconciler-only group -- deliberately NOT the
  # reserved `agent-lcars-dispatch-v1-*` per-issue namespace (workflow-
  # contract.test.mjs enforces that no workflow but agent-router.yml's
  # broker job ever declares that namespace). This only prevents two
  # overlapping scheduled/manual scans from redundantly firing duplicate
  # `kind: reconcile` dispatches; a redundant extra dispatch would be
  # harmless (each downstream reconcile pass is independently idempotent),
  # but there is no reason to pay for it. It has no bearing on per-issue
  # ledger mutation safety, which is fully delegated to agent-router.yml's
  # own concurrency group per candidate issue.
  group: dispatch-reconcile-scan
  cancel-in-progress: false

jobs:
  hosted-scan:
    if: github.event_name == 'schedule' || inputs.transport == 'hosted'
    # The scheduler itself must remain alive when the protected self-hosted
    # control-plane pool is unavailable. App Hosting performs discovery and
    # dispatch after validating this job's OIDC claims.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Invoke hosted reconciler with GitHub Actions OIDC
        env:
          RECONCILE_URL: https://agent-console.supersprinkles.racing/api/control-plane/reconcile
          RECONCILE_AUDIENCE: agent-lcars-dispatch-reconcile
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RECONCILE_AUDIENCE")"
          oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' \
            <<<"$token_response")"
          curl --fail-with-body --silent --show-error --max-time 240 \
            -X POST \
            -H "Authorization: Bearer $oidc_token" \
            "$RECONCILE_URL"

  action-fallback:
    if: github.event_name == 'workflow_dispatch' && inputs.transport == 'action-fallback'
    # Explicit manual rollback while the hosted path soaks. This preserves
    # the prior implementation without leaving the scheduled repair path in
    # the same failure domain as the broker it repairs.
    runs-on: ${{ vars.CONTROL_PLANE_RUNNER_LABEL }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - name: Checkout trusted broker revision
        uses: actions/checkout@v7

      - name: Assert required repo variables are set
        uses: ./.github/actions/assert-repo-vars
        with:
          vars: |
            AGENT_FLEET_LOGIN=${{ vars.AGENT_FLEET_LOGIN }}

      - name: Scan open agent-labeled/fleet-assigned issues and dispatch reconciliation
        uses: ./.github/actions/dispatch-broker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_FLEET_LOGIN: ${{ vars.AGENT_FLEET_LOGIN }}
        with:
          operation: reconcile
