name: Dispatch Reconciler

# Periodically and manually invoke App Hosting's reconciliation endpoint. It
# expires native Run leases and drains the authoritative control-plane outbox.
# This scheduler stays available when the direct worker pool is unavailable.

on:
  schedule:
    # Offset from :00/:30 to avoid the scheduling stampede.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # This prevents redundant full scans. Per-anchor serialization remains the
  # control plane's authority lease.
  group: dispatch-reconcile-scan
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      id-token: write
    steps:
      # Referenced @main rather than as a local path on purpose: this
      # workflow only ever runs from main (schedule/workflow_dispatch), and
      # the remote reference keeps the job checkout-free.
      - name: Invoke control-plane reconciler with GitHub Actions OIDC
        uses: jlapenna/agent-lcars/.github/actions/oidc-post@main # latest
        with:
          endpoint: https://lcars.jlapenna.net/api/control-plane/reconcile
          audience: agent-lcars-dispatch-reconcile
          # A full reconcile expires leases and drains the durable outbox;
          # keep the scheduler's bounded request budget.
          timeout-seconds: '360'
