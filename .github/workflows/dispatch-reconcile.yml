name: Dispatch Ledger Reconciler

# Scheduled AND manually runnable maintenance pass over every open,
# agent-labeled OR agent-fleet-assigned issue/PR (#305, child of the
# dispatch-broker reliability epic #301; the fleet-assigned lane closes a
# #363 review gap -- see `discoverReconcileCandidates` in
# `libs/dispatch-reconcile/src/scan.ts`). The scheduled scan runs in the
# existing App Hosting backend,
# invoked from a GitHub-hosted runner with a narrowly validated GitHub
# Actions OIDC token.
# That puts the repair path outside the retired self-hosted control-plane
# runner pool it replaces (#736).
#
# Every hosted repair runs directly inside App Hosting after the scheduler's
# OIDC run/repository identity is verified. The same normalized reconcile
# transition and Firestore authority lease used by webhook admission provide
# lossless per-issue serialization without dispatching agent-router.yml or
# consuming a self-hosted control-plane runner.
#
# What it repairs (`apps/dispatch-broker/src/main.ts`'s
# reconcileLedger/trackMissingRun): a dispatch
# generation stuck `dispatching`/`dispatch-unknown` with no worker run ever
# showing up (a crashed worker, or a queue-evicted intent #345/#347
# deliberately failed red for) gets bounded-retried and, past the bound,
# parked `status:needs-human`. A completed worker run whose completion
# callback never landed (a red pre-#349 run, a timeout, a force-cancel) gets
# finalized by the same reconcileActive() logic every ordinary event already
# runs. A current label whose intent was queue-evicted is rebuilt from its
# real maintainer-authored timeline source even after earlier generations
# completed (#639), or from a digest-valid, maintainer-authored Quick Task
# whose agent label was set at creation and has no timeline event (#634).
# A pending intent queued behind either repair gets promoted once its blocking
# generation resolves; ordinary work remains held while status:needs-human is
# live and resumes through the serialized broker after unpark (#720). No
# separate "stale pending" mechanism is needed. A genuine concurrent
# duplicate-run collision is surfaced as a `duplicate-attempt` anomaly and
# parked, never silently resolved.

on:
  schedule:
    # Every 30 minutes, offset from :00/:30 to avoid the scheduling
    # stampede (see label-contract-audit.yml's '17 13 * * *' for the same
    # convention at daily granularity).
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # A single, repo-wide, reconciler-only group -- deliberately NOT the
  # reserved `agent-lcars-dispatch-v1-*` per-issue namespace (workflow-
  # contract.test.mjs enforces that no workflow but agent-router.yml's
  # broker job ever declares that namespace). This only prevents two
  # overlapping scheduled/manual scans from redundantly processing the same
  # candidates. A redundant pass would be harmless because every candidate
  # still acquires its own Firestore authority lease, but there is no reason
  # to pay for it.
  group: dispatch-reconcile-scan
  cancel-in-progress: false

jobs:
  hosted-scan:
    # The scheduler itself must remain alive when the protected self-hosted
    # control-plane pool is unavailable. App Hosting performs discovery and
    # direct processing after validating this job's OIDC claims.
    runs-on: ubuntu-latest
    # Hosted candidates defer immediately when another controller owns their
    # authority lease, so queue size cannot multiply the 130s wait used by
    # single-event transports. Leave room for discovery and GitHub API work.
    timeout-minutes: 7
    permissions:
      id-token: write
    steps:
      - name: Invoke hosted reconciler with GitHub Actions OIDC
        env:
          RECONCILE_URL: https://agent-console.supersprinkles.racing/api/control-plane/reconcile
          RECONCILE_AUDIENCE: agent-lcars-dispatch-reconcile
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RECONCILE_AUDIENCE")"
          oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' \
            <<<"$token_response")"
          curl --fail-with-body --silent --show-error --max-time 360 \
            -X POST \
            -H "Authorization: Bearer $oidc_token" \
            "$RECONCILE_URL"
