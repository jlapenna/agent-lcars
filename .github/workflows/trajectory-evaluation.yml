name: Remote Agent Trajectory Evaluation

on:
  schedule:
    - cron: '31 14 * * 1'
  workflow_dispatch:
    inputs:
      repository:
        description: Repository whose completed agent runs should be sampled.
        required: true
        default: jlapenna/agent-lcars
        type: string
      days:
        description: Recent production window in days (1-90).
        required: true
        default: 14
        type: number
      limit:
        description: Maximum completed, non-skipped agent runs (1-300).
        required: true
        default: 100
        type: number

# Collection is metadata-only. This workflow has no write permission, cloud
# credential, dispatch-controller credential, or self-hosted runner access.
permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: trajectory-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    name: Build rolling and frozen reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVALUATION_REPOSITORY: ${{ inputs.repository || github.repository }}
      EVALUATION_DAYS: ${{ inputs.days || 14 }}
      EVALUATION_LIMIT: ${{ inputs.limit || 100 }}
      CORPUS_PATH: tools/trajectory-evaluation/corpus/v1/issue-523.json
      VARIANT_PATH: tools/trajectory-evaluation/variants/issue-523-reliability-v1.json
    steps:
      - name: Checkout trusted evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository Node version
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: 'false'

      - name: Collect read-only rolling window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/trajectory-evaluation/cli.mjs collect \
            --repository "$EVALUATION_REPOSITORY" \
            --days "$EVALUATION_DAYS" \
            --limit "$EVALUATION_LIMIT" \
            --output "$RUNNER_TEMP/trajectory-corpus.json" \
            --report "$RUNNER_TEMP/trajectory-rolling.md"

      - name: Verify frozen cohort and reviewed comparison
        run: |
          node tools/trajectory-evaluation/cli.mjs validate --corpus "$CORPUS_PATH"
          node tools/trajectory-evaluation/cli.mjs report \
            --corpus "$CORPUS_PATH" \
            --output "$RUNNER_TEMP/trajectory-frozen.md"
          node tools/trajectory-evaluation/cli.mjs compare \
            --corpus "$CORPUS_PATH" \
            --variant "$VARIANT_PATH" \
            --output "$RUNNER_TEMP/trajectory-comparison.md"

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-agent-trajectory-evaluation
          path: |
            ${{ runner.temp }}/trajectory-corpus.json
            ${{ runner.temp }}/trajectory-rolling.md
            ${{ runner.temp }}/trajectory-frozen.md
            ${{ runner.temp }}/trajectory-comparison.md
          if-no-files-found: error
          retention-days: 30
