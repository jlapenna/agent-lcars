name: Publish runner-autoscaler images

# Builds and publishes both images this repo's runner fleet depends on:
# the control-plane (apps/runner-autoscaler/Dockerfile) and the JIT worker image
# (apps/runner-autoscaler/runner-image/Dockerfile) every other CI job in this
# fleet actually executes inside. jlapenna/homelab pulls both rather than
# building from source (agent-lcars#52) -- this workflow is the one place
# that source gets compiled into a real, published artifact.
#
# Runs on homelab-autoscale-lcars-docker, NOT the AI-agent-dispatch pool
# (homelab-autoscale-claude-agent-lcars) -- that pool deliberately has no
# docker socket (see homelab#135), so this needed its own, trusted,
# workflow-defined-only pool.

on:
  push:
    branches: [main]
    paths:
      - apps/runner-autoscaler/**
      - .github/workflows/publish-runner-autoscaler.yml
      # The JIT worker image's Dockerfile clones this repo's own `main` at
      # build time and bakes in `nx bundle @agent-lcars/telemetry-watcher`
      # (see runner-image/Dockerfile) -- a telemetry-only change must
      # rebuild the image too, or every self-hosted runner keeps the old
      # sidecar until an unrelated autoscaler change or manual dispatch
      # happens to trigger one (the same silent-staleness failure mode
      # #52 exists to eliminate).
      - apps/telemetry-watcher/**
      - libs/telemetry/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-runner-autoscaler
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    # The push trigger is already branch-scoped to main above; workflow_dispatch
    # is not (it lets any write-access collaborator pick an arbitrary ref in
    # the UI/API) and this workflow publishes the exact images the whole
    # self-hosted fleet, including the one docker-socket-mounted pool, pulls
    # and trusts on every job. Restrict manual dispatch to main too, so an
    # unreviewed branch can never reach the registry this way.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["homelab-autoscale-lcars-docker"]') }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runner-autoscaler/go.mod

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test before publishing
        run: |
          ./tools/nx build @agent-lcars/runner-autoscaler
          ./tools/nx test @agent-lcars/runner-autoscaler
          ./tools/nx typecheck @agent-lcars/runner-autoscaler

      # This pool spans hosts of two architectures (fleet-wide, see
      # homelab's github-runner-autoscaler/orchestrator.yml) -- without
      # QEMU + explicit platforms, whichever single host a run happens to
      # land on is the only architecture the published manifest supports
      # (members#3411 hit exactly this for the sandbox image).
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # No docker/login-action: docker-registry.lan.jlapenna.net accepts
      # anonymous push from this network position (confirmed in
      # supersprinklesracing/members#2373).

      - name: Build and push control-plane image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/runner-autoscaler
          file: apps/runner-autoscaler/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: docker-registry.lan.jlapenna.net/agent-lcars/runner-autoscaler:latest
          cache-from: type=registry,ref=docker-registry.lan.jlapenna.net/agent-lcars/runner-autoscaler:buildcache
          cache-to: type=registry,ref=docker-registry.lan.jlapenna.net/agent-lcars/runner-autoscaler:buildcache,mode=max

      # Keeps the existing tag name: every consuming workflow across members
      # and agent-lcars already hardcodes
      # docker-registry.lan.jlapenna.net/homelab-runner:jit-node24 --
      # renaming it is out of scope for this migration.
      - name: Build and push JIT worker runner image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/runner-autoscaler/runner-image
          file: apps/runner-autoscaler/runner-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: docker-registry.lan.jlapenna.net/homelab-runner:jit-node24
          # Busts the Dockerfile's internal `git clone` layer on every real
          # publish -- see that Dockerfile's own comment. Without this, the
          # registry-backed cache below could restore a stale clone of
          # agent-lcars main from a prior build.
          build-args: |
            CACHE_BUST=${{ github.sha }}
            # Build the exact reviewed commit that triggered this publish.
            # `git fetch origin <sha>` in the Dockerfile supports a detached
            # commit as well as the local-build fallback of `main`.
            AGENT_LCARS_REF=${{ github.sha }}
          cache-from: type=registry,ref=docker-registry.lan.jlapenna.net/homelab-runner:buildcache
          cache-to: type=registry,ref=docker-registry.lan.jlapenna.net/homelab-runner:buildcache,mode=max
