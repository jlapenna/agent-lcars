name: Publish runner-autoscaler images

# Builds and publishes both images this repo's runner fleet depends on:
# the control-plane (apps/runner-autoscaler/Dockerfile) and the JIT worker image
# (apps/runner-autoscaler/runner-image/Dockerfile) every other CI job in this
# fleet actually executes inside. jlapenna/homelab pulls both rather than
# building from source (agent-lcars#52) -- this workflow is the one place
# that source gets compiled into a real, published artifact.
#
# Runs on lcars-build-client: a socketless pool that holds no Docker socket
# and needs no local Docker daemon (agent-lcars#101). Images are built by a
# dedicated rootless BuildKit service on oldbook, reached over mutually
# authenticated TLS via Buildx's remote driver, so a compromised job here
# cannot administer the host it landed on.
#
# The client certificate arrives as a read-only bind-mount from the
# encrypted homelab secret store -- NOT from GitHub Actions secrets. The
# control plane runs locally, so the whole BuildKit PKI shares one storage
# and rotation path (homelab's ansible/deploy_buildkit.yml).

on:
  push:
    branches: [main]
    paths:
      - apps/runner-autoscaler/**
      - .github/workflows/publish-runner-autoscaler.yml
      # The JIT worker image's Dockerfile clones this repo's own `main` at
      # build time and bakes in `nx bundle @agent-lcars/telemetry-watcher`
      # (see runner-image/Dockerfile) -- a telemetry-only change must
      # rebuild the image too, or every self-hosted runner keeps the old
      # sidecar until an unrelated autoscaler change or manual dispatch
      # happens to trigger one (the same silent-staleness failure mode
      # #52 exists to eliminate).
      - apps/telemetry-watcher/**
      - libs/telemetry/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-runner-autoscaler
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    # The push trigger is already branch-scoped to main above; workflow_dispatch
    # is not (it lets any write-access collaborator pick an arbitrary ref in
    # the UI/API) and this workflow publishes the exact images the whole
    # self-hosted fleet pulls and trusts on every job. Restrict manual
    # dispatch to main too, so an unreviewed branch can never reach the
    # registry this way.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # Pinned literally, deliberately: this previously read
    # `fromJSON(vars.CI_RUNS_ON || ...)`, which let a mutable repository
    # variable redirect the one workflow that publishes fleet-trusted
    # images to an arbitrary pool -- including a socket-mounted one. That
    # is inconsistent with the dispatch-ref restriction directly above,
    # which exists for exactly the same trust reason.
    runs-on: lcars-build-client
    # Raised from 20: arm64 is emulated on the builder (no native aarch64
    # host is available -- see agent-lcars#101), and the first publish runs
    # against a cold BuildKit cache on a 4-core box. Steady-state runs are
    # far quicker once the cache is warm.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runner-autoscaler/go.mod

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test before publishing
        run: |
          ./tools/nx build @agent-lcars/runner-autoscaler
          ./tools/nx test @agent-lcars/runner-autoscaler
          ./tools/nx typecheck @agent-lcars/runner-autoscaler

      # Fail loudly rather than silently falling back to a local daemon if
      # this ever lands on a socket-mounted pool by mistake. The absence of
      # this socket is the entire point of agent-lcars#101.
      - name: Assert the runner holds no Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            echo "::error::/var/run/docker.sock is present; this job must run on a socketless pool"
            exit 1
          fi
          echo "no docker socket present"

      # No docker/setup-qemu-action: nothing is built locally any more.
      # Emulation for linux/arm64 lives on the builder (qemu-user-static,
      # installed by homelab's ansible/deploy_buildkit.yml), which is where
      # the RUN steps actually execute under the remote driver.
      #
      # driver-opts take ABSOLUTE FILE PATHS. Do not switch these to the
      # BUILDER_NODE_<n>_AUTH_TLS_* environment variables shown in Docker's
      # GitHub Actions docs -- those carry PEM *contents*, which is the
      # shape that only makes sense when the material comes from GitHub
      # secrets. Here it is a read-only bind-mount from the local secret
      # store, so paths are correct and the PEM never transits GitHub.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: remote
          endpoint: tcp://oldbook.lan.jlapenna.net:1234
          driver-opts: |
            cacert=/secrets/buildkit-ca.pem
            cert=/secrets/buildkit-client-cert.pem
            key=/secrets/buildkit-client-key.pem

      # Records which builder and platforms actually served the build --
      # the first thing worth seeing when a publish misbehaves.
      - name: Show builder
        run: docker buildx inspect --bootstrap

      # No registry login: writes are currently UNAUTHENTICATED (#112).
      #
      # Basic auth was deployed and reverted -- Buildx's remote driver
      # cannot satisfy a Basic challenge. BuildKit takes registry
      # credentials only from the client session, and containerd's resolver
      # does not complete Basic through it, so `docker login` here succeeds
      # and the push still 401s. Putting the credential on the builder does
      # not help; BuildKit never reads a daemon-side docker config.
      #
      # Whatever replaces it must work with the remote driver -- see
      # jlapenna/homelab docs/registry.md for the options.
      - name: Build and push control-plane image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/runner-autoscaler
          file: apps/runner-autoscaler/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: docker-registry.lan.jlapenna.net/agent-lcars/runner-autoscaler:latest
          cache-from: type=registry,ref=docker-registry.lan.jlapenna.net/agent-lcars/runner-autoscaler:buildcache
          cache-to: type=registry,ref=docker-registry.lan.jlapenna.net/agent-lcars/runner-autoscaler:buildcache,mode=max

      # Keeps the existing tag name: every consuming workflow across members
      # and agent-lcars already hardcodes
      # docker-registry.lan.jlapenna.net/homelab-runner:jit-node24 --
      # renaming it is out of scope for this migration.
      - name: Build and push JIT worker runner image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/runner-autoscaler/runner-image
          file: apps/runner-autoscaler/runner-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: docker-registry.lan.jlapenna.net/homelab-runner:jit-node24
          # Busts the Dockerfile's internal `git clone` layer on every real
          # publish -- see that Dockerfile's own comment. Without this, the
          # registry-backed cache below could restore a stale clone of
          # agent-lcars main from a prior build.
          build-args: |
            CACHE_BUST=${{ github.sha }}
            # Build the exact reviewed commit that triggered this publish.
            # `git fetch origin <sha>` in the Dockerfile supports a detached
            # commit as well as the local-build fallback of `main`.
            AGENT_LCARS_REF=${{ github.sha }}
          cache-from: type=registry,ref=docker-registry.lan.jlapenna.net/homelab-runner:buildcache
          cache-to: type=registry,ref=docker-registry.lan.jlapenna.net/homelab-runner:buildcache,mode=max
