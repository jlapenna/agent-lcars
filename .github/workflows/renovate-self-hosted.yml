name: Renovate Self-Hosted

# Runs self-hosted Renovate (renovatebot/github-action) against the fleet
# repositories the hosted Mend/Renovate app does not cover: extending the
# hosted app to them needs an `admin:org` credential nobody on this machine
# holds. The maintainer does not perform manual dependency-update steps, so
# this authenticates as the fleet's own `agent-lcars` GitHub App instead
# (already installed on every repo below, already used fleet-wide via
# `mint-agent-token`) and shares the same `renovate-preset.json` baseline
# the hosted-app repos already use (agent-lcars#2018). See docs/renovate.md
# for the full hosted-vs-self-hosted split, how to add or remove a repo
# here, and how to dispatch a dry run.
#
# HAZARD this workflow exists to guard against: a token minted from the
# `agent-lcars` App authors its PRs as `agent-lcars[bot]`, and every member
# repo's `agent-automerge-reusable.yml` treats any bot login in its
# AGENT_BOT_LOGINS variable -- which includes `agent-lcars[bot]` -- as
# auto-mergeable the moment a non-draft PR is opened. A major version bump
# landing on green CI with no human look is not acceptable, so
# renovate-preset.json's major-update packageRule opens those as DRAFT PRs
# (excluded from that arm-on-open gate; labels added after creation are
# racy, draft status at creation is not) with a status:needs-human label and
# automerge disabled. See renovate-preset.json's packageRules for why that
# rule lives in the shared preset rather than in this workflow's own
# .github/renovate-self-hosted.json global config.
#
# runs-on: ubuntu-latest, not this repo's self-hosted lcars-default pool
# (contrast label-contract-audit.yml, which stays on lcars-default for a
# lightweight gh-api-only job). renovatebot/github-action always launches a
# Docker container to run Renovate itself, and a real run resolves
# dependency datasources (npm, docker, go, github-actions, ...) across four
# repos this workflow does not otherwise touch -- the same "needs open
# egress a homelab runner has no reason to be granted" reasoning
# scaleset-upstream.yml documents for its own ubuntu-latest choice.

on:
  schedule:
    # Monday 20:00 UTC, matching renovate-preset.json's own
    # `schedule: ["after 8pm on monday"]` so the self-hosted repos run on
    # the same cadence the hosted-app repos already do.
    - cron: '0 20 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          'dry-run' (the default) simulates the whole run -- extraction,
          lookups, and logging what would be branched/PRed -- without pushing
          a commit, opening a PR, or touching an issue. 'real' runs exactly as
          the weekly schedule does. This is a choice, not a free-text
          dry_run string, because GitHub substitutes an input's default for
          an empty value: `-f dry_run=` silently stayed a dry run
          (run 35542057275).
        type: choice
        options:
          - dry-run
          - real
        default: dry-run
      repositories:
        description: >-
          Optional comma-separated subset of the four self-hosted
          full_name repos (e.g. "jlapenna/repo-tools") to limit this run to.
          Leave empty to run the whole fleet from
          .github/renovate-self-hosted.json.
        type: string
        default: ''

permissions: {}

jobs:
  plan:
    name: Compute owner/repository matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # .github/renovate-self-hosted.json's `repositories` array is the
      # single source of truth for which repos are self-hosted; grouping by
      # owner here (rather than hand-maintaining a second matrix list) means
      # adding or removing a repo only ever touches that one file (see
      # docs/renovate.md).
      - name: Compute matrix from renovate-self-hosted.json
        id: plan
        env:
          REPOSITORIES_OVERRIDE: ${{ inputs.repositories }}
        run: |
          set -euo pipefail
          CONFIG=.github/renovate-self-hosted.json
          ALL_REPOS=$(jq -c '.repositories' "$CONFIG")

          if [ -z "${REPOSITORIES_OVERRIDE:-}" ]; then
            TARGET_REPOS="$ALL_REPOS"
          else
            TARGET_REPOS=$(printf '%s' "$REPOSITORIES_OVERRIDE" \
              | tr ',' '\n' \
              | awk '{$1=$1};1' \
              | grep -v '^$' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
            UNKNOWN=$(jq -c -n --argjson all "$ALL_REPOS" --argjson sel "$TARGET_REPOS" '$sel - $all')
            if [ "$UNKNOWN" != "[]" ]; then
              echo "::error::repositories input lists repos outside the self-hosted fleet in $CONFIG: $UNKNOWN"
              exit 1
            fi
          fi

          MATRIX=$(jq -c -n --argjson repos "$TARGET_REPOS" '
            {include: (
              $repos
              | group_by(split("/")[0])
              | map({
                  owner: (.[0] | split("/")[0]),
                  full_repos: .,
                  repos: map(split("/")[1]),
                })
            )}
          ')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  renovate:
    name: Renovate (${{ matrix.owner }})
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Per-owner, not per-workflow: the two owners' runs are independent
      # and should not wait on each other, but a schedule firing while a
      # prior dispatch for the same owner is still running must queue
      # rather than run concurrently against the same repos' branches.
      group: renovate-self-hosted-${{ matrix.owner }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Scoped to exactly this owner's repos and exactly the permissions
      # Renovate needs against them: contents/pull-requests to branch and
      # PR, issues for labels and the Dependency Dashboard issue (GitHub's
      # label endpoints sit under the Issues permission -- see
      # label-contract-audit.yml), and workflows because all four repos
      # have .github/workflows Renovate's github-actions manager will want
      # to open PRs against (pushing a workflow-file change needs the
      # `workflows` permission specifically, or the push is rejected).
      - name: Mint ${{ matrix.owner }} App token
        id: mint
        uses: ./.github/actions/mint-agent-token
        with:
          client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ join(matrix.repos, ',') }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Run self-hosted Renovate for ${{ matrix.owner }}
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        env:
          RENOVATE_REPOSITORIES: ${{ toJSON(matrix.full_repos) }}
          # Renovate's env parser skips an empty-string env var entirely
          # (treated as unset), so this is a real run on schedule and
          # whatever the dispatch input says otherwise.
          RENOVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'real' && 'full' || '' }}
          LOG_LEVEL: info
        with:
          configurationFile: .github/renovate-self-hosted.json
          token: ${{ steps.mint.outputs.token }}
          # Kept as an exact pin, tracked by the customManager in this
          # repo's own renovate.json (hosted Renovate keeps it fresh, same
          # as any other third-party pin in this repo).
          renovate-version: '44.104.1' # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
