# Fleet-published reusable Claude agent lane (issue #1312 U1).
#
# The canonical Claude issue-agent pipeline, synthesized from the union of
# the fleet's three claude.yml lanes (agent-lcars, homelab, sprinkles).
# Callers keep what workflow_call cannot carry: `on: workflow_dispatch`
# inputs, `run-name` (contract-tested), top-level concurrency, top-level
# permissions, and the repo-variable spellings (vars don't cross repos, so
# every needed value arrives as an input).
#
# Recorded divergence reasons (#1305 convention) — every toggle below
# exists because one repo needs it, and defaults to the consumer behavior:
#
# - dispatch-bootstrap: agent-lcars is the hosted-orchestrator thin
#   executor (#1015) — admission, attempt identity, App-token mint, claim,
#   and enforcement-snapshot run through its local dispatch-bootstrap/
#   agent-handoff composites; consumer repos run the published
#   snapshot/mint/claim/verify path against `@main` instead.
# - protected-snapshot: agent-lcars preserves the dispatch brief as a run
#   artifact for trajectory evaluation; consumers run no evaluation.
# - long-run-budget: sprinkles resolves the agent budget from the
#   dispatched issue's live `agent-option:long-run` label (200 turns/80
#   minutes default, 400/170 long); the other repos use fixed budgets.
# - gcp-auth: sprinkles' agents self-verify production through a
#   read-only WIF identity; the other repos grant claude no ambient GCP.
# - install-workspace-deps: sprinkles' Nx worktree-aware resolution needs
#   the primary checkout's node_modules installed (sprinkles#4003); the
#   other repos have no worktree-vs-primary split.
# - telemetry-workload-identity-provider empty skips the telemetry
#   sidecar entirely (sprinkles' opencode lane has no telemetry; every
#   claude lane currently passes a provider).
# - ACTIONS_RERUN_TOKEN source is era-tied: agent-lcars hands the agent a
#   separate revocable PAT so agent code never holds the job's
#   control-plane credential (#645); consumers hand the job token, whose
#   actions:write their own permissions block grants for this purpose.
# - prompt / no-deliverable-reason are caller-supplied text: each repo's
#   protocol paths, mode conditionals, and redispatch vocabulary are
#   repo-specific content, exactly like `run-name`.

on:
  workflow_call:
    inputs:
      issue:
        description: 'Issue number the dispatch is anchored on'
        required: true
        type: string
      mode:
        description: 'Dispatch mode for hosted-controller issue work'
        required: true
        type: string
      reply:
        description: 'Original maintainer reply when mode is reply'
        required: false
        default: ''
        type: string
      runbook:
        description: 'Optional skill for a runbook dispatch'
        required: false
        default: ''
        type: string
      context:
        description: 'Optional deployment or router context'
        required: false
        default: ''
        type: string
      broker-generation:
        description: 'Monotonic broker generation (attempt identity half)'
        required: false
        default: ''
        type: string
      broker-intent-id:
        description: 'Immutable broker intent ID (attempt identity half)'
        required: false
        default: ''
        type: string
      runs-on-label:
        description: 'Self-hosted runner label the worker job targets'
        required: true
        type: string
      job-timeout-minutes:
        description: 'Whole-job backstop timeout'
        required: false
        default: 90
        type: number
      agent-timeout-minutes:
        description: 'Agent-step timeout when long-run-budget is off'
        required: false
        default: 60
        type: number
      max-turns:
        description: 'Agent turn budget when long-run-budget is off'
        required: false
        default: 200
        type: number
      long-run-budget:
        description: 'Resolve 200/80 vs 400/170 from the agent-option:long-run label'
        required: false
        default: false
        type: boolean
      dispatch-bootstrap:
        description: 'agent-lcars thin-executor admission era (see header)'
        required: false
        default: false
        type: boolean
      protected-snapshot:
        description: 'Upload the dispatch brief as a run artifact for evaluation'
        required: false
        default: false
        type: boolean
      install-workspace-deps:
        description: 'pnpm-install the primary checkout (sprinkles#4003)'
        required: false
        default: false
        type: boolean
      gcp-auth:
        description: 'Authenticate ambient GCP ADC for the agent'
        required: false
        default: false
        type: boolean
      gcp-workload-identity-provider:
        description: 'WIF provider for gcp-auth'
        required: false
        default: ''
        type: string
      gcp-service-account:
        description: 'Service account for gcp-auth'
        required: false
        default: ''
        type: string
      telemetry-workload-identity-provider:
        description: 'WIF provider for the telemetry sidecar (empty skips it)'
        required: false
        default: ''
        type: string
      telemetry-service-account:
        description: 'Write-only telemetry service account'
        required: false
        default: ''
        type: string
      agent-fleet-login:
        description: "Caller's AGENT_FLEET_LOGIN repo variable"
        required: true
        type: string
      maintainer-login:
        description: "Caller's MAINTAINER_LOGIN repo variable"
        required: true
        type: string
      agent-lcars-client-id:
        description: 'Agent LCARS App client ID for the token mint'
        required: true
        type: string
      nx-cache-url:
        description: 'Nx self-hosted remote cache URL (empty soft-fails)'
        required: false
        default: ''
        type: string
      pnpm-store-dir:
        description: 'npm_config_store_dir for the run (empty leaves default)'
        required: false
        default: ''
        type: string
      brief-budget-minutes:
        description: 'Dispatch-brief runtime budget (prepare-agent-dispatch)'
        required: false
        default: '60'
        type: string
      brief-artifact-checkpoint-minutes:
        description: 'Dispatch-brief durable-artifact checkpoint'
        required: false
        default: '25'
        type: string
      brief-finalize-checkpoint-minutes:
        description: 'Dispatch-brief finalization checkpoint'
        required: false
        default: '45'
        type: string
      prompt:
        description: "The agent prompt, fully rendered in the caller's context"
        required: true
        type: string
      no-deliverable-reason:
        description: 'Silent-stall wording, rendered with the caller redispatch vocabulary'
        required: true
        type: string
      message-prefix:
        description: 'Optional prefix for post-agent gate failure reports'
        required: false
        default: ''
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Long-lived token from `claude setup-token`'
        required: true
      AGENT_LCARS_PRIVATE_KEY:
        description: 'Agent LCARS App private key for the token mint'
        required: true
      NX_CACHE_TOKEN:
        description: 'Nx remote cache access token (empty soft-fails)'
        required: false
      AGENT_CI_RERUN_TOKEN:
        description: 'Separate revocable CI-rerun PAT (dispatch-bootstrap era)'
        required: false

jobs:
  claude:
    runs-on: ['${{ inputs.runs-on-label }}']
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    # Requests exactly what every lane's caller grants today; a called
    # workflow can only downgrade the caller's grant, never widen it.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write
    env:
      # Lane-specific values. Keep the common lifecycle below data-driven;
      # Claude's action-managed authentication and status check remain its
      # only intentional behavior differences.
      AGENT_NAME: Claude
      WORKER_WORKFLOW: claude.yml
      AGENT_GIT_LOGIN: ${{ inputs.agent-fleet-login }}
      AGENT_LABEL: agent:claude
      REDISPATCH_COMMAND: '@claude'
      # Nx remote cache (agent-lcars/sprinkles): the agent's own
      # lint/test/build runs replay task outputs CI already computed and
      # seed the cache for the CI runs on its PRs. Empty values or an
      # unreachable server soft-fail to local recompute, so this can never
      # block the agent.
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ inputs.nx-cache-url }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}
    steps:
      # Repo-specific store location (agent-lcars parks it on the shared
      # workdir mount, sprinkles on the disk-backed runner workdir; homelab
      # sets none). Published via GITHUB_ENV instead of job env so an empty
      # input leaves the pnpm default untouched rather than forcing an
      # empty-string config value.
      - name: Publish lane environment
        env:
          PNPM_STORE_DIR: ${{ inputs.pnpm-store-dir }}
        run: |
          if [ -n "$PNPM_STORE_DIR" ]; then
            echo "npm_config_store_dir=$PNPM_STORE_DIR" >> "$GITHUB_ENV"
          fi

      # ---- Consumer admission era (published actions, dispatch-bootstrap
      # off). Fail fast, naming every missing required value at once,
      # before any step depends on one.
      - name: Assert required lane inputs are set
        if: ${{ !inputs.dispatch-bootstrap }}
        uses: jlapenna/agent-lcars/.github/actions/assert-repo-vars@main # latest
        with:
          vars: |
            AGENT_FLEET_LOGIN=${{ inputs.agent-fleet-login }}
            MAINTAINER_LOGIN=${{ inputs.maintainer-login }}

      # Freeze the trusted failure path at the earliest point possible, so
      # mint/claim/checkout can fail without stranding the issue. The
      # composite copies bytes from the pinned-ref fetch of
      # jlapenna/agent-lcars itself, not this checkout's working tree.
      - name: Snapshot post-agent enforcement scripts
        if: ${{ !inputs.dispatch-bootstrap }}
        uses: jlapenna/agent-lcars/.github/actions/snapshot-enforcement-scripts@main # latest
        with:
          actions: |
            verify-deliverable
            report-failure
            telemetry-finalize
            post-agent-gates

      # This attempt's stable identity, derived directly from the trusted
      # dispatch inputs — `g<generation>:<intentId>`, byte-identical to
      # libs/dispatch-contracts' formatAttemptId. Written to $GITHUB_ENV so
      # any later step reads it as ${{ env.ATTEMPT_ID }}. (In the
      # dispatch-bootstrap era the bootstrap composite publishes the same
      # value itself.)
      - name: Publish attempt identity
        if: ${{ !inputs.dispatch-bootstrap }}
        env:
          ATTEMPT_ID: g${{ inputs.broker-generation }}:${{ inputs.broker-intent-id }}
        run: echo "ATTEMPT_ID=$ATTEMPT_ID" >> "$GITHUB_ENV"

      # Mints the Agent LCARS App token so claim/comment/label operations
      # are attributed to the App's bot login instead of
      # github-actions[bot]. This does NOT change how "Run Claude Code"
      # itself pushes or opens PRs: that step vends its own separate
      # claude[bot] App token internally.
      - name: Mint agent token
        id: agent-lcars-token
        if: ${{ !inputs.dispatch-bootstrap }}
        uses: jlapenna/agent-lcars/.github/actions/mint-agent-token@main # latest
        with:
          client-id: ${{ inputs.agent-lcars-client-id }}
          private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write

      # Claim the anchor issue/PR for the agent fleet the moment the run
      # starts. Before Checkout on purpose — a cross-repo action needs no
      # local checkout, so the claim still lands even if workspace setup
      # fails. Additive and idempotent: never removes a human assignee.
      - name: Claim the issue as the agent fleet
        id: claim
        if: ${{ !inputs.dispatch-bootstrap }}
        uses: jlapenna/agent-lcars/.github/actions/claim-issue@main # latest
        with:
          token: ${{ steps.agent-lcars-token.outputs.token }}
          issue: ${{ inputs.issue }}
          claim-login: ${{ inputs.agent-fleet-login }}

      # Shared by both eras: claude's checkout carries no minted token —
      # the claude-code action vends its own push credential. In the
      # dispatch-bootstrap era this must also run before the bootstrap
      # composite below: local composite actions only resolve once the
      # repo containing them is checked out — a platform constraint.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---- agent-lcars thin-executor admission era (#1015): freezes the
      # post-agent enforcement scripts, asserts required repo variables,
      # publishes this attempt's stable identity, mints the Agent LCARS App
      # token, and claims the anchor issue/PR for the agent fleet —
      # admission was already decided server-side by the hosted
      # orchestrator before this workflow ran. See
      # .github/actions/dispatch-bootstrap/action.yml for the full
      # step-by-step rationale.
      - name: Dispatch bootstrap
        id: dispatch-bootstrap
        if: ${{ inputs.dispatch-bootstrap }}
        uses: ./.github/actions/dispatch-bootstrap
        with:
          issue: ${{ inputs.issue }}
          broker-generation: ${{ inputs.broker-generation }}
          broker-intent-id: ${{ inputs.broker-intent-id }}
          agent-fleet-login: ${{ inputs.agent-fleet-login }}
          maintainer-login: ${{ inputs.maintainer-login }}
          agent-lcars-client-id: ${{ inputs.agent-lcars-client-id }}
          agent-lcars-private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}

      # Trusted finalization handoff (agent-lcars#823): agent git identity,
      # run-start timestamp, shared Nx cache, and the App-identity/push-
      # credential verification — the last trusted gate before "Run Claude
      # Code" below. See .github/actions/agent-handoff/action.yml.
      - name: Agent handoff
        id: agent-handoff
        if: ${{ inputs.dispatch-bootstrap }}
        uses: ./.github/actions/agent-handoff
        with:
          agent-login: ${{ env.AGENT_GIT_LOGIN }}
          token: ${{ steps.dispatch-bootstrap.outputs.token }}
          agent: ${{ env.AGENT_NAME }}
          app-slug: ${{ steps.dispatch-bootstrap.outputs.app-slug }}

      # ---- Consumer era continues: split of agent-handoff's pairing.
      - name: Shared agent setup
        id: agent-setup
        if: ${{ !inputs.dispatch-bootstrap }}
        uses: jlapenna/agent-lcars/.github/actions/agent-setup@main # latest
        with:
          agent-login: ${{ inputs.agent-fleet-login }}

      # $GITHUB_WORKSPACE never otherwise gets `pnpm install` in these
      # workflows — only the agent's own linked worktree does. Nx's
      # worktree-aware resolution anchors some workspace-library imports
      # off the git "main worktree" root, which here is $GITHUB_WORKSPACE;
      # left dependency-less that silently breaks Vitest resolution for
      # tests reaching a workspace lib with third-party deps
      # (sprinkles#4003).
      - name: Install workspace dependencies (primary checkout)
        if: ${{ !inputs.dispatch-bootstrap && inputs.install-workspace-deps }}
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/corepack-shims"
            corepack enable --install-directory "$RUNNER_TEMP/corepack-shims"
            echo "$RUNNER_TEMP/corepack-shims" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/corepack-shims:$PATH"
          fi
          HUSKY=0 pnpm install --frozen-lockfile

      - name: Verify agent identity
        if: ${{ !inputs.dispatch-bootstrap }}
        uses: jlapenna/agent-lcars/.github/actions/verify-agent-identity@main # latest
        with:
          token: ${{ steps.agent-lcars-token.outputs.token }}
          agent: Claude
          app-slug: ${{ steps.agent-lcars-token.outputs.app-slug }}

      - name: Prepare dispatch context
        id: agent-dispatch
        if: ${{ !inputs.dispatch-bootstrap }}
        uses: jlapenna/agent-lcars/.github/actions/prepare-agent-dispatch@main # latest
        with:
          agent: Claude
          issue: ${{ inputs.issue }}
          mode: ${{ inputs.mode }}
          reply: ${{ inputs.reply }}
          runbook: ${{ inputs.runbook }}
          context: ${{ inputs.context }}
          budget-minutes: ${{ inputs.brief-budget-minutes }}
          artifact-checkpoint-minutes: ${{ inputs.brief-artifact-checkpoint-minutes }}
          finalize-checkpoint-minutes: ${{ inputs.brief-finalize-checkpoint-minutes }}

      # Authenticates via the caller's WIF pool, impersonating the
      # write-only telemetry-writer SA so the sidecar can report this run's
      # live turns/tokens to the agent-lcars console. if: always() so an
      # earlier step's failure doesn't skip telemetry entirely — the
      # composite's own inner steps are already continue-on-error, so this
      # never turns a healthy run red. Two era-split instances of the same
      # composite: the dispatch-bootstrap era resolves it from this repo's
      # own dispatched-ref checkout, the consumer era from the published
      # `@main` fetch.
      - name: Start telemetry sidecar
        id: telemetry-start
        if: always() && inputs.dispatch-bootstrap
        uses: ./.github/actions/telemetry-start
        with:
          workload-identity-provider: ${{ inputs.telemetry-workload-identity-provider }}
          service-account: ${{ inputs.telemetry-service-account }}
          issue: ${{ inputs.issue }}

      - name: Start telemetry sidecar (published)
        id: telemetry-start-published
        if: always() && !inputs.dispatch-bootstrap && inputs.telemetry-workload-identity-provider != ''
        uses: jlapenna/agent-lcars/.github/actions/telemetry-start@main # latest
        with:
          workload-identity-provider: ${{ inputs.telemetry-workload-identity-provider }}
          service-account: ${{ inputs.telemetry-service-account }}
          issue: ${{ inputs.issue }}

      # GCP access via Workload Identity Federation so the agent can
      # self-verify things it used to have to ask the maintainer to check.
      # No stored key: the WIF provider trusts the caller repo's OIDC token
      # directly.
      - name: Authenticate to GCP
        id: gcp-auth
        if: ${{ inputs.gcp-auth }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-service-account }}

      # A second, narrower mint — deliberately not the App token above and
      # not github.token. The App token is the agent's own working
      # identity; github.token is this job's control-plane credential, and
      # handing either to the agent step below would let agent-authored
      # code act as the controller — exactly what #645 forbids.
      # AGENT_CI_RERUN_TOKEN is a classic PAT at public_repo scope from the
      # agent-lcars-bot machine account: a separate, attributable,
      # independently revocable identity confined to the public repo.
      # Loud rather than silent when the credential is absent: an empty
      # $ACTIONS_RERUN_TOKEN makes `gh run rerun` fail with an opaque error
      # deep inside an agent turn, which reads as "the agent is stuck"
      # rather than "a secret is unset".
      - name: Check CI-rerun credential is present
        if: ${{ inputs.dispatch-bootstrap }}
        run: |
          if [ -z "$ACTIONS_RERUN_TOKEN" ]; then
            echo "::warning::AGENT_CI_RERUN_TOKEN is unset - the agent will \
          not be able to rerun its own failed CI (agent-protocol.md §8). \
          Expected a classic PAT with public_repo scope."
          fi
        env:
          ACTIONS_RERUN_TOKEN: ${{ secrets.AGENT_CI_RERUN_TOKEN }}

      - name: Prepare current dispatch brief and runtime deadline
        id: dispatch-brief
        if: ${{ inputs.dispatch-bootstrap }}
        uses: ./.github/actions/prepare-agent-dispatch
        with:
          token: ${{ steps.dispatch-bootstrap.outputs.token }}
          agent: ${{ env.AGENT_NAME }}
          issue: ${{ inputs.issue }}
          mode: ${{ inputs.mode }}
          reply: ${{ inputs.reply }}
          runbook: ${{ inputs.runbook }}
          context: ${{ inputs.context }}
          budget-minutes: ${{ inputs.brief-budget-minutes }}
          artifact-checkpoint-minutes: ${{ inputs.brief-artifact-checkpoint-minutes }}
          finalize-checkpoint-minutes: ${{ inputs.brief-finalize-checkpoint-minutes }}

      # The skill install is fail-soft by contract (guidance must never
      # fail the job it instruments), and agent-lcars's prompt relies on
      # those skills being discoverable rather than naming their paths. An
      # empty digest is the observable symptom of an install that quietly
      # did nothing, so surface it (#1278). A warning, not a failure — the
      # prompt keeps a checkout fallback.
      - name: Warn if the layer-1 skill install produced nothing
        if: inputs.dispatch-bootstrap && steps.dispatch-brief.outputs.skills-digest == ''
        run: |
          echo "::warning::Layer-1 skill install produced no digest (#1278); this run's agent is falling back to checkout paths for the protocol."

      - name: Preserve protected dispatch snapshot for evaluation
        if: ${{ inputs.protected-snapshot }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dispatch-brief-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.dispatch-brief.outputs.path || steps.agent-dispatch.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # One uniform budget mechanism: with long-run-budget off this simply
      # echoes the static inputs; with it on it takes sprinkles'
      # label-resolved implementation (workflow_dispatch has no event
      # payload to read labels from, so the dispatched issue's live labels
      # are the one source of truth; a PR-anchored dispatch falls back to
      # the PR's closing issue).
      - name: Resolve agent budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ inputs.issue }}
          LONG_RUN_BUDGET: ${{ inputs.long-run-budget }}
          DEFAULT_MAX_TURNS: ${{ inputs.max-turns }}
          DEFAULT_TIMEOUT_MINUTES: ${{ inputs.agent-timeout-minutes }}
        run: |
          if [ "$LONG_RUN_BUDGET" != "true" ]; then
            echo "max_turns=$DEFAULT_MAX_TURNS" >> "$GITHUB_OUTPUT"
            echo "timeout_minutes=$DEFAULT_TIMEOUT_MINUTES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          long=false
          labels=$(gh issue view "$NUM" --repo "${{ github.repository }}" \
            --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || true)
          if [[ ",${labels}," == *",agent-option:long-run,"* ]]; then
            long=true
          elif [ -z "$labels" ]; then
            # NUM anchors a PR, not an issue: inherit from its closing issue.
            source_issue=$(gh pr view "$NUM" --repo "${{ github.repository }}" \
              --json closingIssuesReferences \
              --jq '.closingIssuesReferences[0].number // empty' 2>/dev/null || true)
            if [ -n "$source_issue" ]; then
              source_labels=$(gh issue view "$source_issue" --repo "${{ github.repository }}" \
                --json labels --jq '[.labels[].name] | join(",")')
              [[ ",${source_labels}," == *",agent-option:long-run,"* ]] && long=true
            fi
          fi

          if [ "$long" = "true" ]; then
            echo "max_turns=400" >> "$GITHUB_OUTPUT"
            echo "timeout_minutes=170" >> "$GITHUB_OUTPUT"
          else
            echo "max_turns=200" >> "$GITHUB_OUTPUT"
            echo "timeout_minutes=80" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        id: agent
        # A step timeout, not just the job's: exceeding this fails the
        # step rather than cancelling the job, so the post-agent gates
        # below still run and the issue actually hears about it.
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.timeout_minutes) }}
        # SHA-pinned (not a tag, and not floating @v1) deliberately: this
        # step holds the CLAUDE_CODE_OAUTH_TOKEN, the job's full write
        # permissions, and unrestricted Bash on a self-hosted runner — the
        # single most privileged step in the fleet. Resolved from the
        # v1.0.191 tag (the fleet hit a real breakage on a later version —
        # do not bump without confirming the new version against a live
        # test dispatch first).
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1.0.191
        env:
          # Turns on the marker-stamping gh wrapper agent-handoff installed
          # (agent-lcars#1213) — dispatch-bootstrap era only; consumer
          # prompts stamp the attempt-claim marker themselves. Deliberately
          # set ONLY here: the post-agent gates use the same gh, and
          # stamping their reports would let the deliverable gate satisfy
          # itself.
          AGENT_MARKER_STAMPING: ${{ inputs.dispatch-bootstrap && '1' || '' }}
          # The app token the action vends to the agent maxes out at
          # actions:read, so re-running workflows needs a second token.
          # Era-tied (see header): the dispatch-bootstrap era hands the
          # separate AGENT_CI_RERUN_TOKEN PAT and NEVER falls back to the
          # job's control-plane token when that secret is unset (#645);
          # consumers hand the job token, whose actions:write their own
          # permissions grant. The agent uses it as
          # `GH_TOKEN=$ACTIONS_RERUN_TOKEN gh run rerun ...`
          # (agent-protocol.md §8).
          ACTIONS_RERUN_TOKEN: ${{ (inputs.dispatch-bootstrap && secrets.AGENT_CI_RERUN_TOKEN) || (!inputs.dispatch-bootstrap && github.token) || '' }}
        with:
          # A manually-issued long-lived token from `claude setup-token`
          # (interactive browser OAuth flow) — no auto-refresh or rotation.
          # If it expires, every dispatch crashes instantly
          # (is_error:true, api_error_status:401, total_cost_usd:0) while
          # the workflow's own conclusion still reports "success" — the
          # "Verify Claude run status" step below is what actually catches
          # this. Fix: run `claude setup-token` to completion in a terminal
          # with real browser access, then `gh secret set
          # CLAUDE_CODE_OAUTH_TOKEN` in the calling repo.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Grant the action's GitHub token read access to Actions so the
          # agent can inspect CI results on the draft PRs it opens.
          additional_permissions: |
            actions: read
          # Scoped to the fleet's own bots, not `*` — a wildcard would let
          # any App that can reach the trigger start a privileged agent
          # step. github-actions[bot] is the actor of workflow_dispatch
          # runs; agent-lcars[bot] became the triggering actor when
          # dispatch moved onto App installation tokens (#1287).
          allowed_bots: 'claude[bot],github-actions[bot],agent-lcars[bot]'
          # Caller-supplied so every run uses agent mode consistently; an
          # empty prompt would silently fall back to tag mode with
          # different tool rules and no eyes-reaction/progress behavior.
          prompt: ${{ inputs.prompt }}
          # Allow Bash wholesale. The action denies all Bash by default,
          # and a granular allowlist is brittle (env-var prefixes and pipes
          # don't match Bash(cmd:*) patterns cleanly). The authorization
          # gate is the caller's dispatch admission; the runner is
          # dedicated to this agent workload. ScheduleWakeup/SendMessage
          # only work in interactive sessions; in a headless run they let
          # the agent end its turn "waiting" on something that will never
          # resume. Task is disallowed for the same reason: it defaults to
          # run_in_background, so a headless run can background a subagent
          # and end its own turn cleanly while the backgrounded work never
          # runs (agent-protocol.md §5/§9; the deliverable-evidence gate
          # below is the backstop).
          claude_args: |
            --max-turns ${{ steps.budget.outputs.max_turns }}
            --allowedTools "Bash,Edit,Write,MultiEdit"
            --disallowedTools "ScheduleWakeup,SendMessage,Monitor,Task"

      # Claude-only trusted adapter check, era-split. The
      # dispatch-bootstrap variant requires the pinned action's completed
      # structured result instead of querying this workflow's own log while
      # the run is still in progress (GitHub often cannot serve it yet);
      # the consumer variant greps the run log the way homelab/sprinkles
      # do today. Runs BEFORE the generic gates so a failure correctly
      # skips deliverable validation through JOB_STATUS.
      - name: Verify Claude run status
        if: success() && inputs.dispatch-bootstrap
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          bash tools/verify-claude-run-status.sh "$CLAUDE_EXECUTION_FILE"

      - name: Verify Claude run status (log scan)
        if: success() && !inputs.dispatch-bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="$(gh run view ${{ github.run_id }} --log 2>/dev/null || true)"
          # GitHub often can't serve logs for a still-in-progress run (this
          # step runs as part of the very run whose log it's fetching), so
          # LOG can legitimately come back empty - make that visible instead
          # of letting the checks below silently pass on no data.
          if [ -z "$LOG" ]; then
            echo "::warning::Could not fetch this run's log (often unavailable while the run is still in progress); the auth-crash check below was skipped."
          fi
          # Detect if the run crashed during initialization (is_error: true and cost is 0,
          # or api_error_status is 401).
          if (echo "$LOG" | grep -q '"api_error_status": 401' && echo "$LOG" | grep -q '"total_cost_usd": 0') || \
             (echo "$LOG" | grep -q '"is_error": true' && echo "$LOG" | grep -q '"total_cost_usd": 0'); then
            echo "::error::Claude Code run failed silently during startup/authentication."
            exit 1
          fi

      # Shared post-agent gate orchestrator (#645 Phase 3): runs
      # telemetry-finalize, verify-deliverable, failure-reason
      # determination, and report-failure, in that order, from ONE script —
      # see post-agent-gates.sh's own header for exactly how it reproduces
      # each phase's original if: condition using JOB_STATUS.
      # Silent-stall detection matters because a run can end job-success
      # having produced NOTHING — "success" alone is never proof of
      # delivery (agent-protocol.md §5).
      #
      # Runs from the pre-agent snapshot ($RUNNER_TEMP), not a local
      # composite: this step's scripts run AFTER "Run Claude Code", which
      # has unrestricted Bash and could have rewritten a locally-resolved
      # composite in the working tree.
      - name: Run post-agent gates
        id: post_agent_gates
        if: always()
        env:
          # The job's own GITHUB_TOKEN, NOT the minted App token:
          # installation tokens expire after one hour, and this step can
          # run at hour three of a long agent turn (run 30988771060 hit
          # exactly that — HTTP 401 on the failure report). The job token
          # lives for the whole job; attribution shifts to
          # github-actions[bot].
          GH_TOKEN: ${{ github.token }}
          AGENT: ${{ env.AGENT_NAME }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          ISSUE: ${{ inputs.issue }}
          MODE: ${{ inputs.mode }}
          # This run's verified attempt identity (#815): published via
          # $GITHUB_ENV by dispatch-bootstrap or the consumer-era publish
          # step, always earlier in this same job.
          ATTEMPT_ID: ${{ env.ATTEMPT_ID }}
          JOB_STATUS: ${{ job.status }}
          MESSAGE_PREFIX: ${{ inputs.message-prefix }}
          WRITER_CREDENTIALS_FILE: ${{ steps.telemetry-start.outputs['credentials-file-path'] || steps.telemetry-start-published.outputs['credentials-file-path'] }}
          # Caller-rendered no-deliverable wording (agent-protocol.md §5) —
          # the shared script stays lane-agnostic.
          NO_DELIVERABLE_REASON: ${{ inputs.no-deliverable-reason }}
          # Claude-only extra failure-reason signal (a turn-budget
          # exhaustion or an expired/invalid OAuth token), kept as an
          # adapter-style input to the shared orchestrator — see
          # claude-log-scan.sh. Left unset on every other lane.
          FAILURE_LOG_SCAN_SCRIPT: ${{ runner.temp }}/trusted-actions/post-agent-gates/claude-log-scan.sh
          CLAUDE_EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: bash "$RUNNER_TEMP/trusted-actions/post-agent-gates/post-agent-gates.sh"
