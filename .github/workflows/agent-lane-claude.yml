# Fleet-published reusable Claude agent lane (issue #1312 U1; shim since
# #1340 A-R1).
#
# This file is the published surface consumers call
# (`jlapenna/agent-lcars/.github/workflows/agent-lane-claude.yml@main`,
# and this repo's own claude.yml same-repo). The worker job itself lives
# in .github/workflows/agent-lane.yml — the single parameterized lane the
# three per-agent shims delegate to — selected here with
# `pipeline: claude`. The `workflow_call` input/secret surface below is
# the lane's published contract, pinned name-for-name (requiredness,
# type, default) by tools/contract-tests/worker-workflow-contract.test.ts;
# the same test proves every input and secret is forwarded into
# agent-lane.yml, so nothing declared here can silently drop.
#
# Callers keep what workflow_call cannot carry: `on: workflow_dispatch`
# inputs, `run-name` (contract-tested), top-level concurrency, top-level
# permissions, and the repo-variable spellings (vars don't cross repos, so
# every needed value arrives as an input). Divergence-toggle rationale
# (#1305 convention) lives in agent-lane.yml's header.

on:
  workflow_call:
    inputs:
      issue:
        description: 'Issue number the dispatch is anchored on'
        required: true
        type: string
      mode:
        description: 'Dispatch mode for hosted-controller issue work'
        required: true
        type: string
      reply:
        description: 'Original maintainer reply when mode is reply'
        required: false
        default: ''
        type: string
      runbook:
        description: 'Optional skill for a runbook dispatch'
        required: false
        default: ''
        type: string
      context:
        description: 'Optional deployment or router context'
        required: false
        default: ''
        type: string
      broker-generation:
        description: 'Monotonic broker generation (attempt identity half)'
        required: false
        default: ''
        type: string
      broker-intent-id:
        description: 'Immutable broker intent ID (attempt identity half)'
        required: false
        default: ''
        type: string
      runs-on-label:
        description: 'Self-hosted runner label the worker job targets'
        required: true
        type: string
      job-timeout-minutes:
        description: 'Whole-job backstop timeout'
        required: false
        default: 90
        type: number
      agent-timeout-minutes:
        description: 'Agent-step timeout when long-run-budget is off'
        required: false
        default: 60
        type: number
      max-turns:
        description: 'Agent turn budget when long-run-budget is off'
        required: false
        default: 200
        type: number
      long-run-budget:
        description: 'Resolve 200/80 vs 400/170 from the agent-option:long-run label'
        required: false
        default: false
        type: boolean
      dispatch-bootstrap:
        description: 'agent-lcars thin-executor admission era (see agent-lane.yml)'
        required: false
        default: false
        type: boolean
      protected-snapshot:
        description: 'Upload the dispatch brief as a run artifact for evaluation'
        required: false
        default: false
        type: boolean
      install-workspace-deps:
        description: 'pnpm-install the primary checkout (sprinkles#4003)'
        required: false
        default: false
        type: boolean
      gcp-auth:
        description: 'Authenticate ambient GCP ADC for the agent'
        required: false
        default: false
        type: boolean
      gcp-workload-identity-provider:
        description: 'WIF provider for gcp-auth'
        required: false
        default: ''
        type: string
      gcp-service-account:
        description: 'Service account for gcp-auth'
        required: false
        default: ''
        type: string
      telemetry-workload-identity-provider:
        description: 'WIF provider for the telemetry sidecar (empty skips it)'
        required: false
        default: ''
        type: string
      telemetry-service-account:
        description: 'Write-only telemetry service account'
        required: false
        default: ''
        type: string
      agent-fleet-login:
        description: "Caller's AGENT_FLEET_LOGIN repo variable"
        required: true
        type: string
      agent-lcars-client-id:
        description: 'Agent LCARS App client ID for the token mint'
        required: true
        type: string
      nx-cache-url:
        description: 'Nx self-hosted remote cache URL (empty soft-fails)'
        required: false
        default: ''
        type: string
      pnpm-store-dir:
        description: 'npm_config_store_dir for the run (empty leaves default)'
        required: false
        default: ''
        type: string
      brief-budget-minutes:
        description: 'Dispatch-brief runtime budget (prepare-agent-dispatch)'
        required: false
        default: '60'
        type: string
      brief-artifact-checkpoint-minutes:
        description: 'Dispatch-brief durable-artifact checkpoint'
        required: false
        default: '25'
        type: string
      brief-finalize-checkpoint-minutes:
        description: 'Dispatch-brief finalization checkpoint'
        required: false
        default: '45'
        type: string
      prompt:
        description: "Override the canonical prompt BODY (the attempt-claim tail is always the lane's)"
        required: false
        default: ''
        type: string
      protocol-note:
        description: "Extra clause naming a repo's own protocol file, spliced into the default prompt's reading order"
        required: false
        default: ''
        type: string
      no-deliverable-reason:
        description: 'Override the canonical silent-stall wording (empty renders the lane default)'
        required: false
        default: ''
        type: string
      message-prefix:
        description: 'Optional prefix for post-agent gate failure reports'
        required: false
        default: ''
        type: string
      claude-token-secret:
        description: 'Secret Manager resource holding the subscription token (#1350)'
        required: false
        default: 'projects/agent-lcars/secrets/CLAUDE_CODE_OAUTH_TOKEN/versions/latest'
        type: string
      claude-token-wif-provider:
        description: 'WIF provider admitting the caller repo to read that secret'
        required: false
        default: 'projects/611425338852/locations/global/workloadIdentityPools/github/providers/github'
        type: string
      claude-token-service-account:
        description: 'Read-only service account holding accessor on that one secret'
        required: false
        default: 'claude-token-reader@agent-lcars.iam.gserviceaccount.com'
        type: string
    secrets:
      AGENT_LCARS_PRIVATE_KEY:
        description: 'Agent LCARS App private key for the token mint'
        required: true
      NX_CACHE_TOKEN:
        description: 'Nx remote cache access token (empty soft-fails)'
        required: false
      AGENT_CI_RERUN_TOKEN:
        description: 'Separate revocable CI-rerun PAT (dispatch-bootstrap era)'
        required: false

jobs:
  claude:
    # Same permissions the worker job requests; a called workflow can only
    # downgrade the caller's grant, never widen it.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write
    uses: ./.github/workflows/agent-lane.yml
    with:
      pipeline: claude
      issue: ${{ inputs.issue }}
      mode: ${{ inputs.mode }}
      reply: ${{ inputs.reply }}
      runbook: ${{ inputs.runbook }}
      context: ${{ inputs.context }}
      broker-generation: ${{ inputs.broker-generation }}
      broker-intent-id: ${{ inputs.broker-intent-id }}
      runs-on-label: ${{ inputs.runs-on-label }}
      job-timeout-minutes: ${{ inputs.job-timeout-minutes }}
      agent-timeout-minutes: ${{ inputs.agent-timeout-minutes }}
      max-turns: ${{ inputs.max-turns }}
      long-run-budget: ${{ inputs.long-run-budget }}
      dispatch-bootstrap: ${{ inputs.dispatch-bootstrap }}
      protected-snapshot: ${{ inputs.protected-snapshot }}
      install-workspace-deps: ${{ inputs.install-workspace-deps }}
      gcp-auth: ${{ inputs.gcp-auth }}
      gcp-workload-identity-provider: ${{ inputs.gcp-workload-identity-provider }}
      gcp-service-account: ${{ inputs.gcp-service-account }}
      telemetry-workload-identity-provider: ${{ inputs.telemetry-workload-identity-provider }}
      telemetry-service-account: ${{ inputs.telemetry-service-account }}
      agent-fleet-login: ${{ inputs.agent-fleet-login }}
      agent-lcars-client-id: ${{ inputs.agent-lcars-client-id }}
      nx-cache-url: ${{ inputs.nx-cache-url }}
      pnpm-store-dir: ${{ inputs.pnpm-store-dir }}
      brief-budget-minutes: ${{ inputs.brief-budget-minutes }}
      brief-artifact-checkpoint-minutes: ${{ inputs.brief-artifact-checkpoint-minutes }}
      brief-finalize-checkpoint-minutes: ${{ inputs.brief-finalize-checkpoint-minutes }}
      prompt: ${{ inputs.prompt }}
      protocol-note: ${{ inputs.protocol-note }}
      no-deliverable-reason: ${{ inputs.no-deliverable-reason }}
      message-prefix: ${{ inputs.message-prefix }}
      claude-token-secret: ${{ inputs.claude-token-secret }}
      claude-token-wif-provider: ${{ inputs.claude-token-wif-provider }}
      claude-token-service-account: ${{ inputs.claude-token-service-account }}
    secrets:
      AGENT_LCARS_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
      NX_CACHE_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}
      AGENT_CI_RERUN_TOKEN: ${{ secrets.AGENT_CI_RERUN_TOKEN }}
