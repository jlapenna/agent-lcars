name: Codex Issue Agent

# Third issue-agent pipeline, alongside claude.yml and opencode.yml. Adding
# the `agent:codex` label dispatches OpenAI's Codex CLI on the same self-hosted
# fleet; reply with `/codex` to continue a conversation on an issue that
# already carries the label.
#
# Thin caller (issue #1312 U1): the worker job's whole step sequence lives
# in the published reusable lane, .github/workflows/agent-lane-codex.yml,
# consumed here same-repo (so it resolves from this run's own dispatched
# ref). This file keeps only what workflow_call cannot carry: the
# workflow_dispatch input contract, the contract-tested run-name, the
# subscription-auth concurrency group, the permissions grant, and the
# repo-variable spellings passed down as inputs.
#
# The subscription credential is this repository's own GCS object. Codex
# rotates it on every run, so no two repositories may share a lineage.
#
# The shared agent protocol is the complete behavioral contract.

# This workflow is workflow_dispatch-only (the hosted controller owns event
# admission). Keep the console's leading issue-number join key and add the
# immutable broker marker used for interrupted-bind reconciliation. Native
# runs render a fixed label; the work id is already in the dispatch marker
# tail, which is what the console binds on.
run-name: "${{ inputs.issue != '' && format('#{0}', inputs.issue) || 'native work' }}: Codex issue agent [dispatch:g${{ inputs.broker_generation }}:${{ inputs.broker_intent_id }}]"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to run against (manual testing)'
        required: false
        default: ''
      mode:
        description: 'Dispatch mode for hosted-controller issue work'
        required: false
        default: 'implement'
      reply:
        description: 'Original maintainer reply when mode is reply'
        required: false
        default: ''
      runbook:
        description: 'Optional skill for a runbook dispatch'
        required: false
        default: ''
      context:
        description: 'Optional deployment or router context'
        required: false
        default: ''
      work:
        description: 'Native work item JSON: {id, spec} for a work-anchored dispatch, or {spec} merged onto issue context for a GitHub anchor (see prepare-agent-dispatch/action.yml)'
        required: false
        default: ''
      broker_intent_id:
        description: 'Immutable broker intent ID'
        required: true
      broker_generation:
        description: 'Monotonic broker generation'
        required: true
      broker_dispatch_token:
        description: 'Immutable broker dispatch token'
        required: true

# Least privilege: enough to comment, push a feature branch, and open a PR.
# id-token: write is what lets this job mint a WIF token for the GCP
# project that holds the subscription credential.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  codex:
    # The hosted controller authorizes the request and enforces exactly one
    # agent label before dispatching this worker.
    if: github.event_name == 'workflow_dispatch' && (inputs.issue != '' || inputs.work != '')
    # Serialize every subscription-authenticated run: two agents must never
    # rotate the same auth.json refresh token concurrently. This belongs on
    # the job, not the workflow — issue_comment creates a workflow run
    # before the dispatch predicate above is evaluated, so at workflow scope
    # a later bot/no-op comment could evict a valid pending agent run from
    # the group even though its own job would be skipped.
    concurrency:
      group: codex-subscription-auth
      cancel-in-progress: false
    uses: ./.github/workflows/agent-lane-codex.yml
    with:
      issue: ${{ inputs.issue }}
      mode: ${{ inputs.mode }}
      reply: ${{ inputs.reply }}
      runbook: ${{ inputs.runbook }}
      context: ${{ inputs.context }}
      work: ${{ inputs.work }}
      broker-generation: ${{ inputs.broker_generation }}
      broker-intent-id: ${{ inputs.broker_intent_id }}
      runs-on-label: ${{ vars.AGENT_RUNNER_LABEL }}
      # 90, matching claude.yml/opencode.yml and the console's
      # RUN_TIMEOUT_MINUTES. The real bound is the lane's per-step agent
      # timeout; this is the backstop (see #51/#129 for what an unbounded
      # agent step costs).
      job-timeout-minutes: 90
      agent-timeout-minutes: 60
      # This repo is the hosted-orchestrator thin executor (#1015) and
      # preserves the dispatch brief for trajectory evaluation.
      dispatch-bootstrap: true
      protected-snapshot: true
      gcp-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp-service-account: ${{ vars.GCP_CODEX_AGENT_SA }}
      gcp-project-id: ${{ vars.GCP_PROJECT_ID }}
      telemetry-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
      telemetry-service-account: ${{ vars.GCP_TELEMETRY_WRITER_SA }}
      agent-fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      agent-lcars-client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
      nx-cache-url: ${{ vars.NX_CACHE_URL }}
      # Use the image's normal pnpm store: matching package content comes from
      # its immutable lower-layer seed, while misses stay in this ephemeral
      # runner container's private writable layer.
      brief-budget-minutes: '60'
      brief-artifact-checkpoint-minutes: '25'
      brief-finalize-checkpoint-minutes: '45'
    secrets:
      AGENT_LCARS_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
      NX_CACHE_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}
      AGENT_CI_RERUN_TOKEN: ${{ secrets.AGENT_CI_RERUN_TOKEN }}

  fallback-finalize:
    needs: codex
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.issue != '' || inputs.work != '')
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    uses: ./.github/workflows/agent-fallback-finalize.yml
    with:
      issue: ${{ inputs.issue }}
      work: ${{ inputs.work }}
      generation: ${{ inputs.broker_generation }}
      intent-id: ${{ inputs.broker_intent_id }}
      dispatch-token: ${{ inputs.broker_dispatch_token }}
      worker-workflow: codex.yml
      worker-result: ${{ needs.codex.result }}
      agent: Codex
      fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      maintainer: ${{ vars.MAINTAINER_LOGIN }}
