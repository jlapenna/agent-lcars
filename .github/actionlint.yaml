# actionlint's self-hosted-runner allowlist only matters for LITERAL
# `runs-on:` values - it has no way to resolve a `${{ vars.* }}` expression
# at lint time, so it never actually checks a job whose `runs-on:` reads an
# expression against this list. Keep the known labels documented here for any
# non-provider workflow that later pins one literally.
self-hosted-runner:
  labels:
    - lcars-default
    - lcars-ci

# GitHub supports concurrency.queue; pinned actionlint 1.7.7 does not yet.
# Required deploy-console-source-fence contracts validate queue values and
# queue:max cancellation rules for this one workflow. Preserve every other
# syntax diagnostic. Remove this exception when rhysd/actionlint#657 lands.
paths:
  .github/workflows/deploy-console.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
