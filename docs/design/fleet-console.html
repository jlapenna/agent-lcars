<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent LCARS — Bridge</title>
<style>
@font-face { font-family: "Antonio"; src: url(assets/fonts/Antonio-500-700.woff2) format("woff2"); font-weight: 500 700; font-display: swap; }
@font-face { font-family: "IBM Plex Sans"; src: url(assets/fonts/IBMPlexSans-400-600.woff2) format("woff2"); font-weight: 400 600; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(assets/fonts/IBMPlexMono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(assets/fonts/IBMPlexMono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }

/* ---- Tokens: values are theme.ts palette anchors + dark ramp ---- */
:root {
  --surface: #060709;          /* the one ground (dark-9) */
  --surface-raised: #0f121a;   /* menus, row hover only */
  --hairline: #212736;         /* dark-6 */
  --ink: #eeeff2;              /* gray-0 */
  --ink-dim: #a5adc0;          /* dark-2 */
  --ink-on-accent: #06070a;
  --ink-on-muted: #f4f4f6;
  --spark: #505c7c;            /* dark-4: quiet data encoding */
  --track: #212736;

  --amber: #ff9f45; --blue: #6c8fe0; --periwinkle: #8c8fde;
  --violet: #b15fc7; --teal: #4fb8c4; --gold: #e0b84b;

  /* status: never a route accent */
  --ok: #4fae8c; --warn: #b98e19; --warn-ink: #e0b84b; --fail: #d9694f; --fail-ink: #df9786;

  --signal-stops: var(--blue) 0 56%, var(--violet) 56% 76%, var(--gold) 76% 100%;
  --spine: 6px;

  --rail-w: 152px; --arm-h: 24px; --knee-r: 32px; --outer-r: 72px; --gap: 32px;

  --f-display: "Antonio", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
[data-accent="amber"] { --accent: var(--amber); }
[data-accent="blue"] { --accent: var(--blue); }
[data-accent="periwinkle"] { --accent: var(--periwinkle); }
[data-accent="violet"] { --accent: var(--violet); }
[data-accent="teal"] { --accent: var(--teal); }
[data-accent="gold"] { --accent: var(--gold); }
[data-accent] {
  --accent-ink: color-mix(in srgb, var(--accent) 80%, white);
  --accent-muted: color-mix(in srgb, var(--accent) 52%, var(--surface));
  --accent-muted-hover: color-mix(in srgb, var(--accent) 40%, var(--surface));
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface); color: var(--ink); }
body { font: 400 14px/1.45 var(--f-body); min-width: 1180px; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
.mono { font-family: var(--f-mono); }
.dim { color: var(--ink-dim); }
.eyebrow { font: 600 12px/1 var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-dim); }

/* ---- Page grid: elbow rail | header + body ---- */
.page { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: auto 1fr; column-gap: var(--gap); min-height: 100vh; padding-right: 28px; }

/* ---- The one elbow: rail turns through the knee into the arm ---- */
.rail-head { position: relative; grid-row: 1; background: var(--accent); border-top-left-radius: var(--outer-r); display: flex; flex-direction: column; justify-content: flex-end; padding: 0 12px 12px; color: var(--ink-on-accent); text-align: right; }
.rail-head::after { content: ""; position: absolute; left: 100%; top: 0; width: var(--knee-r); height: calc(var(--arm-h) + var(--knee-r)); background: var(--accent);
  -webkit-mask: radial-gradient(circle at 100% 100%, transparent calc(var(--knee-r) - .5px), #000 var(--knee-r)) 0 var(--arm-h) / var(--knee-r) var(--knee-r) no-repeat, linear-gradient(#000, #000) 0 0 / 100% var(--arm-h) no-repeat;
          mask: radial-gradient(circle at 100% 100%, transparent calc(var(--knee-r) - .5px), #000 var(--knee-r)) 0 var(--arm-h) / var(--knee-r) var(--knee-r) no-repeat, linear-gradient(#000, #000) 0 0 / 100% var(--arm-h) no-repeat; }
.rail-brand { font: 700 22px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.rail-code { font: 500 11px/1.4 var(--f-mono); margin-top: 6px; }
.rail-body { grid-row: 2; display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.rail-block { background: var(--accent-muted); color: var(--ink-on-muted); padding: 8px 12px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; text-align: right; }
.rail-block b { font: 500 18px/1.1 var(--f-mono); }
.rail-block span { font: 600 11px/1.2 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.rail-block.fill { flex: 1; min-height: 40px; }
.rail-block.end { background: var(--accent); color: var(--ink-on-accent); height: 44px; }

/* ---- Header ---- */
.header { grid-row: 1; grid-column: 2; padding-bottom: 18px; }
.arm { display: flex; gap: 6px; height: var(--arm-h); }
.arm i { background: var(--accent); display: block; }
.arm i:first-child { flex: 1; }
.title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 18px 0 0; }
h1 { margin: 0; font: 700 46px/.95 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.subtitle { margin-top: 6px; color: var(--ink-dim); font-size: 13px; }
.utilities { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.sync { font: 400 12px/1.3 var(--f-mono); color: var(--ink-dim); text-align: right; }
.sync b { color: var(--ok); font-weight: 500; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.who .av { width: 32px; height: 32px; background: var(--hairline); display: grid; place-items: center; font: 600 13px var(--f-display); letter-spacing: .05em; }

.signal { display: flex; gap: 4px; height: 6px; margin: 16px 0 12px; }
.signal i { display: block; background: linear-gradient(to right, var(--signal-stops)); }
.signal i:nth-child(1) { flex: 0 0 34%; background: var(--blue); }
.signal i:nth-child(2) { flex: 0 0 12%; background: var(--violet); }
.signal i:nth-child(3) { flex: 0 0 7%; background: var(--gold); }
.signal i:nth-child(4) { flex: 0 0 3%; background: var(--amber); }
.signal i:nth-child(5) { flex: 1; background: var(--teal); max-width: 14%; }

/* destination rail: square modules, label docked to the trailing edge */
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; height: 44px; padding: 0 12px 7px; min-width: var(--w, 120px);
  background: var(--accent-muted); color: var(--ink-on-muted); text-decoration: none; font: 600 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; transition: background-color .14s; }
.nav a small { font: 500 11px/1 var(--f-mono); letter-spacing: 0; opacity: .9; align-self: flex-start; padding-top: 7px; }
.nav a:hover { background: var(--accent-muted-hover); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--ink-on-accent); }
.nav a:active { transform: translateY(1px); }

/* ---- Buttons: flat blocks ---- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border: 0; border-radius: 0; cursor: pointer;
  font: 600 14px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; transition: background-color .14s; }
.btn-primary { background: var(--accent); color: var(--ink-on-accent); height: 40px; padding: 0 20px; }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 86%, white); }
.btn-secondary { background: var(--accent-muted); color: var(--ink-on-muted); }
.btn-secondary:hover { background: var(--accent-muted-hover); }
.btn-sm { height: 30px; padding: 0 12px; font-size: 13px; }
.btn:active { transform: translateY(1px); }

/* ---- Workspace frame ---- */
.body { grid-row: 2; grid-column: 2; padding: 16px 0 28px; }
.frame { border: 1px solid var(--hairline); }
.warnband { display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-left: 4px solid var(--warn); border-bottom: 1px solid var(--hairline); color: var(--warn-ink); font-size: 13px; }
.warnband .eyebrow { color: var(--warn-ink); }
.warnband .sep { color: var(--hairline); }
.warnband a { color: var(--warn-ink); text-decoration: underline; text-underline-offset: 3px; margin-left: auto; white-space: nowrap; }
.toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--hairline); }
.field { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--hairline); background: var(--surface); color: var(--ink); font: 400 13px var(--f-body); }
.field .eyebrow { font-size: 11px; }
select.field { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(-45deg, transparent 50%, var(--ink-dim) 50%); background-size: 5px 5px; background-position: right 14px center, right 9px center; background-repeat: no-repeat; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--hairline); }
.seg button { height: 34px; padding: 0 14px; border: 0; background: transparent; color: var(--ink-dim); font: 500 12px var(--f-mono); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--hairline); }
.seg button:hover { color: var(--ink); background: var(--surface-raised); }
.seg button[aria-pressed="true"] { background: var(--accent-muted); color: var(--ink-on-muted); }
.search { width: 240px; }
.search input { border: 0; background: transparent; color: var(--ink); font: inherit; width: 100%; outline: none; }
.search input::placeholder { color: var(--ink-dim); }
.search:focus-within { outline: 2px solid var(--amber); outline-offset: 2px; }
.toolbar .push { margin-left: auto; }
.content { padding: 20px; display: grid; gap: 28px; }

/* ---- Readouts ---- */
.readouts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.readout { padding: 2px 20px; border-left: 1px solid var(--hairline); min-width: 0; }
.readout:first-child { border-left: 0; padding-left: 4px; }
.readout .val { font: 500 30px/1.1 var(--f-mono); margin: 10px 0 2px; letter-spacing: -.01em; }
.readout .val small { font-size: 15px; color: var(--ink-dim); }
.readout .sub { font-size: 12px; color: var(--ink-dim); min-height: 18px; }
.spark { display: block; width: 100%; height: 28px; margin-top: 10px; }
.spark rect { fill: var(--spark); }
.spark rect.now { fill: var(--accent); }
.spark rect.warn { fill: var(--warn); }

/* ---- Panels: square spine down the leading edge ---- */
.cols { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.stack { display: grid; gap: 28px; min-width: 0; }
.panel { display: grid; grid-template-columns: var(--spine) minmax(0, 1fr); column-gap: 16px; min-width: 0; }
.panel::before { content: ""; background: var(--accent); }
.panel.signalled { grid-template-columns: var(--spine) minmax(0, 1fr) var(--spine); }
.panel.signalled::after { content: ""; background: linear-gradient(to bottom, var(--signal-stops)); }
.panel-head { display: flex; align-items: baseline; gap: 10px; padding: 2px 0 12px; border-bottom: 1px solid var(--hairline); }
.panel-head h2 { margin: 0; font: 600 19px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.panel-head .count { font: 500 14px var(--f-mono); color: var(--accent-ink); }
.panel-head .meta { margin-left: auto; font: 400 12px var(--f-mono); color: var(--ink-dim); }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 10px 8px 0; font: 600 11px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); border-bottom: 1px solid var(--hairline); white-space: nowrap; }
td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
tbody tr:hover td { background: var(--surface-raised); }
td.num, th.num { text-align: right; white-space: nowrap; }
td.num { font-family: var(--f-mono); font-size: 13px; }
.ref { font: 500 12px var(--f-mono); color: var(--accent-ink); white-space: nowrap; }
.item-title { display: block; color: var(--ink); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.cell-clip { max-width: 0; width: 40%; }
.tag { display: inline-block; padding: 3px 6px 2px; border: 1px solid var(--hairline); font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-dim); }

/* phase readout: five flat blocks */
.phase { display: flex; gap: 2px; }
.phase i { display: block; width: 18px; height: 8px; background: var(--track); }
.phase i.done { background: var(--accent); }
.phase i.cur { background: linear-gradient(to right, var(--accent) var(--p), var(--accent-muted) var(--p)); }
.phase-label { font: 500 11px/1 var(--f-mono); color: var(--ink-dim); margin-top: 6px; text-transform: uppercase; white-space: nowrap; }

.meter { height: 6px; background: var(--track); min-width: 80px; }
.meter i { display: block; height: 100%; background: var(--spark); width: var(--v); }
.meter.warn i { background: var(--warn); }
.meter.fail i { background: var(--fail); }
.budget { font: 400 12px var(--f-mono); color: var(--ink-dim); margin-top: 6px; white-space: nowrap; }
.budget b { color: var(--ink); font-weight: 500; }
.budget.warn b { color: var(--warn-ink); }

.state { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 13px; }
.state::before { content: ""; width: 8px; height: 8px; background: currentColor; }
.state.ok { color: var(--ok); } .state.fail { color: var(--fail-ink); } .state.warn { color: var(--warn-ink); }
.state.busy { color: var(--ink); } .state.idle { color: var(--ink-dim); } .state.neutral { color: var(--ink-dim); }

/* decision inbox */
.inbox { list-style: none; margin: 0; padding: 0; }
.inbox li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 12px 0; border-bottom: 1px solid var(--hairline); align-items: center; }
.inbox .kind { font: 600 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
.inbox .t { color: var(--ink); margin: 5px 0 4px; }
.inbox .m { font: 400 12px var(--f-mono); color: var(--ink-dim); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.inbox .m > span { white-space: nowrap; }
.inbox .m .late { color: var(--warn-ink); }

/* hosts */
.host-spec { font: 400 11px/1.4 var(--f-mono); color: var(--ink-dim); display: block; margin-top: 2px; white-space: nowrap; }
.slots { display: flex; gap: 2px; }
.slots i { width: 12px; height: 12px; background: var(--track); display: block; }
.slots i.busy { background: var(--ink-dim); }
.slots i.drain { background: var(--warn); }
.slots i.off { background: transparent; border: 1px solid var(--fail); }
.bars { display: grid; gap: 5px; min-width: 110px; }
.bars div { display: grid; grid-template-columns: 30px 1fr 30px; gap: 6px; align-items: center; font: 400 11px var(--f-mono); color: var(--ink-dim); }
.bars span:last-child { text-align: right; }
.telemetry { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 16px; }
.telemetry > div { padding: 0 14px; border-left: 1px solid var(--hairline); }
.telemetry > div:first-child { padding-left: 0; border-left: 0; }
.telemetry .v { font: 500 18px var(--f-mono); margin-top: 6px; }
.telemetry .spark { height: 22px; margin-top: 6px; }

.empty-note { color: var(--ink-dim); font-size: 13px; padding: 12px 0; }
.cost-bar { display: grid; grid-template-columns: 1fr 56px; gap: 10px; align-items: center; }

@media (max-width: 1320px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .readouts { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 20px; }
  .readout:nth-child(4) { border-left: 0; padding-left: 4px; }
}
</style>
</head>

<script>
const DEST = [
  { key: 'deck', label: 'Bridge', accent: 'amber', w: 168, title: 'Bridge', sub: 'Fleet overview · 4 repositories · 12 runners on homelab k3s' },
  { key: 'inbox', label: 'Inbox', accent: 'blue', w: 132, count: 5, title: 'Decision Inbox', sub: 'Work waiting on a maintainer response' },
  { key: 'agents', label: 'Agents', accent: 'periwinkle', w: 132, count: 7, title: 'Agents', sub: 'Active runs, claimed work and recent outcomes' },

  { key: 'sessions', label: 'Sessions', accent: 'teal', w: 140, title: 'Session Archive', sub: 'Durable session records for investigation and audit' },
  { key: 'costs', label: 'Costs', accent: 'gold', w: 112, title: 'Costs', sub: 'Cost ledger · daily budget $60.00' },

const RUNS = [
  { agent: 'claude', repo: 'agent-lcars', ref: '#2479', title: 'routing: switch executor when an authorized maintainer changes agent labels', phase: 2, p: 62, note: 'build · 41 files', el: '23m 41s', used: 2.14, cap: 8, tok: '1.42M', runner: 'picard-r1' },
  { agent: 'codex', repo: 'agent-lcars', ref: '#2478', title: 'perf(console): expose the cold Inbox interaction breakdown', phase: 3, p: 40, note: 'verify · e2e 2/5', el: '41m 09s', used: 3.90, cap: 6, tok: '2.07M', runner: 'picard-r2' },
  { agent: 'claude', repo: 'agent-lcars', ref: '#2473', title: 'feat(telemetry): hooks-based session telemetry, phase 0', phase: 4, p: 30, note: 'review · CI pending', el: '1h 12m', used: 7.10, cap: 8, tok: '4.66M', runner: 'spark-r1' },
  { agent: 'claude', repo: 'homelab', ref: '#2245', title: 'capacity: declare executor hosts and identity trust roots', phase: 2, p: 35, note: 'build · paused for plan', el: '52m 18s', used: 4.60, cap: 8, tok: '3.02M', runner: 'picard-r3' },
  { agent: 'codex', repo: 'messages-control', ref: '#118', title: 'image workflow: pin buildx and restore GHCR push', phase: 3, p: 70, note: 'verify · actionlint ok', el: '27m 52s', used: 1.75, cap: 6, tok: '0.98M', runner: 'spark-r2' },
  { agent: 'opencode', repo: 'sprinkles', ref: '#6041', title: 'members: sync .ss-checker divider tokens from the design system', phase: 2, p: 20, note: 'build · 6 files', el: '18m 03s', used: 0.92, cap: 4, tok: '0.61M', runner: 'laforge-r1' },
  { agent: 'claude', repo: 'homelab', ref: '#2251', title: 'spark: raise memory alert hysteresis after QueueExecutorStalled storm', phase: 1, p: 55, note: 'plan · reading alerts', el: '6m 12s', used: 0.38, cap: 8, tok: '0.21M', runner: 'data-r1' },
];
const PHASES = ['intake', 'plan', 'build', 'verify', 'review'];

const INBOX = [
  { kind: 'Plan approval', title: 'Plan changes production capacity policy and identity trust roots', repo: 'homelab', ref: '#2245', agent: 'claude', age: '3h 12m', late: true },

const $ = (s) => document.querySelector(s);
const money = (n) => '$' + n.toFixed(2);
function spark(vals, { warnAbove = Infinity, label = '' } = {}) {
  const max = Math.max(...vals), n = vals.length, w = 4;
  const bars = vals.map((v, i) => {
    const h = Math.max(1.5, (v / max) * 28);
    const cls = i === n - 1 ? 'now' : v > warnAbove ? 'warn' : '';
    return `<rect class="${cls}" x="${i * w}" y="${28 - h}" width="${w - 1}" height="${h}"/>`;
  }).join('');
  return `<svg class="spark" viewBox="0 0 ${n * w - 1} 28" preserveAspectRatio="none" role="img" aria-label="${label}">${bars}</svg>`;
}
const series = (base, amp, n, seed) => Array.from({ length: n }, (_, i) => Math.round(base + amp * Math.sin(i * 0.55 + seed) + amp * 0.6 * Math.sin(i * 1.7 + seed * 2)));
const meterCls = (pct) => pct >= 100 ? 'fail' : pct >= 80 ? 'warn' : '';

function phaseCell(r) {
  const blocks = PHASES.map((_, i) => i < r.phase ? '<i class="done"></i>' : i === r.phase ? `<i class="cur" style="--p:${r.p}%"></i>` : '<i></i>').join('');
  return `<div class="phase" aria-label="Phase ${r.phase + 1} of 5: ${PHASES[r.phase]}">${blocks}</div><div class="phase-label">${r.note}</div>`;
}
function budgetCell(r) {
  const pct = Math.round((r.used / r.cap) * 100), c = meterCls(pct);
  return `<div class="meter ${c}"><i style="--v:${Math.min(pct, 100)}%"></i></div><div class="budget ${c}"><b>${money(r.used)}</b> / ${money(r.cap)} · ${r.tok} tok</div>`;
}

}

document.addEventListener('click', (e) => {

  if (seg) seg.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === seg)));
  if (e.target.closest('[data-od-id="primary-action"]') && document.body.dataset.accent === 'amber') render('inbox');
});
